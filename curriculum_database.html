al activity beyond just penis-in-vagina penetration to include oral, anal, manual sex, and outercourse.\nSexual Readiness Factors: Understanding the personal, emotional, and relational boundaries required for healthy decision-making and analyzing the considerations that go into the decision to be sexually active.\nAnatomical Accuracy: Defining internal and external reproductive/pelvic anatomy across all sexes and genders.\nContraception & Barrier Methods: Understanding the critical protocols for proper external and internal condom use, storage liabilities, latex allergies, and distinguishing STI risk-reduction from pregnancy risk-reduction.\nSexually Transmitted Infections (STIs): Exploring transmission, symptoms, prevention, and general facts about common STIs.\nDebunking Misconceptions: Dismantling peer, cultural, and media myths regarding intimacy, emotional closeness, and orgasms.\nPelvic Health: comprehension of flow/menstrual regularities and irregularities, endometriosis, PMDD, STIs, UTIs, and yeast infections.", "skills": "Boundary Navigation & Communication: Practicing explicit conversations about sexual safety, personal readiness, and consent with future partners or healthcare providers in fictional scenarios.\nAnatomical Literacy: Utilizing proper, scientific, and anatomically correct terminology comfortably in health-related discussions, and demonstrating knowledge of each term.\nPractical Health Application: Demonstration and explanation of the exact, multi-step process required to use physical barrier methods safely and effectively.\nPeer-to-Peer Education: Researching, paraphrasing, and synthesizing complex medical data (STIs) to present to peers without plagiarizing source materials.\nAnalyzing Personal Readiness: Privately and personally, consider the list of readiness questions and determine which ones would be most important to you.\nExplaining Pelvic Health: matching information cards to the correct category of a variety of pelvic health considerations (flow/menstrual regularities and irregularities, endometriosis, PMDD, STIs, UTIs, and yeast infections).", "materials": "Unit 6: Sexual Health & Readiness", "assessments": "Readiness Scenario Analysis: Partner or independent written critique of practice scenarios using the Sexual Readiness Checkpoint Questions.\nAnatomy & Terminology Review: Peer teaching circles and generation of collaborative question sheets.\nSTI Research Poster & Gallery Walk: Creation of informational posters evaluating specific STIs, paired with a reflective peer evaluation and summary worksheet.\nPelvic Health Matching Game: matching information cards to the correct category of a variety of pelvic health considerations (flow/menstrual regularities and irregularities, endometriosis, PMDD, STIs, UTIs, and yeast infections)."}]}, {"name": "Class V Health", "department": "Health", "teacher": "Dean Roth", "grade": "", "length": "", "description": "", "competencies": "intercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future\nAnalyzing nutritional choices and the role of balanced nutrition on physical/cognitive function.\nSetting, reviewing, and adjusting personal health goals using the SMART framework.\nUsing the DECIDE model to support health-enhancing decision-making.\nAnalyzing health risks such as nicotine and building confidence in health-enhancing decision-making.\nIdentifying relevant aspects of puberty, periods, and pregnancy, and identifying ways to be better-prepared for physical, emotional, and social changes.", "units": [{"name": "Unit 1"}, {"name": "Nutrition & Goal-Setting", "timeframe": "3-5 class periods", "concepts": "The 5 Food Groups: Identifying and classifying foods into Vegetables, Fruits, Protein, Carbs/Grain, and Dairy.\nFood Group Identification: Understanding specific foods within each category (e.g., Carbs from flour/oats/rice/wheat; Dairy from milk/cheese/yogurt; Protein from meat/fish/eggs/tofu/beans/nuts).\nThe Function of Glucose: Blood sugar (glucose) is the main energy source for the brain and body, derived straight from the food we eat, primarily carbs and protein.\nThe Physical and Mental Impacts of Hunger/Skipping Meals: Ignoring hunger causes a drop in blood sugar. This leads to physical fatigue, sluggishness, shakiness, dizziness, and fainting risks, as well as mental impacts like confusion, lack of focus, irritability, anxiety, and trouble solving problems.\nBreakfast as Fuel: Analyzing the daily requirement of all 5 food groups for optimal mental and physical stamina and evaluating regular school-day breakfast routines. Students make a “breakfast plan” with a variety of options, ease, speediness, and write a letter to their grown-ups outlining what parts of the plan they’ll need help with. Students also are made aware of the opportunity to eat breakfast at school at no cost.", "skills": "Classifying items into their correct food group families.\nMatching biological benefits to corresponding food groups (e.g., muscle development, digestive health, bone strength, and focusing abilities).\nPlanning balanced, realistic meals that account for logistical time constraints (preparation, consumption, wake-up routines) and family support networks.\nGoal-setting\nDecision-making", "materials": "Nutrition", "assessments": "Food Group Superhero Project — Students select a food group and draw/describe a superhero highlighting how that category provides \"superpowers\" to support the brain and body.\nDesign a Menu Card — Students choose a favorite school lunch item, draw it, detail the specific food groups involved, and write a description of its physical/mental benefits and why they like it.\nBreakfast Plan — Students make a “breakfast plan” with a variety of options, ease, speediness, and write a letter to their grown-ups outlining what parts of the plan they’ll need help with. Students also are made aware of the opportunity to eat breakfast at school at no cost."}, {"name": "Unit 2"}, {"name": "Nicotine & Decision-Making", "timeframe": "2-3 classes", "concepts": "critical systems thinking\naction towards a better future\nThe Chemistry of E-Cigarette Aerosol: Dispersing the myth that vapes emit harmless vapor. The substance is an aerosol containing hazardous materials including nicotine, heavy metals (e.g., nickel, tin, lead), volatile organic compounds, ultrafine particles, and cancer-causing chemicals.\nFlavoring Chemicals & Popcorn Lung: Understanding that chemical flavorings (such as diacetyl), while safe for ingestion in food, are dangerous when inhaled into the lungs. Inhalation can cause irreversible damage to the bronchioles, a condition known as bronchiolitis obliterans (\"popcorn lung\").\nNicotine's Neurobiology (The Addiction Loop): Nicotine alters adolescent brain chemistry by activating pleasure centers to create a false sense of enjoyment. As nicotine levels decrease, the brain experiences withdrawal symptoms (anxiety, stress, irritability) and craves more nicotine to alleviate those feelings, triggering the cycle of addiction.\nHealth Impacts on the Body:\nThe Respiratory System (Lungs): Aerosol paralyzes cilia (the hair-like structures that sweep out mucus and dirt), leading to trapped bacteria, chronic coughs, increased risk of lung infections, and irreversible tissue damage.\nThe Cardiovascular System (Heart): Nicotine acts as a stimulant, spiking blood pressure and increasing heart rate. It causes blood vessels to constrict (narrow), forcing the heart to pump harder and reducing oxygen delivery throughout the body.\nEnvironmental Exposure (Secondhand vs. Thirdhand Aerosol):\nSecondhand Aerosol: The mixture of exhaled chemicals inhaled by bystanders.\nThirdhand Aerosol: The residue of chemicals that settles out of the air onto surfaces, furniture, clothing, and dust. This residue persists long after the vapor clears and poses a unique toxic risk to infants, toddlers, and pets who touch or mouth contaminated objects.\nPeer Realities vs. Marketing Myths: Examining social perceptions to realize that the vast majority of 5th graders/middle schoolers do not vape, and identifying how marketing tactics try to make these products look appealing.", "skills": "Risk Assessment & Decision-Making: Identifying risks of nicotine, identifying risks within peer pressure situations, and using that knowledge to make health-enhancing decisions.\nRefusal Scripting & Social Norming: Using peer data to build confidence in saying \"no\" to vapes, acknowledging that remaining vape-free is the true statistical norm among middle school youth.", "materials": "Decision-Making & Nicotine", "assessments": "The DECIDE Vaping Dilemma: A completed 6-step decision-making template where students process a peer-pressure vaping scenario. Students must map out choices, weigh the pros and cons (including impacts on the lungs, heart, and relationship trust), anchor their choice to personal health values, and draft a 2-3 sentence explicit refusal script that details exactly how to walk away and inform a trusted grown-up."}, {"name": "Unit 3"}, {"name": "Puberty & Menstruation", "timeframe": "4-6 classes", "concepts": "sense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future\nThe Three Dimensions of Puberty: Analyzing how puberty alters three core aspects of a student's life:\nBody: Physical growth and anatomical development (e.g., body odor).\nMind: Changing thoughts, intense emotions, and processing internal feelings.\nRelationships: Shifting dynamics with peers, friends, and family (e.g., navigating growing apart from childhood friends).\nThe Biology of the Menstrual Cycle:\nIdentifying the typical onset age for menstruation (usually between 8 and 14 years old).\nUnderstanding hormones as the chemical signals sending messages throughout the body.\nRecognizing the chronological pathway: the brain activates first to trigger the cycle, signalling the ovaries to release an unfertilized egg roughly once a month, hormones trigger menstruation when there is no fertilized egg.\nDefining the contents of menstrual fluid as a natural combination of blood, tissue, and vital nutrients (endometrial lining) exiting the body through the vagina, as well as describing why this process happens.\nAnatomical and Physiological Vocabulary:\nMenarche: The scientific definition for an individual's very first period.\nOvulation: The multi-day process of an egg traveling from an ovary into the fallopian tube, occurring roughly 7–10 days before bleeding begins.\nPMS (Pre-Menstrual Syndrome): The physical or emotional symptoms (such as abdominal cramps, fatigue, and mood swings) felt during or the week prior to a period.\nFlow Volume: Understanding variations in menstrual volume, distinguishing between a \"light flow\" and a \"heavy flow,\" as well as what is typical for this age.\nHygiene and Menstrual Product Mechanics:\nExploring the functionality of pads, tampons, and menstrual cups to absorb fluid and maintain physical cleanliness.\nDifferentiating product usage restrictions (e.g., swimming requires tampons or cups because standard pads over-absorb water).\nCore sanitation rules: Products, plastic wrappers, and applicators must never be flushed down toilets because they clog plumbing; they must always be wrapped and disposed of in stall trash bins when out in public.\nMaintenance routines: Changing pads or tampons every 3–6 hours to actively prevent odors, leaks, and reproductive infections.", "skills": "Self-Reflection and Normalization: Assessing personal emotional baselines regarding puberty/periods by matching personal feelings to anonymous character archetypes to diminish stigma, embarrassment, or shame.\nCorrect and hygienic use of menstrual products: Following step-by-step protocols for hygiene management \nCollaborative Inquiry and Peer Mentorship: Engaging in collaborative peer-to-peer exchanges to address anonymous worries regarding changing peer friendships, bodily sensations, and social taboos around periods.\nLogistical Preparedness: Organizing and preparing physical materials to proactively manage unpredictable periods by making a period pouch", "materials": "Puberty V 25-26", "assessments": "Formative Kinesthetic Game: Swat the Fact! — An interactive review game where students use flyswatters to quickly select facts or accurate vocabulary definitions on the board while filtering out myths.\nCollaborative Synthesis Task: Puberty Question Swap Portfolio — A group rotating analysis station where teams find anonymous student questions written on large sheets (e.g., \"How do you tell people without it being weird?\" or \"Do you feel blood coming out?\"). Groups collaborate to write peer answers, building collective empathy and medical literacy. Teacher follows up to correct myths/mistakes."}]}, {"name": "Class VI Health", "department": "Health", "teacher": "Dean Roth", "grade": "", "length": "", "description": "", "competencies": "intercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future\nVerbal and physical refusal and defense skills (taught by Prepare)\nThreat assessment (taught by Prepare)\nAnalyzing advertisements and image manipulation to assess media literacy and introduce the concept of cultural beauty standards vs. physical health standards\nUnderstanding and applying nutritional needs to day-to-day decision-making\nReviewing puberty, hygiene, and menstruation through a 6th grade lens", "units": [{"name": "Unit 1"}, {"name": "Threat Assessment & Self Defense (Taught by Prepare Inc.)", "timeframe": "6 class periods", "concepts": "Threat Assessment without bias - how to identify problematic behavior, not problematic people based on appearance, mental illness, or stereotypes\nHow to safely leave an uncomfortable or potentially threatening situation\nHow to use verbal refusal skills to keep yourself safe\nHow to use physical self-defense skills in rare occasions where your safety is threatened, and leaving or verbally refusing did not work", "skills": "Identifying problematic behavior\nHow to leave safely from a variety of environments\nHow to effectively use verbal refusal skills\nHow to use physical self-defense moves", "materials": "", "assessments": "Practice scenarios in groups and 1-1 with the instructors each session"}, {"name": "Unit 2"}, {"name": "Media Literacy & Physical Health Standards", "timeframe": "2-3 class periods", "concepts": "Defining media and Media Literacy, the goals of media, and investigating where, when, and how we interact with media\nThe Reality of Media Editing: Understanding that professional media is highly manufactured and is not intended to demonstrate or mimic our lived reality, especially that of a 6th grader. \nImplicit Promises of Advertising: Analyzing how advertisements sell more than a consumer product; they sell abstract concepts, lifestyles, or identities (e.g., popularity, acceptance, a flawless appearance).\nThe Source and Reinforcement of Beauty Standards: Tracing how unrealistic body and beauty standards originate from commercial media and are constantly reinforced through social media algorithms, television, magazines, and peer interactions.\nThe Tri-Dimensional Impact on Health: Evaluating how intense exposure to curated appearance ideals can harm a person's systemic health:\nPhysical Health: Pressuring individuals to pursue risky physical modifications, restrictive dieting, or purchasing unnecessary cosmetics to \"fix\" their appearance\nMental/Emotional Health: Inducing negative feelings of inadequacy, low self-esteem, stress, and anxiety regarding one's natural body type.\nSocial Health: Experiencing negative peer pressure to conform to strict look-alike standards instead of celebrating individuality, isolating yourself out of fear of judgment, losing friendships or quality time with friends because of self-perception or assumptions about others\nCultural beauty standards vs. physical health standards: what sources they originate from, and their intentions - does the standard relate to taking good and healthy care of your body, or does the standard relate to fitting into certain appearance ideals regardless of the impact on your health", "skills": "Increased level of media literacy\nAbility to recognize advertising tricks and persuasive tactics, practice by analyzing a set of ads\nAbility to differentiate between cultural beauty standards and physical health standards\nApplying skills: Designing a health-focused “beauty” campaign that refocuses on functional health indicators, and provides actionable coping skills for peers when handling social or media pressure.\nApplying skills: Articulating personal characteristics, interior traits, and distinct outside attributes that bring happiness and promote health, anchoring self-worth outside of mainstream public standards - “happy to be me” portrait drawings", "materials": "", "assessments": "Analyzing and criticizing advertisements: An analytical worksheet where students process a real-world advertisement. They must write short-answer arguments mapping out the product's implied promises, the editor's corporate intent, and the psychological impact on the consuming public.\nThe Health-Focused Beauty Campaign: Students design a public-facing flyer or poster that champions body inclusivity, physical health standards, and that rejects toxic appearance ideals.\n“Happy to be me” portrait drawings: Articulating personal characteristics, interior traits, and distinct outside attributes that bring happiness and promote health, anchoring self-worth outside of mainstream public standards"}, {"name": "Unit 3"}, {"name": "Nutrition Literacy", "timeframe": "2-3 class periods", "concepts": "Brain and body benefits of the 5 food groups\nContextual Goal Matching: Connecting food groups to specific daily lifestyle demands\nUnderstanding and evaluating which food groups to eat and when/why (in order to support personal needs)\nDemystifying foods with negative connotations (ex: what is the purpose of processed foods, what level of sugar is acceptable in moderation)", "skills": "Food Group matching: determining a food group based on the brain/body benefits it provides\nAnalyzing food options: Auditing real-world school lunch options (such as the salad/sandwich/yogurt bar) to construct customized, enjoyable meals that will meet a nutritional need\nAnalyzing fictional scenarios: when presented with a set of criteria, students are able to determine what food groups their fictional student should focus on in their next meal/snack", "materials": "Nutrition", "assessments": "Fictional case studies: when presented with a set of criteria, students are able to determine what food groups their fictional student should focus on in their next meal/snack\nThe Salad Bar Challenge: A behavioral application assignment where students step out of their comfort zone during school lunch to physically add a missing food group to their plate. (To preserve student comfort and alleviate pressure on the “picky eaters,” restrictive eaters, or students with dietary restrictions/disordered eating, this is a personal and private assignment that does not get checked or graded - instead, students write a private reflection, and are encouraged to share their experience with a classmate during a structured check-in, but they are not required to share.)\nAnalyzing their favorite meal: are students able to identify all the food groups in their favorite meal, and to recognize the brain/body benefits that meal provides"}, {"name": "Unit 4"}, {"name": "Puberty, Menstruation, and Hygiene", "timeframe": "2-3 class periods", "concepts": "Understanding and applying proper hygiene needs during puberty relating to different parts of the body: body, dental, feet, genitals, hair, and skin\nAnatomy of the reproductive system and menstruation, identifying and defining the function of each part of the system\nExplaining what menstruation is and why and how it happens\nProper use and disposal of menstrual products", "skills": "Self-advocacy\nSelf-management (taking care of your own health with less help from your grown-ups)\nProper use of menstrual products\nDiscussing hygiene with a grown-up at home - building the skill of “awkward” conversations", "materials": "Puberty & Hygiene", "assessments": "Labeling a diagram of the female reproductive system\nExplaining in your own words what menstruation is, why it happens, and the mechanics involved\nAt-home hygiene interview with a grown-up"}]}, {"name": "Class VII Health", "department": "Health", "teacher": "Dean Roth", "grade": "", "length": "", "description": "", "competencies": "sense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future\nValues identification and application\nSelf-management\nDecision-making\nSelf-advocacy", "units": [{"name": "Unit 1"}, {"name": "Mental Health & Healthy Habits", "timeframe": "3-5 classes", "concepts": "Surviving vs. thriving\nThe 8 dimensions of Health (mental, physical, social, spiritual, environmental, financial, intellectual, occupational)\nInterconnectedness of dimensional health - impacts to health in one dimension may affect other types of health)\nHealth-enhancing vs. health-diminishing habits\nStress dynamics", "skills": "Determining whether a behavior is health-enhancing or health-diminishing\nHelp-seeking from adults, and identifying problems a 7th grader could solve on their own vs. problems for which they need adult help \nStress-management\nTurning health-enhancing behaviors into habits", "materials": "Mental Health & Healthy Habits VII", "assessments": "Sorting behaviors by type of health affected, health-enhancing or health-diminishing, and whether it needs an adult’s help or not\nHealth behavior/habit matching game\nStress analysis"}, {"name": "Unit 2"}, {"name": "Spiritual Health", "timeframe": "2-3 class periods", "concepts": "Defining Spiritual Health: Understanding Spiritual Health as living with passion and purpose, acting in accordance with a moral compass, and staying true to an authentic self. Clarifying that in this secular context, Spiritual Health does not refer to religion, but may include religious values for some people. “Spiritual” in this context refers more so to the inner self rather than a religious spirituality.\nCore Personal Values: Identifying values as a distinct group of characteristics, ideas, personal priorities, or areas of life that hold deep meaning for an individual.\nThe Importance of Alignment: Exploring why defining and honoring values matters for:\nSelf-Actualization: Being your most authentic self and building confidence.\nWell-being: Boosting long-term happiness and overall mental/emotional wellness.\nCommunity Support: Empowering adolescents to make choices that positively impact the world and communities they’re part of.\nStrategic Execution of Values: Formulating specific, actionable pathways to weave inner principles into daily routines, including:\nMedia Consciousness: Making deliberate choices to consume digital media, entertainment, and social content that support and reflect personal values.\nPeer Selection: Hanging out with people who share similar values, and choosing friends who respect differences when personal values do not perfectly align.\nOpen Alignment/Communication: Sharing values with others by openly discussing why they matter and how they drive life choices.", "skills": "Values Identification & Selection: Reflecting on personal priorities to filter, isolate, and define a personal list of 5 core values.\nActionable Mapping (The Personal Values Plan): Translating abstract values into functional blueprints by matching each core value with a real-world execution strategy.\nContextual Goal-Setting: Identifying at least one specific, concrete thing that can be performed in day-to-day middle school life to express each core value.\nPeer Consultation & Critique: Collaborating with a partner to evaluate a \"Living By Your Values\" plan—identifying the most practical execution strategies and offering constructive modifications for the least practical ones.", "materials": "Spiritual Health VII", "assessments": "Formative Analysis Task: The Personal Values Plan Matrix — A three-column graphic organizer completed independently by students to document their 5 core values, select a strategy to live that value, and establish a specific action item they can do that same day to express it.\nFormative Collaboration & Peer Feedback: The Strategic Review Session — A paired activity where students exchange plans, verbally assess the viability of their partner's strategies, write down explicit peer-delivered feedback at the bottom of their matrix, and refine their action plans.\nSummative Applied Design Portfolio: The Middle School Value Card Campaign — An anonymous design project where students select one high-priority value, write it clearly at the top of a card, and draft a visually-appealing and realistic, accessible way a middle schooler can execute that value in their daily life. Completed cards are collected to serve as an anonymous peer resource bank to guide other middle school students."}, {"name": "Unit 3"}, {"name": "Sleep Hygiene", "timeframe": "3-4 classes", "concepts": "The sleep cycle/stages of sleep\nBiological sleep needs for adolescents\nBrain and body benefits of sleep\nFactors that support and harm sleep hygiene - focusing on both quality and quantity of sleep", "skills": "Data Analysis & Personal Reflection: Track and rate personal sleep duration and quality using a standardized “sleep quality” scale, identify factors that affect the quality and quantity of their sleep.\nBehavior Modification & Action Planning: Choose 2-4 targeted sleep hygiene practices and write a specific, sequential day-to-day routine change based on the above.\nInterpersonal Communication: Share a Washington Post article we read in class about adolescent sleep with a grown-up at home, and facilitate a collaborative household interview/discussion regarding sleep habits and devise a shared sleep hygiene practice for the family.\nResource Design: Design an informative, visually engaging poster promoting a specific specific strategy backed by data.", "materials": "Sleep VII Spring26", "assessments": "Sleep-stages matching activity\nReflection homework completed with an adult\nSet and track sleep goals\nDesign an informative, accurate, and visually appealing resource about a sleep strategy"}, {"name": "Unit 4"}, {"name": "The Adolescent Brain, Substance Use, and Refusal Skills", "timeframe": "2-3 classes", "concepts": "The Vulnerability of the Adolescent Brain: The teen brain is still actively developing, making it uniquely vulnerable to the chemical effects of substances like nicotine.\nThe Science of Nicotine Addiction: Nicotine alters neural pathways, impacting mood, attention, and learning capacity. It can create mental reliance (using it to try and feel better or escape stress) and quickly leads to physical dependency.\nVaping and Respiratory Health: Vaping and E-cigarette use are on the rise among middle and high school students. Inhalation of these aerosols damages lung tissue, introduces toxic chemicals, compromises the immune system, and can cause chronic respiratory issues (like asthma exacerbation).\nUnderstanding and Rejecting Social and Behavioral Drivers: Youth are introduced to nicotine through social pressures, targeted advertising, peer influence, a desire to fit in, or the misconception that it relieves depression and academic stress.\nAltered Sleep Architecture: Nicotine use changes how the body moves through biological sleep cycles. Users spend more time in lighter sleep stages and miss out on necessary deep, restorative sleep.", "skills": "Assertive Refusal Strategies: Formulate and internalize clear, direct, and realistic verbal strategies to say \"no\" to substance offers.\nScriptwriting & Realistic Roleplay: Draft and execute authentic, context-driven dialogue scripts that employ refusal tactics while navigating high-pressure peer scenarios.\nDefining and describing the relationship of dopamine to addiction\nDescribing impacts to brain and body health of using nicotine", "materials": "Substance Use & Refusal Skills VII Spring26", "assessments": "A-to-Z Refusal Workbook: Completion of a comprehensive dictionary of 10–15 distinct, realistic verbal refusals adhering to the \"Be Clear, Be Direct, Give a Reason\" strategy.\nPeer Roleplay Performance & Feedback: (Optional) Perform their skits for the class, where they act out their refusal strategies and receive peer critiques evaluating clarity, directness, and effectiveness of refusal."}, {"name": "Unit 5"}, {"name": "Traits of a Healthy Relationship", "timeframe": "1-2 classes", "concepts": "10 traits of a healthy relationship (primarily focused on friendships)\n10 traits of an unhealthy relationship (primarily focused on friendships)\nElements of a productive and healthy conflict-resolution conversation", "skills": "Identify the traits that are most important to you and explain why it supports healthy friendships in your life\nAnalyze the 10 unhealthy traits and identify examples of how they show up in friendships as well as the impact they can have on a relationship\nAnalyze a fictional friendship scenario to identify healthy and unhealthy traits, and provide suggestions on how to approach the conflicts productively and compassionately", "materials": "Healthy Relationships VII Spring 26", "assessments": "Analyze a fictional friendship scenario to identify healthy and unhealthy traits, and provide suggestions on how to approach the conflicts productively and compassionately"}]}, {"name": "Class VIII Health", "department": "Health", "teacher": "Dean Roth", "grade": "", "length": "", "description": "", "competencies": "intercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future\nDecision-making\nValues identification and analysis\nGoal-setting\nAnalysis of social norms\nVerbal and physical refusal and defense skills (taught by Prepare)\nThreat assessment (taught by Prepare)", "units": [{"name": "Unit 1"}, {"name": "Health Dimensions & Mental Health", "timeframe": "4-5 Classes", "concepts": "The Wellness Wheel (10 Dimensions of Health): Total health is dynamic and goes beyond just physical fitness. It comprises multiple interconnected dimensions: Physical, Emotional/Mental, Social, Intellectual, Spiritual, Occupational, Financial, Multicultural, Sexual, and Environmental health.\nThe Interconnectedness of Dimensions: A stressor or positive change in one dimension heavily impacts the others. \nThe Mental Health Continuum: Mental health is not binary (sick vs. healthy, good vs. bad mental health); it exists on a fluid continuum ranging from optimal well-being and structural coping to distress and clinical mental illness, and can change day-to-day or even moment-to-moment. \nAdolescent Neurobiology & Stress: The 8th-grade brain experiences rapid development in the limbic system (emotions) before the prefrontal cortex (impulse control and executive functioning) is fully matured, intensifying the perception of academic and social stress, and shortening the foresight of long-term impacts, cause-and-effect, etc.\nDeconstructing Stigma: Mental health conditions are biological and psychological realities, not character flaws. Societal stigma often prevents individuals from seeking necessary care, making open and empathetic dialogue essential.\nSupport & Help-Seeking: Recognizing warning signs of severe distress in oneself or friends, identifying the difference between a small and large concern, and knowing the protocol for accessing trusted adults, school counselors, or crisis resources.", "skills": "Help-Seeking for self and others\nAnalyzing a problem or challenge as one an 8th grader can manage on their own vs. one that needs help from a trusted adult (typical stressor vs. mental health challenge)\nSelf-management\nAdvocacy\nReframing & Cognitive Coping: Practice and apply cognitive behavioral reframing techniques to transform negative self-talk into constructive, realistic perspectives.\nDe-escalation & Stress Management: Execute immediate somatic stress-reduction skills, such as box breathing, progressive muscle relaxation, and mindfulness grounding techniques.\nResource Mapping & Advocacy: Research, verify, and document accessible mental health resources within both the local school community and broader public networks.", "materials": "Unit 1: Health Dimensions & Mental Health VIII", "assessments": "The Multi-Dimensional Health Case Study Portfolio: Students analyze a complex scenario of a fictional peer experiencing a possible crisis. They must accurately diagnose which dimensions of health are affected, map out the interconnected causes, and formulate a comprehensive, multi-step action plan utilizing realistic resources.\nCreate a fictional dialogue about a possible mental health challenge that an 8th grader may experience to demonstrate the ability to recognize warning signs, support a friend, be an empathetic listener, and seek help from a trusted adult.\nMental Health Resource Advocacy Guide: A collaborative or individual project where students create an informational flyer, digital graphic, or script detailing how an 8th-grader can access school and community mental health professionals, explicitly outlining what to say to lower the barrier of asking for help."}, {"name": "Unit 2"}, {"name": "Nutrition, Body Image, Beauty Standards", "timeframe": "4-5 classes", "concepts": "Media & Cultural Literacy: Critiquing societal messaging, historical trends, and corporate advertisements regarding body image, dieting, and beauty standards. Includes a deep dive into how beauty standards change throughout time, the roots of specific appearance ideals in the context of social, political, and cultural change\nNutritional Literacy: Identifying how different food groups and nutrient classes meet brain and body needs.\nSelf-Advocacy & Health Management: Designing realistic, health-first personal routines (e.g., breakfast planning) and actively rejecting cultural body expectations that are not health-centered.\nDiet vs. Diet Culture: A \"diet\" is defined as restricting types, amount, or frequency of food eaten to lose weight or impact health. \"Diet culture\" is a rigid system of beliefs, expectations, and societal norms that promote thinness and weight loss to gain acceptance or higher social status.\nEating Disorder Realities: Approximately 10% of the U.S. population will develop an eating disorder (likely higher due to difficulty in accessing healthcare). Fewer than 6% of people with eating disorders are underweight; it is impossible to determine someone's health status or eating habits simply by looking at their size or even their diet/exercise habits.\nThe Body's \"Set Weight Point\": Each person has a unique, biological weight range that is healthiest and safest for them, which the body naturally tries to maintain and cannot be permanently altered through restrictive diet and exercise. Restrictive dieting in teen girls increases the risk of developing an eating disorder by 5 to 18 times.\nImpacts of Dieting & Diet Culture: Restrictive eating patterns cause wide-ranging negative effects, including memory/concentration problems, stress hormone elevation, weight cycling (which has its own physiological risks and complications), loss of natural hunger/fullness cues, body dissatisfaction which can increase mental health concerns, social isolation, and in extreme cases, an increased risk of heart disease or fertility issues.\nHistorical Fluidity of Beauty Ideals: Appearance expectations are unstable constructs that shift across generations based entirely on the specific events, motivations, and socioeconomic values of that historical era.\nNutritional Chemistry (Food as Fuel):\nMacronutrients (Carbohydrates, Proteins, Fats): The primary foods the brain and body use for energy, focus, cell repair, and muscle development.\nMicronutrients (Vitamins and Minerals): Elements like Calcium and Iron that support bone strength and oxygen flow.\nComplete vs. Complementary Proteins: Complete proteins contain all 9 essential amino acids (meat, soy, dairy), while complementary proteins must be combined (e.g., rice and beans) to work together.", "skills": "Media & Historical Analysis: Skimming, annotating, and critiquing historical and current media messages and advertisements to identify shared themes and persuasion strategies, and analyzing whether advertisements rely on or hide scientifically-backed data.\nPractical Wellness Planning: Designing a self-directed, realistic breakfast and lunch blueprint utilizing baseline nutrition targets while navigating morning time constraints.\nWritten Self-Reflection: Formulating structured arguments (5–7 sentences) evaluating personal belief shifts, the physical/mental impacts of diet culture, and strategies for rejecting societal standard pressures that are not health-centered.\nAdvocacy & Communication: Creating health-focused educational media targeted at middle school peers to encourage body neutrality, health-centered decision-making, and positive self-outlook.", "materials": "Unit 2: Nutrition & Food Relationship VIII", "assessments": "Practical Nutrition Blueprint: Student-designed breakfast plans and lunch mapping factoring in food groups, glucose stability, and morning schedules.\nBeauty Standards Throughout History: Using a provided historical resource, students develop a timeline of shifting appearance ideals, connect them to the sociopolitical context of that time period, and draw conclusions about what societies value at different times.\nMini-Project Options (Choose One):\nCreating an Anti-Diet-Culture Message for Middle Schoolers: A flyer, social media post, or advertisement layout that helps peers understand the impact of diet culture and provides actionable tips to overcome toxic messaging.\nHealth-Focused Beauty Campaign: A creative poster or social media campaign that encourages a healthy outlook on bodies and promotes mental, physical, and social health over appearance ideals."}, {"name": "Unit 3"}, {"name": "Substance Use", "timeframe": "3 class periods", "concepts": "Classification and Legalities: Alcohol is a chemical drug classified as a depressant (not a stimulant), and states enforce specific laws regarding underage consumption and medical/legal protections (e.g., Good Samaritan laws where calling 911 for an alcohol overdose protects both parties from underage consumption consequences).\nNeurological Impact on Adolescents: Substance use directly alters the adolescent brain, particularly affecting the prefrontal cortex—the region responsible for impulse control, planning, problem-solving, emotional regulation, managing short-term memory, and predicting cause-and-effect outcomes.\nThe Biology of Consumption & \"Blackouts\": Dispelling myths around sobriety (e.g., eating carbs or drinking caffeine does not reverse drunkenness or speed up metabolic sobriety). Understanding that an alcohol-induced blackout is a state of short-term memory loss where a person remains conscious but the brain stops recording memories, leading to high-risk situations (fighting, unsafe choices) without recollection.\nSystemic Ripple Effects: The physiological effects of alcohol (slurred speech, dehydration, lower inhibitions, impaired motor coordination) and cannabis (impaired judgment, decreased motivation, potential correlation with mental health issues like psychosis if genetically predisposed) have compounding negative consequences on academic success, personal relationships, long-term health, and legal standing.", "skills": "Critical Evaluation & Deconstruction of Myths: Distinguishing medical and physiological facts from cultural or media-driven fictions regarding alcohol and cannabis consumption.\nPerspective-Taking & Long-term Impact Analysis: Empathizing with and analyzing personal loss or risk through reflective simulations (using elements from their own life to put themselves in the shoes of a teen struggling with alcohol through a simulated scenario).\nCognitive Linkage: Connecting the physiological effects of a substance to the specific localized functions of the human brain (e.g., tracing short-term memory loss to prefrontal cortex impairment).", "materials": "Unit 3: Substance Use", "assessments": "Fact or Fiction Collaborative Synthesis: Guided paired discussions evaluating the truth of physiological and legal statements, corrected live with teacher feedback.\nThe Value Progression Simulation: A structured classroom exercise where students selectively surrender representation cards (crumpling cards representing possessions, hobbies, or relationships) to physically simulate how dependency compromises personal identity and life stability, and describing the effect, impact, or emotional output of those sacrifices/losses."}, {"name": "Unit 4"}, {"name": "Anatomy, Contraception, Reproduction", "timeframe": "3-4 classes", "concepts": "Biological Anatomy Verification: Identifying internal and external reproductive organs using cross-sectional and frontal biological diagrams (such as the uterus, fallopian tubes, ovaries, cervix, vagina, vulva, bladder, urethra, and rectum).\nThe Mechanics of Human Reproduction: Tracing how pregnancy occurs through the meeting of cellular components (sperm and egg cells) via multiple pathways (intercourse or IVF/IUI) and understanding embryonic development timeline markers (Zygote for 1 week, Embryo for 2 months, Fetus for 8 months).\nContraceptive Selection & Efficacy Metrics: Distinguishing between methods that only lower pregnancy risk versus barrier methods that concurrently reduce Sexually Transmitted Infections (STIs). Evaluating correct usage statistics versus typical real-world efficacy across multiple models (Abstinence, IUD, Birth Control Pills, Ring, Arm Implant, Emergency Contraception, and Barrier Methods).\nBarrier Method Architecture & Logistics: Identifying the steps of proper condom use.\nLegal Access and Consumer Safety Rights: Knowing legal parameters regarding local reproductive healthcare (e.g., in New York City, adolescents do not need parental consent or age verification to purchase external barrier contraceptives at drugstores) and understanding material preservation guidelines (avoiding storage in environments with excessive friction or heat, like a wallet or loose backpack).", "skills": "Anatomical Diagram Mapping: Accurately applying word banks to translate and isolate anatomical organs on standard cross-sectional scientific diagrams.\nProcedural Sequence Tracking: Analyzing a multi-step physical health protocol (condom application and removal) and sequencing the steps in chronological order to reduce accidental tears or failure rates.\nComparative Data Analysis: Critiquing structural data regarding youth sexual activity trends to challenge distorted cultural assumptions or peer group misconceptions.", "materials": "Unit 4: Anatomy & Contraception", "assessments": "Anatomical Blank Diagram Check: Independent or partner labeling tasks using a structural word bank to demonstrate comprehension of interior/exterior body views.\nPeer Synthesis & Question Gen Index Cards: Mid-lesson pause where student pairs analyze informational readings to format three active clarifying questions or wonderings for a safe, anonymous question box. Students then have an opportunity to answer each other’s questions in a classwide discussion.\nOrdering steps to proper condom use: students are provided all of the steps, but shuffled into random order - they then work together to put them into the correct order."}, {"name": "Unit 5"}, {"name": "Threat Assessment & Self Defense (Taught by Prepare Inc.)", "timeframe": "6 class sessions", "concepts": "Threat Assessment without bias - how to identify problematic behavior, not problematic people based on appearance, mental illness, or stereotypes\nHow to safely leave an uncomfortable or potentially threatening situation\nIncreasing the content from the 6th grade sessions to include early dating/romantic scenarios\nHow to use verbal refusal skills to keep yourself safe\nHow to use physical self-defense skills in rare occasions where your safety is threatened, and leaving or verbally refusing did not work", "skills": "Identifying problematic behavior\nHow to leave safely from a variety of environments, including early dating/romantic scenarios\nHow to effectively use verbal refusal skills\nHow to use physical self-defense moves", "materials": "", "assessments": "Practice scenarios in groups and 1-1 with the instructors each session"}]}, {"name": "Health", "department": "Health", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Global I", "department": "History", "teacher": "Emily Salitan and Gabriel Ulibarri", "grade": "", "length": "", "description": "", "competencies": "Historical thinking skills\nMakes connections between specific texts and broader unit themes \nRecognizes patterns of change and continuity over time\nPlaces events in chronological order and considers how they relate to one another\nClose reading and primary source analysis\nEvaluates the perspective, purpose, and possible bias of a source\nApplies an understanding of historical context\nInterprets historical significance \n\nAnalytical writing: \nCrafts a focused claim that makes an argument\nSupport claims with specific evidence from sources\nDiscusses historical significance in primary source analysis paragraphs (PSAs), document-based question essays (DBQs), and other in-class writing assessments\nClass preparation\nHas all class materials ready at the beginning of class\nDemonstrates thorough annotating and/or note-taking\nIdentifies main ideas/argument and supporting details \n\nClass participation:\nFinds ways to share ideas, whether in whole-class, small-group, or student-led activities\nDemonstrates a willingness to take intellectual risks", "units": [{"name": "Unit 1"}, {"name": "Unit 1, Part 1 – Worlds Overlap: The Black Death\nUnit 1, Part 2 – Worlds Overlap: Global Trade Routes in Africa & Asia", "timeframe": "", "concepts": "", "skills": "Close reading \nPrimary source analysis \nAnalytical writing (often first DBQ of 9th grade)", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Crisis and Recovery in the 15th Century: Political and Cultural Renewal in Ming China and Renaissance Europe", "timeframe": "", "concepts": "", "skills": "Close reading \nPrimary source analysis \nAnalytical writing (often first DBQ of 9th grade)", "materials": "", "assessments": ""}, {"name": "Unit 3"}, {"name": "Indigenous Empires in the Americas – The Aztec and the Inca", "timeframe": "", "concepts": "", "skills": "Academic research \nFinding, identifying and citing sources", "materials": "", "assessments": "Annotated bibliography"}, {"name": "Unit 4"}, {"name": "Contact, Commerce and Colonization, c. 1450-1600", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": "Quiz\nDigital exhibit group project: Worlds Together, Worlds Apart: Contact, Commerce, Colonization, Consolidation, Coexistence?"}, {"name": "Unit 5"}, {"name": "Spring Research Paper", "timeframe": "", "concepts": "", "skills": "", "materials": "SRP Folder (all 2026 resources)", "assessments": ""}, {"name": "Unit 6"}, {"name": "Mini-unit on the scientific revolution and enlightenment", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Atlantic Revolutions", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Class V History", "department": "History", "teacher": "Sadoff/Fedeli", "grade": "", "length": "", "description": "", "competencies": "", "units": [{"name": "Unit 1"}, {"name": "Early Humans/Neolithic Revolution", "timeframe": "", "concepts": "What is history? Why study history?\nHow do social scientists interpret the past?\nHow did humans live as hunter-gatherers in the Paleolithic Age?\nHow did the development of agriculture change daily life in the Neolithic Age?", "skills": "Analyzing visual primary sources\nComparing and contrasting\nParagraph writing using TWR program\nUsing sentence fragments to create expanded sentences\nCreating SPO\nDeveloping strong topic and concluding sentences\nUsing transitions\nPeer and self-editing of drafts\nHighlighting key ideas in a text\nApplying historical concepts to a creative project", "materials": "Turnbull’s Maroo of the Winter Caves (summer reading)\nArtifact analysis activities (cave paintings/modern artifacts)\nNational Geographic’s World History: Great Civilizations (1.1, p. 12; 1.3, p. 16-17)\nTCI’s History Alive! The World Through 1750 (Lesson 4, p. 71-77, workbook p. 39-44)\nTCI’s Interactive Student Notebook (p. 1-6)", "assessments": "Comparison/contrast paragraph on Maroo\nVocabulary/key term quiz with two short answer questions\nComic book on Neolithic Revolution"}, {"name": "Unit 2"}, {"name": "Ancient Mesopotamia/Sumer", "timeframe": "End of October to end of November", "concepts": "How did geographic challenges lead to the rise of city-states in Mesopotamia?\nWhat do historians and archaeologists identify as the key characteristics of civilization?\nWhy do historians classify ancient Sumer as a civilization?\nWhat is a code of law? How does the creation of written laws impact society and government\nHow do written laws still impact us today?", "skills": "Identifying and highlighting key ideas in a text\nUsing a thematic map to understand effects of geography\nUsing a timeline/understanding BC/BCE and AD/CE\nEffective notetaking\nApplying the seven characteristics of civilization\nAnalyzing primary sources (Standard of Ur, Sumerian artifacts from TCI, excerpts from Hammurabi’s Code)", "materials": "Pearson’s My World History (Chapter 3, Section 1, p. 110-117)\nTCI Artifact Activity (found online in Lesson 6 of History Alive! The Ancient World)", "assessments": "Vocab quiz\nParagraph on Sumer and the seven characteristics of civilization"}, {"name": "Unit 3"}, {"name": "Ancient Egypt", "timeframe": "", "concepts": "How did geography affect early settlement in Egypt?\nWhat did the ancient Egyptian pharaohs accomplish and how did they do it?\nHow did social class affect daily life in ancient Egypt?\nWhat are some of the main gods and ancient Egyptian beliefs about life after death?\nHow did Egyptian beliefs about the afterlife influence daily life?", "skills": "Identifying and highlighting key ideas from a text\nTaking effective notes from a text\nEvaluating historical figures through creative writing assignment (letter to “favorite” pharaoh)\nConducting independent research\nApplying independent research to outline\nUsing outline to develop a paragraph on independent research project\nDevelop and deliver presentation on research topic", "materials": "TCI’s History Alive! The World Through 1750 (Lesson 9, p. 143-145)\nSupplemental readings from Newsela and Britannica School\nEgyptian Hieroglyph Activity from National Museum of Ireland", "assessments": "Fan letter to one of the major pharaohs\nVocabulary quiz\nResearch project on topics of daily life in ancient Egypt"}, {"name": "Unit 4"}, {"name": "Ancient China", "timeframe": "", "concepts": "How did geography affect settlement and agriculture in ancient China?\nWhat do Shang artifacts reveal about this civilization?\nWhat were the philosophies of Confucianism, Daoism and Legalism? \nHow did Confucianism, Daoism and Legalism influence political rule in ancient China?\nWhat were the major accomplishments of the Han Dynasty?", "skills": "Evaluate impact of geography on a civilization’s development\nIdentifying and highlighting key ideas from a text\nTaking effective notes from a text\nEvaluating and comparing major philosophies", "materials": "TCI’s History Alive! The Ancient World (Chapters 19-21, p. 200-231, workbook p. 142-146)\nTCI Unit V Geography Inquiry Project", "assessments": "Shang Dynasty vocabulary quiz\nCollaborative project on the Three Ancient Chinese Philosophies\nTest on Zhou Dynasty/Confucianism, Daoism, Legalism"}, {"name": "Unit 5"}, {"name": "Silk Roads", "timeframe": "", "concepts": "What was the Silk Road?\nOver what continents and terrain did it extend?\nHow did it promote an exchange of goods and ideas?", "skills": "Identifying and highlighting key ideas from a text\nTaking effective notes from a text\nUse thematic maps to understand historical trends and evaluate impact of geography on human interactions\nApply historical knowledge to a creative writing assignment", "materials": "TCI’s History Alive! The Ancient World (Chapters 24, p. 255-263, workbook p. 167-171)\nSilk Roads Activity (adapted from various sources)", "assessments": "Illustrated letter from perspective of Silk Roads trader"}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Class VI History", "department": "History", "teacher": "Sadoff/Fedeli", "grade": "", "length": "", "description": "", "competencies": "", "units": [{"name": "Unit 1"}, {"name": "Geography", "timeframe": "4 weeks", "concepts": "Continents and Oceans\nElements of Map- map title, key, scale, compass rose/cardinal directions\nPolitical, physical and thematic maps\nMap projections", "skills": "Identifying and highlighting key ideas from a text\nTaking effective notes from a text\nIdentify and apply the major elements of a map\nIdentify and use political, physical, and thematic maps\nUnderstand map projection and it causes distortion", "materials": "Seterra website (for continents and oceans review)\n“What is Geography?” reading (adapted from TCI, National Geographic, and other sources)\nGeography Alive! Regions and People (Lesson 1, p. 10-23)\n“Africa is Big, and It Wants the World’s Maps to Show It” (Newsela)", "assessments": "Test on continents and oceans, geography vocabulary, elements of a map, types of map, and map project/distortion"}, {"name": "Unit 2"}, {"name": "Alexander the Great", "timeframe": "4 weeks", "concepts": "Alexander the Great and his empire: Rise, conquest, fall\nAlexander the Great’s achievements: Hellenism, Alexandria, Library of Alexandria, etc.", "skills": "Identifying and highlighting key ideas from a text\nTaking effective notes from a text\nUse a timeline to organize key events chronologically\nUnderstanding use of BC/BCE and AD/CE\nCreate more complicated and detailed sentences using TWR strategies\nUsing transition phrases between sentences in a paragraph\nUse information from a text to write an expository paragraph; steps included\nCreating more detailed sentences withTWR’s Expanded and Summary Sentences activity\nCreate an outline using TWR’s SPO \nSelf and Peer Editing of initial draft of paragraph", "materials": "History Alive! The World Through 1750 (Lesson 19, Section 1, p. 293-294)\nHistory Alive! The Ancient World [Lesson 19, Section 1, p. 293-294, workbook p. 209-213 (modified)]\nTWR Expanded and Summary Sentences and SPO worksheets\nMeasuring Time reading (National Geo) and activity?", "assessments": "Expository paragraph on the strategies of Alexander the Great"}, {"name": "Unit 3"}, {"name": "Ancient India/Hinduism", "timeframe": "", "concepts": "Indus River Valley civilization\nHarrapo and Mojendaro- development and disappearance\nVedic Age/Brahmanism/ Aryan civilization\ngods of Hinduism \nMajor Beliefs of Hinduism: Brahman, dharma, reincarnation, samsara, moksha, etc.\npolytheism/monotheism in Hinduism\nHindu Holidays: Diwali and Holi (and the Ramayana)\nCaste system in ancient India and today", "skills": "Identifying and highlighting key ideas from a text\nTaking effective notes from a text\nArtifact analysis- identifying the origins and importance of artifacts and archaeology\nPrimary source analysis introduction: Using a primary source to decode meaning and significance \nExpository writing- ability to explain a historical concept in writing", "materials": "History Alive! The Ancient World [Unit 4, Lessons 17 and 19, Early Geography & Settlement, and Learning about Hinduism. Workbook: Unit 3, Chapter 15\nHymn from the Vedas, and primary source analysis worksheet\nPolitical and physical maps of South Asia", "assessments": "Poem on Hindu god/godess \nTest w/ political map of South Asia"}, {"name": "Unit 4"}, {"name": "Buddhism", "timeframe": "", "concepts": "Origins of Buddhism: Story of Siddhartha\nMajor Beliefs of Buddhism: 4 Noble Truths, 8 Fold Path\nSpread of Buddhism\nBuddhist practices- meditation, worship, monasteries", "skills": "Active reading/Identifying and highlighting key ideas from a text", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Ancient Israel/Judaism", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Rome", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Class VII History", "department": "History", "teacher": "Hines, Salitan, Rosenblatt", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Forms of Government and the Haudenosaunee Confederacy", "timeframe": "3 weeks", "concepts": "Early Migration & Adaptation: Foot migration of the first Americans from Siberia to Alaska across the Beringia land bridge during the last Ice Age (~30,000 years ago). Transition to hunter-gatherer lifestyles as glaciers melted and prehistoric prey died out. How diverse groups developed distinct cultures by adapting food, clothing, and shelter to local environments and natural resources across nine major cultural regions (e.g., Arctic, Eastern Woodlands, Southwest). Development of agricultural practices allowing permanent town and village settlements .\nMain Forms of Government: Defining structural variations of governance, including autocracy, anarchy, monarchy, dictatorship, democracy (direct vs. representative), oligarchy, and theocracy .\nThe U.S. Constitution & Preamble: Analyzing how the Preamble outlines democratic goals and principles, the division of power into three branches (legislative, executive, judicial), and core concepts of popular sovereignty, delegates, and the status of citizens vs. subjects .\nThe Haudenosaunee Confederacy: Examining the historical framework of the Iroquois Confederacy, the Great Peacemaker story, the Great Law of Peace, and methods for conflict resolution over resources. The governance roles of the Grand Council and Clan Mothers, the political importance of women, and visual symbols like the Hiawatha Belt. Assessing the explicit connections, similarities, and structural limits of influence between the Haudenosaunee model and the U.S. system .\nEarly European Contact & Colonization:\nMotivations: Push and pull factors prompting European migration, what they left behind, and their hopes and anxieties about the \"New World\" \n Jamestown Colony: The establishment of the first permanent English colony by The London Company, the hardships of \"The Starving Time,\" and the economic impact of John Rolfe's tobacco cultivation. Interactions and conflicts involving John Smith, the Pamunkey Tribe, Chief Powhatan, and Pocahontas .\nNew Netherland & New Amsterdam: The brief history of the Dutch colony managed by the Dutch West India Company, tracking Henry Hudson’s exploration and the leadership of Peter Minuit and Peter Stuyvesant .\nGlobal Frameworks: Fundamental concepts of mercantilism and the Columbian Exchange.", "skills": "Primary Source Analysis (PSA): Evaluating historical perspectives using foundational primary source texts, maps, and artifacts, including Christopher Columbus's journals, documents on the legacy of Jamestown tobacco, the U.S. Preamble, the Great Seal (1782), and the Hiawatha Belt .\nGeographic Literacy: Interpreting historical maps to track prehistoric migration routes across Beringia and analyzing the geographic distribution of distinct indigenous cultural regions .\nComparative Analysis: Conducting structured comparisons between indigenous governance structures (Grand Council & Clan Mothers) and Euro-American governance frameworks .\nNote-Taking & Synthesis: Annotating informational history texts (such as TCI chapters) and organizing core environmental or political data into clear notebook entries using full sentences .\nAnalytical Writing Foundations: Crafting a clear, historical claim, selecting a minimum of three distinct pieces of supporting evidence, incorporating counter-evidence to highlight historical nuances, and providing logical reasoning/analysis.", "materials": "Handouts & Readings: \"Who Rules?\", \"Eastern Woodlands Cultural Region\", The Great Peacemaker Story, and The Haudenosaunee Clan System.\nPrimary Sources: Preamble to the U.S. Constitution, Great Seal of the United States (1782), and the Hiawatha Belt.\nVisual Media: PBS Video: Democracy's Ancestors.\nGraphic Organizers: Three Branches reading matrix and the Haudenosaunee-Founding Fathers comparison charts.", "assessments": "Formative Assessments: Notebook checks evaluating text annotations (e.g., 5 key facts explaining Eastern Woodlands environmental adaptation, summary reflections on the Great Peacemaker story). Handout question worksheets tracking comprehension for Jamestown (Section 4) and New Netherland (Section 5). Active-learning checks including the forms of government \"True or False\" Activity B, vocabulary crosswords, and the Haudenosaunee Grand Council vs. U.S. Government comparison chart .\nSummative Quizzes: Content mastery assessments covering early migration, indigenous cultural regions, colonization case studies, forms of government, and the separation of powers.\nPerformance Task (In-Class Analytical Essay): A structured writing workshop process (including outline drafting and claim revisions) culminating in an analytical paragraph answering: \"To what extent did the Haudenosaunee Confederacy influence the Founding Fathers and the U.S. Constitution?\" graded on Claim, Evidence integration (3 minimum), Explanation/Analysis, and Conclusion."}, {"name": "Unit 2"}, {"name": "Toward Independence", "timeframe": "3-4 Weeks", "concepts": "The Thirteen British Colonies: Analysis of the geographic, economic, religious, structural, and political traits unique to the New England, Middle, and Southern colonial regions.\nThe French and Indian War (1754–1763): Understanding the global Seven Years' War, its financial impacts (debt), the role of Indigenous groups (Lenape, Shawnee, Haudenosaunee), and the early ambitions of George Washington.\nShifting British Imperial Policies: Transition from local colonial assembly self-governance to strict British intervention, taxes, and control .\nImperial Crises & Colonial Responses: The Proclamation of 1763, Stamp Act, Quartering Act, Townshend Acts, Boston Massacre, Tea Act, Boston Tea Party, and Intolerable Acts .\nIdeological Ideals & Factions: Differentiating between Patriots (American Whigs fighting for self-governance), Loyalists (Tories remaining faithful to the King), and Neutrals .\nOutbreak of War: The political and physical clashes leading up to the First Continental Congress and the Battles of Lexington and Concord.", "skills": "Regional Matrixing: Categorizing and comparing colonies by climate, economy, settlement motivations, and governance .\nPrimary Source Analysis (PSA): Evaluating visual media like Benjamin Franklin's 1754 \"Join, or Die\" cartoon, written records like George Washington’s 1754 letter, historical ads, and text-based songs .\nCause & Effect Relationship Mapping: Connecting specific British actions directly to their corresponding colonial reactions through structured graphic organizers .\nPerspective Taking: Adopting historical viewpoints to address opposing contemporary arguments (e.g., confronting Loyalist arguments) .\nAnalytical Writing & Argumentation: Outlining and constructing a historical essay paragraph with claims and integrated textual evidence .\nVisual Media Literacy: Drawing a contextually accurate political cartoon designed to sway community opinion.", "materials": "Texts & Case Chapters: TCI's Toward Independence (comprising Section 1: \"Before 1763\", Section 2: \"Early British Actions in the Colonies\", Section 3: \"The Townshend Acts\", Section 4: \"The Boston Massacre\", Section 5: \"The Boston Tea Party\", Section 6: \"The Intolerable Acts\", and Section 7: \"Lexington and Concord\").\nPrimary & Visual Sources: Benjamin Franklin’s \"Join, Or Die\" political cartoon, George Washington’s Letter (May 31, 1754), the colonial Tea Song, and historical advertisement calls from the Sons of Liberty (December 1773) .\nMedia: Classroom video comparing the New England, Middle, and Southern colonies .\nGraphic Organizers: Thirteen Colonies comparative chart, \"Is the Stamp Act Unfair?\" matrix, and the British Actions and Colonial Reactions tracker.", "assessments": "Formative Assessments: Active evaluation of TCI reading notes, regional feature charts (New England, Middle, Southern), \"Is the Stamp Act Unfair?\" comprehension questions, and the complete British Actions and Colonial Reactions cause-and-effect organizer .\nSummative Quiz: A 10-question multiple-choice assessment evaluating mastery of sections 1–6 (covering the initial population boom through the Intolerable Acts) .\nSummative Performance Task (Persuasive Speech & Cartoon): A creative roleplay assessment where students write a 1–2 paragraph persuasive speech and sketch a political cartoon from the perspective of a 1774 Massachusetts Patriot. The final work must explicitly detail:\nShifts in colonial lifestyle under heightened British interest .\nAt least one British act or policy denying fundamental freedoms and taking away rights .\nA definitive call to action while explicitly addressing Loyalist counterarguments .\nAlternative Assessment Option (Analytical Paragraph): A structured historical writing paragraph evaluating the specific causes and consequences of a chosen colonial event, supported by integrated primary evidence explaining colonial opposition."}, {"name": "Unit 3"}, {"name": "Declarations of Freedom and the Revolutionary Era", "timeframe": "Approximately 4 weeks", "concepts": "The Declaration of Independence (DOI): The what, who, when, where, and why of the document. Understanding the foundational structure of the DOI, specifically separating the political philosophies of the Preamble from the logistical complaints within the Grievances section.\nEnlightenment Philosophy & Governance Principles: The influence of John Locke’s theories on natural or unalienable rights (rights people are born with, not granted by government) and the core concept that legitimate political power derives strictly from the consent of the governed.\nThe Second Continental Congress: The function, importance, and historical context of the assembly of colonial representatives meeting in Philadelphia starting in 1775.\nThe Paradox of Liberty & Omissions: Evaluating the deep historical contradiction between the egalitarian ideals expressed in the Declaration of Independence and the realities of who was systematically omitted from those rights (African Americans, women, and Indigenous peoples within the thirteen colonies).\nEarly Abolitionism & Legal Resistance:\nAnalyzing Prince Hall’s 1777 Petition to the Massachusetts Legislature (\"Slave Petition\") and how early abolitionists strategically weaponized the Patriots' own anti-Britain rhetoric to expose the hypocrisy of slavery.\nExamining how legal foundations like the Sheffield Resolves (1773) and the Massachusetts State Constitution of 1780 altered state law.\nTracking the landmark 1781 court case of Elizabeth \"Mumbet\" Freeman and how the Massachusetts judiciary ultimately utilized constitutional language to end state slavery.\nThe Realities of the Revolutionary War (1776): Understanding daily life, hardships, and socio-political tensions during the war through the lens of occupied New York City in 1776. Key historical reference points include Thomas Paine's Common Sense, the Battle of Brooklyn, the Great Fire of New York, the British military occupation, the horrors of British prison ships, and the active conflict between local Loyalists and Patriots.", "skills": "Primary Source Text Translation: Breaking down complex 18th-century legal and political prose (e.g., Prince Hall's petition text or the 1780 Massachusetts Constitution) and rewriting those historical ideas accurately into modern language.\nChronological & Contextual Reasoning: Analyzing why specific legal arguments (like Elizabeth Freeman's freedom suit) succeeded in 1781 but would have historically failed before the adoption of the 1780 state constitution.\nHistorical Perspective-Taking / Roleplay Writing: Empathizing with and adopting the voice of historical figures (e.g., Elizabeth Mumbet Freeman) or contemporary observers to construct compelling, legally grounded, and persuasive first-person arguments.\nTextual Coding & Citing: Selecting and integrating short, direct quotes from historical primary sources into analytical text to reinforce a central claim.\nVisual Literacy & Symbolic Representation: Translating complex socio-political conditions, plot points, and historical atmospheres (e.g., 1776 NYC tensions) into deliberate visual designs and symbolic imagery.", "materials": "Core Historical Literature: Sophia’s War (Part I) by Avi.\nPrimary Sources & Petitions: The Declaration of Independence (1776), Prince Hall’s Petition to the Massachusetts Legislature (January 1777), the Sheffield Resolves (1773), and the Massachusetts State Constitution (1780).\nPolitical Texts: Thomas Paine’s Common Sense (1776).\nScaffold Tools: Student Quiz Review Sheets, Peer-to-Peer Question-Drafting Guides, and the Mumbet Opening Statement Essay Outline.", "assessments": "Formative Assessments: Student-generated quiz question exercises (collaboratively writing mock multiple-choice and fill-in-the-blank questions to test peers on vocabulary terms like Abolitionist, Grievance, and Second Continental Congress); primary source worksheet translations (the 1780 MA Constitution translation matrix).\nSummative Quiz (Declarations of Freedom): A multi-part assessment consisting of conceptual multiple-choice questions regarding the mechanics of the DOI and Enlightenment philosophy, paired with a detailed, text-based primary source parsing exercise testing student comprehension of Prince Hall's 1777 petition.\nSummative Creative-Analytical Project (Sophia's War Book Cover): A dual-part design task requiring students to create a detailed book cover featuring 5–6 thematic elements (with at least 2 making explicit links to historical realities like prison ships or the Great Fire), backed by an analytical 6–8 sentence paragraph justifying their visual, historical, and symbolic decisions."}, {"name": "Unit 4"}, {"name": "Creating the Constitution, the Bill of Rights, and Early Political Developments", "timeframe": "Approximately 5 to 6 weeks", "concepts": "The Articles of Confederation: Understanding the structural post-independence fears of tyranny that led states to initially design a weak central government. Evaluating its historic legislative achievements (The Northwest Ordinances) against its systemic weaknesses exposed by armed civil unrest (Shays' Rebellion).\nThe Constitutional Convention & Compromises: Mapping the conflicting visions for national representation, specifically contrasting the population-weighted Virginia Plan against the equal-status New Jersey Plan, and analyzing how they were unified via a bicameral legislature under the Great Compromise. Investigating the deep moral and political debates over demographics that led to the Three-fifths Compromise and the structural framework of the Electoral College.\nThe Ratification Crisis & Ideological Fractions: Debating the balance of federalism, separation of powers, and checks and balances. Contrasting the Federalists (advocating for centralized authority) with the Anti-Federalists (fearing unchecked federal reach and demanding explicit protections for individual liberties).\nThe Bill of Rights & Core Individual Liberties: The role of James Madison in drafting foundational protections. Analyzing the amendments as direct structural safeguards against past historical abuses under British colonial rule, focusing on:\nFirst Amendment: Protections of individual expression (speech, religion, assembly, press, petition) and their civil boundaries (e.g., unlawful property damage vs. protected protest).\nSecond & Third Amendments: Protections regarding civilian gun ownership and limits on quartering troops in private residences.\n Fourth Amendment: Shielding citizens from unreasonable searches, seizures, and property invasions without legal warrants.\nThe Mechanics of the Constitution & Amendment Process: Understanding why constitutional amendments are uniquely rare (only 27 instances in over 230 years). Evaluating how laws adapt over time through three branches of government: legislative changes, constitutional amendments, and judicial rulings.\nThe Judicial Branch & The Supreme Court: The architecture of the federal court system (appellate paths to the Supreme Court), the lifelong tenure of justices, and their power of judicial review to strike down or repeal unconstitutional legislation. Reviewing how landmark Supreme Court precedents apply directly to the legal protections of teenagers.\nThe Emergence of Political Parties & The Election of 1800: Tracking the transition of the federal government capital to Washington, D.C. Analyzing the growing partisan chasm between John Adams (Federalist platform prioritizing central stability and peace) and Thomas Jefferson (Democratic-Republican platform prioritizing states' rights and agrarian simplicity). Examining how political campaigns utilized early print media, songs, and visual satire to debate what constitutes \"fair and free elections.\"", "skills": "Demographic Data Interpretation: Analyzing and cross-referencing population data tables (e.g., the 1790 Census) to contextualize the geographic stakes behind early congressional compromises.\n\n* Comparative System Design: Weighing opposing governance platforms (Virginia vs. New Jersey Plans; Federalists vs. Anti-Federalists) to assess how political systems reconcile conflicting interests.\n\n* Primary Source Text & Media Literacy: Parsing and decoding early American political campaign song lyrics (\"Hail Columbia\" vs. \"Fair and Free Elections\"); translating visual satire and political iconography embedded within historical cartoons (\"Mad Tom in a Rage\").\n\n* Legal Application & Boundaries Reasoning: Evaluating real-world and simulated civics scenarios to distinguish between legally protected constitutional rights and unprotected civil actions.\n\n* Digital Policy Research: Navigating modern federal databases (e.g., congress.gov) to investigate modern constitutional policy, sponsor platforms, and legislative movements.\nArgumentative Presentation Craft: Outlining, structuring, and delivering a cohesive 3–5 minute oral or multimedia presentation defending a specific policy stance using validated external evidence.\n\n* Evidence-Based Analytical Writing: Constructing tightly organized written responses featuring a definitive claim, targeted evidence, and explanatory reasoning across brief formats (2–3 sentence short answers) and complete analytical paragraphs (5–6 sentences).", "materials": "Core Curricular Reading Packets: Creating the Constitution reading packet, Anatomy of the Constitution guide, The Bill of Rights mini-packet, and The Judicial Branch mini-packet.\n\n* Text & Article Resources: TCI's Political Developments/The Election of 1800 case readings; Scholastic's \"3 Supreme Court Cases Every Teen Should Know\" by Brooke Ross (February 2022).\n\n* Primary Sources & Visual Records: Text and lyric sheets for early political songs \"Hail Columbia\" and \"Fair and Free Elections\"; Anonymous 1800 political cartoon artwork \"Mad Tom in a Rage\"; Demographic charts compiled from the 1790 United States Census.\n\n* Scaffold & Research Organizers: Amending the Constitution Packet & Project Guide; Unit 4 Assessment Review Sheet; Learning Check, Bill of Rights exercise sheets.", "assessments": "Formative Assessments & Learning Checks:\nLearning Check, Bill of Rights: An 8-question conceptual multiple-choice check evaluating knowledge of state ratification arguments, Madison's role, and First through Fourth Amendment scope.\nElection of 1800 Lyric Activity: Comprehension worksheet tracking political changes from Washington's inauguration to the election of 1800.\nMad Tom in a Rage Visual Analysis: Written synthesis identifying political symbols and artist bias within early media.\nChanging Laws Research Guide: Completion of research matrices compiling author data, URLs, and a summary of modern legislative viewpoints.\n\nSummative Research Project (Amending the Constitution Presentation): A 3–5 minute persuasive presentation (delivered via song, video, website, poster, editorial, or speech) requiring students to pick a proposed constitutional amendment, locate its main sponsor on congress.gov, compile three external source perspectives on its policy merits, and argue its long-term societal impact\n.\nSummative Unit Exam (Unit 4 Assessment): A comprehensive written assessment utilizing limited multiple-choice items and heavy written-response sections. Students are graded via a Claim-Evidence-Reasoning rubric on their capacity to process primary source excerpts across short-answer responses (2–3 sentences) and structured paragraphs (5–6 sentences) evaluating historical compromises, the Bill of Rights, and the power of the federal judiciary."}, {"name": "Unit 5"}, {"name": "The New Nation: 1800 and Beyond (Political Developments and Expansion)", "timeframe": "Approximately 3-4 weeks", "concepts": "Launching the New Government: Examining the foundatio
