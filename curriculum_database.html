<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curriculum Database</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f9fa; --card-bg: #ffffff; --primary: #2563eb; --primary-light: #eff6ff;
      --text: #1e293b; --text-muted: #64748b; --border: #e2e8f0;
      --chip-bg: #f1f5f9; --chip-active: #2563eb; --chip-active-text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }
    header { background: white; border-bottom: 1px solid var(--border); padding: 24px 32px; }
    header h1 { font-size: 1.5rem; font-weight: 700; }
    header p { color: var(--text-muted); font-size: 0.875rem; margin-top: 4px; }
    .controls { padding: 16px 32px; background: white; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 360px; }
    .search-wrap input { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.875rem; outline: none; font-family: inherit; }
    .search-wrap input:focus { border-color: var(--primary); }
    .search-wrap::before { content: "🔍"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 0.75rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { padding: 4px 12px; border-radius: 20px; background: var(--chip-bg); border: 1px solid var(--border); font-size: 0.78rem; cursor: pointer; color: var(--text-muted); transition: all 0.15s; white-space: nowrap; }
    .chip:hover { border-color: var(--primary); color: var(--primary); }
    .chip.active { background: var(--chip-active); border-color: var(--chip-active); color: var(--chip-active-text); }
    .count { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; padding: 24px 32px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; cursor: pointer; transition: all 0.2s; }
    .card:hover { border-color: var(--primary); box-shadow: 0 4px 12px rgba(37,99,235,0.08); transform: translateY(-1px); }
    .card-dept { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 7px; }
    .card-title { font-size: 0.98rem; font-weight: 600; margin-bottom: 6px; line-height: 1.3; }
    .card-meta { font-size: 0.78rem; color: var(--text-muted); display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .card-desc { font-size: 0.78rem; color: var(--text-muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .card-units { margin-top: 10px; display: flex; gap: 5px; flex-wrap: wrap; }
    .unit-tag { font-size: 0.68rem; padding: 2px 8px; background: var(--primary-light); color: var(--primary); border-radius: 4px; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal { background: white; border-radius: 16px; max-width: 700px; width: 100%; max-height: 88vh; overflow-y: auto; position: relative; }
    .modal-header { padding: 24px 24px 0; position: sticky; top: 0; background: white; z-index: 1; border-radius: 16px 16px 0 0; }
    .modal-dept { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
    .modal-title { font-size: 1.35rem; font-weight: 700; margin-top: 4px; line-height: 1.25; }
    .modal-meta { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; color: var(--text-muted); font-size: 0.83rem; }
    .modal-close { position: absolute; top: 18px; right: 18px; background: none; border: none; font-size: 1.1rem; cursor: pointer; color: var(--text-muted); padding: 6px 10px; border-radius: 6px; line-height: 1; }
    .modal-close:hover { background: var(--chip-bg); }
    .modal-tabs { display: flex; border-bottom: 2px solid var(--border); margin-top: 18px; }
    .tab { padding: 8px 16px; font-size: 0.84rem; cursor: pointer; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tab.active { color: var(--primary); border-color: var(--primary); font-weight: 600; }
    .modal-body { padding: 20px 24px 28px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .section { margin-bottom: 20px; }
    .section-label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 6px; }
    .section-content { font-size: 0.88rem; line-height: 1.65; color: var(--text); white-space: pre-wrap; }
    .unit-card { border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 10px; }
    .unit-name { font-weight: 600; font-size: 0.93rem; margin-bottom: 10px; color: var(--text); }
    .unit-field { margin-bottom: 8px; }
    .unit-field-label { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .unit-field-value { font-size: 0.84rem; color: var(--text); margin-top: 3px; white-space: pre-wrap; line-height: 1.55; }
    .empty { text-align: center; padding: 60px 32px; color: var(--text-muted); font-size: 0.9rem; display: none; }
    footer { text-align: center; padding: 24px; color: var(--text-muted); font-size: 0.72rem; border-top: 1px solid var(--border); margin-top: 8px; }
  </style>
</head>

<footer>Last updated: 2026-06-09 &nbsp;·&nbsp; 171 courses across 13 departments</footer>

<script>
const COURSES = [{"name": "US History", "department": "History", "teacher": "LE Hartmann, Nina Rosenblatt. Gabriel Ulibarri", "grade": "", "length": "", "description": "", "competencies": "Close reading and contextualization of primary and secondary sources\nConsidering the role of narrative in historical thinking and why accounts of the past are not just “the facts” \nUsing readings to formulate questions for further research \nConstructing sound arguments using evidence, reasoning, and chronological and contextual thinking skills", "units": [{"name": "Unit 1"}, {"name": "Unit 1: Introduction/Collision of Cultures in 16th Century North America", "timeframe": "4 weeks", "concepts": "Essential Questions:\nWhy do people disagree about what happened in the past? \n\nHow did the establishment of English colonies in North America fit into larger patterns of global trade and European expansion?  How did it differ?\nWhy and how did the legal definition of slavery emerge and solidify in colonial America? Why did race-based chattel slavery replace indentured servitude?", "skills": "Close reading and contextualization of primary and secondary sources\nConsidering the role of narrative in historical thinking and why accounts of the past are not just “the facts” \nUsing readings to formulate questions for further research \nConstructing sound arguments using evidence, reasoning, and chronological and contextual thinking skills", "materials": "Summer Reading: Erica Armstrong Dunbar, Never Caught: The Story of Ona Judge\nDavid Shi, America \nPrimary Source Readings", "assessments": "In-Class Writing on Summer Reading\nUnit Quiz\nIn Class DBQ (Document Based Question)"}, {"name": "Unit 2"}, {"name": "Era of Revolution", "timeframe": "4 weeks", "concepts": "Essential Questions \n\nWhy/in what ways did North American colonists begin to develop a “common colonial culture” by the mid-1700s?\nIn what ways did the American Revolution draw on Enlightenment ideas?\nHow “revolutionary” was the American Revolution?", "skills": "Close reading and contextualization of primary and secondary sources\nConsidering the role of narrative in historical thinking and why accounts of the past are not just “the facts” \nUsing readings to formulate questions for further research \nConstructing sound arguments using evidence, reasoning, and chronological and contextual thinking skills", "materials": "David Shi, America (textbook)\nPrimary Source Readings \nVarious historians’ analyses of the American Revolution", "assessments": "Quiz \nGraded roundtable discussion: How revolutionary was the American Revolution?"}, {"name": "Unit 3"}, {"name": "The Constitution and the Early Republic", "timeframe": "5 Weeks", "concepts": "Essential Questions:\n\nWhat view(s) of government were expressed in the Constitution and the debates over its drafting and ratification? What views of individual rights were expressed in those debates?\nDid developments in the Early Republic live up to the ideals expressed in the Constitution?", "skills": "Close reading and contextualization of primary and secondary sources\nConsidering the role of narrative in historical thinking and why accounts of the past are not just “the facts” \nUsing readings to formulate questions for further research \nConstructing sound arguments using evidence, reasoning, and chronological and contextual thinking skills", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Public Speaking", "department": "Beyond Barriers", "teacher": "Whalen", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place", "units": [{"name": "Unit 1"}, {"name": "The Gettysburg Address", "timeframe": "¼ semester", "concepts": "The historical and rhetorical significance of the Gettysburg Address as an example of effective public speaking.\nFundamentals of speech memorization and oral delivery.\nCore vocal delivery techniques, including vocal inflection, emphasis, pacing, pausing, tone, and volume.\nThe role of physical presence in public speaking, including stance, posture, eye contact, and composure.\nThe relationship between preparation, repetition, and confident performance.\nThe importance of precision and accuracy in formal speech delivery.", "skills": "Memorizing and accurately reciting a formal speech.\nDemonstrating effective vocal variety through inflection, emphasis, pacing, pause, tone, and volume.\nMaintaining confident posture and appropriate stage presence during delivery.\nSpeaking clearly and audibly for an audience.\nApplying feedback to improve performance through repeated practice and revision.\nBuilding confidence and fluency in public speaking through repetition and performance mastery.", "materials": "The Gettysburg Address", "assessments": "Performance-based assessment of the Gettysburg Address focused on:\nAccuracy of memorization\nVocal delivery techniques\nPhysical presence and posture\nClarity and confidence\nStudents must deliver the speech word-for-word with proficiency before advancing to the next unit."}, {"name": "Unit 2"}, {"name": "Toast writing and delivery", "timeframe": "¼ semester", "concepts": "The purpose, structure, and tone of ceremonial and commemorative speeches.\nDifferences between various forms of toasts and tribute speeches, including wedding toasts, eulogies, retirement speeches, birthday toasts, and award speeches.\nThe role of audience, occasion, and relationship in shaping a speaker’s message.\nElements of effective storytelling, humor, sincerity, and emotional appeal in public speaking.\nCharacter development and audience adaptation through creative writing and performance.\nThe writing and revision process for short-form speeches.", "skills": "Adapting speech content and tone to fit a specific occasion and audience.\nWriting organized and engaging ceremonial speeches with a clear introduction, body, and conclusion.\nIncorporating storytelling, descriptive language, humor, and emotional resonance into speeches.\nRehearsing and delivering speeches with vocal variety, pacing, confidence, and appropriate emotional tone.\nDemonstrating improvisation and adaptability when working with randomly assigned speech scenarios and characters.\nProviding and applying peer and teacher feedback during the drafting and rehearsal process.\nSpeaking using only an index card – somewhat memorized, but not entirely", "materials": "Toast examples from films/TV shows", "assessments": "Toast delivery / expectations \nCompletion and quality of fictional character profile creation.\nDraft submission and teacher/peer feedback checkpoints.\nPerformance-based assessment of the final toast or tribute speech, evaluating:\nOrganization and clarity\nAudience and occasion awareness\nCreativity and storytelling\nEmotional authenticity and tone\nVocal delivery and stage presence\nPeer feedback and reflection activities.\nSelf-assessment on preparation, rehearsal, and delivery growth."}, {"name": "Unit 3"}, {"name": "“How to” presentations using Google Slides", "timeframe": "¼ semester", "concepts": "The purpose and structure of an instructional (“how-to”) presentation.\nPrinciples of effective multimedia presentation design, including slide organization, visual hierarchy, readability, and minimal text usage.\nThe relationship between visual aids and oral communication.\nAudience engagement strategies during informational speaking.\nThe importance of rehearsal, preparation, and familiarity with material in fluent speech delivery.\nTechniques for maintaining audience attention through pacing, clarity, visuals, and confident delivery.", "skills": "Organizing and presenting a clear step-by-step instructional process.\nDesigning effective Google Slides presentations that emphasize visuals over text.\nSpeaking extemporaneously without relying on notes or reading directly from slides.\nMaintaining eye contact and audience engagement during presentations.\nDemonstrating vocal clarity, confidence, pacing, and appropriate volume.\nUsing purposeful gestures and professional stage presence.\nApplying principles of visual design, including formatting, readability, grammar, and mechanics.\nManaging presentation timing within a five-minute speaking window.", "materials": "A clicker from tech dept to use when kids are delivering their presentations (so they don’t have to stand behind computer) \n\nOther kids’ examples from previous years (E block, 2026)   (H block, 2026)", "assessments": "Evaluation of completed slide presentation based on:\nOrganization and clarity of ideas\nEffective use of visuals\nMinimal and purposeful text usage\nFormatting, readability, grammar, and mechanics\nPerformance-based assessment of final presentation evaluating:\nFluency and confidence in speaking\nAbility to present without notes or reading slides\nEye contact and audience engagement\nVocal clarity, pacing, and volume\nPhysical presence, posture, and purposeful gestures\nEffective integration of slides as supporting visual aids\nAdherence to the required presentation length\nPeer feedback and self-reflection following presentations.\n\n“How To” expectations  – rubric"}, {"name": "Unit 4"}, {"name": "“The Moth” (Personal storytelling)", "timeframe": "¼ semester", "concepts": "The structure and purpose of personal narrative storytelling.\nThe influence of organizations such as The Moth on modern spoken storytelling.\nElements of effective storytelling, including conflict, pacing, detail, reflection, and emotional resonance.\nThe role of vulnerability, authenticity, and personal voice in public speaking.\nTechniques for organizing a story with a clear beginning, middle, climax, and resolution.\nThematic exploration of personal growth, change, and lessons learned.\nThe importance of rehearsal and revision in polished oral storytelling.", "skills": "Brainstorming and selecting meaningful personal experiences appropriate for oral storytelling.\nStructuring a coherent narrative around a central theme or lesson.\nUsing descriptive language, pacing, tone, and vocal variety to engage an audience.\nDelivering an extended speech from memory or minimal notes while maintaining fluency.\nDemonstrating confidence, eye contact, purposeful movement, and audience awareness.\nRevising stories based on teacher and peer feedback.\nReflecting on personal experiences and communicating them effectively to an audience.", "materials": "Mentor stories and video examples from The Moth. – have kids pick stories they liked after browsing \nBrainstorming sheet – helpful to identify stories", "assessments": "Performance-based assessment of final storytelling speech evaluating:\nNarrative organization and clarity\nDevelopment of theme and reflection\nAudience engagement and emotional impact\nVocal delivery, pacing, and fluency\nConfidence, eye contact, and stage presence\nPreparedness and rehearsal\nAdherence to the 5–6 minute time requirement"}]}, {"name": "Ancient Philosophy", "department": "Classics", "teacher": "Stephanie Crooks", "grade": "X-XII", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future\n* Textual Analysis: Critically reading, annotating, and interpreting dense historical philosophical texts.\n* Argumentation & Dialectic: Constructing valid logical arguments and engaging in respectful, analytical verbal debate.\n* Philosophical Application: Translating abstract metaphysical and ethical frameworks into concrete solutions for modern ethical dilemmas.", "units": [{"name": "Unit 1"}, {"name": "Unit 1: The Presocratics", "timeframe": "7 Weeks", "concepts": "The historical, systematic transition from mythos (mythology) to logos (rational argumentation).\nMonism and the pursuit of the primordial element (arche) across the Milesians (Thales, Anaximander, Anaximenes).\nPythagorean mathematical mysticism and Xenophanes’ early critique of anthropomorphic religion.\nThe ultimate metaphysical standoff regarding nature and reality: Heraclitus’ doctrine of constant change versus Parmenides’ structural defense of absolute permanence and Zeno's paradoxes.\nEarly physical materialism through the foundational tenets of Ancient Atomism (Leucippus & Democritus).", "skills": "Reconstructing cohesive arguments from isolated textual fragments.\nTranslating foundational abstract worldviews into conceptual illustrations and diagrams.", "materials": "S. Marc Cohen, Readings in Ancient Greek Philosophy (pp. 7–59).\nJames Warren, Presocratics (Secondary background text).", "assessments": "Formative: \"Snowball Discussion\" over hard-copy text fragments; conceptual drawing workshops (\"Draw what we know about the Presocratics\").\nSummative: In-class open-book/open-note analytical writing response (30 minutes)."}, {"name": "Unit 2"}, {"name": "Rhetoric, Socrates, and the Sophists", "timeframe": "7 weeks", "concepts": "The rise of 5th-century Athenian democracy and the educational influence of the Sophists.\nRelativism and the absolute power of persuasion vs. objective truth via Gorgias' Encomium of Helen.\nThe Socratic elenchus (cross-examination) as an antidote to dangerous, deceptive rhetoric.\nCivil disobedience, civic duty, legal integrity, and historical memory surrounding the trial and execution of Socrates.", "skills": "Sophistic Manipulation: Actively using emotional appeal, logic, and vivid tone to successfully \"make the weaker argument stronger\".\nComparative Source Evaluation: Evaluating biases by contrasting Plato's stylized Socratic portrait with Xenophon’s distinct accounts.", "materials": "Gorgias, Encomium of Helen.\nPlato, Gorgias, Apology (pp. 90–106), and Crito.\nXenophon (selected historical excerpts).\nPop-culture integration: The Good Place (Episode 12, exploring ethical theories).", "assessments": "Formative: Rhetorical simulation presentation (\"Make the Weaker Argument Stronger\" challenge); visual artwork analysis (The Death of Socrates).\nSummative: Semester 1 Final Project and Oral Presentation Workshop/Colloquium."}, {"name": "Unit 3"}, {"name": "Eros, Dialectic, and the Ladder of Love", "timeframe": "Approximately 4 Weeks", "concepts": "The transition from cosmology to targeted virtue ethics: asking How should one live a good life?.\nMulti-dimensional definitions of Love (Eros) via the dramatic structure of a symposium.\nIndividual parsing of early speeches: Phaedrus, Pausanias, Aristophanes, and Agathon.\nDiotima’s philosophical revelation: Love defined as the fundamental desire to possess the good forever, generating wisdom through the \"Ladder of Love\".\nThe sudden structural interruption of Alcibiades: exploring the tension between ideal abstract virtue and messy, unrequited reality.", "skills": "Jigsaw text reading: synthesizing, taking ownership of, and instructing peers on specific sub-sections of a complex dialogue.", "materials": "Plato, Symposium (Cohen et al., pp. 202–234).", "assessments": "Formative: Guided slide presentations; collaborative Think-Pair-Share peer reviews.\nSummative: Homework Response 1 (What is Love?)."}, {"name": "Unit 4"}, {"name": "The Body, Death, and the Cosmos", "timeframe": "Approximately 1 Week", "concepts": "Cynicism and radical societal counter-culture via the philosophy of Diogenes the Dog Philosopher.\nThe physical human corpse: balance points between modern ecological reality and historical rituals honoring the dead.", "skills": "Connecting ancient materialist philosophies with current 21st-century socio-environmental issues.", "materials": "Thomas W. Laqueur, The Work of the Dead (selected intros).\nNew York Times features regarding modern eco-friendly green burials.", "assessments": "Formative: Comparative class debates surrounding the biological versus social value of inanimate bodies.\nSummative: Homework Response 2 (What is the body, and why do we care about it during and after life?)."}, {"name": "Unit 5"}, {"name": "Aristotelian Ethics and Action", "timeframe": "Approximately 4 Weeks", "concepts": "The teleological endpoint of human life: eudaimonia (human flourishing).\nMoral psychology: how virtue is systematically acquired through habit, practice, and finding the intermediate \"golden mean\".\nStructural taxonomy of human character types: the Continent (enkrates), the Incontinent (akrates), and the Bad/Vicious (kakos).\nAristotle’s foundational triad of friendship: Utility, Pleasure, and Complete/Virtue friendship.", "skills": "Applied Typography: Diagnosing fictional or literary archetypes using strict philosophical moral categories.", "materials": "Aristotle, Nicomachean Ethics (Books I, II, VII, and IX).", "assessments": "Formative: Guided Quote Workshops; \"Fictional Profile Construction\" project where teams map Aristotelian virtue states onto complex literary figures.\nSummative: Homework Response 3 (Field interview synthesis on the core purpose of humanity)."}, {"name": "Unit 6"}, {"name": "Hellenistic Philosophy and Passions", "timeframe": "Approximately 4 Weeks", "concepts": "Epicurean hedonism: understanding the calculation of pain and the real pursuit of tranquility (ataraxia).\nThe fundamental tenets of Roman Stoicism.\nStoic emotional therapy: unpacking anger as a calculated choice rather than an involuntary biological instinct.", "skills": "Applying ancient philosophical exercises (\"therapies\") to resolve personal modern behavioral dilemmas.", "materials": "Epicurus, Letter to Menoecus.\nSeneca, On Anger (Books I & III) and Letters to Lucilius.", "assessments": "Formative: \"Stoic Parable Activity\"; collaborative analytical role-play resolving situational anger via Zenonian or Senecan models.\nSummative: Critical Journal Exercise (Evaluating personal success rates of Senecan therapies)."}, {"name": "Unit 7"}, {"name": "Stoic Myth, Power, and Legacy", "timeframe": "Approximately 4 Weeks", "concepts": "Stoic philosophy rendered in art: tracing passion, betrayal, and unravelling in Roman tragedy.\nComparative mythology and literature: tracing structural choices across Euripidean vs. Senecan theater.\nThe concept of the \"Philosopher King\" operating at the height of absolute political power.\nDeconstructing Hollywood's highly romanticized visual representation of Roman Stoicism.", "skills": "Cross-Media Criticism: Dissecting modern film representations of historical figures using primary journals.", "materials": "Seneca, Medea.\nMarcus Aurelius, Meditations (Books 1–3, Book 6 selections).\nCinematic media: Gladiator (2000, introductory sequence).", "assessments": "Formative: Class-wide comparative blurb workshop (Seneca vs. Euripides); course review gamification (Kahoot).\nSummative: Final Capstone Research Presentation and Year-End Colloquium."}]}, {"name": "Elementary Ancient Greek 1 and 2", "department": "Classics", "teacher": "Talia Varonos", "grade": "9-12", "length": "", "description": "", "competencies": "Linguistic Foundation & Phonetic Fluency: Students master the mechanics of the Ancient Greek alphabet, distinguishing between vowels, consonants, diphthongs, and breathing marks. They demonstrate the ability to read Greek text aloud with proper oral pronunciation, stress, and natural phrasing, building the foundational comfort necessary to recognize syntactic patterns visually and aurally.\nMorphological Analysis & Decoding Confidence: Students identify and accurately parse fundamental grammatical building blocks (such as early noun cases, sentence agreements, and present/past verb systems). Rather than relying solely on word-for-word decoding, they learn to recognize linguistic structures to translate continuous prose narratives with an intuitive sense of flow, ease, and joy.\nTextual Scaffolding Navigation: Students build early resilience and autonomy in reading by transitioning from controlled textbook exercises to encountering original Ancient Greek excerpts. They learn how to systematically use supportive pedagogical aids, including facing-page notes, historical commentaries, and running glossaries, to independently unpack meaning from unadapted or lightly adapted classical text segments.\nParallel Cultural & Literary Interpretation: Students actively examine the history, worldview, and core values of the classical world by reading foundational texts across different genres in English translation (epic poetry with Homer's Iliad and classical comedy with Aristophanes' Clouds). They synthesize linguistic insights with literary themes to gain an empathetic understanding of archaic and democratic Athenian societies, tracking how concepts like heroic honor (timē) or social satire function in context.", "units": [{"name": "Unit 1"}, {"name": "Language Foundations & Epic Beginnings (Part I — Fall)", "timeframe": "6–7 weeks", "concepts": "Greek alphabet (vowels, consonants, diphthongs, and breathing marks);\n introduction to an inflected language; \nreading Homer's Iliad (Books 1-12) in English to explore heroic values (timē and kleos), divine intervention, and Mycenaean/Archaic Greek culture.", "skills": "Learning to read and write in Ancient Greek\nTranslating Ancient Greek\nBasic Morphology \nIdentifying word stems etc.\nAnalyzing epic themes, narrative structures, and historical context from the English text of the Iliad", "materials": "Athenaze\nHomer’s Iliad in translation (Emily Wilson)", "assessments": "Quizzes and projects"}, {"name": "Unit 2"}, {"name": "Narrative Progression & Epic Conclusions (Part I — Fall)", "timeframe": "8–9 weeks", "concepts": "Present active indicative verb conjugations\nImperative moods\nNoun declensions and case function (nominative, accusative, genitive, dative); \nComplete Homer's Iliad (Books 13-24) in English to evaluate concepts of mortality, grief, and reconciliation.", "skills": "Parsing verbs and nouns\nTranslating and analyzing sentence structures in Athenaze reading passages and exercises\n Discussion and analysis of Iliad", "materials": "Athenaze\nHomer’s Iliad in translation (Emily Wilson)", "assessments": "Quizzes\nMicroproject that involves tracing the historying, etymology, and evolution of a single word from English to Ancient Greek."}, {"name": "Unit 3"}, {"name": "Developing Grammatical Confidence and Translation Ease", "timeframe": "8–9 weeks", "concepts": "Study and consolidation of verbs, infinitives\nIntroduction to relative clauses and results clauses in Athenaze; \nTranslation and analysis of complex sentence patterns to build a solid grammatical foundation. \nAcquisition and consolidation of new and old vocabulary\nTargeted, two-week module in early March preparing for the National Greek Exam by reviewing core syntax patterns.", "skills": "Cultivating translation fluency\nReading Greek passages aloud to master pronunciation and facilitate auditory comprehension\n Utilizing grammar concepts to translate with intuitive flow and joy \nLearning and reviewing the material covered on the National Greek Exam (during the 2-week exam review).", "materials": "Athenaze\nPractice exams and exercises provided by the American Classical League, which administers the National Greek Exam.", "assessments": "Quizzes"}, {"name": "Unit 4"}, {"name": "Building the Translation Foundation and Aristophanes' Clouds", "timeframe": "8 weeks", "concepts": "Introduction to contract verbs, third declension nouns, and noun-adjective agreement\nAcquisition and consolidation of vocabulary, new and old \nContinue practicing and honing translation skills\nReading of Aristophanes' Clouds in English to study Old Comedy, democratic Athenian culture, and the historical/literary depiction of Socrates.", "skills": "Continuing to practice and build core translation skills with ease\nReading aloud with proper phrasing\nEvaluating philosophical and political satire in 5th-century BCE Athens.", "materials": "Athenaze (Book I), \nAristophanes' Clouds (English translation).", "assessments": "Quizzes and final assignment, which involves students writing their own dialogue between the Good Argument and Bad Argument, based on Aristophanes’ Clouds"}]}, {"name": "Elementary", "department": "Classics", "teacher": "Corsello", "grade": "7-10", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Intermediate Ancient Greek 1 and 2", "department": "Classics", "teacher": "Talia Varonos", "grade": "9-12", "length": "", "description": "", "competencies": "intercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change", "units": [{"name": "Unit 1"}, {"name": "Grammar Consolidation and Plato's Symposium", "timeframe": "7–8 weeks", "concepts": "Systematic review of introductory morphology and vocabulary\n Introduction to new Athenaze chapters; \nExploring the cultural contexts of Ancient Greek companionship, philosophy, and Eros through Plato's Symposium (English translation)", "skills": "Parsing core noun cases and active verb systems\nReading aloud for proper pronunciation and rhythm\nTranslating Ancient Greek into English\nExtracting philosophical themes and cultural values from a translated prose text.", "materials": "Athenaze and Plato’s Symposium", "assessments": "Quizzes"}, {"name": "Unit 2"}, {"name": "Expanding Athenaze and the Varieties of Love", "timeframe": "7–8 weeks", "concepts": "Advancing through vocabulary, noun declensions, and verb tenses\nConcluding the Symposium in English and synthesizing how the dialogue defines love, education, and virtue\nTranslation and exploration of excerpts from Symposium in the original Ancient Greek", "skills": "Translating continuous narratives in the textbook with greater structural awareness\nTranslating excerpts of texts in the original Ancient Greek with the help of a glossary and notes\nEvaluating characters (like Socrates and Alcibiades) and arguments within the literary text.", "materials": "Athenaze,Plato’s Symposium, various exercises", "assessments": "Quizzes and Final project on the Symposium"}, {"name": "Unit 3"}, {"name": "Deepening Core Grammar and the National Greek Exam", "timeframe": "8–9 weeks", "concepts": "Continuing the sequential study of grammar, morphology, and vocabulary \nFocused two-week module reviewing foundational syntax and cultural topics specifically targeted to the National Greek Exam syllabus", "skills": "Recognizing grammatical patterns smoothly to build reading ease \nNavigating multiple-choice standardized translation and syntax questions under timed conditions", "materials": "Athenaze and National Greek Exam syllabus and practice exams and materials", "assessments": "Quizzes and National Greek Exam"}, {"name": "Unit 4"}, {"name": "Translating Authentic Greek and Sappho's Fragments", "timeframe": "8–10 weeks", "concepts": "Consolidation grammar and vocabulary\nTransition to translation authentic Ancient Greek texts; \nReading and translating the poetic fragments of Sappho \nExplore and examine the lyric voice, role of women, and the significance and influence of Sappho\nSynthesizing and contrasting Sappho’s poetic manifestation of love with Plato’s philosophical, ladder-like ascension toward the absolute form of Beauty studied in the fall", "skills": "Effectively utilizing running glossaries and pedagogical commentary notes to translate unadapted/lightly adapted Greek with confidence and joy\nEngaging in critical, comparative literary analysis across genres (philosophical prose dialogue vs. archaic lyric poetry).\nCreative and academic synthesis: adopting historical authorial personas, evaluating opposing intellectual paradigms, and writing a theatrical dialogue.", "materials": "Athenaze, Sappho’s fragments, and various articles and secondary sources", "assessments": "Quizzes \nFinal Capstone Project: The Panel on Eros. Inspired by Sappho's fragments and Plato's Symposium, students will compose an imagined dialogue between Sappho and Plato on the topic of Eros (structured as if they were participating on a modern panel or symposium debating Love). In this theatrical script, students must deeply consider:\nWhat each writer explicitly wrote regarding Eros and how it manifests across their respective texts.\nWhere the philosopher and the lyric poet might fundamentally agree or fiercely disagree (e.g., Plato’s striving to transcend the physical body vs. Sappho’s acute focus on physical, emotional vulnerability).\nDynamic interpersonal interactions, including moments where they might poke fun at, satirize, or intellectually criticize one another's views.\nFormatting Requirements: The script must be formatted like a theatrical dialogue, at least two pages long, double-spaced, in a standard 12-point font."}]}, {"name": "Latin 1", "department": "Classics", "teacher": "Stephanie Crooks and Talia Varonos", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Review", "timeframe": "Approximately 2.5 weeks", "concepts": "Review of Nouns (Declensions 1–3)\nAdjective Review and Noun-Adjective Pairs\nVerb Review (Present, Imperative, Imperfect, and Perfect tenses)\nIrregular Verbs (sum, possum, nolō, volō, ferō) across all tenses", "skills": "Declining nouns and adjectives in agreement\nConjugating regular and irregular verbs in the active voice\nRecalling foundational vocabulary (Chapters 1–20)", "materials": "Review Vocabulary Packet (Ch. 1–20)\nNoun/Adjective Review Worksheets\nConjugation Charts\nEcce Romani II", "assessments": "Review Quiz"}, {"name": "Unit 2"}, {"name": "Noun-Adjective Agreement", "timeframe": "Approximately 2.5 weeks", "concepts": "Third Declension Adjectives (Review of One and Two Terminations)\nNoun-Adjective agreement patterns in various cases", "skills": "Translating narrative text (Ch. 22 story)\nCorrectly matching adjectives to nouns of different declensions\nIdentifying adjective terminations", "materials": "Ch. 22 Vocabulary Handouts 1 & 2\nThird Declension Adjectives packets\nWorkbook activities\nEcce Romani II", "assessments": "Ch. 22 Homework Check\nChapter 22 Test"}, {"name": "Unit 3"}, {"name": "The Future Tense", "timeframe": "Approximately 1.5 weeks", "concepts": "Formation of the Future Tense for the 1st, 2nd, 3rd, and 4th conjugations\nFuture tense of irregular verbs", "skills": "Annotating and translating Latin narrative\nIdentifying future tense markers (bo/bi/bu vs. a/e)", "materials": "Ch. 23 Vocab Handouts 1 & 2\nFuture Tense Handout \nWorkbook activities\nFuture Tense Kahoot\nEcce Romani II", "assessments": "Ch. 23 Homework Check\nFuture Tense Drill\nFuture Tense Kahoot"}, {"name": "Unit 4"}, {"name": "The Pluperfect, Future Perfect, and The Fourth and Fifth Declensions", "timeframe": "Approximately 4 weeks", "concepts": "Formation and usage of the Pluperfect and Future Perfect tenses\nIntroduction to the Fourth and Fifth Declensions", "skills": "Translating more complex past and future-sequence tenses\nInternalizing noun declension endings \nPerforming verb synopses", "materials": "Mnemonic devices/songs\nCh. 24 & 25 Vocab Handouts\nPluperfect and Future Perfect Handouts\n4th & 5th Declension Kahoot\nTextbook Exercises \nEcce Romani II", "assessments": "Chapter 24 Test\nChapter 24 & 25 Vocab Checks\n4th & 5th Declension Oral Quiz\nInterim Reflection"}, {"name": "Unit 5"}, {"name": "Pronouns and Adjectives", "timeframe": "Approximately 11 weeks (including Winter/Midwinter breaks)", "concepts": "hic, haec, hoc and ille, illa, illud\nPersonal, Reflexive, and Relative (qui, quae, quod)\nPossessive and Indefinite; Interrogative (\"Qu-\" words)\nRoman hairstyles and the festival of Saturnalia", "skills": "Using demonstratives and pronouns in context\nIdentifying relative clauses and their antecedents\nCreative writing (Saturnalia Composition)", "materials": "Vocab Handouts for Ch. 26–29\nRelative Pronoun PPT and Handout\nCultural reading: \"Hairstyles of Roman Girls and Women\"\nEcce Romani II", "assessments": "Chapter 26 Test & Chapter 28 Test\nChapter 27 Team Quiz\nQ-word Pop Quiz\nSaturnalia Creative Composition"}, {"name": "Unit 6"}, {"name": "The Passive Voice", "timeframe": "Approximately 8.5 weeks", "concepts": "Formation of the Passive Voice in the Present System (Present, Imperfect, Future)\nThe Present Passive Infinitive\nNational Latin Exam (NLE) Preparation", "skills": "Differentiating between active and passive voice in translation\nPerforming Verb Synopses (Active vs. Passive)\nResearch and Presentation (Struggles of Rome Project)", "materials": "Ch. 30 & 31 Vocab Handouts\nNLE Practice Exams\nEcce Romani II", "assessments": "Quiz on Passive Forms\nChapter 31 Test\nNational Latin Exam\nStruggles of Rome Mini-project"}, {"name": "Unit 7"}, {"name": "The Perfect Passive System", "timeframe": "Approximately 4.5 weeks", "concepts": "Formation and translation of the Perfect Passive, Pluperfect Passive, and Future Perfect Passive tenses.\nThe 4th Principal Part (Perfect Passive Participle) and its role in verb formation.", "skills": "Distinguishing between active and passive systems in the past tenses.\nCompleting full verb synopses (Active and Passive voices).\nReading and interpreting Roman recipes and menus.", "materials": "Chapters 32 & 33 Vocabulary Handouts.\nPerfect Passive System Handout (HO).\nCultural Reading: “Recipes and Menus” (pp. 54-55).\nEcce Romani II", "assessments": "Chapter 32 Homework Check.\nPerfect Passive Kahoot.\nPerfect Passive Forms Quiz.\nComprehensive Year-End Vocabulary Review (Ch. 22-33).\nRoman Gastronomy Final Project"}]}, {"name": "Latin IA", "department": "Classics", "teacher": "Dakouras, Kearney", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Relative Clauses and Roman Aesthetics", "timeframe": "Approximately 2–3 weeks.", "concepts": "The Relative Clause: Understanding the relationship between antecedents and relative pronouns.\n\nInterrogatives: Distinguishing between \"who\" (quis) and \"which\" (quī/quae/quod).\n\nIndefinite Pronouns: Introduction to quīdam (a certain).\n\nRoman Beauty Standards: Hairstyles, the role of the ornātrīx (hairdresser), and the use of vittae (headbands).", "skills": "Morphology: Declining quī/quae/quod, quīdam, and quis/quid in all cases.\n\nSyntax: Identifying the correct case for a relative pronoun based on its function within its own clause (e.g., quibus, cui, quod) .\n\nTranslation: Converting sentences with \"qu-\" words from English to Latin and vice versa.\n\nCultural Literacy: Describing the daily morning rituals of Roman women.", "materials": "Ecce Romani 2A; Latin IA Chapters 28-29 Review.", "assessments": "Unit 28-29 Exam featuring pronoun declension charts, fill-in-the-blank syntax exercises, and narrative translation"}, {"name": "Unit 2"}, {"name": "Urban Life and the Passive Voice", "timeframe": "Approximately 2–3 weeks.", "concepts": "The Passive Voice: Introduction to Present, Imperfect, and Future Passive.\n\nRoman Housing: Comparative study of the īnsula (apartment) vs. domus (town house).\n\nRoman Daily Life: Social classes (guests vs. merchants) and city dangers like fires.", "skills": "Grammar: Conjugating and identifying passive verb forms.\n\nTranslation: Latin to English narrative translation focusing on city life .\n\nVocabulary: Mastery of words related to the home and urban activities.", "materials": "Ecce Romani 2A", "assessments": "Ecce Romani (implied context); Latin IA Test 30-31A."}, {"name": "Unit 3"}, {"name": "The Roman Dinner Party", "timeframe": "Approximately 2–3 weeks.", "concepts": "Advanced Passive Voice: Perfect, Pluperfect, and Future Perfect Passive.\n\nParticiples: Introduction to the Perfect Passive Participle (PPP).\n\nCulinary Culture: Roman dinner parties (convīvia), specific foods (dormice, grapes), and dining rooms (trīclīnium)", "skills": "Verb Synopses: Providing full passive voice synopses for 3rd-person forms.\nSynthesis: Using participles to combine ideas within sentences .\nCultural Analysis: Commenting on Roman social hierarchies through dining customs.", "materials": "Ecce Romani 2A, 32-33 Review", "assessments": "Summative: Unit 32-33 Exam featuring complex translation, verb synopsis charts, and identification of cultural terms ."}, {"name": "Unit 4"}, {"name": "Modifiers and Mixology", "timeframe": "Approximately 2–3 weeks.", "concepts": "Degree of Modifiers: Understanding Positive, Comparative, and Superlative degrees for both adjectives and adverbs, including irregular forms.\nSocial Rituals: The commissātiō (drinking party) and its associated etiquette.\nRoman Literature: Introduction to Catullus 13.", "skills": "Morphology: Forming and declining comparative and superlative adjectives (e.g., malus to pessimus) .\n\nAdverbial Transformation: Changing adjectives into adverbs across all three degrees.\n\nNoun-Adjective Agreement: Declining complex pairs such as \"a smaller arch\".\n\nTextual Analysis: Translating and interpreting Latin poetry.", "materials": "Ecce Romani 2A", "assessments": "Summative: Unit 34-35 Exam featuring adjective/adverb charts, noun-adjective declension, sentence translation, and cultural identifications (e.g., arbiter bibendi, unguentum, tali) ."}, {"name": "Unit 5"}, {"name": "Deponents and Dictators", "timeframe": "Approximately 2–3 weeks.", "concepts": "Deponent Verbs: Mastering verbs that are passive in form but active in meaning.\nRoman Chronology: Understanding the complex system of Roman dates (Kalends, Nones, Ides).\nHistorical Literacy: The collapse of the Republic and the roles of Cicero and Caesar.", "skills": "Morphology: Conjugating deponent verbs (e.g., proficīscor, moror) across all six tenses.\nDate Calculation: Recognizing and translating Latin dates (e.g., prīdiē Nōnās Novembrēs).\nCritical Synthesis: Translating narratives that combine deponents, relative clauses, and superlatives.", "materials": "Ecce Romani; Latin IA Chapters 36-37 Review.", "assessments": "Summative: Unit 36-37 Test covering deponent verb charts, Roman calendar math, and a historical essay on Caesar/Cicero"}, {"name": "Unit 6"}, {"name": "Numbers, Nations, and Narratives", "timeframe": "Approximately 2–3 weeks", "concepts": "Numerical Systems: Mastery of Cardinal numbers and Ordinal numbers (1–12).\nLocative Syntax: Place and Time constructions (Time How Long, Time When).\nGeography: Significant Mediterranean locations (Athens, Carthage, Brundisium).\nRoman Education: Structure and goals of the Roman schooling system.", "skills": "Grammatical Precision: Distinguishing between duration of time (Accusative) and points in time (Ablative).\nGeographic Prepositions: Using \"To/From/In\" constructions with city names (omitting prepositions for names of cities, towns, and small islands).\nMythological Context: Translating passages regarding Aeneas and Dido", "materials": "Ecce Romani 2A, 38-39 Review", "assessments": "Summative: Unit 38-39 Exam featuring number identification, place phrase translations, and a cultural analysis of Roman education."}, {"name": "Unit 7"}, {"name": "Semi-Deponent Verbs and Participial Modifiers", "timeframe": "Approximately 2–3 weeks", "concepts": "Semi-Deponent Verbs: Mastery of verbs that follow active forms in the present system but deponent forms in the perfect system (e.g., audeō, gaudeō, soleō).\nPresent Active Participle (PAP): Formation and declension of PAPs (e.g., docentem).\nPerfect Active Infinitive: Formation and translation of perfect active infinitives (e.g., coxisse).\nRoman History: The reign and legacy of Augustus.", "skills": "Morphology: Conjugating semi-deponents and declining present active participles across all genders and numbers.\nSyntactic Integration: Using active participles to modify nouns and infinitives to express completed actions.\nTranslation: Complex sentence translation involving multiple verbal modifiers.", "materials": "Ecce Romani 2A, 40-41 Review", "assessments": "Summative: Unit 40-41 Exam featuring semi-deponent verb charts, participial declensions, infinitive formation, and narrative translation"}, {"name": "Unit 8"}, {"name": "The Subjunctive & The Roman Baths", "timeframe": "Approximately 2–3 weeks", "concepts": "The Subjunctive Mood: Formation of Present, Imperfect, Perfect, and Pluperfect (Active & Passive).\nSubordinate Clauses: Mastery of Cum Clauses (Causal, Circumstantial, Concessive) and Indirect Questions (IQ).\nRoman Leisure: Anatomy and usage of the thermae (baths).", "skills": "Morphology: Conjugating verbs in the subjunctive mood across all four tenses and both voices.\n\nSyntactic Analysis: Identifying, categorizing, and translating Cum clauses and Indirect Questions.\n\nCultural Literacy: Describing the specialized rooms of the bath complex, including the apodyterium, frigidarium, tepidarium, caldarium, and palaestra.", "materials": "Ecce Romani 2A, 42-43 Review", "assessments": "Summative: Unit 42-43 Exam featuring subjunctive conjugation charts, Cum clause/IQ identification exercises, narrative translation, and cultural terminology"}, {"name": "Unit 9"}, {"name": "Advanced Syntax & The Ablative Absolute", "timeframe": "Approximately 2–3 weeks", "concepts": "Ablative Absolute: Formation and translation of the Ablative Absolute construction (Noun + Participle).\nLinking Quī: Using the relative pronoun quī, quae, quod at the start of a sentence to connect to the preceding thought.\nAdvanced Participial Usage: Using participles (including deponents) to create complex subordinate relationships within sentences.", "skills": "Grammatical Analysis: Recognizing the Ablative Absolute as an independent grammatical structure and translating it with appropriate context (e.g., \"With X having been done...\").\n\nSyntactic Synthesis: Translating complex narratives that integrate the Linking Quī to maintain coherence between sentences.\n\nMorphology: Forming and declining all active/passive participles for both standard and deponent verbs.", "materials": "Ecce Romani 2A, 2B, 44-45 Review", "assessments": "Summative: Unit 44-45 Exam featuring participle formation charts, Ablative Absolute identification/translation, and narrative translation involving linking pronouns"}]}, {"name": "Latin 2", "department": "Classics", "teacher": "Corsello", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Review of Latin 1 material (chapter 1-32)", "timeframe": "4 weeks", "concepts": "Noun declensions (1-5)\nVerb conjugations (1-4) (all tenses, active and passive)\nAdjective declensions (1-3)\nNoun/adjective agreement", "skills": "Recognition of case endings and functions\n       Recognition of verb tenses and translations\n       Translation of sentences of varying degrees of difficulty using all cases and tenses\n       Vocabulary memorization and retention", "materials": "Ecce Romani II\nWorksheets based on grammar covered in Ecce Romani I", "assessments": "Vocabulary checks\nNoun declension quizzes\nVerb tense quizzes\nTranslation quizzes"}, {"name": "Unit 2"}, {"name": "Introduction to Participles (perfect passive); Comparison of Adjectives and Adverbs; Deponents", "timeframe": "10 weeks", "concepts": "Recognition of perfect passive participles\nTranslation of perfect passive participles\nFormation and translation of comparative adjectives and adverbs\nConjugation and translation of deponent verbs", "skills": "Translation of sentences and readings that include perfect passive participles and comparatives adjectives and adverbs and deponent verbs", "materials": "Ecce Romani II, chapter 33-39\nWorksheets", "assessments": "Vocabulary checks\nParticiples formation and translation quizzes\nComparative formation and translation quizzes\nConjugation and translation of deponent verbs\nTranslation quizzes\nGroup presentations on Roman education"}, {"name": "Unit 3"}, {"name": "Introduction to Subjunctives", "timeframe": "10 weeks", "concepts": "Imperfect and pluperfect subjunctives\nCum clauses\nIndirect Questions", "skills": "Conjugation and recognition of imperfect and pluperfect subjunctives", "materials": "Ecce Romani II, chapters 40-43\nWorksheets", "assessments": "Vocabulary checks\nSubjunctive formation quizzes\nTranslation quizzes\nGroup oral presentations on multi-culturalism in the ancient Roman world"}, {"name": "Unit 4"}, {"name": "Ablative Absolute and Consolidation of Participles", "timeframe": "4 weeks", "concepts": "Formation and translation of all participles\nRecognition and translation of different types of ablative absolutes", "skills": "Translation of sentences and readings with participles and ablative absolutes", "materials": "Ecce Romani, II, chapters 44-45", "assessments": "Vocabulary checks\nParticiple formation and translation quizzes\nTranslation sentence quizzes\nGroup oral reports on multi-culturalism in ancient Rome."}, {"name": "Unit 5"}, {"name": "Indirect Statement", "timeframe": "4 weeks", "concepts": "Consolidation of Infinitives\nRecognizing the verb of perceiving, subject accusative pattern (Indirect Statement)\nTranslation of indirect statements", "skills": "Translation of sentences including indirect statements", "materials": "Ecce Romani II, chapters 46-49", "assessments": "Vocabulary checks\nTranslation sentence quizzes\nSight translation quiz emphasizing all major grammatical constructions and vocabulary covered this year."}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Latin 2A", "department": "Classics", "teacher": "Dakouras", "grade": "", "length": "", "description": "", "competencies": "", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Latin 3A", "department": "Classics", "teacher": "Varonos/Kearney", "grade": "", "length": "", "description": "", "competencies": "Intercultural Connection: Analyzing Roman social norms, gender roles, and political structures.\nSense of Self and Place: Connecting classical themes to modern political discourse and art.\nCritical Systems Thinking: Evaluating the mechanics of language through scansion and rhetorical analysis.", "units": [{"name": "Unit 1"}, {"name": "Unit 1: Introduction to Class and Grammar Review", "timeframe": "6–7 teaching days", "concepts": "Indirect Statement, Indirect Commands, Result/Fear Clauses, Conditionals, Gerunds/Gerundives, and Passive Paraphrastics.", "skills": "Differentiating noun/participle modifiers; identifying dative vs. ablative of agent; synthesizing complex syntax into translation.", "materials": "various review handouts.", "assessments": "Grammar tests and quizzes; translation checks."}, {"name": "Unit 2"}, {"name": "Unit 2: Ovid, excerpts from Metamorphoses", "timeframe": "23–26 teaching days", "concepts": "Mythological etiology, transformation, and Augustan-era poetry. Specific myths: Daedalus and Icarus, Orpheus and Eurydice, and Pygmalion.", "skills": "Dactylic Hexameter scansion; identifying poetic devices (zeugma, anaphora, hyperbaton); dramatic reading/recitation.", "materials": "Ovid, Metamorphoses; Conte’s Introduction to Ovid; .", "assessments": "Daedalus and Icarus Test; Orpheus and Eurydice Test; Pygmalion Mini Test; Literary Device Assessment."}, {"name": "Unit 3"}, {"name": "Unit 3: Caesar, De Bello Gallico", "timeframe": "19–20 teaching days", "concepts": "Roman military structure, Gallic geography, and ethnography (The Druids). The ethics of war and enslavement.", "skills": "Analyzing third-person narrative perspective; identifying technical military vocabulary; historical synthesis.", "materials": "Caesar’s De Bello Gallico (Books 1 and 6).", "assessments": "Tests and quiz;  Latin Dictation assessment."}, {"name": "Unit 4"}, {"name": "Unit 4: Cicero, In Catilinam", "timeframe": "13–14 teaching days", "concepts": "Roman rhetoric, political conspiracy, and the preservation of the state.", "skills": "\"Translation with flair\"; recognizing rhetorical devices (oxymoron, tricolon crescens, epanalepsis); evaluating political invective.", "materials": "Cicero, In Catilinam I; Introduction to Roman Law/Politics.", "assessments": "Cicero Quiz, Cicero Tests; Cicero Post Spring Break Worksheet; Test on Literary Devices."}, {"name": "Unit 5"}, {"name": "Unit 5: Apuleius, Cupid and Psyche", "timeframe": "14 teaching days", "concepts": "The Latin Novel; Silver Age prose style; Folk-tale elements in classical literature.", "skills": "Comparing original text with English translations; identifying Apuleian \"Baroque\" style; understanding Greek oracle influences.", "materials": "Apuleius, Metamorphoses (The Golden Ass), Books 4–6.", "assessments": "Quizzes; Final discussion."}, {"name": "Unit 6"}, {"name": "Unit 6: Final Project", "timeframe": "~6 Days", "concepts": "Individual interest exploration: Gender in Latin texts, Ancient Mental Health (Celsus), or the Nature of Translation.", "skills": "Independent research; 8-point footnote citation; public presentation and mini-lecture skills.", "materials": "Special X Latin Project 2026 guidelines; Celsus’ De Medicina.", "assessments": "5-page research paper or 4-page reflection + creative artifact; Final presentations (June 1, 3, 5)."}]}, {"name": "Latin 4", "department": "Classics", "teacher": "Stephanie Crooks", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future\n* Process-Oriented Hermeneutics: Deconstructing complex synthetic sentences via rigorous tracking of syntax, metrics (scansion), and grammar, rather than relying on rote vocabulary recall or predictive text patterns .\n* Rhetorical & Stylistic Evaluation: Identifying, analyzing, and applying ancient rhetorical tropes (e.g., anaphora, praeteritio, asyndeton) to determine how formatting choices alter political and literary messaging .\n* Historical Contextualization & Application: Constructing active oral and written commentaries that connect Roman topographical, legal, and socio-political events with modern structures.", "units": [{"name": "Unit 1"}, {"name": "Latin Syntax & Grammar Review", "timeframe": "2 Weeks", "concepts": "Re-establishing core grammar foundations: Indirect Statements and the accompanying system of infinitive tenses.\nSubjunctive operations: Volitive variants focusing specifically on Indirect Commands and adverbial Ut clauses.\nThe syntax of verbal adjectives and nouns: Mastery of Gerunds, Gerundives, and the Passive Periphrastic construction denoting obligation.\nContextual analysis of vocabulary using structural glossaries.", "skills": "Distinguishing verbal modifications across conjugations and nominal changes within third-declension noun frameworks.\nIdentifying abstract syntactic structures within modern colloquial English conversations and media publications (e.g., The New York Times) to track etymological/grammatical evolution.", "materials": "Comprehensive syntax packets and review sheets covering Ut clauses, Gerunds, and Periphrastics.\nEcce Romani (Chapters 58–59 secondary grammar reference models).\nDaniel Peterson's foundational framework piece: “How to Read and Study Classical Latin Texts”.", "assessments": "Formative: Immersive lifestyle challenges (e.g., tracking and intentionally omitting Indirect Statements or tracking spoken academic imperatives); Collective derivative hunts in modern news journalism; Individualized review diagnostic creation.\nSummative: Unit 1 Comprehensive Syntax & Morphological Identification Quiz."}, {"name": "Unit 2"}, {"name": "Ovid’s Metamorphoses", "timeframe": "12 Weeks", "concepts": "Annotation Isolation: Systematically highlighting, noting, and parsing poetic lines independently prior to attempting active verbal translation.\nCross-Media Literary Comparison: Evaluating Roman visual art layouts (e.g., Bernini’s Daphne and Apollo sculpture) and modern performance narratives (e.g., Matthew Aucoin’s Eurydice opera) against classical texts.", "skills": "Annotation Isolation: Systematically highlighting, noting, and parsing poetic lines independently prior to attempting active verbal translation.\nCross-Media Literary Comparison: Evaluating Roman visual art layouts (e.g., Bernini’s Daphne and Apollo sculpture) and modern performance narratives (e.g., Matthew Aucoin’s Eurydice opera) against classical texts.", "materials": "Ovid, Metamorphoses (Primary text selections: Daphne/Apollo, Orpheus/Eurydice, Pygmalion).\nArt History Survey resources (Focusing on Gian Lorenzo Bernini's baroque sculptures).\nAudio/Visual recordings: Matthew Aucoin’s opera, Eurydice.", "assessments": "Formative: “We Ask, the Text Speaks” situational prompt inquiries; Student-led deep dives on underworld mythological archetypes (Danaids, Sisyphus, Furies); Periodic vocabulary performance checks; Metrical scansion modeling labs.\nSummative: Translation Mini-Project and interactive peer presentations (10/16); High-Stakes Translation and Context Test 1: Daphne & Apollo (11/3); Translation and Context Test 2: Orpheus & Eurydice (12/8); Pygmalion Creative Extension Capstone: The Prosopopoeia monologue composition and speech delivery (12/18)."}, {"name": "Unit 3"}, {"name": "Julius Caesar — Prose, Politics, and Propaganda", "timeframe": "13 Weeks", "concepts": "Stylistic disparities between poetic composition and military historical prose.\nThe mechanics of narrative self-fashioning: How generalship, dominance, and justification materialize when written implicitly in the third person (Commentarii de Bello Gallico Books I, IV, and VI).\nGeographic ethnography: How geographical placement functions as a calculated catalyst or structural excuse for systemic territorial conflict and expansion.\nAdvanced grammar integrations: The nuanced functionality of the intensifying quam prefix with adjectives, Cum clauses, and Datives of Reference.", "skills": "Topographical Emulation: Adapting Caesar’s stylistic syntax to map, document, and describe modern physical locations.\nLegal/Forensic Argumentation: Extrapolating implicit text details to form structured cases regarding a historical figure’s ethical conduct.", "materials": "Julius Caesar, Commentarii de Bello Gallico (Textbook selections: Books 1, 4, and 6).\nJane’s Specialized National Latin Exam Prep Packet (Idioms, Mottoes, and Prefixes).\nOfficial National Latin Exam (NLE) archive papers (2024 and 2025 release sets).", "assessments": "Formative: The Nightingale Neighborhood Topography Mapping Project: Composing 5 original Latin sentences framing the topography of Manhattan using distinct Caesarian syntax; Book IV Mock Trial Simulation (prosecuting or defending Caesar’s operational ruthlessness using textual documentation); 5-minute modern academic article synthesis and presentation; Targeted Vocabulary Checks.\nSummative: Book I Textual Translation and Comprehension Quiz (1/27); Book 1 & 4 Comprehensive Examination (2/12); External Benchmark: National Latin Exam Administration (3/10); Book VI Analytical Research Paper and Presentation (4/13)."}, {"name": "Unit 4"}, {"name": "Marcus Tullius Cicero — Rhetoric and Conspiracy", "timeframe": "7 Weeks", "concepts": "The political climate of the late Roman Republic: The structural breakdown of state institutions and the mechanics of the Catilinarian Conspiracy.\nClassic Oratory and Rhetorical Scaffolding: Defining, tracking, and identifying structural applications of Praeteritio, Anaphora, Asyndeton, Exempla, and stylized Rhetorical Questions.\nStructural comparisons of authorship styles (Caesar vs. Ovid vs. Cicero).\nCultural literacy: The deep structural matrix of the Roman Calendar system.", "skills": "Sight Translation Execution: Deciphering un-annotated, complex periodic sentences using context clues, historical vocabulary knowledge, and grammatical logic.\nAI Critical Synthesis & Style-Shifting: Utilizing Generative AI tools to transform text styles between distinct authors, followed by a human-driven critique of the linguistic outputs.", "materials": "Cicero, In Catilinam I (Primary Latin selections from pages 3–25; complete text evaluated in English).\nArchitectural/Cultural modules detailing the Roman Calendar.\nVisual Media: HBO’s historical drama Rome (Season 1, Episode 2).", "assessments": "Formative: Analytical empathy simulation journaling (mapping the desperation of losing a structural political race onto personal academic scenarios); Sentence Reconstruction Challenge (rewriting Cicero's sentences in the stylistic voice of Caesar or Ovid, manually or via AI-critique channels); Periodic vocabulary metrics.\nSummative: Cicero Sight Translation & Rhetorical Identification Pop Quiz (5/14); High-Stakes Latin IV Final Examination: In Catilinam (6/1); End-of-Year Capstone Synthesis Portfolio & Written Reflection (6/3–6/4)."}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Latin Epic", "department": "Classics", "teacher": "Jeff Kearney", "grade": "and 12", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Foundations of Roman Epic (Naevius to Catullus)", "timeframe": "3 Weeks", "concepts": "Introduction to the epic genre; study of early Roman epic \"rough-cut fragments.\" Keys concepts include epic conventions: invocation of the muse, statement of theme, beginning in medias res, etc.", "skills": "Close reading, reading complex narrative, character analysis, recognizing literary devices, comparative analysis between epics, understanding historical context, interpreting Roman values, vocabulary development, syntax and grammar analysis,", "materials": "A Latin Epic Reader, Ed. Keith", "assessments": "Translation quizzes; comparative analysis of epic fragments.\nTests including linguistic and literary analysis, sight translation"}, {"name": "Unit 2"}, {"name": "Aeneid Books 1-2", "timeframe": "2 months", "concepts": "The Aeneid Book 1: The Storm, Aeneas’s arrival in Carthage, Dido’s introduction, and Venus’s prophecy.\nThe Aeneid Book 2: The Fall of Troy\nComparative Epic: Intertextual analysis with Homer’s Odyssey (Books 6 and 12).", "skills": "Grammatical Analysis: Advanced identification of ablative functions, participial tense/voice, historical infinitives, and subjunctive usage (deliberative/potential).\nScholarly Engagement: Collaborative leadership in analyzing secondary source articles (Beck, Williams).\nComparative Argumentation: Analyzing Vergil's adaptation of Homeric motifs.", "materials": "Vergil’s Aeneid: Expanded Collection Vergil, \n        Aeneid Books 1-2\nHomer, Odyssey Excerpts (Book 6.85-107, Book 12.149-230).\nSecondary Sources: Deborah Beck, “The First Simile of the Aeneid”;  R.D. Williams, “The First Great Prophecy.”\nResources: Shared class \"running doc\" for collaborative translation.", "assessments": "Translation Quizzes: to ensure consistent progress.\nGrammar Diagnostics: Embedded in every assignment (case functions, parsing, verb identification).\nTests 1 and 2, featuring a comprehensive evaluation of Books 1 and 2 translation, morphological identification, and short-answer questions concerning historical/literary context."}, {"name": "Unit 3"}, {"name": "Aeneid Part 2: Books 4-6", "timeframe": "3 months", "concepts": "Books 4–6 of the Aeneid represent the emotional and psychological core of the epic, marking the transition from Aeneas’s abandonment of personal happiness to his acceptance of his role as the founder of Rome.\nThe Tragedy of Dido (Book 4):  Conflict between furor (uncontrolled passion) and pietas (dutiful submission to fate). \nThe Necessity of Abandonment: \nThe Nature of the Underworld (Book 6): \nCatharsis: Aeneas confronts the ghosts of his past\n           The Roman Destiny: The Burden of Leadership:", "skills": "Sight Translation & Parsing: Beyond prepared reading, students must demonstrate a precise understanding of the Latin at all times. This includes the ability to parse complex participial phrases, identify subtle grammatical agreements, and resolve ambiguous syntactic structures in real-time.\nMetric Scansion: Students master dactylic hexameter, learning not just to scan lines, but to explain how the interaction between metrical rhythm (dactyls vs. spondees) and poetic content heightens the narrative's emotional or kinetic impact.\nStylistic Device Analysis: Students identify and categorize rhetorical devices—such as chiasmus, juxtaposition, anaphora, and alliteration—and are assessed on their ability to explain how these devices contribute to the specific meaning of a passage.", "materials": "Aeneid (Books 4-6); Archives 22-23.", "assessments": "Persuasive literary essays focusing on how the text conveys meaning"}, {"name": "Unit 4"}, {"name": "Aeneid Part 3 (Books 7-12, 12 in Latin)", "timeframe": "2 months", "concepts": "The Transition to War (The Iliadic Half):. Students analyze how the \"rage\" (furor) of characters like Turnus and Amata disrupts the pietas (duty) Aeneas is trying to establish.\nThe Corruption of Peace: Understanding why the local Italians (the Latins) feel threatened by the Trojan \"invaders\" is central to understanding the conflict.\nThe Moral Cost of Empire: Students examine the ambiguity of the poem’s conclusion: Is the foundation of Rome a triumph of divine destiny, or a tragedy defined by bloodshed?\nThe Failure of Diplomacy: Students assess the failure of various peace treaties and the role of divine interference (Juno’s manipulation of Allecto) in escalating a manageable conflict into an unavoidable war.\nCharacter Tragedies: Beyond Aeneas and Turnus, the focus shifts to the collateral damage of war, specifically figures like Pallas, Camilla, and Lausus. Their deaths serve as indictments of the violence inherent in nation-building.", "skills": "Syntactic Complexity: Navigating Vergil’s complex sentence structures, including interwoven word order (synchysis), elliptical constructions, and the precise use of cases in military and legal contexts.\nDeponent and Participial Mastery: The text relies heavily on participles to create narrative tension; students must correctly parse tense, voice, and the specific noun/pronoun each participle modifies.\nEpic Vocabulary & Diction: Mastery of specialized vocabulary related to combat, weaponry, and the specific rhetoric of the foedus (treaty).", "materials": "Aeneid, 7-12\nAeneid 12, Commentary, Ed. Tarrant", "assessments": "Translation quizzes; comparative analysis of epic fragments.\nTests including linguistic and literary analysis, sight translation"}, {"name": "Unit 5"}, {"name": "Student Projects", "timeframe": "1 month", "concepts": "Examples of individual projects:\n\n--A presentation (with handout) on Latin epic author we have not read (as done in Latin Lyric)\n\n--A short paper and presentation on epic conventions in a modern work of art (movie, television show, book, dance, painting)\n\n--A board game based on the Aeneid or another Roman epic that incorporates elements of what we have learned this year\n\n-- A commentary on a passage we have not read from the Aeneid (examples available)\n\n--A detailed map of the Underworld that tracks A’s entire journey\n\n--A thorough analysis of how Vergil adapted a passage or concept from the Iliad or Odyssey", "skills": "Author Presentation: Scholarly Synthesis\nEpic Conventions Paper: Intertextual Analysis\nAeneid Board Game: Synthesis/Game Design\nCommentary Project: Linguistic/Technical Mastery\nUnderworld Map: Spatial/Narrative Mapping\nIliad/Odyssey Analysis: Comparative Argumentation", "materials": "Varies with project", "assessments": "Project and class presentation"}]}, {"name": "Latin VI", "department": "Classics", "teacher": "Corsello, Kearney, Varonos, and Webster", "grade": "", "length": "", "description": "", "competencies": "Reading Comprehension: Students improve their ability to read and comprehend progressively challenging Latin texts.\nCritical Thinking and Decoding: Students apply their knowledge of word endings and what they signify to determine the meaning of noun and verb forms in different contexts. \nCultural Understanding: Students understand the customs, practices, and values of the ancient Romans, and are able to make connections and comparisons with other cultures, including their own. \nMetacognition: Students learn and apply different study strategies and practice self-assessment techniques to determine their grasp of new concepts.", "units": [{"name": "Unit 1: Chapters 1-7"}, {"name": "Introduction to the Inflected Nature of Latin", "timeframe": "This unit starts in September and continues until the middle of February. Each chapter is covered in approximately two-three weeks and culminates in a summative assessment and/or project.", "concepts": "1st, 2nd, and 3rd Declension Nouns\nNominative Case: Subject\nAccusative Case: Direct Object\nNoun & Adjective Agreement \nVerb Agreement: Singular and Plural Subjects\nVerb Conjugations & Infinitives", "skills": "Determining the declension of 1st, 2nd, 3rd declension nouns\nGenerating declension charts including case names (1st, 2nd and 3rd declensions)\nRecognizing subjects and direct objects of English and Latin sentences.\nIdentifying present tense verb forms (3rd person singular and plural\nRecognizing infinitives in English and Latin\nRecognizing complementary infinitives\nDetermining noun and adjective agreement\nGenerating noun/adjective pairs following rules of agreement.\nTranslating simple Latin sentences \nComposing simple Latin sentences\nLearning about ancient Roman family life, customs and dress\nUnderstanding the history and mythology of the Trojan War and knowing the key characters\nUnderstanding how the Trojans under the leadership of Aeneas are connected to the founding of the city of Rome.", "materials": "Ecce Romani IA Textbook\nEcce Romani Language Activity Book\nQuizlet vocabulary sets\nKahoot vocabulary review games\nVariety of practice materials, worksheets, and grammar handouts", "assessments": "Chapter 1 Vocabulary Checks (2)\nFIrst declension assignment\nFirst declension Quiz\nChapter 2 Vocabulary Checks (2)\nChapter 1 and 2 Review sheet\nChapters 1-2 test (summative)\nChapter 3 Vocabulary Checks (2)\nNoun and adjective handout\nFirst and Second declension assignment\nSecond declension Song contest\nChapter 3 Review sheet\nChapter 3 test (summative)\nChapter 4 Vocabulary Checks (2)\nThird declension handout\n1st-3rd declension review handout\nSubject and Direct Object handout\nChapter 4 Review Sheet\nChapter 4 test (summative)\nChapter 5 Vocabulary checks (2)\nInfinitives and Conjugations handouts\nInfinitive Review handout\nSentence Completion handout\nChapter 5 Review Sheet\nChapter 5 test (summative)\nChapter 6 Vocabulary Checks (2)\nNoun and adjective agreement handout\nChapter 6 Review Sheet\nChapter 6 Test (formative)\nChapter 7 Vocabulary Checks (2)\nNoun and adjective handout\nCases and declensions handout\nChapter 7 Review sheet\nChapter 7 test (summative)"}, {"name": "Unit 2: Chapters 8-12"}, {"name": "Declensions & Conjugations", "timeframe": "This unit starts in the middle of February and continues until the end of the school year in June. Each chapter is covered in approximately three weeks and culminates in a summative assessment.", "concepts": "Verb Forms & Properties\nPresent Tense Verbs\nThe Imperative Mood\nConjugations & Infinitives\nNoun Cases & Functions\nPrepositional Phrases\nUses of Genitive\nUses of the Ablative\nThe Founding of Rome: Historians & Legendary Characters", "skills": "Determining the conjugation of a verb from its infinitive\nGenerating present tense verb forms\nIdentifying present tense verb forms and accurately translating them into English\nGenerating the imperative forms of verbs\nIdentifying imperative verb forms and accurately translating them into English\nGenerating 1st-3rd declension noun forms\nUnderstanding the functions of each noun case and applying this knowledge to translate nouns in context\nTranslating Latin passages and being able to answer questions about the reading\nComposing simple sentences in Latin.\nUnderstanding the history and mythology behind the founding of Rome and knowing the key characters in this narrative.", "materials": "Ecce Romani IA Textbook\nEcce Romani Language Activity Book\nQuizlet Vocabulary Sets\nKahoot Vocabulary Review Games\nChapter 8 Practice Materials: Google Folder\nChapter 9 Practice Materials: Google Folder\nChapter 10 Practice Materials: Google Folder\nChapter 11 Practice Materials: Google Folder\nChapter 12 Practice Materials: Google Folder", "assessments": "Formative Assessments\nChapter 8 Vocabulary Check\nPresent Tense Quiz\nChapter 8 Review Sheet\nChapter 9a & 9b Vocabulary Check\nPrepositional Phrases Drill\nChapter 9 Review Sheet\nChapter 10a & 10b Vocabulary Check\nImperatives Drill \nChapter 10 Review Sheet\nChapter 11a & 11b Vocabulary Check\nChapter 11 Review Sheet\nChapter 12 Vocabulary Check\nAblative Uses Drill\nChapter 12 Review Sheet\n\nSummative Assessments\nChapter 8 Test\nChapter 9 Test\nChapter 10 Test\nFounding of Rome Project\nChapter 11 Test\nChapter 12 Test"}]}, {"name": "Latin VII", "department": "Classics", "teacher": "Corsello and Schapiro", "grade": "", "length": "", "description": "", "competencies": "Reading and Comprehension: Students improve their ability to read and comprehend progressively challenging Latin texts.\nMorphology and Syntax Expertise: Students deepen their understanding of Latin grammar and recognize and correctly interpret new morphological and syntactical forms.\nResearch & Presentation Skills: Students learn to conduct research related to Latin cultural topics and present findings clearly and engagingly.\nCultural Understanding: Students understand ancient Roman customs, practices, and values, making connections to other cultures.\nCognitive & Academic Habits: Pattern recognition, precise attention to detail, organization, listening, and collaboration skills.", "units": [{"name": "Unit 1"}, {"name": "Disaster on the Journey to Rome", "timeframe": "4–5 weeks", "concepts": "The Imperfect Tense, Adverbs, and The Kings of Rome", "skills": "Identifying verbs in the imperfect tense and accurately translating them into English.\nGenerating the imperfect tense of Latin verbs.\nIdentifying and accurately translating adverbs.\
