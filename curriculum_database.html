h": "", "description": "", "competencies": "Interpersonal\nInterpretive\nPresentational\nMultilingualism\nLanguage comparisons\nLifelong learning\nCommunity engagement\nMulticulturalism \nTaking perspectives\nMaking connections\nComparing cultures\n\nOur five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "China’s Holidays and Transformations", "timeframe": "7–8 weeks", "concepts": "Cultural Traditions & Festivities (中国的节日): Deep understanding of the cultural significance, chronological dates, and specific culinary traditions tied to traditional lunar holidays including the Spring Festival, Lantern Festival, Dragon Boat Festival, Qingming Festival, and Mid-Autumn Festival.\nSocietal & Urban Evolution (中国的变化): Evaluating the rapid modernization, urbanization, and infrastructural shifts in contemporary China, using historical hubs like Nanjing as a case study.\nCultural Heritage Preservation: Analyzing architectural preservation through key figures like Liang Sicheng, and balancing economic progress with the safeguarding of historical landmarks like Confucius Temples.", "skills": "Linguistic Functions & Grammar Application:\nIntegrating sequential actions and states using the Adjective/verb + 着 + verb construction.\nEmploying the formal preposition 以 and the structural pattern 以 X 为 Y (to treat X as Y) to express foundational values and definitions.\nSoftening tones or expressing exclamation using modal particles (嘛 and 啊).\nExecuting advanced relational structures like the conditional pattern (先)……再…… and the counterfactual pattern 要不是 (if it were not for).\nApplying descriptive frequency and emphasis through 一 + reduplicated measure word structures.\nTarget Vocabulary Utilization: Incorporating advanced directional phrases like Verb + 起来 / 看起来, socio-cultural descriptors like 传统 (tradition), 热闹 (lively), and absolute qualifiers like 从来 (always/at all times) and 尽可能 (as much as possible).\nCommunication Modes: * Presentational Speaking & Writing: Delivering personal traditional New Year wishes, describing historical changes in local environments, and contrasting current geographic realities with prior layout expectations.\nInterpretive Analysis: Deconstructing multimedia documentation and academic texts detailing changing architectural landscapes and local preservation concerns.", "materials": "Core Textbook: Integrated Chinese Volume 4, 4th Edition (Lessons 11 & 12).\nCourse Resource Hub: Unit 1 Lesson Materials Folder Lesson 11 and Lesson 12\nInteractive Dynamic Platform: 1st Semester Class Padlet (2025-2026) used for daily logs, collaborative annotation, and student prompts.", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "The World is Smaller (世界变小了): Global Interconnectedness", "timeframe": "4 weeks", "concepts": "Global Village Concept: Exploring how technology and transportation have diminished physical and cultural distances.\n* Cross-Cultural Communication: Understanding the role of language in fostering global empathy and diplomatic discourse.\n\n* Senior Reflection: Synthesizing high-school language learning with future academic and personal goals.", "skills": "* Abstract Discussion: Using advanced vocabulary to debate the pros and cons of globalization.\n\n* Linguistic Synthesis: Integrating complex grammar from Integrated Chinese Volume 4, such as \"千万\" (must) and \"哪怕\" (even if).\n\n* Presentational Speaking: Delivering a formal \"Legacy Speech\" reflecting on 12th-grade growth.", "materials": "* Textbook: Integrated Chinese Volume 4, Lesson 20.\n\n* Digital Media: Semester 2 Padlet lesson notes.\n\n* Multimedia: News clips on global tech trends and international travel blogs.", "assessments": "Senior Capstone Presentation: A cumulative digital portfolio showcasing language proficiency and cultural insights.\n\n* Final Oral Interview: An end-of-year assessment of spontaneous conversational ability on global topics.\n\n* Reflective Essay: A written synthesis of how the course themes (History, Finance, Environment) intersect in a globalized world."}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Class V Chinese Curriculum", "department": "Modern Languages - Chinese", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Class VI Chinese", "department": "Modern Languages - Chinese", "teacher": "Jia Situ", "grade": "", "length": "", "description": "", "competencies": "Developing reading comprehension, writing compositions, conversational fluency (dialogues and speaking), and applying core grammar structures (e.g., directional phrases, time markers, aspect markers).\nOur five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Colors and Clothing (颜色和衣服)", "timeframe": "", "concepts": "Colors (红, 绿, 蓝, 黑, 黄, 紫, 橙, 粉红, 咖啡色), clothing vocabulary (衬衫, 西装, 裤子, 裙子, 毛衣, 鞋子).", "skills": "Describing objects and attire using colors; using measure words (件, 条, 双, 顶, 个).", "materials": "L13 Reading/HW, L14 HW Packet.", "assessments": ""}, {"name": "Unit 2"}, {"name": "Sports and Pets (运动与宠物)", "timeframe": "", "concepts": "Sports (游泳, 踢足球, 打篮球, 打棒球, 打排球, 骑车); Pets (狗, 猫, 鸟, 金鱼, 乌龟); Describing pets (可爱, 聪明, 玩球, 说话, 游泳).", "skills": "Discussing favorites (更, 经常/常常); expressing ability (会); dialogue/role-play practice.", "materials": "L16 Project/Vocab, L17 Quiz/Test.", "assessments": ""}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "Languages (中文, 英语, 法语, 德语, 西班牙语), nationalities; Shopping vocabulary (字典, 钱, 贵, 便宜); bargaining.", "skills": "Discussing language abilities (会说什么语言); using 给, 如果, 会 (will); asking for prices (多少钱) and bargaining (还价).", "materials": "L18 Text/Workbook, L19 Text.", "assessments": ""}, {"name": "Unit 4"}, {"name": "Daily Routine and Activities (日常活动)", "timeframe": "", "concepts": "Daily routine (几点起床, 吃早饭/午饭/晚饭, 睡觉); actions in progress (在); family activities (看电视, 玩游戏).", "skills": "Telling time; using 就/才 for timely/delayed actions; describing current actions (在 + verb); describing movement (V+来+V+去).", "materials": "L20 Project/Workbook, L21 Text/Workbook.", "assessments": ""}, {"name": "Unit 5"}, {"name": "Weather and Directions (天气与方向)", "timeframe": "", "concepts": "Weather conditions (晴天, 阴天, 下雨, 下雪, 刮风); Directions (东, 南, 西, 北, 往, 向, 路口, 转); Distance (多远, 分钟).", "skills": "Reporting weather (video project); asking for and giving directions (怎么走, A 离 B); using degree (有点儿) and change (越来越, 可能).", "materials": "L22 Project/Vocab, L23 HW Packet.", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Class VII Chinese Curriculum", "department": "Modern Languages - Chinese", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Class VIII Chinese: GoFar 2", "department": "Modern Languages - Chinese", "teacher": "Jia Situ", "grade": "8", "length": "Full Year", "description": "", "competencies": "Planning and discussing events (e.g., talent shows, festivals)\nMastering complex grammatical structures including resultative complements and the 把 structure\nExpressing nuanced opinions in Chinese\nOur five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "看朋友 (Seeing Friends) / 面子与人际关系 (Face and Interpersonal Relationships)", "timeframe": "", "concepts": "Concepts of 'Face' (面子) and interpersonal relationships\nComparative structures (A 没有 B+adj/verb phrase)\nExpressing frequency (每...次) and past actions (S+Verb+了/过+ #次)", "skills": "Constructing sentences using 'A 没有 B' and quantifiers for frequency", "materials": "GoFar 2 Lesson 3 materials", "assessments": "Practice translating and constructing comparative sentences"}, {"name": "Unit 2"}, {"name": "活动计划 (Activity Planning)", "timeframe": "", "concepts": "Time expressions (上个/下个, 上次/下次)\nUsage of 怎么 vs. 怎么样\nPlanning a school activity (美食节, 才艺秀, 唱歌比赛, 演唱会)", "skills": "Developing a detailed activity plan, including purpose (目的), time, location, participants, content, and a detailed timeline", "materials": "GoFar 2 Chapter 4 and U2-1 Presentation/Quiz materials", "assessments": "Planning a school activity presentation; quizzes related to time expressions and sentence structure"}, {"name": "Unit 3"}, {"name": "才艺秀准备 (Talent Show Preparation)", "timeframe": "", "concepts": "Resultative complements: 懂, 完, 好, 清楚, and 会\nGrammar points: 就 and 以前/以后", "skills": "Using resultative complements correctly (e.g., 看完, 听懂, 学会)\nDiscussing interests (对...感兴趣) and simultaneous actions (一边...一边...)", "materials": "GoFar 2 Chapter 5 textbook/workbook and Quizlet", "assessments": "Q&A sessions, listening exercises (P137), and quizzes on resultative complements"}, {"name": "Unit 4"}, {"name": "(Mis)communication", "timeframe": "", "concepts": "The 把 (bǎ) structure (Subject + 把 + Object + Verb + other elements)\nDiscussion of 粉丝 (fans) and nuanced opinions using 'adj 是 adj, 但是...'", "skills": "Using the 把 structure for object manipulation; expressing nuanced opinions in conversation", "materials": "GoFar 2 Chapter 6 presentation slides", "assessments": "Translation exercises and conversational practice"}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Easy Steps to Chinese 4", "department": "Modern Languages - Chinese", "teacher": "", "grade": "Middle School (Stage 2)", "length": "Full year", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future\nRadicals and simple characters, formation of phrases, expansion of vocabulary, simple grammar and sentence structures, dictionary skills, typing skills, classroom instruction in Chinese, writing (100-250 characters), and exposure to modern China and Chinese culture.", "units": [{"name": "Unit 1"}, {"name": "Personal Identity and Occupations", "timeframe": "4-5 weeks", "concepts": "Appearance (长相), Occupations (职业), and Personality (性格).", "skills": "Describing people, discussing aspirations, and using grammar structures like \"虽然...但是\" and \"只有...才\".", "materials": "Easy Steps to Chinese 4", "assessments": "Easy Step to Chinese Unit 1 test."}, {"name": "Unit 2"}, {"name": "Daily Life and Home", "timeframe": "4-5 weeks", "concepts": "Daily Routine (日常起居), Household Chores (家务), and Pets (宠物).", "skills": "Describing daily routines, talking about household responsibilities and pets, and using complements of result.", "materials": "Easy Steps to Chinese 4", "assessments": "Easy Steps to Chinese 4 Unit 2 Test"}, {"name": "Unit 3"}, {"name": "School and Academic Life", "timeframe": "5-6 weeks", "concepts": "Schools (学校), Examinations (考试), and School Events (学校活动).", "skills": "Describing school facilities, discussing academic performance, and practicing the complement of possibility.", "materials": "Easy Steps to Chinese 4", "assessments": "Easy Steps to Chinese 4 Unit 3"}, {"name": "Unit 4"}, {"name": "Food and Celebrations", "timeframe": "5-6 weeks", "concepts": "Delicious Food (美食), Festivals (节日), and Eating Out (外出就餐).", "skills": "Discussing food preferences, describing festivals, and communicating during a meal.", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Community and Travel", "timeframe": "4-5weeks", "concepts": "Neighbourhood (社区), Travelling (旅游), and Accidents (意外事故).", "skills": "Discussing local community and travel topics.", "materials": "Easy Steps to Chinese 4", "assessments": "Easy Steps to Chinese 4 Unit 5"}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Class VI French", "department": "Modern Languages - French", "teacher": "Bellec", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Les gens que je connais", "timeframe": "7-8 weeks", "concepts": "Family structures, physical and personality traits, numbers (up to 3 million), and dates. Grammar: Possessive adjectives and -IR verbs.\nCulture: Martinique; Francophone West Africa", "skills": "Describing people, expressing possession, and discussing birthdays.", "materials": "T'es branché Level 1 (Ch. 5).", "assessments": "Quiz on indefinite articles (September 29)\nPresentations: guess who (students describe a classmate) (October 9-10)\nTest 1 covering: Family, description, possessive adjectives, indefinite articles, months/dates/age, personality, with a bonus on Martinique\nTest 2 (Lesson C): Listening comprehension, French-speaking Africa vocabulary, Grammar (venir, C'est/Ce sont), and Writing"}, {"name": "Unit 2"}, {"name": "La rue commerçante", "timeframe": "6-7 weeks", "concepts": "Clothing, colors, food, and types of shops. Grammar: Acheter/Vendre/Vouloir, demonstrative adjectives, and expressions of quantity.", "skills": "Role-playing shopping scenarios, describing outfits, and managing a budget.", "materials": "T'es branché Level 1 (Ch. 6).", "assessments": "Test 3: Reading comprehension and written expression\nProject/Presentation: Present a recipe from Marmiton.fr\nWritten Expressions: Describe clothes for a birthday, describe celebrity outfits, and describe purchases"}, {"name": "Unit 3"}, {"name": "À la maison", "timeframe": "6 weeks", "concepts": "Housing, furniture, and table settings. Grammar: Devoir/Pouvoir/Mettre, ordinal numbers, and comparisons (plus/moins que).", "skills": "Describing a home layout and comparing objects or lifestyle habits.", "materials": "T'es branché Level 1 (Ch. 7).", "assessments": "Test 4 : Listening comprehension, vocabulary, partitive and ordinal numbers\nQuiz 7 on vocabulary and comparison\nPresentations : Presenting a recipe from Marmiton.fr\nTest 5 : Reading comprehension, Vocabulary (furniture/rooms), Grammar (comparison, putting, power), and Written production\nProjects: Apartment search in Paris and House plan drawing"}, {"name": "Unit 4"}, {"name": "À Paris", "timeframe": "5-6 weeks", "concepts": "Weather, animals, city landmarks, and the Passé Composé.\nCulture: Paris; each students was assigned an arrondissement", "skills": "Recounting past events, describing the weather, and identifying landmarks.", "materials": "T'es branché Level 1 (Ch. 8).", "assessments": "Quizzes 8 and 9 respectively on vocabulary + expressions with avoir and passé composé with être\nTest 6 : Listening comprehension (video), Vocabulary, Grammar (past tense, expressions with avoir), and Writing"}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "French 7A and French 7B – Note : French 7B will likely not complete the last two units", "department": "Modern Languages - French", "teacher": "Ladane du Boulay", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Comment je passé l'été / How I spent summer", "timeframe": "~5 Weeks", "concepts": "Thematic Focus: Summer holidays, festivals, and television/media.\nCultural Content: The city of Québec, the Festival d’été de Québec, La Saint-Jean, cultural traditions in France and Canada. Francophone study of Luxembourg and French reality television.\nGrammar/Structure: * Review of regular verbs ending in -er, -ir, -re.\nReview of negative sentences, possessive adjectives, forming questions, and dates.\nIrregular verbs avoir and être, indefinite articles in negation, and demonstrative adjectives.\nAdjective agreement/position and comparative adjectives.", "skills": "Key Skills\nDiscussing personal vacation preferences and holiday traditions.\nCritiquing and evaluating media preferences (TV shows, advertisements).\nMastering pronunciation nuances: articulating vowels and.", "materials": "T’es branché 2", "assessments": "Quizzes/tests/projects/oral and writing assignments."}, {"name": "Unit 2"}, {"name": "Dans la capitale - In the capital", "timeframe": "~6 Weeks (Accounting for a long weekend/Columbus day)", "concepts": "Thematic Focus: Fine arts, navigating a city, and amusement parks/transportation.\n\nCultural Content: Parisian landmarks (The Louvre, Centre Pompidou, Musée d’Orsay), Impressionist painting, neighborhoods of the Right and Left banks, and amusement parks (La Fête des Loges, La Ronde). Introduction to Canadian bilingualism and Versailles.\nGrammar/Structure:  Irregular verbs suivre, mettre, prendre, voir, vouloir, pouvoir, devoir, falloir, aller, faire, venir, partir, sortir.\nPassé composé with avoir and être, including irregular past participles.\nContractions with de and à, the imperative mood, and telling time.", "skills": "Key Skills\nDescribing visual art and architectural structures in French.\nAsking for and giving directions to navigate urban spaces and transit networks (RER).\nExpressing obligations, permissions, and past occurrences.", "materials": "T’es branché 2", "assessments": "Quizzes/tests/projects/oral and writing assignments."}, {"name": "Unit 3"}, {"name": "La vie quotidienne - Daily life", "timeframe": "~6 Weeks (Accounting for Thanksgiving Week Off: Nov 23–27)", "concepts": "Thematic Focus: Morning routines, household chores, personal memories, and cultural events.\nCultural Content: Spotlight on West Africa (Cameroun, Côte d'Ivoire, Sénégal).\nGrammar/Structure: Reflexive Verbs (Present tense, Imperative, and Passé composé).\nIrregular plural forms of nouns and adjectives.\nIrregular verb s'asseoir.", "skills": "Chronologically detailing daily habits and distribution of domestic chores.\nConstructing a narrative sequence using sequential pictorial prompts.\nEngaging respectfully in debates regarding socio-political and immigration discourse.", "materials": "T’es branché 2", "assessments": "Quizzes/tests/projects/oral and writing assignments."}, {"name": "Unit 4"}, {"name": "Autrefois - Long time ago", "timeframe": "~5 Weeks (Accounting for Winter Break Off: Dec 21–Jan 1)", "concepts": "Thematic Focus: Farm life, historic occupations, student milestones, and comparing the past to the present.\nCultural Content: Agricultural France, the history of Montmartre, and Social movements.\nGrammar/Structure: * The Imperfect Tense (l'imparfait).\nDistinguishing uses of the imparfait versus the passé composé.\nTime expressions with il y a , hypothetical clauses (Si on + Imperfect) , and irregular verbs croire and dire.", "skills": "Contrasting historical settings/lifestyles with modern environments.\nConducting and documenting oral histories or narratives about ancestral backgrounds.\nDifferentiating registers of speech (Standard vs. Informal vs. Familiar French).", "materials": "T’es branché 2", "assessments": "Quizzes/tests/projects/oral and writing assignments."}, {"name": "Unit 5"}, {"name": "Bon voyage et bonne route! - Safe travels!", "timeframe": "~5 Weeks (Accounting for Spring Break Off: March 22–26)", "concepts": "Thematic Focus: Airport procedures, driving/road travel, and hotel accommodations.\nCultural Content: Air France, Paris airports, and the city of Bordeaux. French automotive giants (Stellantis, Renault-Nissan) and the process of earning a license in France. Hospitality systems (gîtes, auberges) and luxury hotels in cinema.\nGrammar/Structure: * Direct Object Pronouns (me, te, nous, vous, le, la, l', les).\nAgreement of direct object pronouns in the passé composé.\nIndirect Object Pronouns (lui, leur, me, te, nous, vous).\nIrregular verbs conduire and boire, and forms of the adjective tout.", "skills": "Managing logistics for travel, check-ins, transit, and ordering room service in French.\n\nReplacing nouns efficiently with appropriate object pronouns to sound more natural.\n\nDrafting authentic conversational scripts and situational role-plays.", "materials": "T’es branché 2", "assessments": "Quizzes/tests/projects/oral and writing assignments."}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "T’es branché 2", "assessments": "Quizzes/tests/projects/oral and writing assignments."}, {"name": "Unit 6"}, {"name": "Les arts maghrébins - Maghebi art", "timeframe": "~7 Weeks (Accounting for end-of-year reviews and capstone)", "concepts": "Thematic Focus: Literature and graphic novels, music genres, jewelry, and open-air markets.\nCultural Content: Regional focus on the Maghreb: Morocco, Algeria, and Tunisia. Francophone comic strips (bande dessinée), the history of Raï music, musical icon Faudel, and negotiating in traditional souks.\nGrammar/Structure: * Irregular verbs lire, écrire, savoir, connaître, recevoir, ouvrir.\nFormal letter writing conventions.", "skills": "Differentiating between factual knowledge (savoir) and personal familiarity (connaître).\nFormulating formal business or inquiry correspondence in French.\nDrafting profiles detailing a person or character's attributes.", "materials": "T’es branché 2", "assessments": "Quizzes/tests/projects/oral and writing assignments."}]}, {"name": "Class VIII French", "department": "Modern Languages - French", "teacher": "Howell", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "La vie à la ferme", "timeframe": "2 weeks", "concepts": "Gaining insights into rural life in France\nNames of common animals and the sounds they make\nThe imperfect vs the passé composé", "skills": "Recounting events in the past with accurate distinction between the passé composé and the imperfect\nComparing and contrasting urban and rural living", "materials": "TEXTBOOK T’es branché 2 \nWORKBOOK T’es branche 2\nShort videos in Fr  "Unit 11"}, {"name": "La Bretagne, La Normandie, l’Alsace-Lorraine, la Touraine et la Provence", "timeframe": "4 weeks", "concepts": "", "skills": "", "materials": "TEXTBOOK T’es branché 2 \nWORKBOOK T’es branche 2\nTravel websites that promote various tourist attractions in France\nVideos for teenagers on the geography of France", "assessments": "Assessments are determined carefully according to targeted tasks, skills, and proficiency levels of the students in a given group. Assessments include traditional tests to be given upon the completion of every two units, short oral interviews that count as a quiz, short weekly quizzes, dictation, and short oral presentations on a chosen topic. Practice dialogues are recorded and graded online on the textbook’s platform."}, {"name": "Unit 12"}, {"name": "Les Antilles", "timeframe": "2 weeks", "concepts": "", "skills": "", "materials": "TEXTBOOK T’es branché 2 \nWORKBOOK T’es branche 2\nA short history of Haïti in French\nA basic manual of Créole \nTravel websites for Martinique and Guadéloupe", "assessments": "Assessments are determined carefully according to targeted tasks, skills, and proficiency levels of the students in a given group. Assessments include traditional tests to be given upon the completion of every two units, short oral interviews that count as a quiz, short weekly quizzes, dictation, and short oral presentations on a chosen topic. Practice dialogues are recorded and graded online on the textbook’s platform."}, {"name": "Les révisions", "timeframe": "6 weeks", "concepts": "", "skills": "", "materials": "Handouts designed to review all grammatical structures and vocabulary learned since September. \nShort French language videos targeting the more difficult grammatical structures. \nTPRS novels: Fama va en Californie and La corde cassée", "assessments": "Assessments are determined carefully according to targeted tasks, skills, and proficiency levels of the students in a given group. Assessments include traditional tests to be given upon the completion of every two units, short oral interviews that count as a quiz, short weekly quizzes, dictation, and short oral presentations on a chosen topic. Practice dialogues are recorded and graded online on the textbook’s platform. \nOf special note, the students will have a final oral interview that includes a battery of 50 questions in various tenses and a mixture of thematic vocabulary. Students will also be required to summarize the plot of one of the novelettes read."}]}, {"name": "French 1", "department": "Modern Languages - French", "teacher": "Bellec (2025/2026) / du Boulay (2026/2027)", "grade": "Open to IX-XII", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Salut !", "timeframe": "Approximately 4 weeks", "concepts": "Politeness (La politesse), the French alphabet, Francophone manners (La bise), nouns and articles (singular/plural), numbers 0-60, classroom vocabulary, use of « Qu’est-ce que… ? » and « il y a », silent letters, descriptive adjectives, nationalities, subject pronouns, verb être, and stereotypes.", "skills": "Correct usage of être and applying gender and number agreement.", "materials": "Promenades, unité 1.", "assessments": "Quiz 1\nTest 1"}, {"name": "Unit 2"}, {"name": "À la fac", "timeframe": "Approximately 4 weeks", "concepts": "Expressing likes and dislikes (J’aime / je n’aime pas), forming questions, expressing negation, course vocabulary, regular -er verbs, frequency, university/college vocabulary (la fac), class schedule (l’emploi du temps), days of the week, verb avoir (including age), and telling time (L’heure). Also includes work on the /r/ pronunciation.", "skills": "Conjugating and using regular -er verbs and the verb avoir. Expressing negation and asking questions.", "materials": "Promenades, unité 2.", "assessments": "Quiz 2\nTest 2 (covering avoir and writing/spelling)"}, {"name": "Unit 3"}, {"name": "La famille et les copains", "timeframe": "Approximately 6 weeks", "concepts": "Family vocabulary, descriptive adjectives, possessive adjectives, professions (Les métiers), numbers 61-100, prepositions of place (de lieux), and disjunctive pronouns.", "skills": "Using descriptive adjectives, applying placement rules (BAGS), using possessive adjectives, and using prepositions of place and disjunctive pronouns.", "materials": "Promenades, unité 3.", "assessments": "Quizzes 3, 4 and 5\nTest 3, covering listening comprehension (on professions), grammar (prepositions), writing prompt, adjectives (placement/BAGS), prepositions, and disjunctive pronouns"}, {"name": "Unit 4"}, {"name": "Au café", "timeframe": "Approximately 5 weeks", "concepts": "Verb aller, preposition à with verbs (commencer, parler, penser, téléphoner), interrogative words (emphasis on pourquoi), quelle/quel/quelles/quels, expressions with avoir (e.g., avoir soif, avoir faim), combien/combien coûte, verbs prendre and boire, the partitive (du, de la, de l'), and expressions of quantity (un morceau de, une bouteille de, etc.).", "skills": "Asking questions with pourquoi, using aller, boire, and prendre, and applying the partitive and expressions of quantity.", "materials": "Promenades, unité 4.", "assessments": "Quizzes 6 and 7\nPresentations\nTest 4, covering Vocabulaire 4B, exercises on verbs (aller, boire, prendre), the partitive, Combien coûte with a menu, and Expression écrite"}, {"name": "Unit 5"}, {"name": "Les loisirs", "timeframe": "Approximately 5 weeks", "concepts": "Adverbs (déjà, encore, jamais, parfois, souvent), verb faire, the expression il faut, irregular -ir verbs (sortir, partir, dormir, servir, sentir, courir), vocabulary for weather, seasons, months, and birthdays, numbers above 100, and spelling-change -er verbs (acheter, espérer, envoyer).", "skills": "Using verb faire and il faut, conjugating irregular -ir verbs and spelling-change -er verbs. Writing practice.", "materials": "Promenades, unité 5.", "assessments": "Quiz 8\nTest 5, covering Chapter 5B Vocabulary, verb faire, il faut, irregular -ir verbs, numbers above 100, spelling-change verbs, Comprehension orale, and Expression écrite"}, {"name": "Unit 6"}, {"name": "Les fêtes", "timeframe": "Approximately 4 weeks", "concepts": "Vocabulary related to age and clothing, demonstrative adjectives, Passé composé with avoir, French fashion (la mode en France), indirect object pronouns, and regular/irregular -re verbs.", "skills": "Using the passé composé, using indirect object pronouns, and conjugating -re verbs. Describing clothing (Que portent-ils?).", "materials": "Promenades, unité 6.", "assessments": "Quizzes 9 and 10\nTest 6, covering Chapter 6B Vocabulary, Passé composé, Indirect object pronouns, and -re verbs. Test components include Compréhension orale, Vocabulaire, Choix multiple, Conjugaison, Transformation de phrases, and Production écrite ('Un week-end de shopping')"}, {"name": "Unit 7"}, {"name": "En vacances", "timeframe": "2 weeks", "concepts": "Passé composé with être\nTravel related vocabulary", "skills": "Narrating past travel experiences using cohesive transitions like d'abord, ensuite, and tout à coup.\nApplying negation (ne... pas) to describe unexpected travel events.\nConducting digital research to plan and describe a virtual stay in a specific French city.", "materials": "Chapitre 7 PowerPoint including teacher-modeled slides of Rennes.\nInteractive digital tools: Google Maps for itineraries and Airbnb for researching authentic lodging", "assessments": "Presentation\nQuiz"}]}, {"name": "French 3", "department": "Modern Languages - French", "teacher": "Ladane du Boulay", "grade": "Open to IX and XII grades", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": "Quizzes/tests/projects/oral and writing assignments."}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": "Quizzes/tests/projects/oral and writing assignments."}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": "Quizzes/tests/projects/oral and writing assignments."}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": "Quizzes/tests/projects/oral and writing assignments."}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": "Quizzes/tests/projects/oral and writing assignments."}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": "Quizzes/tests/projects/oral and writing assignments."}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": "Quizzes/tests/projects/oral and writing assignments."}]}, {"name": "French 4", "department": "Modern Languages - French", "teacher": "Bellec; Howell", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "« ressentir et vivre »", "timeframe": "6 weeks", "concepts": "Personal relationships\nverbes irréguliers (être, avoir, faire, aller)\nSpelling-change verbs (-ger, -cer, -yer, -eler/-eter, -e+consonne+er)\nLiterature (Le Pont Mirabeau)", "skills": "Write and discuss personal relationships\nApply correct conjugation for irregular verbs and spelling-change verbs\nAnalyze literary themes and poetic structure in Le Pont Mirabeau", "materials": "“Imaginez”, chapter 1\nWeek-long lesson plan on Le Pont Mirabeau", "assessments": "Presentations on Le Pont Mirabeau\nQuiz 1\nTest 1 (Vocabulary; spelling-change verbs; writing)"}, {"name": "Unit 2"}, {"name": "« Habiter en ville »", "timeframe": "1 month", "concepts": "Vocabulary: \"en ville\"\nCulture : la fête de la musique\nGrammar: reflexive verbs, adjectives, adverbs in -ment", "skills": "Describe urban life and locations using relevant vocabulary\nDiscuss the cultural significance of la fête de la musique\nConstruct sentences using verbes pronominaux, adjectives, and adverbs in -ment", "materials": "“Imaginez”, chapter 2", "assessments": "Quiz 2 (on adjectives)\nTest 2 (listening comprehension; reflexive verbs; -ment adverbs)"}, {"name": "Unit 3"}, {"name": "« l’influence des media »", "timeframe": "5 weeks", "concepts": "Vocabulary: the media world\nStructures: Passé composé (with avoir and être), Passé composé vs imparfait", "skills": "Discuss and analyze the influence of media using specialized vocabulary\nNarrate past events accurately by distinguishing between the passé composé and the imparfait\nImprove reading comprehension, translation, and written expression focusing on narratives", "materials": "“Imaginez”, chapter 3", "assessments": "Quizzes 3 & 4 (Vocabulary and passé composé VS imparfait)\n1:1 meetings on media to assess students’ ability to express opinions about a topic\nTest 3 (Reading comprehension, Grammar: passé composé VS imparfait, Written expression)"}, {"name": "Unit 4"}, {"name": "« la valeur des idées »", "timeframe": "5 weeks", "concepts": "Vocabulary: \"justice and politics\"\nCulture: Haiti\nGrammar: Le plus-que-parfait (PQP), La négation", "skills": "Discuss complex political and social issues (justice and politics) based on the film Le Comte de Monte Cristo using relevant vocabulary\nExplain and discuss the use of Le plus-que-parfait and complex forms of negation\nAnalyze themes of justice and choice in the film Le Comte de Monte Cristo", "materials": "“Imaginez”, chapter 4\nFilm : Le Comte de Monte Cristo", "assessments": "Quizzes 5 & 6 (Vocabulary and complex forms of negation)\nTest 4 (le plus-que-parfait and writing)"}, {"name": "Unit 5"}, {"name": "« la société en évolution »", "timeframe": "4 weeks", "concepts": "Grammar: Le partitif, Les pronoms y et en, L’ordre des pronoms", "skills": "Discuss society themes based on the film Bande de Filles and personal experiences\nUse partitive accurately when speaking and writing about quantities\nEmploy the pronouns y and en correctly\nApply the correct word order for object pronouns in complex sentences\nDevelop writing and reading comprehension skills by applying new grammatical structures", "materials": "“Imaginez”, chapter 5\nFilm : Bande de Filles", "assessments": "Quizzes (Mini quiz on the film; vocabulary quiz; quiz on partitive)\nTest 5 (Reading comprehension, pronoun exercises, Written expression)"}, {"name": "Unit 6"}, {"name": "« les générations qui bougent »", "timeframe": "5 weeks", "concepts": "Vocabulary: family\nLittérature : Maryse Condé\nGrammar: Le subjonctif, Les pronoms relatifs, forming questions", "skills": "Discuss family dynamics and inter-generational topics based on the film La Famille Bélier and using specific vocabulary\nExpress necessity, doubt, and emotion using subjunctive\nConnect clauses and clarify subjects/objects using Les pronoms relatifs\nFormulate and respond to various types of questions\nAnalyze the literary work of Maryse Condé and themes in the film La famille Bélier", "materials": "“Imaginez”, chapter 6\nFilm : La famille Bélier", "assessments": "Quizzes (the subjunctive; forming questions)\n1:1 meetings to assess oral performances on the subjunctive and ability to form questions\nTest 6 (Reading; Relative pronouns; Writing)"}, {"name": "Unit 7"}, {"name": "Unit N rm a poem", "skills": "Identify parts of the face \nMemorize a poem in Spanish\nDevelop correct pronunciation and intonation of Spanish words", "materials": "Read aloud “Gloria Fuertes”\nPoem \nVideos of “En mi Cara Redondita”", "assessments": "Observation, anecdotal record of participation in class"}, {"name": "Unit 7"}, {"name": "Feria de Abril/ Flamenco", "timeframe": "4 weeks", "concepts": "What are the elements of Flamenco?", "skills": "Identify instruments and clothing\nSort vocabulary into categories\nSkits: How to go shopping during La Feria de abril\nAsk and answer questions about the price of an item", "materials": "Carmen Amaya Read Aloud\nVideos of Flamenco dancers, music and elements\nTeacher created materials", "assessments": "Observation, anecdotal record of participation in class"}]}, {"name": "Class II Spanish Curriculum", "department": "Modern Languages - Spanish", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Review + Routines", "timeframe": "Four-Five Weeks", "concepts": "What can I remember and use?\nHow can I use Spanish to observe, record and describe calendar facts?\nHow can I use Spanish to share about myself and greet others?\nHow can I ask for what I need and express my preferences and opinions?", "skills": "Write facts about the date, weather and seasons using special symbols required\nUse the correct greeting for the time of day \nUse multiple words to create sentences to describe \nLearn and review vowels", "materials": "Lesson slideshows\nSpanish folders\nIndividual Calendars\nHelpful Vocabulary Reference Packets", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 3"}, {"name": "Unit Name"  Tiene”)\nSong about South America capitals and countries", "assessments": "Observation, anecdotal record of participation in class"}, {"name": "Unit 3"}, {"name": "Identity, personality, pronouns and adjectives", "timeframe": "4 weeks", "concepts": "How can I use Spanish to describe myself and others?\nHow can I share parts of my identity within my community?", "skills": "Students will be able to provide personal information, talk about personality traits, likes and dislikes\nAdjectives\nVerbs in infinitive", "materials": "Teacher created slideshows\nSongs\nWorksheets\nHeadbandz game", "assessments": "Observation, anecdotal record of participation in class"}, {"name": "Unit 4"}, {"name": "Januka y Navidad en America del Sur y Argentina", "timeframe": "2 weeks", "concepts": "How is Christmas and Hanukkah celebrated in South America? \nHow is New Year celebrated in different countries in South America?", "skills": "Students will be able to identify elements of Januca, Navidad y Año Nuevo. \nCompare and contrast how these are celebrated in South America and the United States", "materials": "Teacher created slideshows and worksheets", "assessments": "Observation, anecdotal record of participation in class"}, {"name": "Unit 5"}, {"name": "UNICEF and UN Rights of the Child", "timeframe": "2 weeks", "concepts": "What are the UNICEF rights of the child and why are they important?", "skills": "Identify and name the rights fo the child using spanish vocabulary", "materials": "Mini books on Rights of the child\nTeacher created slideshows\nCharades", "assessments": "Observation, anecdotal record of participation in class"}, {"name": "Unit 6"}, {"name": "Venezuela + Right to Nationality + Food+ Venezuela", "timeframe": "Approx 6 weeks", "concepts": "How can I have an exchange about my identity?\nWhat is Venezuela like?\nHow can I describe Venezuela?\nHow can I use my Spanish to express preferences and have a restaurant exchange?", "skills": "I can describe personal facts using complete phrases \nI can read, write and name facts about Venezuela", "materials": "Passport templates\n“Pepita va a Venezuela”mini books\nSlideshows\nArepa templates\nSkit templates", "assessments": "Observation, anecdotal record of participation in class"}, {"name": "Unit 6"}, {"name": "South American Capstone Project (Collaboratively with Class III Social Studies)", "timeframe": "4 weeks", "concepts": "Students will be working in groups conducting research about a South American country and will collaborate in the creation of a bilingual poster. \nStudents will apply understanding of geographical features, location and country facts to write and present research in a formal presentational context\nStudents will refine pronunciation skills, review letter sound rules and intonation when reading", "skills": "Students will be able to summarize key facts about a country using complete phrases\nStudents will read facts about a country, applying understanding of letter sound rules\nStudents will write facts using short sentences and utilize necessary special symbols", "materials": "Lesson Slideshows\nTeacher created texts with facts about South American countries\nPoster boards (provided by Class III Social Studies teachers)\nColor photos of country features to add to posters", "assessments": "Observation, anecdotal record of participation in class and during capstone event"}, {"name": "Unit 6"}, {"name": "Argentina+ Right to Education+ Maria Elena Walsh Poetry and Songs", "timeframe": "3 weeks", "concepts": "Students will learn about the geography, food, culture and poetry in Argentina", "skills": "Students will be able to describe and read key facts about Argentina\nStudents will be able to describe and read  key facts about poet María Elena Walsh\nStudents will learn and memorize part of the song “Manuelita La Tortuga”", "materials": "Poems by Maria Elena Walsh\nVideos and songs with Maria Elena Walsh poems\nArgentina flag template\nArgentina text description \nVideos about Leo Messi and Tango music of Argentina", "assessments": "Observation, anecdotal record of participation in class"}, {"name": "Unit 6"}, {"name": "Uruguay + Capybara", "timeframe": "2 weeks", "concepts": "Students will learn about the geography, food, and traditions in Uruguay\nStudents will learn about the capybara animal and read facts about its features", "skills": "Students will be able to describe key facts about Uruguay\nStudents will be able to locate Uruguay on a map\nStudents will be able to identify and describe the flag of Uruguay\nStudents will be able to describe and facts about the Capybara animal", "materials": "Passport templates\nFlag of Uruguay template\nMini book about Uruguay template\nMini books about Capybara", "assessments": "Observation, anecdotal record of participation in class"}]}, {"name": "Class IV Spanish", "department": "Modern Languages - Spanish", "teacher": "Annalise Porras and María Tovo", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Review + Routines", "timeframe": "3-4 Weeks", "concepts": "What can we remember and use?\nHow can we use Spanish only to express needs, opinions and requests?\nWhat are the rules for letter sounds and special symbols in Spanish?", "skills": "Review vowels, their sounds and special letter rules (J, LL, H, V, Z)\nEstablish classroom routines, including calendar facts, student interviews and useful classroom phrases \nReview numbers 1-100\nReview of special symbols and their impact on intonation and pronunciation siuch as accent marks, question marks an tildes.", "materials": "Lesson slideshows\nStudent list for Person of The Day Tracking\nSpanish folders\nUseful phrases vocabulary packets", "assessments": ""}, {"name": "Unit 2"}, {"name": "Introduction to Chile", "timeframe": "Six Weeks", "concepts": "Where is Chile located in the world and what is it like?\nWhat makes Chile unique and what can you find there?\nWhat are some cultural highlights that are specific to Chile?\nWhat are the key facts about Chile?", "skills": "Identify, locate and label Chile and its capital on a map\nIdentify and describe the flag of Chile\nList key facts about Chile using complete sentences\nRead short paragraphs about Chile applying understanding of correct intonation\nUtilize cardinal directions to describe where Chile is located in reference to other countries in South America and globally", "materials": "Lesson slideshows\nScript templates for skit project and prop templates\nDigital resources that depict authentic, real life voices", "assessments": ""}, {"name": "Unit 3"}, {"name": "Community Connections; Harlem Senior Center Field Trip", "timeframe": "Two-Three Weeks", "concepts": "How can I use Spanish as a tool to connect with others in my community?\nHow can I use Spanish as a tool for service?\nHow can I use my presentational skills for leadership?", "skills": "Memorization of letter of the alphabet A-Z and their pronunciation\nMemorization of numbers 1-100 and their pronunciation (by 10’s and by 1’s)\nUtilize strategies to support understanding (shortcut counting method, asking for support) \nPractice refining presentational skills, such as volume, projection, clarity and cadence\nUnderstanding how language can be used as a tool to connect with others", "materials": "Lesson slideshows\nField trip to Senior Center in East Harlem to lead BINGO game", "assessments": "Anecdotal observations in class as well as during the field trip"}, {"name": "Unit 4"}, {"name": "Intro to Interrogative Words/Geography of Chile/Intro to Indigenous Groups", "timeframe": "Five-Six Weeks", "concepts": "What are some key geographical features that make Chile unique and what can you do there?\nHow is Chile’s hemispherical location different to New York and the U.S.?\nHow does Chile’s hemispherical location impact its weather and seasons?\nWhat are the indigenous groups in Chile and where are they located?", "skills": "Identify and name the indigenous groups of Chile and locate on a map\nWrite and perform a skit, utilizing geographical features, weather and seasons\nUse verbs in infinitive form to describe various activities that can be explored in the diverse geographical regions of Chile\nUse a variety of weather terms to describe the climate in various regions of Chile", "materials": "“Pichintún” digital animated Chilean children’s episode about indigenous identity (Episode featuring Eva)\nLesson slideshows\nDigital resources which highlight authentic voices and perspectives", "assessments": ""}, {"name": "Unit 5"}, {"name": "Indigenous Identity in Chile", "timeframe": "What are the indigenous groups in Chile and what makes them unique?", "concepts": "What are the indigenous groups in Chile and what makes them unique?\nWhere are the indigenous groups located on a map of Chile?\nHow do the locations of the indigenous groups impact the way they live?\nWhat are some objects or artifacts that are unique to each indigenous group?", "skills": "Identify and name the indigenous groups of Chile and their unique traits and traditions.\nLabel the various indigenous groups of Chile on a map and describe their locations using cardinal directions\nUse interrogative words to respond to comprehension questions in both written and oral form, extending ideas with connecting tools.\nDescribe the objects and artifacts that indigenous groups use to live and celebrate", "materials": "“Pichintún” digital animated Chilean children’s series about indigenous identity\nLesson slideshows\nDigital resources which highlight authentic voices and perspectives", "assessments": ""}, {"name": "Unit 6"}, {"name": "Children’s Book for K Buddies", "timeframe": "Four Weeks", "concepts": "How can I use intonation to express a question versus a statement?\nHow do special symbols change the way Spanish sounds?\nWhat changes need to be made when indicating singular versus plural in Spanish?\nHow can I use my Spanish skills in service to others as a leader?", "skills": "Leadership and service to K buddies when presenting books\nRefine pronunciation skills by utilizing correct intonation when reading aloud\nOpportunity to see language as a tool for connecting with others\nGrammatical understanding of singular/plural and changes required in written form\nReview of greetings, feelings, expressing likes/dislikes and food vocabulary words\nWriting skill of opening and closing a conversation (ACTFL skill)", "materials": "Lesson slideshows\nIndividual student chromebooks and Book Creator app (Collaboration with Tech Dept.)", "assessments": ""}, {"name": "Unit 7"}, {"name": "Pablo Neruda and Poetry (Aligned With April Being National Poetry Month in The U.S.)", "timeframe": "Four-Six Weeks", "concepts": "Who is Pablo Neruda and Why Is He Famous?\nWhat kind of figurative language did Pablo Neruda use in his odes?\nHow can I use adjectives and nouns correctly to write an ode poem?", "skills": "Create and present an original ode, utilizing Neruda’s figurative language style\nRead short paragraphs about Pablo Neruda\nDescribe facts about Pablo Neruda using complete sentences\n Utilize adjectives and nouns with accurate changes needed for masculine/feminine", "materials": "Videos of Neruda Ode example\nRead Aloud about Neruda’s life\nColored construction paper for art project of ode object", "assessments": ""}, {"name": "Unit 8"}, {"name": "Violeta Parra + Gabriela Mistral (In Alignment with Changemakers Project in Class IV)", "timeframe": "Four-Six Weeks", "concepts": "Who are Violeta Parra and Gabriela Mistral and Why Are They Famous?\nWhat kind of figurative language did Violeta Parra use in “Gracias a La Vida?\nHow were Violeta Parra and Gabriela Mistral changemakers in Chile?", "skills": "Utilize two syllable words to write a version of “Gracias a La Vida” song\nRead short paragraphs about Violeta Parra and Gabriela Mistral\nDescribe facts about Violeta Parra and Gabriela Mistral using complete sentences", "materials": "Videos of Violeta Parra song examples\nRead Aloud about Violeta Parra and Gabriela Mistral’s lives\nLesson slideshows \nVideo with recording of “Gracias a La Vida” song", "assessments": ""}]}, {"name": "Class K Spanish", "department": "Modern Languages - Spanish", "teacher": "Annalise Porras", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Introduction to Classroom Routines, Colors and Calendar", "timeframe": "Four to Five weeks", "concepts": "How can I use Spanish to describe how I am feeling, to greet others and describe the colors in my world?", "skills": "Colors vocabulary\nGreetings for different times of day\nNumbers 1-10\nFeelings words\nWeather vocabulary\nHello and Goodbye\nThank you and you’re welcome", "materials": "Lesson slideshows with images and daily routines \nColors cards, matching game and BINGO game\nFeelings cards, signs and matching game", "assessments": "Anecdotal observation of student understanding and production of words and phrases within the classroom and during informal interactions outside of the classroom"}, {"name": "Unit 2"}, {"name": "Introduction to Mexico and Day of The Dead", "timeframe": "Five to Six Weeks", "concepts": "Where is Mexico and what is like there?\nWhat does the flag of Mexico look like?\nWhere is Mexico located in the world and on a map?\nWhat is Day of The Dead and how is it celebrated?\nWhat special objects are used to celebrate The Day of The Dead?", "skills": "Identify and name the colors of the flag of Mexico\nIdentify and label a map of Mexico and The U.S.\nDescribe the key objects used to celebrate The Day of The Dead \nExplain significance of The Day of The Dead holiday and why it is celebrated (English)\nRead short phrase using the sentence structure “Yo veo” (“I see”) and key vocab words", "materials": "Lesson slideshows with images and daily routines \nDay of The Dead posters with vocabulary\nDay of The Dead videos with real people, to highlight authentic resources\nDay of The Dead videos with songs", "assessments": "Observation of students’ ability to identify Mexico on a map\nObservation of students listing color words on art projects and flag\nObservation of students’ ability to list multiple objects used to celebrate holiday\nObservation of students’ reading of mini books and forming short phrases using “Yo veo”"}, {"name": "Unit 3"}, {"name": "Fruit and Expressing Likes and Dislikes", "timeframe": "Four to Five Weeks", "concepts": "What are the names for the fruits and how can I describe them?\nHow can I express my preferences in Spanish?\nWhat kinds of fruits and fruit products can I find in Mexico?\nHow can I use Spanish to buy a product from a vendor?", "skills": "List and identify fruit vocabulary\nDescribe fruit using color words and size vocabulary\nDescribe preferences using short phrase to express likes and dislikes\nEngage in a short role play exchange to order fruit from a vendor using greetings", "materials": "Lesson slideshows with images and daily routines \nFruit vendors in Mexico videos with real people, to highlight authentic resources", "assessments": "Observation of students’ reading of mini books and forming short phrases \nObservation of students’ ability to express preferences using familiar phrases and extend sentences to include fruit vocabulary\nObservation of students’ ability to have a short exchange during a role play activity, utilizing greetings, fruit vocabulary, forms of politeness and goodbye"}, {"name": "Unit 4"}, {"name": "Tamales in Mexico and Navidad Traditions", "timeframe": "Two to three weeks (a mini unit before the Winter Break)", "concepts": "What is Navidad in Mexico and how is it celebrated?\nWhat are tamales and how are they made?\nWhat are some of the special symbols and items that are used to celebrate?", "skills": "Learn, memorize and sing the “Bate, Bate, Chocolate” song\nReview numbers 1-30 and recite independently\nDescribe the significant cultural artifacts used to celebrate Navidad\nLearn, memorize and sing the chorus of the “Feliz Navidad” song\nUtilize the words to describe preferences to share opinions about foods from Mexico", "materials": "Lesson slideshows with images and daily routines \nVideos of families celebrating Navidad in Mexico with real people, to highlight authentic resources", "assessments": "Observation of students’ reading of mini books and forming short phrases \nObservation of students’ ability to express preferences using familiar phrases and extend sentences to include Navidad vocabulary\nObservation of students’ singing to memorized and practiced songs"}, {"name": "Unit 5"}, {"name": "Vegetables and Expressing Likes and Dislikes", "timeframe": "Four to Five Weeks", "concepts": "What are the names for the vegetables and how can I describe them?\nHow can I express my preferences in Spanish?\nWhat kinds of vegetables and vegetable products can I find in Mexico?\nHow can I use Spanish to buy a product from a vendor?", "skills": "List and identify vegetable vocabulary\nDescribe vegetables using color words and size vocabulary\nDescribe preferences using short phrase to express likes and dislikes\nEngage in a short role play exchange to order tacos from a vendor using greetings", "materials": "Lesson slideshows with images and daily routines \nTaco vendors in Mexico videos with real people, to highlight authentic resources", "assessments": "Observation of students’ reading of mini books and forming short phrases \nObservation of students’ ability to express preferences using familiar phrases and extend sentences to include vegetable vocabulary\nObservation of students’ ability to have a short exchange during a role play activity, utilizing greetings, vegetable vocabulary, forms of politeness and goodbye"}, {"name": "Unit 6"}, {"name": "Grains and Expressing Likes and Dislikes", "timeframe": "Four to Five Weeks", "concepts": "What are the names for different grains products and how can I describe them?\nHow can I express my preferences in Spanish?\nWhat kinds of grains and grain products can I find in Mexico?\nHow can I use Spanish to buy a product from a vendor?", "skills": "List and identify grains vocabulary\nDescribe preferences using short phrase to express likes and dislikes\nEngage in a short role play exchange to order bread from a bakery using greetings", "materials": "Lesson slideshows with images and daily routines \nBakery vendors in Mexico videos with real people, to highlight authentic resources", "assessments": "Observation of students’ reading of mini books and forming short phrases \nObservation of students’ ability to express preferences using familiar phrases and extend sentences to include grains vocabulary\nObservation of students’ ability to have a short exchange during a role play activity, utilizing greetings, grains vocabulary, forms of politeness and goodbye"}, {"name": "Unit 7"}, {"name": "Dairy and Expressing Likes and Dislikes", "timeframe": "Four to Five Weeks", "concepts": "What are the names for different dairy products and how can I describe them?\nHow can I express my preferences in Spanish?\nWhat kinds of dairy products can I find in Mexico?\nHow can I use Spanish to buy a product from a vendor?", "skills": "List and identify dairy vocabulary\nDescribe preferences using short phrase to express likes and dislikes\nEngage in a short role play exchange to order from an ice cream cart,  using greetings", "materials": "Lesson slideshows with images and daily routines \nIce cream vendors in Mexico videos with real people, to highlight authentic resources", "assessments": "Observation of students’ reading of mini books and forming short phrases \nObservation of students’ ability to express preferences using familiar phrases and extend sentences to include dairy vocabulary\nObservation of students’ ability to have a short exchange during a role play activity, utilizing greetings, dairy vocabulary, forms of politeness and goodbye"}, {"name": "Unit 8"}, {"name": "Frida Kahlo and Animals", "timeframe": "Four to Five Weeks", "concepts": "Who is Frida Kahlo and why is she important?\nHow can I use Spanish to describe what I observe in her artwork?\nWhat parts of Mexican culture inspired Frida’s clothing and art style?\nHow can I use Spanish to describe my self-portrait?", "skills": "List and identify clothing vocabulary\nList and identify animal vocabulary, using size and color words\nUse vocabulary for the parts of the face to describe self-portrait\nMemorize and recite short facts describing Frida Kahlo", "materials": "Lesson slideshows with images and daily routines \nFrida Kahlo paintings \nVideos of Frida’s “Casa Azul” to highlight authentic resources", "assessments": "Observation of students’ reading of mini books and forming short phrases \nObservation of students’ ability to identify multiple objects in Frida Kahlo’s artwork, using the sentence structure “Yo veo” (“I see”)"}, {"name": "Unit 9"}, {"name": "Butterfly Migration To Mexico", "timeframe": "One to Two Weeks", "concepts": "Why do monarch butterflies go to Mexico?\nHow can I use Spanish to describe butterflies in nature and their habitat?\nHow can I show the path of the butterfly migration on a map?", "skills": "List and utilize color and size vocabulary to describe a variety of butterflies\nMemorize and sing short poem and song about butterflies", "materials": "Lesson slideshows with images and daily routines \nMonarch butterflies in Mexico videos with real footage, to highlight authentic resources", "assessments": "Observation of students’ reading of mini books and forming short phrases \nObservation of students’ ability to memorize and sing poem and song\nObservation of students’ ability to describe butterflies using a variety of sizes and colors"}]}, {"name": "Class V Spanish", "department": "Modern Languages - Spanish", "teacher": "Niurka Álvarez", "grade": "V", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Un paso más (Preliminary Unit/Introductory Review)", "timeframe": "3–4 weeks", "concepts": "The Weather & Seasons: Identifying the four seasons and basic weather conditions (e.g., Hace sol, Llueve, Nieva, Hace frío).\nFormal vs. Informal Social Norms: Understanding the cultural nuances of tú vs. usted.\nFoundational Phonetics: The Spanish alphabet and the critical role of vowel pronunciation.\nNumerical Literacy: Numbers 0–30 for dates, ages, and phone numbers.\nClassroom Community: Vocabulary for objects and essential commands.", "skills": "Interpersonal Speaking: Asking and answering \"What is the weather like?\" (¿Qué tiempo hace?) and \"What is the date?\" (¿Cuál es la fecha?).\nInterpretive Listening: Recognizing weather reports and following physical classroom commands.\nLinguistic Mechanics: Spelling names and weather terms using the Spanish alphabet.\nCultural Literacy: Connecting specific weather patterns and seasons to different regions of the Spanish-speaking world (e.g., reversed seasons in the Southern Hemisphere).", "materials": "Primary Text: Encuentros 1A (Preliminary Unit, pp. 1–29).\nCuaderno de Práctica (Workbook) \n Digital Platform: Vista Higher Learning (VHL) Supersite and WebSAM.\n Supplementary: Vocabulary handouts, flashcards, and audio scripts.", "assessments": "Oral greeting skit, \"My Classroom\" vocabulary labeling, and a quiz on days/months/weather.\n Formative: Participation in oral greetings, \"bell-ringer\" vocabulary matching, and classroom command drills.\n Summative: A short introductory quiz on greetings, alphabet spelling, and basic classroom phrases."}, {"name": "Unit 1:  México – Amigos en México"}, {"name": "People and Family", "timeframe": "5-6 weeks", "concepts": "Vocabulary: People, family members, physical and personality characteristics, emotions, and origins.\nGrammar: Personal pronouns, the verb ser (identity/origin), estar (temporary states), and tener (age/possession).\nCulture: Mexican geography, formal vs. informal introductions, and the life of Frida Kahlo.", "skills": "Interpersonal: Introducing oneself and others formally/informally.\nInterpretive: Recognizing differences in gestures and linguistic expressions in Spanish-speaking cultures.\nPresentational: Describing family members and asking/telling age and origin.", "materials": "Encuentros 1A (Unit 1, pp. 30–85); authentic cultural readings on Mexican family life.", "assessments": "\"Mi Familia\" project (family tree presentation); descriptive writing task; Unit 1 Proficiency Test (listening/reading).\n Summative:  short introductory quizzes on the use the verbs ser and tener, personal pronouns, and family vocabulary"}, {"name": "Unit 2: Puerto Rico – La vivienda en el Caribe"}, {"name": "Unit 2: Home and Leisure", "timeframe": "5–6 weeks", "concepts": "Vocabulary (La vivienda):\nParts of a house and types of furniture.\nCommon household items.\nHousehold chores and daily actions.\nLeisure activities and useful expressions for the home.\nGrammar:\nIdentifying nouns, gender, number, and articles.\nExpressing existence using the verb haber (hay).\nExpressing location or place.\nConjugating present tense verbs and specifying frequency using adverbs.\nExpressing obligation with tener que and hay que.\nCulture (Puerto Rico):\nComposition of streets in Old San Juan and symbols of Puerto Rico.\nFamous Puerto Rican monuments and geographic maps of the Caribbean.\nUnique architectural features, such as the design and rationale of roofs in Puerto Rican buildings.", "skills": "Communication: Describing one’s house and classroom in detail.\nFunctional Tasks: Identifying people, things, and the location of objects.\nCultural Literacy: Describing the customs, geographical aspects, and diversity of Puerto Rico.\nLiteracy: Identifying key concepts and supporting facts within an informational text.", "materials": "Encuentros 1A(Unit 2, pp. 86–143); Virtual tour of Caribbean-style architecture.", "assessments": "Interpretive: Identifying chores and activities within a text.\nPresentational: Describing chores, free-time activities, and life at home.\nInterpersonal: Describing people, places, and activities to others.\n\"Dream House\" design and oral tour; Chores checklist/log; Unit 2 Summative Assessments: short  quizzes vocabulary  and grammar"}, {"name": "Unit 3: Guatemala – De compras en Centroamérica"}, {"name": "Unit 3: Shopping and Clothing", "timeframe": "5-6 weeks", "concepts": "Types of clothing and footwear; shopping at malls vs. markets; describing objects (color, size, material).", "skills": "Shopping for clothes; expressing preferences; using numbers for prices; demonstrative adjectives (this/that).", "materials": "Encuentros 1A (Unit 3, pp. 144–199).", "assessments": "Marketplace role-play (buying/selling); \"What are they wearing?\" fashion description."}, {"name": "Unit 4: Perú-La comida en los Andes"}, {"name": "Unidad 4: Perú — La comida de los Andes (The Food of the Andes)", "timeframe": "4-5 weeks", "concepts": "Vocabulary (La alimentación): Specialty stores, various foods, meals, beverages, and useful expressions related to dining.\nGrammar:  Expressing desire and preference using stem-changing verbs ($e \\rightarrow ie$) like querer and preferir.\nUsing irregular \"yo\" form verbs and $e \\rightarrow i$ stem-changers.\nUnderstanding direct and indirect object pronouns (who or what receives an action).\nCulture (Perú): Geography of Peru, the Incas, the Nazca lines, and specific regional foods like el maíz, el paiche, ceviche, and el cuy peruano.\nSocial Customs: Dining etiquette in Peru and the influence of Los chifas.", "skills": "Communication: Expressing degrees of likes/dislikes and stating what one wishes to eat or drink at different mealtimes.\nFunctional Tasks: Deciding what to buy at specialty stores and performing specific tasks in a kitchen.\nDescription: Identifying and describing items on a dining table and authentic Peruvian dishes.\nAnalysis: Expressing an opinion about food and providing supporting evidence.", "materials": "Encuentros 1A (VHL) textbook and digital resources.\nAuthentic menus and cultural texts regarding Peruvian geography and history.", "assessments": "Integrated Performance Assessment (IPA):\nIdentifying and describing authentic dishes from Peru.\nInterpersonal task: Asking and answering questions about food preferences.\nPresentational task: Expressing and defending an opinion about specific foods.\nShort quizzes on vocabulary and grammar"}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Spanish Class VI", "department": "Modern Languages - Spanish", "teacher": "Álvarez and Howell", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "VII Spanish", "department": "Modern Languages - Spanish", "teacher": "Dr. Arboleda", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Review  - Preliminary Units 1 to 3", "timeframe": "This unit is projected to encompass approximately the first half of the semester, aligned with the established assessment calendar.", "concepts": "Personal Identification: Greetings, names, ages, birthdays, and favorite things (music, classes, food).\nGrammar Fundamentals:\nPresent tense of ser and estar.\nConjugation of regular -ar, -er, and -ir verbs.\nThe verb gustar for expressing preferences.\nQuestion formation and interrogative words (Who, What, Where, How many, etc.).Possessive adjectives and expressions with tener.\nDescriptive Language: Physical and personality adjectives.", "skills": "Interpersonal Communication: Asking and answering personal questions about oneself and others.\nOral Proficiency: Presenting information about a famous Hispanic person from memory using descriptive adjectives and possessives.\nListening Comprehension: Completing workbook activities based on audio and video prompts (e.g., Amigos de todas partes).\nGrammatical Application: Correctly conjugating verbs and using prepositions of location to describe the environment.", "materials": "Textbook/Workbook: Pages 4–75 (including vocabulary lists, grammar explanations, and listening exercises).\nMultimedia: \"Amigos de todas partes\" video series; class slides with interactive activities; various online grammar exercises (Spanish Learning Lab, Wordwall, ProfeDeEle).\nClassroom Tools: Emoticon-based story writing activities and physical diagrams for ser vs. estar.", "assessments": "Examen 1: Covers basic vocabulary, the verb hay, ser, telling time, -ar verbs, and gustar.\nExamen 2: Covers family vocabulary, descriptive adjectives, possessive adjectives, -er/-ir verbs, and expressions with tener.\nPresentación Oral 1: A memorized presentation about a famous Hispanic figure, focusing on physical and personality descriptions.\nFormative Checks: Daily questions, listening activities, and Google Slides visual descriptions (\"Está contenta,\" etc.)."}, {"name": "Unit 2"}, {"name": "Unit 4 - El fin de semana", "timeframe": "Around 4 weeks", "concepts": "Vocabulary: Sports and pastimes (deportes y las diversiones).\nThe Verb Ir: Understanding how to express movement (\"to go\") and using \"Ir + a + infinitive\" to express future plans.\nStem-Changing Verbs: Understanding \"Boot Verbs\" with spelling changes in the stem (e→ie, o→ue, e→i).\nIrregular \"Yo\" Verbs: Learning verbs that have a unique form only in the first-person singular (e.g., \"Yo-go\" verbs like poner, salir, hacer)", "skills": "Conjugation: Correctly conjugating stem-changing verbs (e.g., almorzar, preferir, dormir).\nFuture Expression: Communicating upcoming activities using the Ir + a construction.\nReading/Writing: Answering personal questions about weekend activities, sports preferences, and daily routines.\nListening: Comprehension exercises based on textbook pages 251, 252, and 253", "materials": "Textbook: Aventuras (specifically pages 84-103).\nActivity Manual: Cuaderno de actividades (page 175).\nDigital Tools: Quizlet for vocabulary and verb practice.\nMedia: Instructional videos", "assessments": "Unit 4 Exam: Scheduled for December 5th, covering vocabulary, the verb ir, stem-changers, and irregular \"yo\" forms.\nFormative Practice: Written practice for \"Boot Verbs\" and \"Yo-go\" verbs.\nOral/Written Response: Students answer questions about their personal schedules and hobbies (e.g., \"¿A qué hora sales de la escuela?\" or \"¿Qué prefieres, ir a la playa o esquiar?\")."}, {"name": "Unit 3"}, {"name": "Unit 5 - Las vacaciones", "timeframe": "Around 4 weeks", "concepts": "Stem-Changing Verbs (e -> i): Learning verbs like pedir, servir, and repetir.\nIrregular \"Yo\" Verbs: Mastery of verbs with irregular first-person singular forms, including hacer, poner, salir, suponer, and traer.\nThe Verb \"Ver\": Specific conjugation and usage of the verb \"to see\".\nThe Verb \"Oír\": Conjugation and the unique \"y\" spelling changes in various forms.", "skills": "Identifying Patterns: Differentiating between e -> ie, o -> ue, and e -> i stem changes.\nAccurate Conjugation: Applying irregular \"go\" endings to the \"yo\" form of specific verbs.\nOral Fluency: Answering questions about daily habits, such as what students bring to class (traer) or what time they leave (salir).\nContextual Application: Using verbs like suponer and oír correctly in conversational Spanish.", "materials": "Textbook: Aventuras (Chapter 4 grammar sections).\nVisual Aids: \"Boot verb\" diagrams and \"Yo-go\" verb charts included in class slides.\nDigital Practice: Quizlet and VHL Central activities.", "assessments": "Cumulative Exam: A major assessment on December 5th covering all Chapter 4 grammar and vocabulary.\nBell Ringers/Warm-ups: Daily conjugation checks and sentence translations (e.g., translating \"I hear music\").\nExit Tickets: Short assessments on specific irregular verbs like oír or salir."}, {"name": "Unit 4"}, {"name": "Unit 6 - De compras", "timeframe": "Around 4 weeks", "concepts": "Vocabulary: Clothing (la ropa) and shopping-related terminology.\nNumbers: Mastery of numbers 101 and higher.\nGrammar - Preterite Tense: Formation and use of the preterite tense for regular verbs.\nGrammar - Pronouns: Understanding and using Indirect Object Pronouns.\nGrammar - Demonstratives: Using demonstrative adjectives and pronouns (e.g., this, that, these, those).", "skills": "Listening Comprehension: Completing workbook activities based on audio prompts (pages 263-268).\nConjugation: Correctly conjugating regular and some irregular verbs (e.g., leer, buscar, ser, ir) in the preterite tense.\nSentence Construction: Building sentences using indirect object pronouns and demonstratives to describe shopping scenarios.\nQuantitative Literacy: Identifying and stating large numbers and populations in Spanish.", "materials": "Textbook: Aventuras (specifically pages 140–162).\nWorkbook: Practice pages 179 and 263–268.\nDigital Tools: Quizlet Flashcards for Vocabulary.\nPractice Sheets: Paquete de práctica and digital practice links for demonstratives and preterite verbs.", "assessments": "Unit 6 Exam (Examen Unidad 6): Covering vocabulary, numbers 101+, preterite tense, indirect object pronouns, and demonstratives.\nFormative Checks: Listening activities and workbook exercises used to gauge progress throughout the unit."}, {"name": "Unit 5"}, {"name": "Unit 7 - La rutina diaria", "timeframe": "March - april", "concepts": "Vocabulary: Daily routines, personal hygiene items, and time expressions.\nGrammar - Reflexive Verbs: Understanding and using reflexive pronouns and verbs (e.g., lavarse, despertarse) to describe personal care.\nGrammar - Stem-Changing Verbs: Review and application of stem-changing reflexive verbs.\nGrammar - Negative & Affirmative Words: Using words like alguien/nadie, algo/nada, and siempre/nunca.", "skills": "Sequence Narration: Using transition words (e.g., primero, luego, d
