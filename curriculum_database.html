core essence of a bond versus the state of life and death.", "skills": "Reading: Analyzing advanced poetry using context-specific, monolingual footnotes to foster direct-language immersion.\n Speaking: Debating author background and text themes spontaneously via Expresión personal prompts to connect literary loss to student experiences.\nListening: Discerning narrative tones, poetry cadences, and thematic lecture nuances (conferencias) using core audio program resources.\nWriting: Formulating structured comparative or creative pieces (Composición dirigida) that demand precise command of advanced past timelines and verbs of essence/state.", "materials": "Textbook: Encuentros maravillosos (chapter 2).\nAudio: Downloadable MP3 audio lectures (conferencias) and poetry readings.\nFormative Assessments:", "assessments": "Formative Assessments:\nReading & Vocabulary: Meaning-based Preguntas de comprensión tracking the poem's thematic tone and active vocabulary.\nSpeaking: Paired peer check-ins discussing personal perspectives on mortality and nature using target structures.\nGrammar: Contextual grammar checkpoints focused on accurate Preterite vs. Imperfect switches and Ser vs. Estar distinctions within the text.\nSummative Assessments:\nUnit Exam: A formal test from the Encuentros maravillosos materials (assessing poetic textual analysis, audio lecture comprehension, and grammar mechanics).\nWriting Portfolio: A Composición dirigida (guided written commentary or reflective essay) evaluating control over perfect past tenses and status/essence verbs."}, {"name": "Unit 3"}, {"name": "Unit 3: Reality and Perception", "timeframe": "4 weeks", "concepts": "Thematic Springboard: Julio Cortázar’s short story “Viajes” exploring human archetypes, social classifications, and differing viewpoints of reality.\nLiterary Meaning: Analyzing Cortázar’s use of absurdist humor, satire, and the creation of distinct character categories (famas, cronopios, esperanzas) to critique modern social behaviors.\nGrammar & Syntax Structure: The role of reflexive verbs in indicating internal, behavioral, or emotional changes in a character.\nThe strategic use of combined direct and indirect object pronouns to streamline narrative flow and avoid redundancy.\nThe application of verbs like gustar, faltar, importar, and parecer to express subjective perceptions, missing elements, and personal values.", "skills": "Reading: Deciphering satirical prose and allegorical text using context-specific, monolingual footnotes to ensure direct-language immersion.\nSpeaking: Classifying human personalities and debating travel styles spontaneously via Expresión personal prompts to connect Cortázar’s text to real life.\nListening: Following the humor, pacing, and nuances of the narrative along with thematic background lectures (conferencias) using core audio resources.\nWriting: Drafting original classifications or analytical responses (Composición dirigida) requiring precise control of pronoun placement and verbs of subjective perception.", "materials": "Textbook: Encuentros maravillosos (Cortázar chapter).\nAudio: Downloadable MP3 audio lectures (conferencias) discussing the Latin American Boom and magical realism.", "assessments": "Standard Formative Assessments Framework: \nReading & Vocabulary: Meaning-based Preguntas de comprensión checking for textual comprehension and active vocabulary usage without mechanical regurgitation.\nSpeaking: Spontaneous Expresión personal class debates and paired \ncommunication tasks (Expresándonos) connecting the literary themes directly to real life.\nListening: Periodic check-ins tracking comprehension of audio text readings and thematic background lectures (conferencias).\nGrammar: Contextual syntax checkpoints evaluating accuracy and functional shifts of the targeted grammar topics within literary summaries and plot analysis.\nSummative Assessments:\nWriting Portfolio: A Composición dirigida (guided essay or creative classification of modern archetypes) checking for mastery of pronouns and verbs of perception.\nUnit Test from the new textbook."}, {"name": "Unit 4"}, {"name": "Las reacciones a las expectativas de los padres (Parental Expectations and Reactions)", "timeframe": "3-4 weeks", "concepts": "Theme: Exploring parental expectations, familial dynamics, and generational relationships/reactions.\nLiterary/Cultural Context: Includes analysis of figures/works such as Miguel de Unamuno and thematic case studies (e.g., family structures, rebellion, and parental advice such as \"don Victorino\").\nGrammar Concept (The Spanish Subjunctive Mood):\nIntroduction to the subjunctive mode vs. the indicative mood (subjective/hypothetical vs. factual/certainty).\nUnderstanding the 2-part sentence structure: Main Clause + Subordinate Clause connected by que (requiring a change of subject).\nKey triggers for the subjunctive mood:\nCause or Prevention (volition, requests, rules, prohibitions).\nPersonal Bias or Emotion (feelings, likes/dislikes, hopes).\nFalseness or Unreality (doubt, denial, uncertainty vs. truth/indicative).\nConjunctions (The ESCAPA acronym: en caso de que, sin que, con tal de que, antes de que, para que, a menos que).", "skills": "Grammar Conjugation & Mechanics: Applying the 3-step process to form the present subjunctive (Yo form $\\rightarrow$ drop the \"-o\" $\\rightarrow$ add opposite endings).\nHandling Irregulars: Navigating spelling changes (-car/-gar/-zar), stem-changing verbs (-ar/-er and specialized -ir shifts in the nosotros/vosotros forms), and master irregulars using the DISHES acronym (Dar, Ir, Ser, Haber, Estar, Saber).\nWritten Expression & Advice Formulation: Formulating recommendations, suggestions, and commands using verbs of volition/influence to address real-world and situational dilemmas (e.g., family conflict, school rules, health issues).\nTranslation: Translating complex conditional and subjective statements between English and Spanish.", "materials": "Text/Reference: Course packet text from \"Página 75\" focusing on parental expectations.\nPractice Material: Unit 4 Practice Packet (Paquete de práctica).\nGrammar Frameworks: Visual guides and memory devices for the subjunctive mood (DISHES and ESCAPA acronyms).", "assessments": "Formative Writing Quiz: In-class writing assessment based on a pre-prepared theme. (Length: 200 words; graded via a specific Rubric).\nTranslation & Application Activities: Written notebook prompts directing students to express personal desires, restrictions, or administrative critiques using appropriate mood structures.\nUnit Examination: Comprehensive unit exam evaluating vocabulary, structural concepts of the subjunctive, and contextual readings."}, {"name": "Unit 5"}, {"name": "Lección 5: Las experiencias que nos definen", "timeframe": "March - April", "concepts": "Thematic Focus: How personal and historical experiences define identity.\nHistorical/Cultural Context: The Spanish Civil War, Francisco Franco, and connections to literature and cinema (e.g., Ana María Matute and El laberinto del fauno / Pan's Labyrinth).\nGrammar Concepts:\nFormation and usage of the Future Tense (regular and irregular verbs), including expressing speculation, probability, and suppositions.\nFormation and usage of the Future Perfect Tense (compound tenses).\nFormation and usage of the Conditional and Conditional Perfect Tenses.\nSyntax and application of the Accidental \"Se\" combined with indirect object pronouns to express unexpected or accidental events.", "skills": "Analyzing and discussing the socio-political impacts of the Spanish Civil War on literature and film.\nConducting comparative writing and analyzing content using target evaluation rubrics.\nSpeculating about present and future actions using advanced tense variations.\nCorrectly attributing or deflecting blame in spoken/written Spanish using the accidental \"Se\" construction.", "materials": "Core Text/Resource: Chapter 5 textbook materials (Pages 93, 95, 96, 99, 103, 105, 108, 111-113).\nMultimedia/Cinema: El laberinto del fauno (Pan's Labyrinth) cinematic resources and associated video comprehension activities.\nDigital Practice Platforms: Wordwall grammar modules and Gimkit interactive review sessions.", "assessments": "Formative Assessments:\nVideo comprehension activities\nComparative writing drafts\nStructural grammar packets (Accidental \"Se\", Future/Conditional Perfect choice tasks)\nSummative Assessment:\nUnit 5 Exam (Comprehensive evaluation covering vocabulary, Future, Future Perfect, Conditional, Conditional Perfect, and Accidental \"Se\")."}, {"name": "Unit 6"}, {"name": "Lo real, lo irreal y lo absurdo", "timeframe": "4 weeks", "concepts": "Literary Themes: Exploring Realism, Magical Realism, and the borders between the real, the unreal, and the absurd in Spanish-language literature.\nCore Texts & Content:\nGabriel García Márquez’s \"La peste del insomnio\" (Cien años de soledad) and its structural representations of memory, isolation, and shared reality.\nComparative analysis involving magical/surreal elements across various authors: Jorge Luis Borges (“El otro”), Julio Cortázar (“Historia de Cronopios y famas”), and cinema via Guillermo del Toro (“El laberinto del fauno”).\nGrammar Concepts:\nThe Past (Imperfect) Subjunctive: Formations, uses in dependent past-tense clauses, expressing uncertainty/desires, and polite requests (quisiera).\nConditional Sentences (Cláusulas con si): Distinguishing between \"real\" (indicative) and \"contrary-to-fact/unreal\" conditions (past subjunctive + conditional).\nThe Pluperfect Subjunctive (Pluscuamperfecto del subjuntivo): Formed with hubiera + past participle to express doubt, possibility, or counterfactual scenarios about past actions.\nIdiomatic expressions requiring the subjunctive, specifically como si (as if) and ojalá (que).", "skills": "Comparative Analysis: Analyzing and comparing how elements of the absurd and magical realism function across text types (essays, short stories, and cinema).\nAdvanced Grammatical Precision: Utilizing the past subjunctive and pluperfect subjunctive accurately in complex sentences to discuss hypothetical realities, opinions, and historical textual interpretations.\nCreative Responding: Writing narrative adaptations and generating dialogic scripts mimicking the unique thematic and creative styles of iconic magical realist authors.", "materials": "Main Slide Deck: Capítulo 6. Lo real, lo irreal y lo absurdo\n\nLiterary Readings:\n\"La peste del insomnio\" excerpt from Cien años de soledad (Gabriel García Márquez)\n“El otro” (Jorge Luis Borges)\n“Historia de Cronopios y famas” (Julio Cortázar)\nMedia/Film:\nCien años de soledad adaptation series (Netflix, Chapter 3)\n“El laberinto del fauno” film (Guillermo del Toro)\nTextbook Resources: Textbook pages 135-137 (including Activity A: “La soledad”)", "assessments": "Creative Writing & Expression Interventions:\nSignage Activity: Students author descriptive signs mirroring José Arcadio Buendía's labels during the insomnia plague to identify an object's core quality.\nCollaborative Dialogue: Group task preparing a spoken dialogue simulating a life with permanent insomnia.\nSummative Essay (Comparative Composition): A formal comparative essay (250–300 words) contrasting thematic details from La peste del insomnio with either El otro, Historia de Cronopios y famas, or El laberinto del fauno.\nFormative Grammar & Vocabulary Checkpoints: Written transformations focusing on cláusulas con si, the past subjunctive, and translation exercises handling hypothetical past results."}, {"name": "Unit 7"}, {"name": "Capítulo 7: Los conflictos entre generaciones (Generation Conflicts).", "timeframe": "3 - 4 weeks", "concepts": "Generational and Cultural Conflicts: Examining family traditions, boundaries, and expectations that impose limitations on individuals (anchored in the study of Laura Esquivel’s work).\nLiterary Movements: Introduction to Realismo mágico (Magical Realism)—the blending of fantastical, unusual, or hyperbolic elements within a realistic poverty/everyday context, and how time functions non-linearly.\nHistorical & Cultural Context: Exploration of the U.S.–Mexico border (historical vs. modern dynamics of crossing between Texas and Mexico) and cultural traditions like La rosca de reyes.", "skills": "Grammar & Language Application: Mastering full command structures in Spanish, including Formal (Usted/Ustedes), Familiar (Tú - affirmative and irregulars), Vosotros/as, and Indirect (Que + subjunctive) commands, alongside correct pronoun placement and written accentuation.\nMedia & Literary Analysis: Extracting thematic significance from film and reading excerpts (Como agua para chocolate), taking structured notes on historical biographies, and participating in deep-dive discussions on hyperbole and thematic symbolism.\nStructured Writing: Developing a formal multi-paragraph text via a structured essay workshop format (Título, Introducción, Descripción, Profundización, Conclusión).", "materials": "Literature & Film: Como agua para chocolate (novel fragments by Laura Esquivel and its film adaptation).\nBiographical Media: Documentary/video covering the life and background of Laura Esquivel.\nGrammar Resources: Vista Higher Learning instructional units on Spanish command forms (mandatos).", "assessments": "Formative Assessments: Vocabulary homework, reading comprehension reflections, and an in-class analytical writing workshop (Taller de escritura).\nSummative Assessment: Unit Final Project (Proyecto final de la unidad) with an accompanying grading rubric, due on June 1st (featuring interactive cultural elements, such as student presentations on traditional regional recipes)."}]}, {"name": "Spanish 5", "department": "Modern Languages - Spanish", "teacher": "Amparo Baron, Diana Arboleda", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Las relaciones personales", "timeframe": "4 weeks", "concepts": "Overarching theme: Personal relationships (Las relaciones personales).\nCultural / Demographic reading: \"El español en Estados Unidos\" (Spanish in the US) and \"Corriente latina\".\nLiterary/Media Analysis: Short film (cortometraje) titled \"Café para llevar\".\nGrammar Structures:\nThe Present Tense (El presente): Regular verbs, stem-changing verbs (e:ie, o:ue, e:i), irregular yo forms (e.g., -go, -zco, -jo), verbs with prefixes, and fully irregular verbs (dar, decir, estar, ir, oír, ser, tener, venir).\nSer vs. Estar: Permanent inherent qualities vs. temporary states/conditions; adjectives that change meaning depending on the verb used.\nGustar and similar verbs: Indirect object pronoun constructions and verbs like aburrir, doler, encantar, faltar, fascinar, importar, interesar, molestar, preocupar, quedar, etc.", "skills": "Media comprehension and image analysis.\nWriting critical film reviews (reseña) expressing personal opinions within length guidelines (~100 words).\nReading comprehension of contemporary text regarding Hispanic influence in the United States.\nMastery and contextual application of present tense conjugations, distinctions between ser/estar, and utilizing passive-style structures with gustar", "materials": "Core Textbook: Imagina\n\nDigital Platforms: VHL Central & Quizlet Class Link\n\nShort Film: Café para llevar", "assessments": "Formative/Homework: 100-word film review essay; Textbook practice activities (e.g., Page 29, Exercise 5).\nQuiz: Assessing regular/irregular present tense verbs (Textbook pp. 18-21) and Ser vs. Estar (Textbook pp. 22-25)."}, {"name": "Unit 2"}, {"name": "Vivir en la ciudad (Living in the city)", "timeframe": "4 weeks", "concepts": "Vocabulary: City life, urban environments, and related actions.\nGrammar (Past Tenses):\nThe Preterite Tense (El pretérito): Used to describe actions or states that began or were completed at a definite time in the past. Includes regular forms, spelling changes ( verbs ending in -car, -gar, -zar), changes from -i- to -y- (caer, leer, oír), stem-changing -ir verbs, and irregular stems (e.g., andar, estar, poder, poner, saber, tener, hacer, querer, venir, conducir, decir, traer, ser, ir, dar, ver).\nThe Imperfect Tense (El imperfecto): Used to narrate past events without focusing on their beginning, end, or completion (habitual/repeated actions, ongoing actions, mental/physical/emotional states, and telling time in the past). Includes regular forms and the irregular verbs ir, ser, and ver.\nPreterite vs. Imperfect Contrast: Understanding how they work together during narration (imperfect provides background information/what was happening, while the preterite interrupts or advances the plot with specific events).\nMeaning Changes in the Past: How specific verbs alter meanings when used in the preterite versus the imperfect (e.g., querer, poder, saber, conocer).", "skills": "Speaking & Conversation: Engaging in an evenly balanced, 1-minute partner conversation in Spanish (\"Shadowing\") and presenting it in front of the class.\nReading & Textual Analysis: Reading, understanding, and pulling unfamiliar vocabulary from target cultural/literary texts.\nListening & Interpretation: Completing listening practice and subsequent interpretive activities.\nWritten Narration: Utilizing past tenses chronologically alongside transitional words (e.g., primero, entonces, luego, de repente) to build cohesive stories.", "materials": "Textbook/Curriculum Pages: Vista Higher Learning (VHL) Contexts / Pages 40, 52, 53–54, 56, 60, 64, 68.\nShort Film: Cortometraje ¡Adiós mamá!\n\nCultural Readings: Articles comparing the subway systems of Mexico City (\"El metro del DF\") and New York City (\"NYC\").\nDigital Resources:\nQuizlet Flashcards for Unit 2 Vocabulary\nOnline grammar practices via Profe de ELE\nListening activities hosted on vhlcentral", "assessments": "Textbook text comprehension exercises and vocabulary activities (e.g., Pages 54 and 49).\nVHL Central audio/listening comprehension checks.\nPerformance/Summative Assessments:\nOral Presentation: 1-minute balanced pair-dialogue presentation in class (\"Shadowing 4\").\nGrammar/Writing Application: Multi-tiered grammar application packets comparing the usage of Preterite vs. Imperfect in narrative contexts."}, {"name": "Unit 3"}, {"name": "Los medios de comunicación (Media and communication)", "timeframe": "4 weeks", "concepts": "Vocabulary: Media types, press, broadcasting, television, movies, and modern digital communication.\nGrammar & Structural Concepts:\nThe Subjunctive Mood (El subjuntivo): Introduction to its concepts and usage as a mood rather than a tense.\nPresent Subjunctive Formation: Regular verbs, verbs with spelling changes (e.g., -car, -gar, -zar), stem-changing verbs (including -ar / -er and specific -ir alterations and verbs with irregular yo forms.\nIrregular Subjunctive Verbs: Mastery of the highly irregular verbs: dar, estar, ir, saber, ser, haber.\nSubjunctive of Will/Influence (Subjuntivo con verbos de voluntad e influencia): Applying the subjunctive in subordinate clauses when the main clause expresses a wish, command, request, or suggestion (e.g., querer, sugerir, prohibir, aconsejar).\nClause Mechanics: Understanding the strict requirement of two different subjects and the connecting conjunction \"que\" to trigger the subjunctive.", "skills": "Media & Digital Literacy: Evaluating news headlines, comparing coverage across international media, and discussing current events in Spanish.\nPresentational Speaking: Planning, structuring, and delivering a formal 3-minute group presentation (\"El Noticiero\" / The News Broadcast) in front of an audience using clear narration and proper grammar.\nCollaborative Scriptwriting: Co-writing a broadcast script using formal transitions, journalistic vocabulary, and subjunctive expressions of influence.\nInterpretive Reading & Listening: Analyzing authentic short films and written articles to extract main ideas and unique regional vocabulary.", "materials": "Textbook/Curriculum Pages: Vista Higher Learning (VHL) Contexts / Pages 74, 82, 86, 88, 92, 94.\nShort Film: Cortometraje Encrucijada.\nDigital Resources & Practice Platforms:\nQuizlet Flashcards for Unit 3 Media Vocabulary.\nIntegrated grammar practices via Profe de ELE.\nInteractive listening exercises and auto-graded assessments on vhlcentral.\nProject Rubrics: \"El Noticiero\" Group Presentation Prompt and Rubric.", "assessments": "Formative Assessments:\nText-based reading comprehension exercises (e.g., Page 82 and 94 activities).\nOngoing digital checks on vhlcentral for subjunctive verb conjugation and sentence structures.\nGroup script drafts and peer feedback sessions for the news broadcast.\nPerformance/Summative Assessments:\n\"El Noticiero\" Project: A 3-minute oral news broadcast presentation graded on fluency, collaborative engagement, and accurate usage of target vocabulary and the subjunctive mood.\nUnit Grammar Application: Written evaluation focusing on the mechanics and application of the Present Subjunctive under verbs of will and influence."}, {"name": "Unit 4"}, {"name": "Unit 4: Generaciones en movimiento (Generations in Motion)", "timeframe": "4 to 5 weeks", "concepts": "Magical Realism (Realism Mágico): Understanding the narrative blending of extraordinary/fantastic events within realistic settings, often reflecting on societal or historical struggles.\nCultural Traditions & Generational Shifting: Analyzing societal traditions, family expectations, and \"unjust traditions\" over generations (explored through the film Como agua para chocolate).\nGeopolitical Boundaries: Discussing the concepts of borders (la frontera), specifically the social dynamic and changing realities of crossing between Texas and Mexico.\nHispanic Cultural Celebrations: Recognizing historical and seasonal traditions, specifically the significance of La rosca de reyes.\nProminent Cultural Figures: Introduction to major historical and literary figures, specifically Supreme Court Justice Sonia Sotomayor and Nicaraguan author/activist Gioconda Belli.", "skills": "Master the use of the Subjunctive Mood in Adjective Clauses to describe uncertain, non-existent, or hypothetical antecedents.\nDifferentiate meaning and use cases between Reflexive vs. Non-Reflexive Verbs, and recognize reciprocal actions or verbs that change meaning when used reflexively.\nMastery over the distinct linguistic use cases of Por vs. Para (destination, deadline, motive, exchange, etc.).\nAnalytical Reading & Discussion: Formulating textual predictions, drawing from prior knowledge, and actively engaging in deeper discussion regarding literary fragments and film themes.\nStructured Composition: Drafting multi-paragraph essays utilizing a strict layout framework: Title, Introduction, Description, Deep Dive/In-depth Analysis (Profundización), and Conclusion", "materials": "Core Textbook/Platform: Vistas Higher Learning (vhlcentral.com) for listening exercises, structural grammar layouts, and video modules.\nVocabulary Tool: Quizlet (Unit 4 Vocabulary).\nFilm Study: Como agua para chocolate (Like Water for Chocolate).\nLiterary/Reading Texts:\nSelected reading fragments and discussion guides.\nBiographies/Texts focusing on Sonia Sotomayor and Gioconda Belli.", "assessments": "Writing Workshop (Taller de escritura): An in-class essay prepared at home and executed in the classroom following the structural criteria (Intro, Description, Analysis, Conclusion).\nUnit Exam: Comprehensive test checking mastery over the target structural grammar (Subjunctive in adjective clauses, Reflexive verbs, and Por vs. Para)."}, {"name": "Unit 5"}, {"name": "Las riquezas naturales (Natural resources)  (Baron)", "timeframe": "4 to 5 weeks", "concepts": "This unit explores the relationship between humans and the natural world, focusing on ecology, biodiversity, natural phenomena, and environmental awareness in the Spanish-speaking world. Students will develop interpretive, interpersonal, and presentational communication skills through cultural readings, film analysis, poetry, and discussions about sustainability and conservation.\nThematic Vocabulary: Nature and landscapes, animals and endangered species, ecology and environmental conservation, natural resources, biodiversity, climate and weather, natural phenomena and disasters, ecosystems and the Amazon rainforest, medicinal plants and indigenous communities, environmental problems and sustainability, recycling and pollution, as well as expressions commonly used to discuss the protection of the planet and environmental responsibility. \nCultural Competence: Students will explore the environmental diversity and natural richness of the Spanish-speaking world through the study of the Amazon rainforest, tropical ecosystems, biodiversity, and indigenous traditions connected to nature and medicinal plants. They will examine how different Hispanic communities interact with and protect their natural environments while analyzing environmental challenges such as deforestation, climate change, pollution, and endangered species. \nCultural Context: Colombia, Ecuador, and Venezuela.\nCreators/Figures: Gustavo Dudamel, Marisol Escobar, Oswaldo Guayasamín, and Shakira.\nScience/Environment: The Amazon rainforest (biodiversidad curativa) and medicinal plants.\nLiterature: Poetry by Jaime Sabines (La Luna).\nMedia Literacy: Analyzing the short film Eclipse and the Flash Culture segment on tropical forests.", "skills": "Grammar:\nFuture & Conditional: Expressing predictions, possibilities, and hypothetical situations related to environmental issues and conservation efforts \nRelative pronouns: To connect and expand ideas about nature and ecology, as well as the neuter “lo” to express abstract concepts and opinions \nLinguistic Nuance: Distinguishing between “qué” and “cuál” in questions and \ndiscussions related to environmental topics and natural phenomena.\nOther key skills: \nEnvironmental Analysis & Discussion: Examining ecological issues, biodiversity, climate change, and conservation efforts while engaging in discussions about environmental responsibility and sustainability.\nInterpretive Reading & Viewing: Analyzing authentic cultural materials such as poems, documentaries, articles, and short films related to nature and the environment.\nComparative Cultural Analysis: Comparing environmental challenges, ecosystems, and conservation practices in the Spanish-speaking world and the United States.\nOral Communication & Debate: Expressing opinions, predictions, recommendations, and solutions regarding environmental and ecological concerns through discussions and debates.\nListening Comprehension & Cultural Interpretation: Strengthening listening skills through authentic audio and audiovisual materials while interpreting cultural perspectives related to nature and ecology.\n• Structured Composition: Drafting analytical and persuasive multi-paragraph essays discussing environmental issues, human impact on nature, and possible ecological \nsolutions following a clear organizational structure.\n\nReading: La selva amazónica: biodiversidad curativa and poetry by Jaime Sabines.", "materials": "Textbook: Imagina supported by the online platform VHL.\nVocabulary Tool: Quizlet (Unit 5 Vocabulary).\nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.", "assessments": "Writing component: An in-class essay prepared at home and written in the classroom following the structural criteria (Introduction, Environmental Problem Description, Analysis, Proposed Solutions, Conclusion).\nUnit Exam: Comprehensive test evaluating mastery of the target grammar structures (Future tense, Conditional tense, Relative pronouns, Qué vs. Cuál, and the neuter Lo), as well as thematic vocabulary related to ecology, biodiversity, and environmental conservation.                  \nOral Presentation: Students will deliver an individual or group presentation analyzing an environmental issue, endangered species, ecosystem, or conservation effort in a Spanish-speaking country.\nInterpretive Assessment: Reading and listening comprehension activities based on authentic cultural materials such as documentaries, poems, articles, and short films related to nature and environmental awareness.\nClass Discussions and Debates: Students will participate in interpersonal speaking activities discussing sustainability, climate change, pollution, and human responsibility toward the environment.\n\nUnit Project:Cultural comparison project analyzing environmental policies and conservation efforts in a Hispanic country and the United States."}, {"name": "Unit 6"}, {"name": "El valor de las ideas (The value of ideas)", "timeframe": "4 weeks", "concepts": "This unit explores the power of beliefs, ideologies, human rights, politics, and social justice in the Spanish-speaking world. Students will examine how ideas influence societies, governments, and individual freedoms while developing advanced communication skills through authentic cultural materials, film, literature, and historical analysis. \nThematic Vocabulary: Beliefs and ideologies, laws and human rights, politics and government, social justice, protests and civic participation, dictatorship and democracy, security and threats, equality and freedom, crime and public safety, emotions and opinions related to political and social issues, and expressions commonly used to discuss rights, responsibilities, justice, and social change.\nCultural Competence: Students will explore the political and social history of the Spanish-speaking world through the study of democracy, dictatorship, human rights, and civic activism in countries such as Chile, Argentina, and Puerto Rico. They will analyze the impact of political ideologies, social movements, and historical conflicts on communities and national identities.\nCultural Context: Chile, Argentina, and Puerto Rico.\nCreators/Figures: Isabel Allende, Miguel Littín, Roberto Mata, and Violeta Parra.\nLiterature: Caso Gaspar by JElsa Bornemann.\nMedia Literacy: Analyzing the short film Justo and the Flash Culture segment on Puerto Rico", "skills": "Grammar:\nSubjunctive & Past Subjunctive: Expressing doubt, emotion, recommendations, uncertainty, and hypothetical situations related to political, ethical, and social issues.\nComparatives and superlatives: To analyze political systems, social conditions, and historical events.\nLinguistic Nuance: Using adverbs, diminutives, and augmentatives to add precision, emphasis, tone, and emotional nuance in oral and written communication.\nOther key skills: \nPolitical & Social Analysis: Examining ideologies, human rights, political systems, and social justice issues while engaging in critical discussions about democracy, dictatorship, and civic responsibility.\nInterpretive Reading & Discussion: Analyzing literary fragments, historical texts, films, songs, and authentic cultural materials related to political conflict, justice, freedom, and social change.\nComparative Cultural Analysis: Comparing political, historical, and social realities in the Spanish-speaking world and the United States through discussion and written analysis.\nOral Communication & Debate: Expressing opinions, arguments, doubts, recommendations, and hypothetical situations related to political and ethical issues through formal discussions and debates.\nResearch & Multimedia Presentation: Developing and presenting research projects about historical events, social movements, political leaders, or human rights issues using visual and digital resources.\nListening Comprehension & Cultural Interpretation: Strengthening listening skills through authentic interviews, documentaries, speeches, and audiovisual materials while interpreting diverse cultural and political perspectives.\nStructured Composition: Drafting analytical and argumentative multi-paragraph essays exploring political ideologies, justice, social conflict, and historical memory following a clear organizational structure.\nReading: Chile: dictadura y democracia y Caso Gaspar", "materials": "Textbook: Imagina supported by the online platform VHL.\nVocabulary Tool: Quizlet (Unit 6 Vocabulary).\nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.", "assessments": "Writing component: An in-class analytical essay prepared at home and written in the classroom following the structural criteria (Introduction, Historical/Social Context, Analysis, Interpretation, Conclusion).\nUnit Exam: Comprehensive test evaluating mastery of the target grammar structures (Subjunctive in adverbial clauses, Past subjunctive, Comparatives and superlatives, Adverbs, Diminutives and augmentatives), as well as thematic vocabulary related to politics, human rights, and social justice.\nInterpretive Assessment: Reading and listening comprehension activities based on authentic articles, songs, films, interviews, and literary texts related to democracy, dictatorship, and civic responsibility.\nUnit project: Students will deliver an individual or group presentation analyzing a political, social, or historical issue in a Spanish-speaking country."}, {"name": "Unit 7"}, {"name": "Perspectivas laborales (Career prospects)", "timeframe": "3-4 weeks", "concepts": "This unit explores the world of work, economics, labor perspectives, and financial responsibility in the Spanish-speaking world. Students will analyze how employment, economic systems, and professional opportunities shape societies and individuals while developing advanced communication skills through authentic cultural materials, film, literature, and social analysis.\n\nThematic Vocabulary: Professions and careers, workplace environments, economics and finances, salaries and employment, interviews and professional communication, labor rights and responsibilities, business and entrepreneurship, unemployment and economic inequality, workplace relationships and teamwork, and expressions commonly used in professional and financial contexts. \nCultural Competence: Students will explore labor systems, economic realities, and professional opportunities in the Spanish-speaking world through the study of Bolivia, Paraguay, indigenous communities, and industries connected to natural resources and hydrocarbons. \nCultural Context: Bolivia and paraguay\nCreators/Figures: Ernesto Cavour Aramayo, Josefina Plá,Augusto Roa Bastos,Graciela Boulanger.\nLiterature: El carretillero by Nila López.\nMedia Literacy: Analyzing the short film La jaula and the Flash Culture segment on Ecuador.", "skills": "Grammar:\nPresent Perfect & Present Perfect Subjunctive: Expressing experiences, completed actions, uncertainty, recommendations, and emotions related to professional and economic situations \nAdvanced Structures: Using impersonal and passive constructions with se to discuss workplace systems, labor practices, and social realities \nLinguistic Nuance: Using past participles as adjectives and time expressions with hacer to add precision and sophistication to oral and written communication \nOther key skills: \nWorkplace & Economic Analysis: Examining labor systems, professional opportunities, economic inequality, and workplace dynamics while engaging in discussions about employment and financial responsibility.\nInterpretive Reading & Discussion: Analyzing literary fragments, interviews, films, and authentic cultural materials related to work, economics, globalization, and social mobility.\nComparative Cultural Analysis: Comparing workplace cultures, labor conditions, and economic realities in the Spanish-speaking world and the United States through discussion and written analysis.\nOral Communication & Debate: Expressing opinions, experiences, recommendations, and professional goals through discussions, simulations, and workplace-related conversations.\nResearch & Multimedia Presentation: Developing and presenting research projects about careers, economic systems, labor challenges, entrepreneurship, or professional opportunities using visual and digital resources.\nListening Comprehension & Cultural Interpretation: Strengthening listening skills through authentic interviews, documentaries, and audiovisual materials while interpreting diverse cultural and economic perspectives.\nStructured Composition: Drafting analytical and reflective multi-paragraph essays exploring work, economic inequality, professional identity, and globalization following a clear organizational structure.\nReading: Recursos naturales: Una salida al mundo y El carretillero", "materials": "Textbook: Imagina supported by the online platform VHL.\nVocabulary Tool: Quizlet (Unit 7 Vocabulary).\nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.", "assessments": "Writing component: An in-class analytical essay prepared at home and written in the classroom following the structural criteria (Introduction, Historical/Social Context, Analysis, Interpretation, Conclusion).\nUnit Exam: Comprehensive test evaluating mastery of the target grammar structures (Present perfect, Present perfect subjunctive, Uses of se, Past participles as adjectives, and Time expressions with hacer).\nInterpretive Assessment: Reading and listening comprehension activities based on authentic articles, interviews, short films, and literary texts related to labor, economics, and globalization.\nUnit project: Students will deliver an individual or group presentation analyzing a profession, labor issue, economic challenge, or workplace system in a Spanish-speaking country."}, {"name": "Unit 8"}, {"name": "Ciencia y Tecnología  (Science and Technology)", "timeframe": "43-4 weeks", "concepts": "This unit explores the impact of science, technology, inventions, and astronomy on society and everyday life in the Spanish-speaking world. Students will analyze scientific advances, ethical dilemmas, technological innovation, and humanity’s relationship with the universe while developing advanced communication skills through authentic cultural materials, film, literature, and critical discussion. \nThematic Vocabulary: Science and technology, inventions and discoveries, computers and electronic devices, artificial intelligence and robotics, the internet and communication, astronomy and the universe, scientific research and experimentation, ethical dilemmas in technology, innovation and productivity, and expressions commonly used to discuss scientific progress and technological advancement.\nCultural Competence: Students will explore scientific and technological innovation in the Spanish-speaking world through the study of inventions, scientific advances, and cultural perspectives on technology in countries such as Peru and Argentina. They will analyze the impact of science and technology on communication, medicine, society, and human relationships while examining ethical questions related to artificial intelligence, cloning, and scientific experimentation.\nCultural Context: Perú and Argentina\nCreators/Figures:Tania Libertad,Claudia Llosa,Los hermanos Santa Cruz,Mario Vargas Llosa.\nLiterature: La intrusa by Pedro Orgambide.\nMedia Literacy: Analyzing the short film El Clon and the Flash Culture segment on Argentina.", "skills": "Grammar:\nPast Perfect & Past Perfect Subjunctive: Expressing actions completed before another action in the past, as well as doubt, uncertainty, and hypothetical situations related to scientific and technological contexts                                                                                                          \nAdvanced Structures: Using infinitive constructions to express purpose, obligation, and sequences of actions in scientific and technological discussions                                        \nLinguistic Nuance: Using prepositions accurately to improve precision and complexity in oral and written communication  (de, desde, en, entre, hasta, and sin).\nOther key skills: \nScientific & Technological Analysis: Examining scientific discoveries, technological innovation, ethical dilemmas, and the impact of technology on society through critical discussion and analysis.\nInterpretive Reading & Discussion: Analyzing literary fragments, articles, films, and authentic cultural materials related to science, inventions, artificial intelligence, and the universe.\nComparative Cultural Analysis: Comparing technological advances, scientific developments, and the social impact of technology in the Spanish-speaking world and the United States through discussion and written analysis.\nOral Communication & Debate: Expressing opinions, predictions, ethical concerns, and hypothetical situations related to science and technology through formal discussions and debates.\nResearch & Multimedia Presentation: Developing and presenting research projects about inventions, scientific discoveries, astronomy, artificial intelligence, or technological innovations using visual and digital resources.\nListening Comprehension & Cultural Interpretation: Strengthening listening skills through authentic interviews, documentaries, podcasts, and audiovisual materials while interpreting scientific and cultural perspectives.\nStructured Composition: Drafting analytical and argumentative multi-paragraph essays exploring scientific innovation, ethics, artificial intelligence, and technological progress following a clear organizational structure.\nReading: Invasión marciana y Delicias peruanas", "materials": "Textbook: Imagina supported by the online platform VHL.\nVocabulary Tool: Quizlet (Unit 8 Vocabulary).\nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.", "assessments": "Writing component: An in-class analytical essay prepared at home and written in the classroom following the structural criteria (Introduction, Scientific/Technological Context, Analysis, Reflection, Conclusion).\nUnit Exam: Comprehensive test evaluating mastery of the target grammar structures (Past perfect, Past perfect subjunctive, Uses of the infinitive, and Prepositions), as well as thematic vocabulary related to science, technology, and innovation.\nInterpretive Assessment: Reading and listening comprehension activities based on authentic articles, interviews, documentaries, short films, and literary texts related to science, technology, and the universe.\nUnit project: Students will deliver an individual or group presentation analyzing a scientific discovery or technological invention and evaluating its positive and negative impact on society."}]}, {"name": "Advance Spanish PensArte", "department": "Modern Languages - Spanish", "teacher": "Amparo Baron", "grade": "", "length": "", "description": "", "competencies": "Advanced Communication Skills: Developing sophisticated speaking, listening, reading, and writing abilities through discussions, presentations, debates, and analytical compositions in Spanish.\nArtistic & Cultural Interpretation: Analyzing literature, film, music, painting, architecture, and other artistic expressions to understand cultural, historical, and social perspectives in the Hispanic world.\nCritical & Analytical Thinking: Interpreting symbolism, themes, historical context, and artistic movements while constructing thoughtful arguments and comparative analyses.\nResearch & Presentation Skills: Conducting independent research, synthesizing information from authentic sources, and delivering structured multimedia and oral presentations.\nInterdisciplinary & Cross-Cultural Understanding: Connecting the arts with history, politics, identity, and society while fostering intercultural awareness and intellectual curiosity.", "units": [{"name": "Unit 1"}, {"name": "Introduction to Art and the Fine Arts -Module 1 Music", "timeframe": "4 -5 weeks", "concepts": "Unit 1 begins with an exploration of the concept of art and the definition of the Fine Arts within the Hispanic world. Students will examine how artistic expression reflects culture, identity, history, and human experience while developing the specialized vocabulary necessary to discuss and analyze artistic works in Spanish. The unit then transitions into Module 1: Music. The module centers on salsa as one of the most influential musical and cultural movements in the Hispanic world, with particular emphasis on its development and impact within Hispanic communities in New York City during the 1960s and 1970s.", "skills": "Musical & Cultural Analysis: Examining the origins, evolution, and cultural significance of salsa music within Hispanic communities in New York City.\nInterpretive Listening & Discussion: Analyzing song lyrics, rhythms, musical structures, and performances while engaging in discussions about identity, migration, and cultural expression.\nHistorical & Social Interpretation: Exploring the relationship between salsa music, Nuyorican identity, social movements, and the Hispanic experience in New York during the 1960s and 1970s.\nOral Communication & Cultural Debate: Expressing opinions and interpretations about music, culture, and artistic influence through discussions, presentations, and debates in Spanish.\nResearch & Multimedia Presentation: Developing and presenting research projects about salsa musicians, orchestras, historical movements, and the cultural impact of salsa using audiovisual and digital resources.\nListening Comprehension & Musical Interpretation: Strengthening listening skills through authentic salsa songs, interviews, documentaries, and live performances while interpreting artistic and cultural themes.", "materials": "Hacia una definición de arte — El Malpensante\nSalsa Rising by Juan Flores\nAuthentic music and cultural articles related to the salsa movement, Nuyorican identity, and Hispanic culture in New York City.\nGuest lecture and conference by Bobby Sanabria on the history, cultural significance, and social impact of salsa music in New York City.\nAttendance of the musical Buena Vista Social Club as part of the cultural and artistic exploration of Latin American music and its historical influence on Hispanic identity and musical traditions.", "assessments": "In-Class Analytical Writing: Students wrote analytical paragraphs and short essays based on authentic audio materials, interviews, documentaries, and lectures related to the history and cultural development of salsa music in New York City.\nOral Presentations: Students delivered individual and group presentations analyzing a salsa artist, orchestra, historical movement, or the influence of salsa music on Hispanic culture in New York City.\nInterpretive Listening Assessments: Listening comprehension activities based on authentic salsa songs, documentaries, musical analyses, and the conference by Bobby Sanabria.\nFinal Written Reflection: Students wrote a reflective analytical in-class essay examining the social, historical, and cultural impact of the salsa movement within Hispanic communities and Nuyorican identity.\nParticipation in the Celebration of Hispanic Heritage Month: Students actively participated in the celebration of Hispanic Heritage Month and the salsa movement by presenting their final projects orally before upper school classes and reflecting on their learning throughout the Music Module, specifically the study of salsa as a cultural and artistic movement."}, {"name": "Unit 2"}, {"name": "Module 2: Painting", "timeframe": "4-5weeks", "concepts": "Module 2 explored painting as one of the principal Fine Arts, with particular emphasis on the Mexican Muralist Movement and the role of women painters within the artistic and social transformations of the twentieth century. Students examined how muralism emerged after the Mexican Revolution as a public and educational art form intended to represent national identity, social justice, indigenous heritage, labor, and political struggle.\nSpecial attention was given to the contributions of women muralists such as Aurora Reyes, Helena Huerta, Fanny Rabel, and María Izquierdo, whose work challenged traditional artistic spaces and expanded the visual language of muralism and modern Mexican art.\nThe module also explored connections between Mexican muralism, surrealism in Spain, and modern Latin American painting through the study of women surrealist artists such as Remedios Varo, Leonora Carrington, and Maruja Mallo. Students interpreted symbolism, color, composition, artistic techniques, and historical context while developing specialized artistic vocabulary in Spanish. Through visual analysis, museum experiences, discussions, written reflections, and oral presentations, students strengthened their interpretive, interpersonal, and presentational communication skills while examining how art served as both cultural expression and social critique.", "skills": "Visual & Artistic Analysis: Examining murals, paintings, symbolism, composition, color, and artistic techniques within Mexican muralism and modern Latin American art.\nInterpretive Viewing & Discussion: Analyzing visual artworks, museum materials, and artistic movements while engaging in discussions about identity, revolution, gender, and social justice.\nHistorical & Cultural Interpretation: Exploring the relationship between art, the Mexican Revolution, indigenous heritage, political movements, and national identity.\nComparative Artistic Analysis: Comparing muralism, surrealism, and modern Latin American painting through critical observation and written interpretation.\nOral Communication & Artistic Debate: Expressing opinions and interpretations about artists, artistic movements, and cultural themes through discussions, presentations, and debates in Spanish.\nResearch & Multimedia Presentation: Developing and presenting research projects about muralists, women painters, artistic movements, and historical contexts using visual and digital resources.\nStructured Composition: Writing analytical and reflective essays interpreting artistic works, symbolism, and the cultural significance of muralism and modern Latin American painting.", "materials": "Eclipse de siete lunas by Dina Comisarenco Mirkin\nHistoria del arte hispanoamericano by Sebastián Quesada\n“Reflexión sobre el muralismo mexicano” -WordPress.(Article)\n“Mujeres del surrealismo” -UNAM. (Article) \nVisit to the Museum of Modern Art (MoMA)\nLecture and guided discussion on Mexican muralism -María Gonzalez from the Whitney Museum", "assessments": "Visual Analysis Responses: Students wrote analytical paragraphs and reflections based on murals, surrealist paintings, museum materials, lectures, and authentic artistic sources related to Mexican muralism and surrealism.\nInterpretive Viewing Assessments: Students analyzed symbolism, color, composition, artistic techniques, and historical context through guided visual interpretation activities and class discussions.\nOral Presentations: Students delivered individual and group presentations analyzing artists, artistic movements, and the social and historical significance of muralism and surrealism in the Hispanic world.\nMuseum Reflection: Students composed written reflections based on their visit to the Museum of Modern Art (MoMA) and the lecture on muralism presented by curator María Gonzalez  from the Whitney Museum of American Art.\nClass Discussions and Artistic Debates: Students participated in interpretive discussions and debates about identity, revolution, gender, symbolism, and the role of art as cultural and social expression.\n Unit Project — Análisis comparativo (Muralismo / Surrealismo): Students selected one painting from the Mexican Muralist Movement and one painting from the Surrealist Movement and developed a comparative visual and cultural analysis using specialized vocabulary of the plastic arts. Students analyzed symbolism, composition, color, artistic techniques, historical context, and thematic representation through both a written essay and an oral multimedia presentation"}, {"name": "Unit 3"}, {"name": "Module 3: Theater", "timeframe": "3-4 weeks", "concepts": "Module 3 explored theater as one of the principal Fine Arts through the study of Yerma, one of the most significant dramatic works of twentieth-century Spanish literature. Students examined how Lorca used theater as a form of poetic, symbolic, and social expression to address themes such as gender roles, repression, honor, motherhood, freedom, societal expectations, and individual desire within rural Spanish society.The module also examined the historical and cultural context of Spain during the early twentieth century and the influence of tradition, religion, and patriarchy on the characters and conflicts within the play.", "skills": "Literary & Theatrical Analysis: Examining themes, symbolism, dialogue, dramatic structure, and character development in Yerma through close reading and discussion.\nInterpretive Reading & Discussion: Analyzing literary fragments and dramatic scenes while engaging in discussions about repression, gender roles, honor, freedom, and societal expectations.\nHistorical & Cultural Interpretation: Exploring the social, historical, and cultural context of early twentieth-century Spain and its influence on Lorca’s theater.\nOral Communication & Dramatic Performance: Expressing interpretation and emotional understanding through dramatic readings, performances, debates, and oral presentations in Spanish.\nComparative Literary Analysis: Comparing themes and symbols in Yerma with other artistic movements and cultural works studied throughout the course.\nResearch & Multimedia Presentation: Developing and presenting analytical projects about Lorca, Spanish theater, symbolism, and the cultural significance of Yerma using visual and digital resources.\nStructured Composition: In-class writing analytical and reflective essays interpreting symbolism, tragedy, character conflict, and the social themes presented in Yerma.", "materials": "Yerma by Federico García Lorca\nGarcía Lorca Dramaturgo: Figura central de la Literatura -Instituto Cervantes. (Article)\nVideo: Theater workshop and dramatic interpretation activities with the theater group El Almazén under the direction of Andrés Céspedes Bascuñán.\nLecture and guided discussion on theater and dramatic interpretation with Marta Osorio from Repertorio Español and the Thalia Spanish Theatre.", "assessments": "Interpretive Reading Assessments: Students analyzed dramatic fragments, symbolism, dialogue, and character development through close reading activities and class discussions based on Yerma.\nDramatic Interpretation & Oral Participation: Students participated in dramatic readings, theatrical interpretation activities, and discussions exploring themes such as repression, honor, motherhood, freedom, and societal expectations.\n Listening & Viewing Assessments: Students completed interpretive activities based on the recorded theatrical adaptation of Yerma and the theater workshop conducted by the theater group El Almazén under the direction of Andrés Céspedes Bascuñán.\nAnalytical Writing: Students wrote analytical paragraphs and reflections examining symbolism, tragedy, character conflict, and the social and cultural themes present throughout the play.\nOral Presentation: Students delivered individual or group presentations analyzing characters, symbols, themes, and the historical context of Yerma.\nUnit Project — Análisis temático de Yerma: Students developed an oral and written analytical project in which they selected a central theme from the play Yerma. Students explained how the theme developed throughout the work, analyzed its importance within Yerma’s central conflict, and supported their interpretation with specific examples and quotations from the text. The project concluded with a personal reflection on the chosen theme and required the integration of a minimum of ten (10) specialized vocabulary terms related to theater and dramatic analysis."}, {"name": "Unit 4"}, {"name": "Module 4: Architecture", "timeframe": "3-4 weeks", "concepts": "The module 4 explored major architectural movements including classical, gothic, modernist, and contemporary architecture, with particular emphasis on the Bauhaus movement and its influence on architecture, urban design, functionality, and modern aesthetics in the United States, Spain, and Latin America. Students analyzed how modern architecture transformed the relationship between space, technology, design, and society during the twentieth century, including the study of iconic Art Deco buildings and their influence on urban identity and modern design.\nThe module also included an in-depth study of Antoni Gaudí and Basílica de la Sagrada Família, examining Gaudí’s use of organic forms, symbolism, geometry, light, engineering, and religious imagery. Students attended a lecture on architecture and the Sagrada Familia presented by Professor Fabián Olch from City College of New York.\nThe course concluded with the study of contemporary architecture through the analysis of iconic structures such as Guggenheim Museum Bilbao, World Trade Center Transportation Hub (Oculus) by Santiago Calatrava, and the new 270 Park Avenue (JPMorgan Chase Headquarters). Students analyzed architectural design, materials, innovation, functionality, sustainability, and the role of contemporary architecture in shaping modern urban landscapes.", "skills": "Architectural Analysis: Examining architectural styles, structures, materials, and design from classical to contemporary architecture.\nHistorical & Cultural Interpretation: Exploring how architecture reflected culture, religion, technology, and social transformation.\nComparative Architectural Study: Comparing Bauhaus, Art Deco, gothic, modernist, and contemporary architecture in Spain, Latin America, and the United States.\nOral Communication & Discussion: Presenting and discussing architectural works, urban design, symbolism, and innovation in Spanish.\nResearch & Multimedia Presentation: Developing visual and digital presentations about architects, buildings, and architectural movements.\nInterpretive Viewing & Spatial Analysis: Analyzing space, light, geometry, symbolism, and functionality through architectural observation and discussion.\nStructured Composition: Writing analytical essays about architectural movements, innovation, and cultural significance.", "materials": "Historia del arte hispanoamericano by Sebastián Quesada\n“Belleza y funcionalidad en arquitectura” — article and visual study on the relationship between aesthetics and functionality in modern architecture.\n“Definición de la arquitectura” — educational material from Gabinete Digital, Artes y Curiosidades exploring the principles, purpose, and evolution of architecture as a Fine Art.\n“Arquitectura Bauhaus: todo un referente del siglo XX” — article from La Vanguardia exploring the principles, aesthetics, functionality, and global influence of the Bauhaus movement on twentieth-century architecture and design.\n“Grandes arquitectos y sus obras icónicas en New York” — articles and visual resources examining influential architects, urban design, and iconic architectural landmarks in New York City.", "assessments": "Architectural Analysis Responses: Students wrote analytical paragraphs and reflections based on architectural articles, lectures, documentaries, and visual studies related to architectural movements and iconic structures.\n Interpretive Viewing Assessments: Students analyzed architectural styles, design, symbolism, materials, geometry, and functionality through guided visual interpretation activities and class discussions.\n Oral Presentation: Students delivered individual and group presentations analyzing architectural movements, architects, iconic buildings, and the relationship between architecture, art, and society.\n Research & Comparative Analysis: Students compared architectural styles such as Bauhaus, Art Deco, modernism, and contemporary architecture through written and oral analysis.\nLecture Reflection: Students composed written reflections based on the lecture on architecture and Basílica de la Sagrada Família presented by Professor Fabián Olch from City College of New York.\nUnit Project: Análisis arquitectónico de una obra en Nueva York: Students developed an oral and written project examining an architectural work located in New York City. The presentation demonstrated understanding of the historical context, location, design, functionality, materials, construction techniques, artistic value, and cultural influence of the selected structure. Students analyzed modern and contemporary architectural elements while explaining why the building could be considered both a functional structure and a work of art. The project required the integration of seven (7) to ten (10) specialized architectural vocabulary terms such as fachada, estructura, volumen, simetría, funcionalidad, and ornamento."}, {"name": "Unit 5"}, {"name": "Module 5: Dance", "timeframe": "3-4 weeks", "concepts": "The module began with an introduction to the definition of dance as one of the Fine Arts, exploring its earliest forms and its role as cultural, spiritual, and social expression throughout history. Students examined the development and importance of ballet as a foundational artistic discipline, as well as the influence of pioneering dancers such as Isadora Duncan and Alicia Alonso, whose contributions transformed modern and classical dance.\nThe module then focused on the cultural and historical significance of Hispanic dance traditions, particularly tango and flamenco. Students examined how dance reflected history, migration, community, resistance, celebration, and artistic innovation across Latin America and Spain. They explored the relationship between dance, music, and society while interpreting dance as both artistic performance and cultural expression. Through lectures, dance demonstrations, discussions, and cultural analysis, students studied the origins, symbolism, musicality, and emotional expression embedded within these dance traditions while developing specialized vocabulary related to movement, choreography, rhythm, staging, and performance.", "skills": "Dance & Performance Analysis: Examining movement, rhythm, choreography, symbolism, and emotional expression in Hispanic dance traditions.\nHistorical & Cultural Interpretation: Exploring how tango and flamenco reflected identity, migration, resistance, and cultural history in Latin America and Spain.\nOral Communication & Discussion: Expressing interpretations and cultural analysis through discussions, reflections, and presentations in Spanish.\nInterpretive Viewing & Listening: Analyzing dance performances, music, staging, and cultural symbolism through visual and audiovisual materials.\nResearch & Cultural Presentation: Developing presentations and reflections about Hispanic dance traditions, performers, and cultural significance.\nStructured Composition: Writing analytical and reflective essays about dance as artistic and cultural expression.", "materials": "Historia del arte hispanoamericano by Sebastián Quesada\n“El arte de la danza” — article from Arte Latino exploring the origins, evolution, and artistic significance of dance as a Fine Art.\n“El tango: identidad nacional” — cultural article published by the Government of Argentina examining tango as a symbol of Argentine national identity and cultural heritage.\n“El flamenco: patrimonio de los gitanos” — article and cultural resources from the Museu de Catalunya exploring the origins, symbolism, and cultural importance of flamenco within Spanish and Romani traditions.\nLecture on dance and artistic expression presented by Joselyn Salomón.\nTango lesson and cultural lecture presented by Mariana Parma exploring the origins, symbolism, musicality, and cultural significance of tango within Argentine culture.", "assessments": "Dance Analysis Responses: Students wrote analytical paragraphs and reflections based on dance performances, articles, lectures, and audiovisual materials related to ballet, tango, flamenco, and Hispanic dance traditions.\nInterpretive Viewing & Listening Assessments: Students analyzed movement, rhythm, choreography, symbolism, staging, and emotional expression through guided observation of dance performances and musical interpretation activities.\nOral Presentation: Students delivered oral presentations on Isadora Duncan and Alicia Alonso, examining their artistic contributions, influence on dance history, and impact on modern and classical dance.\n Lecture Reflections: Students wrote personal reflections based on the lectures and cultural presentations by Joselyn Salomón and Mariana Parma, examining the historical, artistic, and cultural significance of dance traditions such as tango and Salsa.\n\nUnit Project — La danza como una bella arte: Students selected a dance tradition of interest such as tango, flamenco, ballet, hip-hop, or another dance form and developed an oral and written cultural analysis. The project included the origin and history of the dance, its cultural context and evolution, and an explanation of why dance can be considered one of the Fine Arts through the analysis of emotional expression, body technique, rhythm, music, and costume design. Students also examined the cultural impact of the dance tradition, included a relevant dancer, company, or choreography, and concluded with a personal reflection on the artistic value of the selected dance. The project required the integration of at least seven (7) specialized vocabulary terms related to dance and performance."}, {"name": "Unit 6"}, {"name": "Modules 6 and 7 Literature and Cinema", "timeframe": "4-5 Weeks", "concepts": "Modules 6 and 7 combined literature and cinema in order to explore how literary works could be transformed into cinematic experiences. Students began with an introduction to cinema as one of the Fine Arts, studying its origins through the work of Auguste and Louis Lumière, silent film, Charlie Chaplin, the significance of The Jazz Singer, and the role of Ricciotto Canudo in defining cinema as the “Seventh Art.” Students also explored the influence of Luis Buñuel in Hispanic cinema and the contributions of actresses such as Greta Garbo and Penélope Cruz.\nStudents read La pregunta de sus ojos by Eduardo Sacheri and analyzed its cinematic adaptation, El secreto de sus ojos directed by Juan José Campanella. Through comparative analysis, students examined how themes such as memory, justice, love, political violence, and obsession were represented differently in literature and cinema while analyzing characterization, symbolism, narrative structure, cinematography, and emotional impact in both artistic formats.", "skills": "Literary & Cinematic Analysis: Examining themes, symbolism, characterization, narrative structure, cinematography, and visual storytelling in literature and film.\nComparative Interpretation: Comparing literary works and their cinematic adaptations through critical analysis and discussion.\nHistorical & Cultural Interpretation: Exploring the historical development of cinema and the cultural impact of Hispanic and international film movements.\nOral Communication & Discussion: Expressing interpretations and critical opinions about literature, cinema, characters, and artistic techniques through discussions and presentations in Spanish.\nInterpretive Viewing & Reading: Analyzing films, literary texts, cinematography, dialogue, and emotional tone through close reading and film observation.\nStructured Composition: Writing comparative essays examining the transformation of literature into film and the artistic choices involved in adaptation.", "materials": "“Historia del cine” — article from Enciclopedia Humanidades exploring the origins, evolution, and development of cinema as the Seventh Art.\nLa pregunta de sus ojos by Eduardo Sacheri.\nEl secreto de sus ojos directed by Juan José Campanella.\nAudiovisual materials and film excerpts related to silent cinema, Charlie Chaplin, Luis Buñuel, and the historical development of Hollywood and Hispanic cinema.", "assessments": "Reading Journal Entries: Students wrote reflective and analytical journal entries throughout the reading of La pregunta de sus ojos, analyzing themes, characters, symbolism, emotional development, and connections between the literary work and its cinematic adaptation.\nInterpretive Viewing & Discussion: Students participated in guided discussions and comparative analyses examining cinematography, narrative structure, symbolism, characterization, music, and emotional impact in both literature and film.\nOral Presentations: Students delivered presentations analyzing scenes, characters, ethical conflicts, and cinematic techniques explored throughout the modules.\nComparative Analytical Writing: Students composed analytical paragraphs and reflections comparing literary narrative and cinematic language through close reading and film interpretation.\nUnit Project — Literatura y cine: análisis comparativo: Students developed an oral and written comparative analysis selecting one or two scenes from a film and a literary fragment connected to the themes explored in class. The project included an analysis of the relationship between the literary and cinematic works through the study of plot, protagonists, conflicts, themes, structure, ethical values, symbolism, and cinematic language such as lighting, editing, sound, photography, dialogue, silence, and music. Students also reflected on the emotional and artistic impact of the film, identified important awards or achievements, and established at least five connections between the film and the literary text. The project required the integration of a minimum of ten (10) specialized vocabulary terms related to cinema and film analysis."}]}, {"name": "Class I Music", "department": "Performing Arts", "teacher": "Mary Beth Alexander", "grade": "", "length": "", "description": "", "competencies": "Steady beat\nSinging in tune in English and Spanish \nPerforming (singing/playing/moving) in an ensemble\nReading iconic and western notation of quarter notes, eighth notes, and the pitches la, sol and mi on the five-line staff", "units": [{"name": "Unit 1"}, {"name": "Quarter note, quarter rest, eighth notes", "timeframe": "2.5 months", "concepts": "Quarter note = one sound, one beat. Represented with iconic (vertical line) and then western notation (notehead/stem)\nQuarter rest = no sound, one beat. Represented with iconic (capital Z) and then Western notation \nEighth notes = two sounds, one beat. Represented first with iconic stick notation then traditional western notation", "skills": "Reading, writing, singing and performing on instruments rhythms containing above durations", "materials": "Cobbler cobbler mend my shoe\nshoemakers’ dance\nDo you know the muffin man?\nI think Music’s Neat\nOne, Two, Tie my shoe", "assessments": "Rhythmic dictation activities with popsicle sticks, \nopportunities to read solo patterns from the board\npoison pattern"}, {"name": "Unit 2"}, {"name": "Unpitched Percussion instrument families", "timeframe": "2.5  months", "concepts": "Identifying instruments in the scrape, shake, ring, click and skin families", "skills": "Correct technique on classroom unpitched percussion instruments and ability to identify by technique categories above\nChoosing instruments to perform distinct roles in an ensemble (ie, long vs. short, fast rhythms vs. slow, etc)", "materials": "Play and Stop\nSan Serenin\nGoin on a Bear Hunt\nGo away big green monster\n1 2 tie my shoe", "assessments": "Instrument conductor activities \nMovement response activities\nFour corners"}, {"name": "Unit 3"}, {"name": "Winter Concert Preparation", "timeframe": "1 month", "concepts": "Ensemble performance, repertoire preparation", "skills": "Singing as a musical team, with expression, dynamics \nMemorizing lyrics and song forms\nListening to piano introduction", "materials": "WC 2024: Burrito Sabanero, S’Vivon, Solstice Song, It’s the Most Wonderful Time of the Year, 7 Days of Kwanzaa", "assessments": "Practice performances as formative assessments leading up to summative assessment of the concert"}, {"name": "Unit 4"}, {"name": "Beginnings of melody - Sol and Mi", "timeframe": "2.5 Months", "concepts": "The pitches so and mi are in many songs, can be written on the five-line staff and played on the classroom instruments", "skills": "Reading and writing so/mi patterns in iconic notation and later the five line staff\nPlaying sm patterns on the letters G/E on the xylophone\nWhy use letter names and when to use solfege?", "materials": "April Rain Song\nCuckoo where are you\nTeddy Bear Teddy Bear", "assessments": "Poison pattern, stick-tation, small groups playing SM patterns on the barred instruments for teacher observation"}, {"name": "Unit 5"}, {"name": "Introduction to barred instruments", "timeframe": "5 Months", "concepts": "Correct instrument technique, translating letter names to solfege, melodic direction and contour", "skills": "Mallet grip, and correct technique on the xylophones\nEchoing and playing melodies\nPlaying the steady beat while singing\nDifferentiating between rhythm and steady beat", "materials": "April Rain Song\nTeddy Bear\nCuckoo Where are You", "assessments": "Teacher observation, small group performances"}, {"name": "Unit 6"}, {"name": "Beat vs. Rhythm", "timeframe": "2.5 Months", "concepts": "Beat and rhythm are different", "skills": "Keeping a beat while saying a rhythm \nClapping the rhythm = ‘the way the words go’", "materials": "Beat vs. Rhythm movement game\nOrff orchestration of Teddy Bear Teddy Bear\nWe are Dancing in the Forest\nJelly in the Bowl\nBeat in the Feet", "assessments": "Teacher observation of student responses during movement games, and capacity to perform beat or rhythm on designated insturments"}, {"name": "Unit 7"}, {"name": "Introducing ‘la’", "timeframe": "2 months", "concepts": "A new note ‘la’ is higher than so and mi and also lives on the five-line staff", "skills": "Writing ‘la’ on the five line staff\nSinging ‘la’ with hand signs\nPlaying ‘la’ on the xylophone", "materials": "Drip Drop\nLemonade\nLucy Locket\nPizza Pizza", "assessments": "Sticktation\nPoison pattern\nMagic pattern\nTeacher observation of  mallet instrument skills"}, {"name": "Unit 8"}, {"name": "Spring Concert Preparation", "timeframe": "1.5 months", "concepts": "Performing as a musical team, with instruments and student-generated lyrics", "skills": "Performing a three or 4-part speech piece\nSinging in Spanish\nCreating lyrics as a class to support chosen theme\nChoosing instruments from the previous instrument family unit to complement sprong concert songs\nSinging songs in cumulative form", "materials": "Different every year - here are the 2026 materials\nWho are the People in your Neighborhood (based on actual interviews Class I did in social studies)\nWhen I Build My House\nPonte tus zapatos\nFood Truck Ruckus\nCommunity (Czarina Jimenez)", "assessments": "Videos of rehearsals for students to review and self-assess, final performance is final assessment"}]}, {"name": "Class IV Music", "department": "Performing Arts", "teacher": "Mary Beth Alexander", "grade": "", "length": "", "description": "", "competencies": "", "units": [{"name": "Unit 1"}, {"name": "Review of extended pentatonic scale + exploration of pentatonic modes", "timeframe": "2.5 Months", "concepts": "Pentatonic scale is found in children’s songs/games and folk songs around the world\nChanging the ‘home tone’ of a scale can change the expressive qualities of the tone set", "skills": "Singing, playing xylophones, reading, writing, and composing patterns using the pitches of the pentatonic scale (do, re, mi, sol, la).\nFiguring out melodies by ear using the classroom instruments\nTransposition: playing a single melodic idea in multiple modes by changing the starting and ending pich \nComposition in pentatonic modes - choosing a mode to suit a particular mood", "materials": "Ding Dong Digg-diggi-dong\nShady Grove\nRiddle Song\nYe Toop Doram", "assessments": "CULMINATING PROJECT: Class period “Jam Session,” where students choose a home-tone, choose an image to accompany the mood of that home-tone, turn off lights and ‘jam’ in the modal context using barred instruments"}, {"name": "Unit 2"}, {"name": "Rhythmic review of quarter notes, eighth notes, sixteenth notes, and introduction of sixteenth note derivations (ti-tika and tika-ti)", "timeframe": "2.5 months", "concepts": "Rhythms can be defined by the number of sounds on a particular beat, and whether they are even or unevenly spaced\nWestern music notation has conventions for writing these rhythms, using stems, beams and noteheads", "skills": "Ss will read, write, improvise, compose and perform with speech/BP/instruments repertoire containing quarter notes, eighth notes, sixteenth notes, and half notes. (review from Class III)\nSs will read, write, improvise, compose and perform with speech/BP/instruments repertoire containing the sixteenth note derivations ti-tika and tika-ti.", "materials": "“All I Wanted was a piece of Candy” - speech piece from MFC Vol. 1\nSagadi Sagadi Sapo Po\nOld Betty Larkin\nStodola Pumpa", "assessments": "Formative assessments throughout the unit:\nPoison pattern\n4 corners\ndictation/sticktation\nSummative assessment: Ss create BP routine with a partner matching candy rhythms containing the target sixteenth-note derivations. Ss perform this 16-beat rhythm composition at the same time as other groups, building rhythmic independence and ensemble skills\nSs notate their rhythm using western notation"}, {"name": "Unit 3"}, {"name": "Winter Concert Preparation", "timeframe": "1 month", "concepts": "Ensemble singing, listening to others, holding your part against another part, learning about the origin and history of music before performing it", "skills": "Part-singing either in canon, partner song or occasionally homophonous harmony (depending on skill level of students)", "materials": "Different every year. Recent examples:\nOh Moon (Andy Beck)\nA la nanita nana (Spanish folk song) \nWinter Wonderland\n7 Days of Kwanzaa\nShalom Chaverim", "assessments": "Watching back videos of in-class practice performances for self-evaluation\nSummative assessment is the winter concert"}, {"name": "Unit 4"}, {"name": "Adding half steps to the scale (introducing fa and ti)", "timeframe": "2.5 months (concurrent with other units)", "concepts": "Defining the difference between half-steps and whole-steps and implication for using half-steps in harmonic context", "skills": "Ss will sing, read, write, improvise, compose and use instruments to play melodies containing ‘fa’ \nSs will sing, read, write, improvise, compose, and use instruments to play melodies containing ‘ti’ - in the major and minor contexts.", "materials": "Polly put the kettle on\nCut the Cake\nSon Macaron\nAh Poor Bird\nSweetly the Swan Sings", "assessments": "FORMATIVE ASSESSMENTS: “Poison Pattern” with melodic patterns containing ‘fa’ and ‘ti’ + singing “Ah Poor Bird” in three-part canon using solfege syllables. \nSUMMATIVE ASSESSMENT: Partner composition project with “Polly put the Kettle On” - Ss compose a melody on the xylophones which uses ‘fa’ as a passing-tone in the major hexatonic scale\nStudents notate their composition on the five-line staff\nProject culminates with a tea party in the black box while watching each group’s final performa
