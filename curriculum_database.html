amp Lab", "assessments": ""}, {"name": "Unit 2"}, {"name": "The Chemistry of Water", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": "Acid/Base Problem Set\nExam #1"}, {"name": "Unit 3"}, {"name": "Amino Acids, Proteins, and Enzymes", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Carbohydrates", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Final Project- Metabolic Disorders", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": "Final Project instructions and lib Guide"}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Advanced Biology (Genetics of Cancer)", "department": "Science", "teacher": "Mary Beth Spina", "grade": "", "length": "", "description": "", "competencies": "", "units": [{"name": "Unit 1"}, {"name": "Biology Review and Intro to Cancer", "timeframe": "1 month", "concepts": "Objectives:\nTo review basic biology concepts that will aid in our understanding of the genetics behind cancer\nTo consider some big questions that will help guide the rest of our investigations together this term", "skills": "Reading and understanding primary sources articles (Peer reviewed journal articles) \nBasic Microscope Skills\nReview of Basic Lab Techniques\nReview of Basic Lab design", "materials": "The immortal Life of Henrietta Lacks", "assessments": "Experimental Methods Lab\nILHL Assignment #1\nEnd of Unit Assessment given on Go formative"}, {"name": "Unit 2"}, {"name": "Cancer Cell Biology", "timeframe": "6- 7  weeks", "concepts": "Objectives:\nTo understand the cell cycle and how it is controlled\nTo compare and contrast the features of normal cells and cancerous cells\nTo compare and contrast transport and metabolism in normal and cancerous cells\nTo understand the mechanisms involved in cell-cell communication (new!) \nTo compare and contrast the cell-cell communication in normal and cancerous cells", "skills": "Cytology Skills", "materials": "Various related videos\nHHMI video on Cancer", "assessments": "ILHL Assignment #2\nHHMI Cel Cycle Worksheet\nMitosis in Onion Root Tip Lab\nScientific Journal Article #1\nEnd of Unit Assessment on Go Formative"}, {"name": "Unit 3"}, {"name": "Cancer Cell Genetics and Inheritance", "timeframe": "4 weeks", "concepts": "Objectives:\nTo apply the fundamentals of Mendelian genetics to the inheritance of cancer-causing genes\nTo examine the role of gene and chromosomal mutations in cancer and how karyotypes can play a diagnostic role\nTo explain cancer development through the lens of the central dogma, including the role of telomeres and the mechanisms of tumor suppressor genes and oncogenes", "skills": "", "materials": "", "assessments": "ILHL Assignment #3\nMorphology of Cancer Cells Lab #1\nMorphology of Cancer Cells Lab #2\nILHL Final assignment\nGenetics Practice Problems\nEnd of Unit assessment"}, {"name": "Unit 4"}, {"name": "Breast Cancer Investigation", "timeframe": "3 weeks", "concepts": "Objectives:\nTo investigate incidences of breast cancer and how it varies with age, race/ethnicity, and geographic location\nTo investigate different types of breast cancers: from etiology and development through potential metastasis, considering traditional and modern treatments\nTo dissect several patient case studies", "skills": "", "materials": "", "assessments": "Lynch Syndrome Lab\nPedigree Construction\nJournal Article #2- Read both of these articles.\narticle #1\narticle #2\nChoose one to focus on and find a current primary article on either the importance of telomeres in cancer or another\ncancer linked to translocation mutation ot targeted therapies.\nFollow journal article instructions as usual\n\nThree Case studies in Breast Cancer:\nUse this website to walk through three different patient case studies for breast cancer. Create a medical record for each patient that contains their medical history, physical exam details, and results from diagnostic studies and labs. Refer to this collective information to create treatment plans tailored for each patient.\n\nSubmit one document that has each patient's full medical record and treatment recommendations.\nUse this website to walk through three different patient case studies for breast cancer. Create a medical record for each patient that contains their medical history, physical exam details, and results from diagnostic studies and labs. Refer to this collective information to create treatment plans tailored for each patient.\n\nSubmit one document that has each patient's full medical record and treatment recommendations."}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Analytical Chemistry", "department": "Science", "teacher": "Barros", "grade": "", "length": "", "description": "", "competencies": "Undefined - It is doubtful anyone has actual competencies", "units": [{"name": "Unit 1"}, {"name": "Tools of the Trade", "timeframe": "2 weeks", "concepts": "This unit explores how common hygiene products, such as soaps, toothpastes, and deodorants, act as aquatic pollutants by examining their chemical structures and mechanisms, like micelle formation and surface tension reduction. Students apply quantitative analytical skills—specifically creating linear calibration curves and performing dilutions—to determine if industrial surfactant concentrations meet environmental safety standards. The curriculum also evaluates various water purification methods, including UV irradiation, chemical disinfection (chlorination and ozonation), and point-of-use technologies like biosand filters, while requiring students to differentiate between systematic and random errors in their measurements. Finally, the unit investigates the impact of excess nutrients on aquatic ecosystems through processes like eutrophication and the resulting depletion of dissolved oxygen.", "skills": "Making molar solutions\nDilutions\nMeasuring with significant figures\nCreating and using calibration curves", "materials": "Fundamentals of Analytical Chemistry by Skoog, West, Holler, and Crouch, Analytical Chemistry: A Guided Inquiry Approach by Lantz and Cole, and Environmental Chemistry by Baird and Cann.", "assessments": "Skill Set\nProblems Set\nLab Report"}, {"name": "Unit 2"}, {"name": "Equilibrium", "timeframe": "2 weeks", "concepts": "This unit integrates the principles of chemical equilibrium with atmospheric chemistry, using the real-world example of chlorofluorocarbons (CFCs) in hairsprays. Students examine the equilibrium of keratin carboxyl groups in hair to understand how pH affects hair health, specifically looking at how different rinses influence the degree of ionization and intermolecular bonding. The curriculum then shifts to the stratosphere, where students analyze the Chapman Mechanism and catalytic cycles of ozone destruction. By calculating the photochemical energy required for O₃ dissociation and the chain efficiency of chlorine radicals, students quantify how small emissions of propellants like Freon-12 scale up to cause global environmental impacts.", "skills": "Redox titrations\nAcid-base titrations\nPrecipitation titrations", "materials": "Fundamentals of Analytical Chemistry by Skoog, West, Holler, and Crouch, Analytical Chemistry: A Guided Inquiry Approach by Lantz and Cole, and Environmental Chemistry by Baird and Cann.", "assessments": "Skill Set\nProblems Set\nLab Report"}, {"name": "Unit 3"}, {"name": "Electrochemistry", "timeframe": "2 weeks", "concepts": "This unit explores the intersection of electrochemistry and environmental science, specifically focusing on the behavior and remediation of pollutants in soils and sediments. Students examine the chemical composition of cosmetics, such as heavy metal pigments in lipstick and eyeliner, and apply redox principles to understand how these substances can leach into the environment. A major technical focus is placed on cation-exchange capacity (CEC), where students analyze how soil texture and pH influence the ability of soil to hold and exchange vital nutrients and toxic metal ions.\nThe curriculum also covers advanced analytical and remediation techniques, including the use of galvanic and electrolytic cells. Students apply the Nernst Equation and Gibbs Free Energy calculations to evaluate the spontaneity of redox reactions used in electrokinetic remediation, a process that uses electric fields to migrate and remove heavy metal contaminants like copper and chromium from soil matrices. Additionally, the unit introduces potentiometry and the use of ion-selective electrodes for precise environmental monitoring, such as measuring pH gradients produced during soil treatment.", "skills": "Creating galvanic and electrolytic cells\nApplying the Nernst equation", "materials": "Fundamentals of Analytical Chemistry by Skoog, West, Holler, and Crouch, Analytical Chemistry: A Guided Inquiry Approach by Lantz and Cole, and Environmental Chemistry by Baird and Cann.", "assessments": "Skill Set\nProblems Set\nLab Report"}, {"name": "Unit 4"}, {"name": "Chromatography", "timeframe": "2 weeks", "concepts": "This unit explores the critical intersection of chromatography and environmental chemistry by analyzing the fate of cosmetic ingredients in natural water systems. Students investigate how intermolecular forces (IMFs), such as hydrogen bonding and dipole-dipole interactions, dictate the separation of complex mixtures in moisturizers using techniques like Thin-Layer Chromatography (TLC) and Gas Chromatography (GC). The curriculum bridges these laboratory methods with real-world ecological issues, examining how stable emulsions from hygiene products bypass standard filtration to increase Biochemical Oxygen Demand (BOD) and threaten biodiversity. Additionally, the unit introduces the pE scale to describe redox environments, requiring students to model how changes in electron availability influence the mobility and oxidation states of heavy metal pollutants in river ecosystems. Through this lens, chromatography is presented not just as a bench-top tool, but as a conceptual framework for understanding the migration and transformation of contaminants in the environment.", "skills": "Gas chromatography\nTLC chromatography", "materials": "Fundamentals of Analytical Chemistry by Skoog, West, Holler, and Crouch, Analytical Chemistry: A Guided Inquiry Approach by Lantz and Cole, and Environmental Chemistry by Baird and Cann.", "assessments": "Skill Set\nProblems Set\nLab Report"}, {"name": "Unit 5"}, {"name": "Spectroscopy", "timeframe": "2 weeks", "concepts": "This unit focuses on the application of UV-Vis spectroscopy to monitor and analyze ground-level air pollutants, specifically focusing on the relationship between volatile organic compounds (VOCs) and photochemical smog. Students investigate how π-electron systems in perfume molecules and other cosmetics allow for the quantification of fragrance concentration and the detection of oxidative degradation, such as the breakdown of limonene into skin sensitizers. The curriculum details the formation of photochemical smog through the interaction of UV light, nitrogen oxides (NOx), and VOCs, emphasizing how the limiting reagent—either NOx in rural areas or VOCs in urban environments—dictates the effectiveness of ozone control strategies. Using Beer's Law and open-path UV spectrometers, students calculate real-time concentrations of NO₂ and O₃ in city air to predict smog levels and evaluate the impact of mitigation technologies like catalytic converters and flue-gas desulfurization.", "skills": "spectroscopy", "materials": "Fundamentals of Analytical Chemistry by Skoog, West, Holler, and Crouch, Analytical Chemistry: A Guided Inquiry Approach by Lantz and Cole, and Environmental Chemistry by Baird and Cann.", "assessments": "Skill Set\nProblems Set\nLab Report"}, {"name": "Unit 6"}, {"name": "Forensics Analysis Project", "timeframe": "2 weeks", "concepts": "In this forensic chemistry simulation, students act as investigators to identify a suspect manufacturing illegal \"E-juice\" by performing a multi-phase analysis of physical evidence. Phase I involves a detailed soil analysis, where students determine soil texture using hydrometers and the USDA textural triangle, alongside measuring nitrate levels, pH, and electrical conductivity to match samples from suspects' desks to the crime scene. In Phase II, students transition to chemical verification using Thin-Layer Chromatography (TLC), creating their own capillary spotters to compare unknown liquids against known E-juice components. The unit culminates in a professional research report and presentation that evaluates the intermolecular forces and retention factors ($R_f$) across various solvent systems to confirm the chemical identity of the contraband.", "skills": "TLC chromatography applications", "materials": "Resources pulled and updated using AI.", "assessments": "Powerpoint or Canvas Slideshow"}, {"name": "Unit 7"}, {"name": "Environmental Analysis Project", "timeframe": "2 weeks", "concepts": "Students do a comparative environmental study by analyzing water quality parameters—including dissolved oxygen, nitrate/ammonium levels, pH, and conductivity—across an aquaponics system, the Turtle Pond in Central Park, and the East River. A key focus is placed on the water’s estimated pE, requiring students to apply redox principles to their field data. The assignment tasks students with synthesizing these findings into a professional IMRaD (Introduction, Methods, Results, and Discussion) research report, emphasizing the use of APA-style citations to support their scientific arguments. By interpreting their data in the context of existing research, students evaluate the significance and limitations of their methods in a format that mirrors the scholarly scientific process.", "skills": "Titration applications\nSpectroscopy applications\nElectrochemistry applications", "materials": "Resources pulled and updated using AI.", "assessments": "Research Report"}, {"name": "Unit 8"}, {"name": "Food Analysis Project", "timeframe": "2 weeks", "concepts": "In this simulation, students assume the role of FDA researchers tasked with updating nutrition labels for breakfast cereals through a five-day intensive analysis that covers six major areas of food chemistry. The laboratory requires students to quantify macronutrients by determining moisture content through weight-loss heating, extracting fats using the semi-continuous Soxhlet method, and measuring total carbohydrates and proteins through colorimetric techniques like the Phenol-Sulfuric Acid and Biuret methods. Students also analyze micronutrients and minerals using complexometric titrations with EDTA for calcium and the Indophenol method to assess Vitamin C stability, while applying Beer’s Law and UV-Vis spectrophotometry to convert absorbance data into precise nutritional values.", "skills": "Titration applications\nSpectroscopy applications\nElectrochemistry applications", "materials": "Resources pulled and updated using AI.", "assessments": "Poster Presentation"}]}, {"name": "Organic Chemistry", "department": "Science", "teacher": "Barros", "grade": "", "length": "", "description": "", "competencies": "Undefined - It is doubtful anyone has actual competencies", "units": [{"name": "Unit 1"}, {"name": "Structure and Bonding", "timeframe": "3 weeks", "concepts": "Students review the basics of chemistry bonds including dot structures, hybridization, bond-line structures, electronegativity, and polarity.  We also discuss how bonding and intermolecular forces relate to physical properties such as boiling point.", "skills": "Extraction of organic molecules from a substance", "materials": "We use Organic Chemistry by Kahn Academy, Organic Chemistry: A Guided Inquiry by Suzanne M. Ruder, and Virtual Textbook of Organic Chemistry by William Reusch.", "assessments": "Unit Test\nLab Report"}, {"name": "Unit 2"}, {"name": "Resonance and Acid-Base Chemistry", "timeframe": "3 weeks", "concepts": "Students review how to keep track of electrons using formal charges, oxidation states, oxidation-reduction reactions, and resonance structures.  We go over the principles of acid-base chemistry.", "skills": "Extraction of organic molecules from a substance", "materials": "We use Organic Chemistry by Kahn Academy, Organic Chemistry: A Guided Inquiry by Suzanne M. Ruder, and Virtual Textbook of Organic Chemistry by William Reusch.", "assessments": "Unit Test\nLab Report"}, {"name": "Unit 3"}, {"name": "Alkanes, Cycloalkanes, and Functional Groups", "timeframe": "3 weeks", "concepts": "The properties of organic molecules depend on the structure, and knowing the names of organic compounds allow us to communicate with other chemists.  We learn about different aspects of molecular structure, including common functional groups and conformations.", "skills": "Synthesis of organic compounds", "materials": "We use Organic Chemistry by Kahn Academy, Organic Chemistry: A Guided Inquiry by Suzanne M. Ruder, and Virtual Textbook of Organic Chemistry by William Reusch.", "assessments": "Unit Test\nLab Report"}, {"name": "Unit 4"}, {"name": "Stereochemistry", "timeframe": "3 weeks", "concepts": "Just like how your left foot doesn't quite fit your right shoe, molecules also can have properties that depend on their handedness!  This property is called chirality.  We go over what makes a molecule chiral, stereoisomers, assigning configurations using the R,S system, optical activity, and Fischer projections.", "skills": "Synthesis of organic compounds", "materials": "We use Organic Chemistry by Kahn Academy, Organic Chemistry: A Guided Inquiry by Suzanne M. Ruder, and Virtual Textbook of Organic Chemistry by William Reusch.", "assessments": "Unit Test\nLab Report"}, {"name": "Unit 5"}, {"name": "Substitution and Elimination Reactions", "timeframe": "4 weeks", "concepts": "Sn1, Sn2, E1, and E2 reactions form the basis for understanding why certain products are more likely to form than others.  We learn about the reaction mechanisms, and how nucleophilicity and electrophilicity can be used to choose between different reaction pathways.", "skills": "Extraction of organic molecules from a substance\nSynthesis of organic compounds", "materials": "We use Organic Chemistry by Kahn Academy, Organic Chemistry: A Guided Inquiry by Suzanne M. Ruder, and Virtual Textbook of Organic Chemistry by William Reusch.", "assessments": "Unit Test\nLab Report\nBiofuel Project"}]}, {"name": "Modern Physics", "department": "Science", "teacher": "Flomberg", "grade": "", "length": "", "description": "", "competencies": "We have STEM learning targets, not competencies. \nData Analysis\nProblem Solving\nSystems Thinking\nCommunication\nQuantitative Reasoning", "units": [{"name": "Unit 1"}, {"name": "Light and its Wavelike Properties", "timeframe": "About 4 weeks (roughly 12 class meetings)", "concepts": "In this unit students will learn about the wave nature of light, or electromagnetic radiation.  A debate in the worlds of physics and mathematics carried on for more than a century, and through the first half of the 19th century the wave model of light dominated.  We will investigate the propagation of light waves, diffraction and interference effects and more in this unit.", "skills": "Data Analysis\nProblem Solving\nSystems Thinking\nQuantitative Reasoning", "materials": "Students use an iBook (University Physics, Volume 3, Open Stax), but all course materials beyond the iBook can be in onCampus for Unit 1, and all units.", "assessments": "Spot Check HW assignments\nUnit 1 Problem Set\nSnell’s Law index of refraction activity\nPivot Interactive Double Slit Diffraction assignment\nLight Propagation Quiz\nDiffraction and Interference Quiz\nUnit 1 TEST"}, {"name": "Unit 2"}, {"name": "Relativity", "timeframe": "About 4 weeks (roughly 12 class meetings)", "concepts": "In this unit students learn about Galilean relative velocity in the classical sense--when things move slowly.  We will then learn about Michelson and Morley's famous experiment which basically turned our understanding of distance and time measurements on its head, and how they become enmeshed as a construct in spacetime.  We will consider the staggering implications of what it means to say that the ultimate speed limit is \"c\", and that the measurement of the speed of light is the same for all inertial observers.", "skills": "Problem Solving\nQuantitative Reasoning\nSystems Thinking", "materials": "Students use an iBook (University Physics, Volume 3, Open Stax), but all course materials beyond the iBook can be in onCampus for Unit 2, and all units.", "assessments": "Spot Check HW assignments\nUnit 2 Problem Set\nVelocity Raptor Special Relativity activity\nDoppler Effect and Special Relativity Quiz\nUnit 2 TEST"}, {"name": "Unit 3"}, {"name": "The Quantum World", "timeframe": "About 4 weeks (roughly 12-14 class meetings)", "concepts": "Students will learn in detail how light, which we characterized as an electromagnetic wave earlier, has particle-like properties.  Energy and matter are also both quantized and wavelike.  As hard as it may be to believe, if something moves it waves.  If it waves, then there are limits to how precisely we can know its position, momentum, energy and more.  Welcome to the world of quantum mechanics!  Giants in modern physics such as Planck, Rutherford, Bohr, deBroglie, Born, Heisenberg, Schrodinger, and of course Big Al (Einstein) are featured in this unit.  We will work our way from the electron cloud and electron energy levels to the superdense positively charged core of the atom.  Fundamental forces and particles will be examined as we study nucleons, mass-energy equivalence, conservation laws and nuclear reactions including radioactivity, fission and fusion.", "skills": "Problem Solving\nQuantitative Reasoning\nSystems Thinking", "materials": "Students use an iBook (University Physics, Volume 3, Open Stax), but all course materials beyond the iBook can be in onCampus for Unit 3, and all units.", "assessments": "Spot Check HW assignments\nUnit 3 Problem Set\nPivot Interactive Photoelectric Effect assignment\nPivot Interactive Gas Emission Spectra assignment\nAtomic structure and photon emission/absoprtion Quiz\nUnit 3 Test"}, {"name": "Unit 4"}, {"name": "Project – Alternative Energy Sources", "timeframe": "Roughly 4 weeks (Roughly 12 class meetings)", "concepts": "There is a serious disconnect between our energy dependence, habits, and economic interests and the recognition that we must curb our carbon emissions immediately or risk facing the worst consequences of climate change.  This is the nature of a genuine problem.  It is hard to solve, and the path to its solution is not at all obvious.  Here is where you come in.\n \nYou and your partners will form a team on a mission to consider an alternative to carbon-based fuels for electric power and help the world meet the goals of the Paris Climate Accords.  One team will explore the potential of solar energy as part of an alternative to carbon.  A second team will consider the feasibility of nuclear fission power plants as part of an alternative to carbon.  The third team will focus on hydrogen and nuclear fusion power plants as part of an alternative to carbon.", "skills": "Quantitative Reasoning\nSystems Thinking\nProblem Solving\nCommunication", "materials": "Students use an iBook (University Physics, Volume 3, Open Stax), but all course materials beyond the iBook can be in onCampus for Alternative Energy Project, and all units.", "assessments": "Alternative Energy Proposal Presentation\nAlternative Energy PSA (60-second video commercial)"}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Advanced Science: Biotechnology", "department": "Science", "teacher": "Naomi Kohen", "grade": "", "length": "", "description": "", "competencies": "Data Analysis\nProblem Solving\nSystems Thinking\nCommunication \nQuantitative Reasoning", "units": [{"name": "Unit 1"}, {"name": "Lab 1: DNA extraction", "timeframe": "See OnCampus website", "concepts": "See OnCampus website and syllabus", "skills": "See OnCampus website and syllabus", "materials": "See OnCampus website", "assessments": "HW assignments and lab notebook. See OnCampus website"}, {"name": "Unit 2"}, {"name": "Lab 2: Restriction Enzymes", "timeframe": "See OnCampus website", "concepts": "See OnCampus website and syllabus", "skills": "See OnCampus website and syllabus", "materials": "See OnCampus website", "assessments": "Multiple HW assignments, lab notebook,  and final presentation (group presentations)"}, {"name": "Unit 3"}, {"name": "Unit 3: Crime Scene Investigation and PCR", "timeframe": "See OnCampus website", "concepts": "See OnCampus website and syllabus", "skills": "See OnCampus website and syllabus", "materials": "See OnCampus website and syllabus", "assessments": "HW assignments and Lab Notebook - See OnCampus"}, {"name": "Unit 4"}, {"name": "Lab 4: ELISA", : "Science", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Astronomy", "department": "Science", "teacher": "Flomberg", "grade": "It is open to US students in Classes X, XI and XII", "length": "", "description": "", "competencies": "We have STEM learning targets, not competencies. \nData Analysis\nProblem Solving\nSystems Thinking\nCommunication\nQuantitative Reasoning", "units": [{"name": "Unit 1"}, {"name": "Measurement, The Night Sky, and Tracking Time", "timeframe": "About 3 weeks (roughly 10 class meetings)", "concepts": "In this unit students learn about our night sky and the cyclical nature of much of what we observe.  We will study both our rotation and revolution about the Sun, the Moon's rotation and revolution around Earth, and how we track the passage of time.", "skills": "Quantitative Reasoning\nProblem Solving\nSystems Thinking", "materials": "Students use an iBook (Astronomy 2e, Open Stax), but all course materials beyond the iBook can be in onCampus for Unit 1, and all units.", "assessments": "Spot Check HW assignments\nProblem Set #1\nUNL Astro Motion of the Stars activity\nExplore Learning Eclipses activity\nUnit 1 Test"}, {"name": "Unit 2"}, {"name": "The Solar System", "timeframe": "About 5 weeks (12-14 class meetings)", "concepts": "Charting the motions of those quirky planets is a bit complex.  Mostly the planets seem to move against the grain of the background of much more distant stars, except for when they don't (we're looking at you Mars!).  Why do circular paths for planets let us down?  How can we measure the time it takes another planet to complete its orbit if Earth is moving around the Sun at the same time?  In this topic area students learn about the advances in mathematics and technology, and the explorers who literally shook us out of our imagined place in the universe and set physics and astronomy on a course toward becoming modern sciences.", "skills": "Data Analysis\nQuantitative Reasoning\nProblem Solving\nSystems Thinking", "materials": "Students use an iBook (Astronomy 2e, Open Stax), but all course materials beyond the iBook can be in onCampus for Unit 2, and all units.", "assessments": "Spot Check HW assignments\nProblem Set #2\nProblem Set #3\nFendt: Kepler’s 1st and 2nd Laws simulation\nUNL Astro Planetary Configurations\nUnit 2 Test"}, {"name": "Unit 3"}, {"name": "Optics, Telescopes, and the Nature of Light", "timeframe": "About 4 weeks (roughly 12 class meetings)", "concepts": "In this unit students begin by learning about the wave and particle properties of light and the instruments that gather that light: telescopes.  They will learn that stars emit both visible and non-visible electromagnetic waves, and consider advances in both optical and non-optical astronomy. We will also learn that the light emitted by heated gases is directly related to the atomic identity and structure of the elements.", "skills": "Quantitative Reasoning\nProblem Solving\nSystems Thinking", "materials": "Students use an iBook (Astronomy 2e, Open Stax), but all course materials beyond the iBook can be in onCampus for Unit 3, and all units.", "assessments": "Spot Check HW assignments\nProblem Set #4\noPhysics wave interference activity\noPhysics double slit diffraction activity\nExploring Learning Bohr model activity\nUnit 3 Test"}, {"name": "Unit 4"}, {"name": "The Sun and Stellar Classification", "timeframe": "About 3-4 weeks (roughly 8 to 10 class meetings)", "concepts": "Students learn about the Sun from the inside out and come to understand the process in which it has been radiating almost unfathomable amounts of energy for over 4.5 billion years.  Our Sun is the biggest star near us, but nothing more than an ordinary sized star when compared to others in our galaxy and beyond.  They will learn how to classify main-sequence, or hydrogen fusing stars by their temperature and luminosity.  If time allows, we will study how stars are born, how they maintain hydrostatic equilibrium through the primes of their lives, and ultimately how they die.", "skills": "Quantitative Reasoning\nData Analysis\nProblem Solving\nSystems Thinking", "materials": "Students use an iBook (Astronomy 2e, Open Stax), but all course materials beyond the iBook can be in onCampus for Unit 4, and all units.", "assessments": "Spot Check HW assignments\nProblem Set #5 (if time allows)\nExplore Learning Big Bang Theory activity\nExplore Learning H-R Diagram activity"}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "First Grade Science", "department": "Science", "teacher": "Amy Helgeson", "grade": "", "length": "", "description": "", "competencies": "Scientific Observation: Testing and describing the properties of rocks, minerals, and matter.\nCritical Systems Thinking: Understanding natural cycles such as the rock cycle and insect metamorphosis.\nAction towards a Better Future: Investigating human impact on the Earth’s surface and environment.\nExperimental Design: Using scientific tools to measure mass, volume, and insect strength.", "units": [{"name": "Unit 1"}, {"name": "Geology", "timeframe": "Trimester", "concepts": "Rocks have observable properties including composition, hardness, color, and luster.\nThe Rock Cycle: Rocks change over time through heat, pressure, weathering, erosion, and deposition.\nClassification of rocks into three types: Sedimentary, Igneous, and Metamorphic.\nMinerals have specific properties such as luster, streak, and textural features.", "skills": "Using classification keys to identify rock and mineral samples.\nSorting materials by physical properties like streak, luster, hardness\nScientific sketching and labeling of natural cycles.", "materials": "Rock samples (granite, gneiss, slate, limestone, shale, sandstone, coal).\nMineral samples.\nStarburst candy for cycle modeling.\nStreak plates\nFlashlight\nNail file\npenny", "assessments": "Lab Performance \nVerbal Participation\nWorksheet \nProject Artifacts"}, {"name": "Unit 2"}, {"name": "States of Matter", "timeframe": "Trimester", "concepts": "Everything is made of matter, which has weight and takes up space.\nThe three phases of matter and their properties.\nHeat and Freezing changes states of matter.\nPhysical vs. Chemical changes.\nProperties of liquids: cohesion, adhesion, and surface tension.\nDifferences between mixtures and solutions.", "skills": "Measuring mass, volume, and length using balance scales, graduated cylinders, and metric rulers.\nExperimenting with heat and cold to induce phase changes.\nTesting solubility to determine if a substance forms a mixture or solution.", "materials": "Cheerios, Jell-O, ice cream ingredients, cornstarch.\nCrayons, ice cubes, alka-seltzer, clay.\nBalance scales, graduated cylinders, metric rulers, hairdryers.\nPennies, paper clips, marbles, pipe cleaners, straws.", "assessments": "Lab Performance\nVerbal Participation (oral predictions before an experiment) \nWorksheet \nProject Artifacts"}, {"name": "Unit 3"}, {"name": "Entomology", "timeframe": "Trimester", "concepts": "Insect anatomy: Head, thorax, abdomen, exoskeleton, and compound eyes.\nLife cycles: Egg, larvae, pupa, and adult; Complete vs. Incomplete metamorphosis.\nHabitat requirements: Nonliving components like water, soil, and sunlight.\nInsect behaviors: Communication, social hierarchy, care for young.", "skills": "Proper handling of live insects\nScientific sketching using graph paper and rulers vs. artistic drawing.\nTesting variables such as odor and light preference on insect behavior.", "materials": "Painted Lady larva\nRulers\nBubble paper\nLegos\nSupplies for exoskeleton drop", "assessments": "Lab Performance \nVerbal Participation (oral predictions before an experiment) \nWorksheet \nProject Artifacts"}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Second Grade Science", "department": "Science", "teacher": "Amy Helgeson", "grade": "", "length": "", "description": "", "competencies": "Critical systems thinking: Analyzing how individual parts work together within the human body and electrical circuits.\nAction towards a better future: Investigating human impact on global water resources and designing filtration solutions.\nScientific modeling: Constructing 3D representations of watersheds, organ systems, and electrical pathways.", "units": [{"name": "Unit 1"}, {"name": "Water Ecology", "timeframe": "September - November", "concepts": "Water is essential to life and distributed globally in various forms.\nPollution moves through a watershed from both point and non-point sources.\nStream quality can be identified by classifying aquatic macroinvertebrate populations.\nWetlands act as natural filters that remove sediment and toxins from water.\nStrategies for reducing individual impacts on water resources.", "skills": "Classifying macroinvertebrates to determine the health of different water samples.\nDesigning and constructing 3-dimensional watershed models.\nEngineering natural filtration systems to remove pollutants.\nExploring mechanical energy through the construction of water wheels.", "materials": "Salt water and freshwater samples\nMacroinvertebrate specimens\nMaterials for 3D watershed modeling \nNatural filtration materials \nWater wheel components", "assessments": "Lab Performance \nVerbal Participation\nWorksheet & Visual Evidence\nProject Artifacts"}, {"name": "Unit 2"}, {"name": "Electricity", "timeframe": "Trimester", "concepts": "Electricity flows through pathways called circuits.\nSwitches function by opening and closing these electrical pathways.\nConductors allow electricity to flow, while insulators resist the flow.\nSeries circuits share a single pathway; parallel circuits provide multiple direct pathways.\nStatic electricity occurs in nature as electrostatic discharge.", "skills": "Building and troubleshooting a simple circuit to create ornament\nBuilding and troubleshooting series and parallel circuits to create a safety vest\nTesting classroom materials to categorize them as insulators or conductors.\nBuilding and troubleshooting open and closed circuits to build a flashlight\nBuilding and troubleshooting open and closed circuits, series and parallel circuits, conductors and insulators to build a board game", "materials": "Light bulbs and sockets\nMotors and switches\nBatteries and battery holders\nWires and alligator clips\nIron or steel cores for electromagnets\nSquishy circuit dough\nBalloons for static electricity labs", "assessments": "Lab Performance \nVerbal Participation\nWorksheet & Visual Evidence\nProject Artifacts"}, {"name": "Unit 3"}, {"name": "Human Body", "timeframe": "Trimester", "concepts": "A system is a group of parts working together as a whole.\nThe circulatory system uses the heart to pump blood throughout the body.\nThe respiratory system (lungs) takes in oxygen and removes carbon dioxide.\nThe skeletal and muscular systems provide shape, support, and movement.\nThe nervous system (brain) sends signals to control all body functions.", "skills": "Modeling biological functions using physical materials \nMeasuring and tracking heart rate changes during physical exercise.\nIdentifying the specific jobs of major organs and how they interact and work together", "materials": "Balloons and plastic bottles for lung models\nQ-tips skeletal models\nMaterials to make heart pump\nMaterials to make robot hand", "assessments": "Lab Performance \nVerbal Participation\nWorksheet & Visual Evidence\nProject Artifacts"}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Grade III", "department": "Science", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Class III Science", "department": "Science", "teacher": "Paul Weaver", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Motion and Design", "timeframe": "1 Trimester", "concepts": "A force is a push or a pull. \nAn unbalanced force is required to change an object's motion.\nGreater forces cause a greater change in motion.\nFriction as a resisting force that occurs when two surfaces rub together. \nIncrease or decrease friction to modify their vehicle's performance.\nChanging the mass affects a vehicle's acceleration and distance. \nIf the same force is applied, a lighter vehicle accelerates faster than a heavier one.\nEnergy can be stored (like in a stretched rubber band or a raised weight) and released to turn an axle to create kinetic motion.", "skills": "Identifying and controlling variables. \nUsing tools such as  tape measures to record distance and stopwatches to measure time.\nGathering raw data over multiple trials, recording it in data tables, and translating  that data into bar or line graphs to visually identify trends.\nUsing concrete numerical evidence to support conclusions.\nInterpreting and Creating Technical Drawings.\nPrototyping and Iterative Testing.\nDesigning Under Constraints such as limited time or materials\nCollaborative Problem Solving.\nCommunicating Technical Ideas.", "materials": "STC Unit: Motion and Design", "assessments": "Science notebooks:  Students record observations and measurements from vehicle investigations, create diagrams and label vehicle designs, and reflect on how design changes affected performance.\nClass discussions:  Students explain how forces affect motion, share evidence from investigations, and compare different vehicle designs and their effectiveness.\nInvestigation observations: Assess students as they use tools appropriately, measure distances accurately, collect and record data, and work collaboratively with partners or teams.\nData tables and graphs:  Students record results from vehicle tests, identify patterns in data, and draw conclusions based on evidence.\nClaim-Evidence-Reasoning:  Students support their claim with data collected during investigations.\nFinal design project: Students create and present a vehicle that demonstrates what they learned about motion and design."}, {"name": "Unit 2"}, {"name": "How Do Weather and Climate Affect Our Lives? (new unit for 2026-270", "timeframe": "1 Trimester", "concepts": "Weather describes the conditions of the atmosphere at a particular time and place.\nWeather can change from hour to hour and day to day.\nCommon weather conditions include:Temperature Precipitation, Wind, Cloud cover, Humidity\nClimate is the typical pattern of weather in a region over many years.\nDifferent regions have different climates.\nClimate influences what plants and animals can survive in an area.\nWeather follows patterns that can be observed over time.\nScientists use weather data to make forecasts.\nPatterns help people prepare for changing weather conditions.\nDifferent seasons have characteristic weather patterns.\nChanges in temperature, daylight, and precipitation occur throughout the year.\nSeasonal weather affects plants, animals, and human activities.\nPlants and animals depend on weather conditions for survival.\nWeather influences growth, migration, hibernation, and behavior.\nExtreme weather can affect habitats and ecosystems.\n  Weather Affects Human Activities", "skills": "Record, graph, and interpret daily weather data to predict short-term changes.\nAnalyze data from around the world to describe regional climate differences.\nEvaluate how extreme weather impacts human structures and communities.\nBuild and improve a weather-resistant roof prototype by evaluating failure points.\nRepresent data in tables and graphical displays to describe typical weather conditions expected during a particular season.\nObtain and combine information to describe climates in different regions of the world.\nMake a claim about the merit of a design solution that reduces the impacts of a weather-related hazard.\nDefine a simple design problem reflecting a need or a want.", "materials": "Smithsonian Science for the Classroom:  How Do Weather and Climate Affect Our Lives?", "assessments": "Weather Journals: Check their daily logs for accuracy and completeness.\nData Graphing: Assess their ability to transfer raw data into local weather bar graphs.\nPattern Predictions: Evaluate their responses to prompts like, \"Based on our data from the last four days, what is the most likely weather for tomorrow?”\nThe Photo/Data Puzzle: Give students a climate data table and a photograph of an unknown location and assessment if the student  can correctly identify the climate zone.\nHemisphere Comparison: Assess their understanding of seasonal patterns. Can they explain why a city in Australia has its warmest weather in December while your hometown is cold?\nAssess if students know the difference between weather and climate? Do they understand that natural hazards cannot be stopped, but their impact can be reduced?\nSummative Assessment: The Roof Design Challenge:  Students design a roof prototype to protect a house from high winds and heavy rain.  Did the student draw a clear design before building? Did they list their materials and explain why they chose them to fight wind or rain? Did they follow the testing constraints?"}, {"name": "Unit 3"}, {"name": "Ecosystems and Habitats (or The Secret Life of the Turtle Pond)", "timeframe": "1 Trimester", "concepts": "Living things within an ecosystem depend on each other and their non-living surroundings to survive. Students understand that the red-eared sliders, dragonflies, and algae (biotic) rely on the pond’s water, sunlight, and rocks (abiotic) for shelter, warmth, and oxygen. If one piece is missing, the whole system changes.\nOrganisms possess specific physical traits and behaviors that allow them to thrive in their unique environment.  Students observe how water lilies have wide, flat leaves to float and catch sunlight, while turtles have webbed feet for swimming and shells for protection, proving they are perfectly suited for a freshwater pond habitat rather than a forest or ocean.\nEven in the middle of a major city, urban green spaces provide crucial habitats that support a wide variety of life.  Students realize that Central Park isn't just for humans; the Turtle Pond is a thriving, diverse ecosystem supporting birds (like herons), insects, amphibians, fish, and mammals right in the heart of Manhattan.\nAll living things in a habitat are connected through food chains that trace their energy back to the sun..  Students can map out how energy moves from the sun to the pond algae, to the insects or tadpoles, and finally to the turtles or large fish.\nEcosystems are constantly changing, and human actions can directly help or harm the health of a habitat.  Students examine how litter, runoff from city streets, or feeding the wildlife affects the pond's water quality and animal health, empowering them to see themselves as caretakers of their local environment.", "skills": "Analyzing and interpreting data\nConstructing explanations\nObtaining, evaluating, and communicating information\nPlanning and carrying out investigations\nObjective observation vs. inference\nField journaling\nMapping cause and effect\nUsing data as proof\nAnalyzing survival\nHuman impact awareness", "materials": "Various found materials", "assessments": "Science Notebooks: Field journal entries  and lab worksheets tracking weather, labeled sketches, and categorized lists of living (biotic) and non-living (abiotic) factors.\nClass Discussions: Participation in collaborative reflections, sharing field observations, and building on classmates' ideas after returning from the pond.\nInvestigation Observations: Real-time checks during field studies excursions to evaluate how accurately and safely students observe and record wildlife interactions.\nData Tables and Graphs: Student-created charts organizing pond data, such as graphing the population numbers of different organisms observed over time.\nClaim-Evidence-Reasoning (CER) Tasks: Short written arguments where students use their direct pond data to prove why a specific organism survives well in that habitat.\nScenario-Based Problem Solving: Quick checks evaluating a student's ability to propose solutions to environmental changes, such as the impact of too much fertilizer  on the pond."}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Class IV", "department": "Science", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Class IV Science", "department": "Science", "teacher": "Paul Weaver", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "How can animals use their senses to communicate?", "timeframe": "1 Trimester", "concepts": "Objects are visible because light reflected from their surface reaches our eyes.\nInternal and external eye structures support different functions for survival.\nAnimals have a variety of specialized sense receptors for different information.\nInformation from the senses is processed in the brain.\nInformation from multiple senses and memories is integrated for decision-making.\nCommunication requires a sender, signal, and receiver; it is impossible without a receiver.\nPlants have structures that support survival and can communicate information to animals.\nComputers send messages as digital signals (1s and 0s).\nFireflies use species-specific flash patterns to identify mates.", "skills": "Construct an argument that plants and animals have internal and external structures that function to support survival, growth, behavior, and reproduction.\nUse a model to describe that animals receive different types of information through their senses, process the information in their brain, and respond to the information in different ways.\nDevelop a model to describe that light reflecting from objects and entering the eye allows objects to be seen.\nGenerate and compare multiple solutions that use patterns to transfer information.\nDefine a simple design problem reflecting a need or a want that includes specified criteria for success and constraints on materials, time, or cost.", "materials": "Smithsonian Science for the Classroom: How Can Animals Use Their Senses to Communicate?", "assessments": "Science Journals: Student drawings or written descriptions of sensory structures (like ears or eyes) and how they function.\nStudent Models: Students  draw a diagram showing the path of a signal.\nThink-Pair-Share: Are students using evidence to explain why an animal might use sound instead of light in a dark forest?\nInvestigation Skills. Can the student carry out a fair test to see how light travels?\n\n  Data Collection Do they accurately record observations of animal behaviors?\n  Argumentation  Can they state a claim (e.g., \"The frog uses sound to find a mate\") and    back it up with data?\nThe Design Challenge: Students are asked to solve a human problem using what they learned about animal senses. For example, designing a way to communicate over a distance using light or sound."}, {"name": "Unit 2"}, {"name": "How Can We Use the Sky to Navigate?", "timeframe": "1 trimester", "concepts": "Ships sailing at the horizon provide evidence that Earth is spherical.\nShadows provide evidence that Earth is spherical.\nGravity is a force directed toward the center of a spherical Earth.\nThe Sun appears larger and brighter than other stars because it is closer.\nThe Sun’s daily motion provides evidence that Earth rotates on an axis.\nThe daily motion of the stars provides evidence that Earth rotates on an axis.\nSome constellations are not visible all year.\nEarth’s revolution around the Sun causes variation in daylight.\nPredictable patterns in the night sky can be used to solve a navigational problem.\nObservations of the sky can be used to navigate a boat.\nScientific arguments are based on evidence.", "skills": "Support an argument that differences in the apparent brightness of the sun compared to other stars is due to their relative distances from the Earth.\n\nRepresent data in graphical displays to reveal patterns of daily changes in length and direction of shadows, day and night, and the seasonal appearance of some stars in the night sky.\n\nSupport an argument that the gravitational force exerted by Earth on objects is directed down.\n\nDefine a simple design problem reflecting a need or a want that includes specified criteria for success and constraints on materials, time, or cost.", "materials": "Smithsonian Science for the Classroom: How Can we Use the Sky to Navigate", "assessments": "Science notebook\n Check student observations, diagrams of the sky, moon phases, constellations, and navigation ideas.\nClass discussions\n Listen for how students explain patterns in the sky and use evidence to support ideas.\nModels and drawings\n Assess student-created models showing how the Sun, stars, or constellations can help people navigate.\nHands-on investigations\n Observe students during activities:\nNavigation challenge\n Students use a star map or model sky to determine direction.\nClaim-Evidence-Reasoning (CER) writing\n Example prompt:\n “How can people use the sky to help them travel?”\n Engineering/design task\n Students design a simple tool, map, or guide to help someone navigate using the sky.\nPresentation or explanation\n Students explain:\nhow the sky changes over time\nhow people have used stars for navigation historically"}, {"name": "Unit 3"}, {"name": "Simple Machines and Rube Goldberg Machines", "timeframe": "1 Trimester", "concepts": "Energy Transfer and Transformation\nSimple Machines\nForces and Motion\nThe Engineering Design Process", "skills": "Students can define a simple problem, including specific criteria and constraints.\nStudents can brainstorm multiple possible solutions and select one based on evidence and feasibility.\nStudents can plan and sketch a multistep design, labeling parts and showing how each step connects.\nStudents can build and test a Rube Goldberg machine that performs a simple task through a chain reaction.\nStudents can modify their design based on test results, identifying what worked well and what needs improvement.\nStudents can describe how energy transfers from one object to another.\nStudents can explain how simple machines can reduce effort or change the direction of a force.\nStudents can identify cause-and-effect relationships in their machine.\nStudents can predict how changes to their design will affect motion and outcomes.", "materials": "Lots of cardboard and random stuff.", "assessments": "Design blueprint: Assess their initial sketch.\nTroubleshooting Logs: \"What didn't work today, and how did you change your design to fix it?\"\nEnergy Transfer Can the student point to a spot and say, \"The energy moves from the domino to the marble\"?\nSimple Machines Can they label the \"ramp\" as an inclined plane or the \"teeter-totter\" as a lever?\nPerformance Assessment\nStep Count: Did they include the required number of steps (e.g., 4 or 5 separate energy transfers)?\nMachine Variety: Did they use at least three different types of simple machines?\nThe \"Task\": Did the machine actually complete the assigned goal"}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Grade IX Core (Biology)", "department": "Science", "teacher": "Spina/Ward", "grade": "", "length": "", "description": "", "competencies": "", "units": [{"name": "Unit 1"}, {"name": "Unit 1- The Ghost Map", "timeframe": "3 months", "concepts": "Topic 1- Scientific Methodology\nTopic 2- Water\nTopic 3- Pathogens and the Immune System\nTopic 4- Cells\nTopic 5- Ghost Map Project", "skills": "Data Analysis\nProblem Solving\nSystems Thinking\nCommunication Skills", "materials": "The Ghost Map By Steven Johnson\nMicroscopes\nVarious Prepared Slides", "assessments": "Workbook #1\nProperties of Water Lab\nWater Unit Workbook\nEgg Transport Lab\nWater Discussion Thread\nELISA Lab workbook\nBacteria Lab\nBacteria Workbook\nPlant Cell Plasmolysis\nGhost Map Final Poster/Project\nMicroscope Lab Practical and end of Unit test - Go formative"}, {"name": "Unit 2"}, {"name": "The Life of a Cell", "timeframe": "After Thanksgiving until End of 1st Semester", "concepts": "Cellular Division\nAsexual and Sexual Reproduction\nMitosis\nCancer", "skills": "Microscopic Skills", "materials": "Microscope\nSlides of sexual and asexual reproduction\nHHMI \nMitosis Onion Root Slides", "assessments": "Unit 2 Workbook 1\nUnit 2 Workbook 2\nUnit 2 Workbook 3\nUnit 2 Workbook 4\nUnit 2 Workbook 5\nFinal Assessment"}, {"name": "Unit 3"}, {"name": "DNA Structure and Function, Protein Synthesis and Enzymes", "timeframe": "4 weeks", "concepts": "Structure of DNA \nStructure of RNA\nThe Central Dogma- Transcription and Translation (Protein Synthesis)", "skills": "Understanding DNA and RNA\nUnderstanding Protein Synthesis\nUnderstanding DNA Mutations", "materials": "", "assessments": "Insulin Translation Activity\nUnit 3 Workbook 1\nUnit 3 Workbook 2\nUnit 3 Workbook 3\nUnit 3 Workbook 4\nUnit 3 Workbook 5\nEnzyme Lab"}, {"name": "Unit 4"}, {"name": "Genetics and Hereditary", "timeframe": "4 weeks", "concepts": "Meiosis\nMendelian Genetics", "skills": "Understanding Mendelian genetics and different inheritance patterns\nUsing Punnet Squares to calculate probability", "materials": "VGL Software for Mendelian Genetics", "assessments": "Unit 4 Workbook 1\nUnit 4 Workbook 2\nUnit 4 Workbook 3\nVGL In class Assessment"}, {"name": "Unit 5"}, {"name": "Energy Transfer", "timeframe": "4-5 weeks", "concepts": "Photosynthesis and respiration\nFollowing the energy flow through ecosystems\nUnderstanding the relationships between organisms in ecosystems\nDetermining the impact a change may have on an ecosystem,", "skills": "", "materials": "HHMI Stress Activity", "assessments": "Energy Transfer Quiz 1\nEnergy Transfer Quiz 2\nHHMI Stress Activity"}, {"name": "Unit 6"}, {"name": "Evolution", "timeframe": "2 weeks", "concepts": "Understanding evolution and Natural Selection\nAnalyzing evolutionary evidence", "skills": "", "materials": "", "assessments": "Unit 6 Workbook Part 1\nUnit 6 Workbook Part 2\nUnit 6 Workbook Part 3\nUnit 6 Workbook Part 4"}, {"name": "Unit 7"}, {"name": "River Species Project", "timeframe": "Last 5 weeks", "concepts": "Making a story map using ArcGis", "skills": "Computer and programming skills", "materials": "Arc Gis Site", "assessments": "River Species Project"}]}, {"name": "Science of Me", "department": "Science", "teacher": "2025-2026 Becky Somogyi, Rachel Rodriguez, Liz Gatlin", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Scientific Method/Are we made of matter?", "timeframe": "3 months", "concepts": "Observations and inferences\nTestable/experimental questions \nExperimental Variables \nProperties of water \nMetric system\nLength, mass, volume, temperature \nFoundations of matter\nMatter, mass, volume, measuring matter\nMolecular motion", "skills": "Scientific inquiry \nData visualization and graphing \nLaboratory precision \nApplying the metric system", "materials": "Laboratory tools\nTriple beam balance \nGraduated cylinders \nRulers\nThermometers", "assessments": "Notebook checks\nLaboratory worksheets \nTest on measurement \nPracticum"}, {"name": "Unit 2"}, {"name": "How are living things organized?", "timeframe": "2 months", "concepts": "Characteristics of living things\nLiving Vs. Nonliving \nLevels of biological organization\nCell theory\nProkaryotic vs eukaryotic cells\nOrganelle structure and function\nCell specialization", "skills": "Microscopy proficiency \nScientific observation and inference \nScientific data tracking \nResearch skills \nSystems thinking", "materials": "Microscope lab equipment \nMicroscope, microscope slides\nModel building materials \nTechnology platforms", "assessments": "Notebook checks\nProjects\nCell city\nSpecialized cells\nMicroscope skill assessment"}, {"name": "Unit 3"}, {"name": "How does my body protect me from the outside world?", "timeframe": "1.5 months", "concepts": "Integumentary system \nSkin\nBodily protection\nExcretion and regulation\nSun exposure and protection \nPathogen world \nBacteria vs viruses \nTransmission pathways \nImmune system \nInnate vs adaptive immunity\nWhite blood cells \nImmune memory and vaccines", "skills": "Culturing and growing bacteria \nData mapping and infectious spreading \nMicroscope visual analysis \nScientific modeling", "materials": "Microbiology equipment \nPetri dishes, swabs, incubator, microscopes\nUV beads\nSunscreen \nDIgital learning tools", "assessments": "Notebook checks\nQuiz and lab reports \nUnit test\nProject"}, {"name": "Unit 4"}, {"name": "How does my body get energy and get rid of waste?", "timeframe": "2 months", "concepts": "Gastrointestinal digestive journey \nMechanical vs chemical digestion \nNutrition and metabolism \nExcretory system", "skills": "Chemical indicator lab assays\nPhysiological systems modeling\nMedical diagnostic and clinical logic \nChemical handling and proper lab technique", "materials": "Nutrient testing materials \nSimulations and other technology tools", "assessments": "Notebook checks \nUnit test \nPracticum \nDiagnosing patients using urinalysis and digestive system tests (endoscopy)\nDIgestive system scaled model organ research project"}, {"name": "Unit 5"}, {"name": "What is energy? How do we harness solar energy? Interdisciplinary capstone project", "timeframe": "1 month", "concepts": "Energy sources\nRenewable vs nonrenewable \nSolar energy \nHeat transfer \nThermodynamics of material absorption and retention \nInsulation \nSurface area and volume", "skills": "Mathematical volume calculation \nScientific hypothesis formulation\nMetric measurement \nData logging \nGraphing \nMetric conversion", "materials": "Solar collectors\nThermometers\nOutdoor space", "assessments": "Project\nNotebook checks"}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Class VI Science", "department": "Science", "teacher": "Rachel Rodriguez, Becky Somogyi", "grade": "", "length": "", "description": "", "competencies": "Stem Learning Targets\nData Analysis:  Effectively gather, organize, analyze, and evaluate data and their trends, make reasoned choices in representing data, and fluently toggle between symbolic and visual representations of the data.\nProblem Solving:  Create, troubleshoot, and persist through challenges to execute a logical course of action given fact patterns and observations to reach reasonable conclusions to complex questions.\nSystems Thinking:  Analyze interconnected components within complex systems, identify feedback loops, manipulate inputs, and predict outcomes of a change in a system.\nCommunication:  Comprehend STEM literature, evaluate sources, and articulate their understanding in multimodal formats to diverse audiences.\nQuantitative Reasoning:  Measure, estimate, compute, and apply mathematical techniques and algorithmic thinking to models and phenomena.", "units": [{"name": "Unit 1"}, {"name": "Intro to Forensics", "timeframe": "~ 7 weeks", "concepts": "Introduction to Forensics: Definition and history of forensic science (e.g., Edmond Locard).\nLocard’s Exchange Principle: The fundamental concept that \"every contact leaves a trace.\"\nEvidence Classification: Distinguishing between direct evidence (eyewitness accounts) and circumstantial evidence (physical/biological).\nSearch Patterns: Systematic methods for searching a crime scene, such as:\nGrid search\nLinear/Strip search\nSpiral search\nQuadrant/Zone search\nThe Crime Scene Team: Roles and responsibilities of personnel including first responders, investigators, medical examiners, and specialists.\nCrime Scene Processing: The \"7 S's\" of crime scene investigation (Securing the scene, Separating witnesses, Scanning, Seeing, Sketching, Searching, and Securing evidence).", "skills": "Data Analysis: Systematic Data Collection and Qualitative Analysis\nProblem Solving: Investigative Design and Evidence-Based Conclusions\nSystemic Thinking: Modeling Complex Interactions and Process Integrity\nCommunication: Evaluating and Communicating Forensic Information\nQuantitative Reasoning: Mathematical Modeling and Computational Thinking", "materials": "Worksheets (either found through credible online sources, or independently developed)\nLab materials such as: gloves, measuring tape/rulers, calculators, graph paper, test tubes/ test tube racks, graduated cylinders, triple beam balances, etc. \nNotebooks\nChromebooks", "assessments": "2 quizzes: one halfway through the unit and one at the very end"}, {"name": "Unit 2"}, {"name": "Forensic Chemistry", "timeframe": "~ 5 weeks", "concepts": "Fiber Classification: Distinguishing between natural fibers (animal, plant, mineral) and synthetic fibers (regenerated and polymers)\nFiber Analysis Techniques: Microscopy and methods (chemical dissolution)\nTransfer of Evidence: Primary vs. secondary transfer and the persistence of fiber evidence over time\nTextile Science: Weave patterns and thread count\nChemical Composition: Monomers vs. polymers and the specific chemical makeup of fibers like wool (protein), cotton (cellulose), and nylon (synthetic), physical versus chemical properties\nPeriodic Table Introduction: Periodic table trends, chemical bonding, and Bohr models.", "skills": "Data Analysis: Qualitative and Quantitative Fiber Identification \nProblem Solving: Logic and Evidence Management\nSystems Thinking: Analysis of Polymerization and Material Life Cycles, Analysis of Periodic Trends\nQuantitative Reasoning: Mathematical Modeling", "materials": "Worksheets (either found through credible online sources, or independently developed)\nLab materials such as: hand lenses, microscopes, different fabrics, calculators, graph paper, test tubes/ test tube racks, graduated cylinders, etc. \nNotebooks\nChromebooks", "assessments": "1 Major assessment at the end of the semester"}, {"name": "Unit 3"}, {"name": "DNA, Genetics, and Mitosis", "timeframe": "~ 5 weeks", "concepts": "DNA Structure: The double helix, sugar-phosphate backbone, and nitrogenous bases.\nBase Pairing Rules: The specific bonding of Adenine-Thymine and Cytosine-Guanine.\nThe Cell Cycle: The life of a cell, including interphase and the stages of division.\nMitosis: The process of nuclear division (Prophase, Metaphase, Anaphase, Telophase).\nGenetics and Heredity: How traits are passed from parents to offspring.\nGenotypes and Phenotypes: Distinguishing between genetic code (alleles) and physical appearance.", "skills": "Data Analysis: Genetic Pattern Recognition\nProblem Solving: Hereditary Logic\nSystems Thinking: The Cell Cycle and Replication\nQuantitative Reasoning: Probability Modeling (punnett squares)", "materials": "Worksheets (either found through credible online sources, or independently developed)\nLab materials such as: gloves, measuring tape/rulers, calculators, graph paper, test tubes/ test tube racks, graduated cylinders, microscopes, etc. \nNotebooks\nChromebooks", "assessments": "2 quizzes: one halfway through the unit and one at the very end"}, {"name": "Unit 4"}, {"name": "Energy Roles in Ecosystems", "timeframe": "~ 7 weeks", "concepts": "The Theory of Evolution: Natural selection, survival of the fittest, and how genetic mutations lead to favorable adaptations over generations.\nEcological Interactions: Organism requirements for survival, competition, predation, and types of symbiotic relationships (mutualism, commensalism, parasitism).\nLevels of Ecological Organization: Mapping relationships from individual organisms up to populations, communities, ecosystems, biomes, and the biosphere.\nEvolutionary Relationships: Understanding shared ancestry using tools like cladograms and phylogenetic trees across the three domains of life.\nEnergy Roles & Flow: Classifying autotrophs (producers) and heterotrophs (consumers, decomposers) and tracking energy transfer via food chains and food webs.\nCellular Energetics: The biochemical processes of photosynthesis (chloroplast inputs/outputs) and cellular respiration (mitochondria converting glucose to ATP).\nEcosystem Dynamics: The roles of keystone species in holding systems together and the ecological disruptions caused by invasive or endangered species.", "skills": "Data Analysis: Effectively gather, organize, and categorize complex ecological data.\nProblem Solving: Mushroom Project - Variable Manipulation\nQualitative Reasoning: Using Lab Journal Data to develop conclusions and further predictions.", "materials": "Worksheets (either found through credible online sources, or independently developed)\nLab materials such as: gloves, measuring tape/rulers, calculators, graph paper, test tubes/ test tube racks, graduated cylinders, microscopes, etc. \nNotebooks\nChromebooks", "assessments": "Capstone Project: maintenance of lab journals throughout mushroom project\nSmaller projects and labs related to ecological concepts"}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Sustainable World", "department": "Science", "teacher": "Danielle Coggin", "grade": "", "length": "", "description": "", "competencies": "Data Analysis:  Effectively gather, organize, analyze, and evaluate data and their trends, make reasoned choices in representing data, and fluently toggle between symbolic and visual representations of the data.\nProblem Solving:  Create, troubleshoot, and persist through challenges to execute a logical course of action given fact patterns and observations to reach reasonable conclusions to complex questions.\nSystems Thinking:  Analyze interconnected components within complex systems, identify feedback loops, manipulate inputs, and predict outcomes of a change in a system.\nCommunication:  Comprehend STEM literature, evaluate sources, and articulate their understanding in multimodal formats to diverse audiences.\nQuantitative Reasoning:  Measure, estimate, compute, and apply mathematical techniques and algorithmic thinking to models and phenomena.", "units": [{"name": "Unit 1"}, {"name": "The Hydrosphere:  Earth’s Lifeblood: Water, Resources, and Sustainability", "timeframe": "Sept - Jan", "concepts": "Water on Earth\nWater Cycle\nProperties of Water\nPhases of Water\nTracing NYC water sources\nPorosity & Permeability\nWater Testing/Chemistry\nWater Filtration", "skills": "Collaboration\nEngineering/Design\nProblem Solving/Real World Application\nData Collection & Analysis", "materials": "https://drive.google.com/drive/folders/1uwGTdhdCFRfBglYT1mZwrhbyXqTvlRMz?usp=drive_link", "assessments": "Assessments, Labs, & Water Filter Project"}, {"name": "Unit 2"}, {"name": "The Biosphere", "timeframe": "January - Feb", "concepts": "", "skills": "", "materials": "", "assessments": "STEM Plant System Project"}, {"name": "Unit 3"}, {"name": "The Geosphere:  Exploring our Dynamic Planet:  Matter & Earth’s Structure", "timeframe": "March - June", "concepts": "Composition of the Earth\nDensity of Earth’s Materials\nMatter:  Atoms to Compounds\nMinerals & their properties\nChemical reactions\nCrystallization & Igneous Rocks\nPlate Tectonics & Convection", "skills": "Interpreting & Analyzing Maps\nOrganizing & Interpreting Data\nMaking observations\nDeveloping CER’s\nScientific argument from evidence\nScaling & Modeling", "materials": "https://drive.google.com/drive/folders/1Ju9XYLfZiqMt9NUjH_U9CMFL-3nP3-1d?usp=drive_link\nhttps://drive.google.com/drive/folders/1yvu5nBzlGJSKMKbLjc5gSgzBeRYrpHgN?usp=drive_link\nhttps://drive.google.com/drive/folders/1lhjlMNdDqFKT98592z0KF-u6e18V1_yY?usp=drive_link", "assessments": "Quizzes (metric measurement)\nTests (Plate Tectonics, Atomic Structure & Bonding)\nLabs (Density of Earth’s Layers, Mineral ID Lab, Earthquake Structures)\nProjects (Earth’s Layers Models)"}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Physical Science", "department": "Science", "teacher": "Danielle Coggin", "grade": "", "length": "", "description": "", "competencies": "Data Analysis:  Effectively gather, organize, analyze, and evaluate data and their trends, make reasoned choices in representing data, and fluently toggle between symbolic and visual representations of the data.\nProblem Solving:  Create, troubleshoot, and persist through challenges to execute a logical course of action given fact patterns and observations to reach reasonable conclusions to complex questions.\nSystems Thinking:  Analyze interconnected components within complex systems, identify feedback loops, manipulate inputs, and predict outcomes of a change in a system.\nCommunication:  Comprehend STEM literature, evaluate sources, and articulate their understanding in multimodal formats to diverse audiences.\nQuantitative Reasoning:  Measure, estimate, compute, and apply mathematical techniques and algorithmic thinking to models and phenomena.", "units": [{"name": "Unit 1"}, {"name": "Unit 1:  Forces and Motion: The Physics of Our World", "timeframe": "Sept - Mid-Dec", "concepts": "Describing Motion \nSpeed, Velocity, Acceleration\nApplying Newton’s Laws to objects in motion\n\nObserving how gravity and friction affect the motion of objects", "skills": "Calculating using motion formulas\nInterpreting and graphing motion data\nDiagramming forces acting on objects \nIdentifying types of forces\nCollecting & Analyzing data", "materials": "https://drive.google.com/drive/folders/1ChjoK02BBqrFoWx3FvhfG_If52e7ZwkK?usp=drive_link", "assessments": "Motion Assessment\nLabs (Motion Lab, Friction Lab)\nEggstronaught Project"}, {"name": "Unit 2"}, {"name": "Unit 2: Lumen:  Earth & Stars", "timeframe": "January - Mid March", "concepts": "Earth’s place in space\nDistance and scale\nSpace measurements\n\nStars\nComposition, life cycle, energy, nuclear fusion\nLight\nProperties of light\nTypes of radiation", "skills": "Constructing scale models\nUsing evidence based reasoning\nPredicting outcomes\nDistinguishing correlation vs causation \nUsing measurement tools\nDiagramming\nMaking observations & Inferences", "materials": "https://drive.google.com/drive/folders/1lxktl8VQXp-a6-qbcCduXQ9AQgNoUUsw?usp=drive_link", "assessments": "Quiz (Earth & Space)\nTests (Stars & Light)\nLab (Properties of Light, Spectroscopy)\nProjects:  Life Cycle of a Star Skit, Fusion Animations"}, {"name": "Unit 3"}, {"name": "Unit 3: Earth's Changing Climate: A Scientific Inquiry", "timeframe": "April - June", "concepts": "Climate vs Weather\nClimate Factors\nSeasons on Earth\n\nEarth’s Climate\nEarth’s atmosphere\nGreenhouse Effect\nThe carbon cycle\nGlobal Warming/Climate Change\nImpact of Climate Change on our Oceans", "skills": "Analyzing Climate Proxies: Interpreting data from tree rings and ice cores to understand Earth's history.\nData Visualization: Reading \"Keeling Curves\" (graphs showing the rise of atmospheric carbon dioxide).\nSystem Thinking: Understanding how a change in one part of the Earth (the atmosphere) affects another (the biosphere or hydrosphere).\nEvaluating Solutions: Weighing the pros and cons of mitigation (reducing emissions) vs. adaptation (adjusting to changes).", "materials"
