"competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Advanced Robotics & Engineering", "department": "Computer Science", "teacher": "Rosen", "grade": "", "length": "", "description": "", "competencies": "Engineering: \nDemonstrates an understanding of core engineering principles by designing, constructing, and optimizing robotic systems, including chassis, drivetrains, and manipulators. Students will apply mechanical and electrical engineering concepts to create structurally sound and efficient robots through an iterative design process.\n\nProgramming:\nDemonstrates an understanding of how to use Java to control various robotics functions. From moving different types of motors to programming autonomous code that uses sensor data to execute different programs.\n\nGrowth Mindset: \nDemonstrate willingness to wrestle with more abstract material. Understand the time commitment needed to master concepts. Show an understanding of the importance of learning through mistake-making.\n\nProblem-Solving Mindset:\nDemonstrates a methodical approach to troubleshooting issues. Shows resilience and persistence in tackling challenging coding and design problems.", "units": [{"name": "Unit 1"}, {"name": "Intro to Design", "timeframe": "1-2 Weeks", "concepts": "Design Thinking methodology and the start of the Engineering Notebook.", "skills": "Conceptualizing solutions to problems and documenting the design process.", "materials": "d School’s Design Thinking Activity\nDisruptUs", "assessments": "Engineering Notebook activities."}, {"name": "Unit 2"}, {"name": "Building & Programming Basics", "timeframe": "2-3 Weeks", "concepts": "Basic robot construction and the FTC Control System (REV Robotics Control Hub and Driver Station)", "skills": "Physical assembly of a drivetrain and setting up the Java development environment", "materials": "REV Robotics hardware, Android Studio, and \"Learn Java For FTC\" PDF", "assessments": "Construction milestones and initial code setup"}, {"name": "Unit 3"}, {"name": "Mechanisms", "timeframe": "3 Weeks", "concepts": "Theory and practical application of mechanical linkages .\nTypes of Mechanisms: Rack and Pinion, Crank and Slider, Pawl and Ratchet, and Four-Bar Linkage .\nMotion Conversion: Understanding how to convert types of motion, such as rotary to linear .\nMechanical Advantage: The trade-off between speed and force.\nReal-World Applications: How these mechanisms function in modern technology like car steering or engines.", "skills": "Research & Documentation: Conducting in-depth research and citing media/sources.\nDigital Communication: Creating a comprehensive 10-slide digital presentation.\nEngineering Design: Applying design rationale to overcome construction challenges.\nPrototyping: Designing and building functional models using LEGO components.\nTechnical Demonstration: Orally explaining the relationship between model components and real-world mechanical elements.", "materials": "LEGO Simple Machines", "assessments": "Mechanism research & presentation \nLEGO Simple Machines Prototype"}, {"name": "Unit 4"}, {"name": "CAD & Fabrication", "timeframe": "2 Weeks", "concepts": "2D and 3D modeling in Autodesk Fusion", "skills": "Fusion Tools: Chamfer, Slot,, Filet, Modify, Mirror, Revolve, Shell Command, Hole Command\nDesigning CAD models and operating fabrication tools", "materials": "Fusion 360", "assessments": "Fusion Tool Screencasts"}, {"name": "Unit 5"}, {"name": "The Final Engineering Challenge", "timeframe": "10 Weeks", "concepts": "Bringing everything together to work on a purposeful project", "skills": "Mechanical Integration: Adapting a researched mechanism (Rack and Pinion, Crank and Slider, Pawl and Ratchet, or Four-Bar Linkage) to solve the 15\" and 30\" lift challenge.\nAdvanced CAD: Designing and 3D modeling at least one custom part of the mechanism for fabrication.\nAutonomous & Tele-Op Programming: Writing robust Java code to control robot movement and sensor feedback.\nProject Management: Navigating a multi-week build cycle with specific milestones (Pitch, Prototype, CAD, Final).", "materials": "Robotics kits, CAD Fabrication Tools", "assessments": "The Robotics Mechanism Competition Project"}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Design and Digital Fabrication I", "department": "Computer Science", "teacher": "Rosen", "grade": "", "length": "", "description": "", "competencies": "Design Thinking and Iteration\nDigital Modeling and CAD Craftsmanship\nHands-on Fabrication and Troubleshooting\nVisual and Argumentative Communication", "units": [{"name": "Unit 1"}, {"name": "Exploration of Design Process", "timeframe": "2 Weeks", "concepts": "The art of design thinking: generating, testing, and refining ideas.  \nEmbracing failure and iteration as part of the creative journey.  \nUnderstanding how \"bad ideas\" can evolve into successful innovations.", "skills": "Critical thinking through design games.", "materials": "DisruptUs Game", "assessments": "Everyday Things Write Up"}, {"name": "Unit 2"}, {"name": "3D Modeling", "timeframe": "6 Weeks", "concepts": "Introduction to Computer-Aided Design (CAD)", "skills": "Fusion navigation: sketching, constraints, extrudes, cuts, fillets, and assemblies.  \n3D printing preparation and troubleshooting.  \nIterative making and technical modeling.", "materials": "Fusion", "assessments": "ScooterBot"}, {"name": "Unit 3"}, {"name": "Vector Design & Laser Cutting", "timeframe": "8 Weeks", "concepts": "Design\nVector geometry vs. raster images.  \nUser-centered design: defining the user, purpose, and audience.  \nStructural stability and tolerances in slot construction.", "skills": "Adobe Illustrator: shape-building, pathfinder operations, layers, and typography.  \nConverting text to outlines and controlling stroke/fill for laser cutting.  \nPrototyping with cardboard before final fabrication.", "materials": "Adobe Illustrator", "assessments": "Animal Design Project\nClock Project"}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Design & Digital Fabrication I", "department": "Computer Science", "teacher": "Alsamadisi", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Exploration of the Design Process", "timeframe": "3 Weeks", "concepts": "The iterative nature of design\nThe Engineering Design Process\nlearning through failure\nhuman-centered design factors.", "skills": "Design ideation\ncritiquing \"everyday things\"\nanalyzing entrepreneurial narratives", "materials": "How I Built This podcast\nThe Design of Everyday Things by Don Norman.\nBad Ideas Lead to Better Ones the game", "assessments": "\"Bad Ideas Lead to Better Ones\" reflection\n\"The How I Built This\" Comparison write-up."}, {"name": "Unit 2"}, {"name": "Technical Modeling & Iterative Making", "timeframe": "4-5 Weeks", "concepts": "Parametric 3D modelling basics: sketches and extrusions\nDigital-to-physical translation\nAI-assisted 3D generation", "skills": "constraints, extrusions, assemblies\nsourcing and modifying online models\nutilizing AI for 3D asset generation.", "materials": "ScooterBot Videos\n3D printers\nAI generation tools (e.g., Meshy AI).", "assessments": "Fully fabricated ScooterBot \nOriginal custom-designed \"add-on\" component"}, {"name": "Unit 3"}, {"name": "Drawing for the Laser Cutter", "timeframe": "5 weeks", "concepts": "Turning 2D drawings into 3D objects\nPlanning and implementation of Design Thinking\nwhy making a \"rough draft\" (prototype) is helpful;", "skills": "Using Adobe Illustrator to turn simple shapes into complex designs\nFormatting designs appropriately and learning to use the laser cutter safely\nThinking about how to design interlocking pieces", "materials": "Adobe Illustrator\ncardboard for testing\nplywood for the final version\nclock motor kits", "assessments": "The 3D Animal: A slotted animal sculpture (starting with a cardboard version to test the fit, then moving to wood).\nThe Design Clock: A custom-made wall clock that reflects the student's personal style."}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Digital Design & Fabrication II", "department": "Computer Science", "teacher": "Bryan Rosen", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Light Project", "timeframe": "5 Weeks", "concepts": "Vector vs. Raster Graphics: Understanding how laser cutters read paths (vector lines) for cutting versus engraving.\nPhysical Computing & Microcontrollers: Learning how an Arduino acts as the \"brain\" to bridge software code with physical electronic hardware.\nCircuit Theory & Safety: Understanding the flow of electricity (Power, Ground, Data), the importance of secure solder joints, and safe handling of tools.\nAddressable LEDs: Comprehending how NeoPixels receive individual digital instructions sequentially over a single data line.\nDesign & Digital Fabrication", "skills": "Digital Fabrication Design: Utilizing Adobe Illustrator tools (Pen tool, Pathfinder, Shape builder) to create precise, interlocking 2D patterns for 3D assembly.\nElectronics Assembly: Measuring, stripping, and soldering wires securely to NeoPixel strips and Arduino microcontrollers.\nProgramming/Coding: Writing and modifying Arduino sketches (using the Adafruit NeoPixel library) to control color arrays, brightness, loops, and conditional lighting patterns.\nMaterial Engineering: Selecting and combining wood and acrylic properties (e.g., using acrylic to diffuse light, wood for structural integrity).", "materials": "Software: Adobe Illustrator, Arduino IDE.\nHardware Components: Arduinos, NeoPixel Light Strips\nFabrication Materials: 1/8\" Plywood sheets, 1/8\" Clear/Frosted Acrylic sheets, wood glue/acrylic cement.\nTools: Laser cutter, soldering irons, wire strippers, safety glasses.", "assessments": "Students will create, assemble, and program their own interactive lights"}, {"name": "Unit 2"}, {"name": "Independent Design & Fabrication Capstone", "timeframe": "Rest of the Semester", "concepts": "The Engineering Design Process: Understanding how to move from empathy/ideation to prototyping, testing, and iterating.\nResource Management & Feasibility: Learning how to scope a project based on available time, materials, and tool constraints.\nSelf-Directed Troubleshooting: Utilizing documentation, physical testing, and AI tools (like Flint) to diagnose and fix technical bugs independently.\nIterative Prototyping: Embracing failure as a data point; understanding that a design rarely works perfectly on the first attempt.", "skills": "Advanced CAD/CAM Design: Utilizing Fusion 360 for 3D modeling or Adobe Illustrator for 2D laser layouts, depending on the chosen project medium.\nMulti-Tool Fabrication: Safely operating 3D printers, laser cutters, hand tools, or electronics (Arduinos, motors, sensors) as required by the custom design.\nTechnical Documentation: Maintaining a chronological engineering notebook that details sketches, pseudocode, schematic diagrams, failures, and pivot points.\nAI-Assisted Prompting & Debugging: Learning how to effectively prompt Flint to get tailored coding help, hardware troubleshooting steps, or design feedback.", "materials": "All Makerspace Materials", "assessments": "The Final Prototype: Scored on execution, functionality, and how well it matches their intended design goals.\nEngineering Notebook & Presentation: Evaluation of the documented design journey, detailing how they overcame bugs and failures."}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Physical Computing", "department": "Computer Science", "teacher": "Bryan Rosen", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Arduino Introduction", "timeframe": "6 Classes", "concepts": "Basic programming structure in the Arduino IDE\nAnalog vs. Digital signals\nBreadboarding electrical circuits & basic schematics", "skills": "Downloading/navigating the IDE\nManipulating hardware pins\nWriting digital/analog signals\nWiring up multiple LEDs\nImplementing delays\nUsing code comments", "materials": "Arduinos\nLEDs\nWires\nBreadboards", "assessments": "Exploration assignments\nLED Blink labs\nMorse Code script\nOpposite Blinking LEDs check."}, {"name": "Unit 2"}, {"name": "Programming Concepts", "timeframe": "8 Classes", "concepts": "Variables & Data Types\nControl Structures (Loops, If-Else conditionals)\nLogical and Comparative Operators\nModularity through Functions", "skills": "Coding fading/pulsing effects using loops\nReading inputs from external components (potentiometers, buttons)\nMapping sensor inputs to servo outputs\nConditional execution based on physical inputs.", "materials": "Arduino hardware kits, Servos, Potentiometers, Pushbuttons, etc", "assessments": "Sweeping Servo Lab\nDistance Warning Lights exercise\nCandy Dispensing System prototype\nSOS function build"}, {"name": "Unit 3"}, {"name": "Air Quality & Gas Sensors", "timeframe": "4 Classes", "concepts": "Environmental sensing and data collection", "skills": "Using sensors to collect environmental data", "materials": "Arduinos\nSensors \nSensor Reference Guide", "assessments": "Air quality monitoring lab and code review"}, {"name": "Unit 4"}, {"name": "Creative Project", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Programming and Data Analysis", "department": "Computer Science", "teacher": "Dr. Adam Alsamadisi", "grade": "", "length": "", "description": "", "competencies": "Computational Logic: Breaking down complex problems into smaller steps and writing code that a computer can execute.\nProgramming Fluency: Developing confidence with Python syntax, control structures, functions, and data structures.\nData Analysis & Visualization: Importing, cleaning, analyzing, and visualizing datasets in order to identify patterns and communicate findings.\nDebugging Resilience: Treating errors as a normal and productive part of programming, using error messages and testing strategies to improve code.\nDigital Agency: Moving from passive use of digital tools to active creation of programs, websites, visualizations, and AI-supported projects.\nAI Literacy & Responsibility: Understanding basic AI concepts, including training data, bias, large language models, automation, and responsible use.\nOur five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Foundations of Python Programming", "timeframe": "6 Weeks", "concepts": "What Is Programming?: Introduction to programming as a way of giving precise instructions to a computer and solving problems step by step.\nVariables and Data Types: Understanding how computers store information using variables, strings, numbers, and Boolean values.\nControl Flow: Learning how programs make decisions using conditionals and respond differently based on user input or data.\nRepetition and Automation: Understanding how loops allow computers to repeat tasks efficiently.\nFunctions as Reusable Tools: Introducing functions as named blocks of code that make programs more organized, flexible, and reusable.", "skills": "Writing and running basic Python programs in CodeHS or another programming environment.\nUsing variables to store and update information.\nWriting if, elif, and else statements to control program behavior.\nUsing loops to repeat actions.\nDefining and calling functions.\nReading error messages and making targeted corrections to code.", "materials": "CodeHS Intro to Python lessons and exercises.\nTeacher-created practice problems and debugging challenges.\nShort applied programming prompts connected to real-world or student-centered contexts.", "assessments": "Python Skills Check: Students complete a set of programming tasks that require them to use variables, conditionals, loops, and functions to build small working programs. Students are assessed on correctness, clarity, persistence through debugging, and their ability to explain how their code works."}, {"name": "Unit 2"}, {"name": "Python for Data Analysis", "timeframe": "6 Weeks", "concepts": "Data as Evidence: Introduction to how datasets can be used to answer questions, identify patterns, and support claims.\nThe Structure of a Dataset: Understanding rows, columns, variables, observations, and basic data types.\nCleaning and Preparing Data: Learning why datasets often need to be inspected, filtered, renamed, or cleaned before they can be analyzed.\nDescriptive Statistics: Using measures such as mean, median, minimum, maximum, and standard deviation to summarize data.\nVisualization as Storytelling: Choosing appropriate visualizations, including histograms, scatterplots, bar graphs, box plots, and line graphs, to communicate patterns clearly.\nHistorical Data Case Study: Using The Ghost Map and John Snow’s cholera investigation as a model for how data analysis and visualization can help make sense of a real-world problem.", "skills": "Importing CSV files into Python.\nUsing pandas to inspect, filter, and summarize datasets.\nCreating basic visualizations with matplotlib.\nInterpreting visual patterns and connecting them to a larger question.\nWriting short explanations of what a visualization shows and why it matters.\nDebugging common errors related to file names, column names, syntax, and plotting code.", "materials": "CodeHS Data Science with Python materials.\nTeacher-prepared CSV datasets.\nJohn Snow / Broad Street cholera data.\nSelected excerpts, summaries, or discussion materials connected to The Ghost Map by Steven Johnson.\nPython notebooks or scaffolded coding environments.", "assessments": "Students contribute a Python-based data analysis section to a broader poster project shared with the Biology and Math classes. In this component, students import and analyze data, create visualizations using Python, and write a brief interpretation explaining what their graphs show and how the evidence connects to the larger scientific or mathematical question. This assessment emphasizes technical skills with pandas/matplotlib while also helping students communicate data clearly within an interdisciplinary STEM context."}, {"name": "Unit 3"}, {"name": "Introduction to Web Design: HTML, CSS, and JavaScript", "timeframe": "6 Weeks", "concepts": "The Structure of the Web: Understanding how websites are built from HTML, CSS, and JavaScript. Students learn that HTML creates the structure of a page, CSS controls its visual design, and JavaScript adds interactivity.\nReading and Writing Web Pages: Introduction to how browsers read and display code, and how students can use developer tools or page inspection to better understand how websites are constructed.\nDesign and Communication: Learning that websites are not just technical products, but communication tools. Students consider layout, hierarchy, readability, image use, color, and audience.\nThe Power of Interactivity: Understanding how user actions, such as clicking a button, hovering, typing, or submitting information, can change what appears on a webpage.", "skills": "Writing basic HTML tags, including headings, paragraphs, images, links, lists, and divisions.\nStructuring a webpage with clear sections and meaningful content.\nUsing CSS selectors to adjust color, fonts, spacing, borders, alignment, and layout.\nConnecting an external CSS stylesheet to an HTML page.\nWriting simple JavaScript commands and event listeners to respond to user actions.\nUsing browser preview tools to test, revise, and debug a webpage.", "materials": "CodeHS Introduction to Web Design or related web development modules.\nTeacher-created HTML/CSS/JavaScript examples and starter files.\nBrowser Developer Tools or page inspection tools.\nWireframing templates or planning sheets.", "assessments": "Interactive Webpage Assignment: Students build a single-page website that uses HTML for structure, CSS for styling, and JavaScript for at least one interactive feature. The page should communicate a clear idea, topic, or message and demonstrate attention to layout, readability, and user experience. Students are assessed on technical accuracy, visual design, organization of code, and successful use of interactivity."}, {"name": "Unit 4"}, {"name": "Building and Publishing a Multi-Page Website", "timeframe": "5 Weeks", "concepts": "User-Centered Design: Students consider what makes a website clear, useful, and enjoyable to navigate. They learn about visual hierarchy, readable contrast, consistent design, and the needs of an intended audience.\nThe Multi-Page Web: Understanding that a complete website is a collection of linked documents. Students learn how navigation bars, internal links, and shared stylesheets help create a coherent user experience.\nWebsites as Stories and Arguments: Students explore how websites can present information, explain a process, advocate for a cause, or tell a data-informed story.\nPublishing to the Web: Demystifying how a website moves from a code editor or sandbox environment to a live web link that can be shared with an audience.", "skills": "Creating a multi-page website folder with organized files and assets.\nLinking multiple HTML pages together using a consistent navigation bar.\nBuilding and applying an external CSS stylesheet across several pages.\nUsing images, links, headings, and layout choices to support clear communication.\nCreating a simple user-facing form or interactive element.\nTesting pages for broken links, readability, and consistency.\nPublishing or sharing a live version of the website through CodeHS or another approved platform.", "materials": "CodeHS Web Development Course.\nTeacher-created model websites and code examples.\nPlanning documents for site map, audience, content, and design choices.", "assessments": "Multi-Page Showcase Website: Students design and build a multi-page website centered on a topic, question, hobby, cause, or project that matters to them. The site must include at least three linked pages, a consistent navigation bar, an external stylesheet, thoughtful use of images and text, and at least one form or interactive feature. Students are assessed on technical structure, visual consistency, clarity of communication, usability, and evidence of revision/debugging."}, {"name": "Unit 5"}, {"name": "Introduction to AI", "timeframe": "5 Weeks", "concepts": "What Is Artificial Intelligence?: Introduction to AI as a broad field focused on creating systems that can recognize patterns, make predictions, generate content, or complete tasks that usually require human-like reasoning.\nRules-Based Coding vs. Machine Learning: Comparing traditional programming, where humans write explicit instructions, with machine learning systems that identify patterns from examples.\nTraining Data and Models: Understanding that AI systems learn from data and that the quality, quantity, and representativeness of training data shape what a model can and cannot do.\nLarge Language Models and Generative AI: Introducing students to LLMs and other generative AI systems as tools that can produce text, images, code, music, video, and other forms of output based on patterns in training data and user prompts.\nAI Ethics and Bias: Investigating how AI systems can reflect or amplify bias, especially when training data is incomplete, unbalanced, or shaped by unequal social conditions.\nResponsible AI Use: Considering when AI can support learning, creativity, accessibility, and problem-solving, and when it may undermine understanding, accuracy, privacy, or authenticity.", "skills": "Differentiating between inputs, training data, models, and outputs in an AI system.\nExplaining the difference between traditional programming and machine learning.\nTraining, testing, and revising a simple machine learning model using images, sounds, text, or other sample data.\nIdentifying possible sources of bias or limitation in a dataset or AI output.\nUsing AI tools thoughtfully to brainstorm, debug, revise, or generate ideas while maintaining ownership of one’s learning.\nApplying course vocabulary such as algorithmic bias, training data, LLM, automation, multimodal AI, and in-context learning.", "materials": "CodeHS Introduction to Artificial Intelligence modules.\nGoogle Teachable Machine or similar visual machine learning sandbox.\nTeacher-created AI vocabulary activities and case studies.\nSelected examples of AI-generated text, images, video, music, or code.\nSchool-approved AI tools for guided exploration.", "assessments": "AI Literacy Check: Students demonstrate understanding of key AI concepts and vocabulary by explaining how an AI system learns, identifying potential concerns around bias or misuse, and describing responsible ways AI can support learning or creative work.\nFlowers for Algernon and AI Ethics Essay: Students write a short analytical essay connecting Flowers for Algernon to the ethical questions raised by artificial intelligence. Students consider how the story’s treatment of intelligence, experimentation, human dignity, consent, progress, and unintended consequences can help us think more carefully about modern AI systems. The essay asks students to use evidence from the text alongside course concepts such as training data, bias, automation, intelligence, and responsibility."}, {"name": "Unit 6"}, {"name": "The Impossible Project", "timeframe": "6 Weeks", "concepts": "AI as a Creative and Technical Partner: Students explore how AI can help them attempt a project that would previously have felt too difficult, time-consuming, or technically out of reach.\nAmbition, Scope, and the MVP: Students learn how to take a large, ambitious idea and reduce it to a minimum viable product or focused final artifact that can realistically be built, tested, revised, and explained.\nSelf-Directed Problem Solving: Students move beyond step-by-step tutorials and learn to use documentation, examples, debugging strategies, and AI tools to solve problems independently.\nLearning Through Iteration: Students understand that failed attempts, confusing outputs, errors, and pivots are a normal part of creative and technical work.\nAI, Learning, and Reflection: Students consider how AI affected their process: what it helped them do, what it did not understand, where it created problems, and how it changed their sense of authorship, creativity, or learning.", "skills": "Developing a project proposal with a clear goal, audience, and intended final product.\nIdentifying what makes the project “impossible” or unusually ambitious for the student.\nUsing AI tools to support coding, design, video generation, research, prototyping, debugging, or other creative work.\nNarrowing a broad idea into a manageable MVP.\nDocumenting process, setbacks, AI interactions, revisions, and pivots.\nEvaluating the usefulness and limitations of AI-generated support.\nPresenting a finished or partially finished prototype, artifact, or investigation to peers.\nExplaining what was learned through both the final product and the process of making it.", "materials": "CodeHS Developer Sandbox or other approved coding environment.\nHTML/CSS/JavaScript, Python, or other project-specific tools depending on student choice.\nSchool-approved AI tools for brainstorming, debugging, prototyping, generating media, or supporting technical development.\nProject planning documents, milestone trackers, and process logs.\nExamples of student project types, such as AI-generated video investigations, recommendation tools, interactive websites, data tools, or creative prototypes.", "assessments": "Impossible Project Proposal: Students submit a brief project proposal that explains their goal, why the project feels ambitious or “impossible,” what they hope to create or investigate, and how AI might support their process.\nProcess Log and AI Use Reflection: Students document their project development over time, including obstacles, failed attempts, AI prompts or interactions, debugging steps, revisions, and changes in direction. This log emphasizes persistence, thoughtful AI use, and learning through process rather than producing a perfect final product.\nFinal Project and Demo Day Presentation: Students present their project to the class, whether it is fully finished or still in progress. Their presentation explains what they tried to create or investigate, how they used AI in a new or meaningful way, what challenges they encountered, and what the project taught them about AI, learning, and problem-solving.\nImpossible Project Written Reflection: Students write a short paper or reflection that places their project in a broader context, such as AI and art, AI and recommendation systems, AI and entertainment, AI and coding, or AI and creativity. They explain their process, analyze how AI shaped their learning, and reflect on what their experience reveals about the possibilities and limitations of AI."}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Technology, Data & Storytelling", "department": "Computer Science", "teacher": "Dr. Adam Alsamadisi", "grade": "", "length": "", "description": "", "competencies": "Data Literacy: Understanding how data is collected, organized, cleaned, analyzed, and interpreted.\nVisual Communication: Creating graphs, charts, maps, and digital layouts that communicate patterns clearly and responsibly.\nSpatial Thinking: Using maps and geographic tools to understand relationships between people, places, movement, and environment.\nTechnology Fluency: Developing confidence with digital tools such as Google Sheets, CODAP, ArcGIS Online, and ArcGIS StoryMaps.\nEvidence-Based Storytelling: Combining data, maps, images, text, and multimedia to build a clear, compelling, and well-supported narrative.\nResponsible Interpretation: Recognizing that data has limits and that strong storytelling requires attention to source, context, bias, uncertainty, and audience.", "units": [{"name": "Unit 1"}, {"name": "Data as a Storytelling Tool", "timeframe": "4 Weeks", "concepts": "What Is Data?: Students are introduced to data as information collected to answer questions, describe patterns, or support claims. They learn to distinguish between observations, variables, rows, columns, categories, and numerical values.\nData Is Made, Not Found: Students explore how data is collected, organized, and shaped by human decisions. They consider what gets counted, what gets left out, and how context affects interpretation.\nThe Basics of Spreadsheets: Students learn how spreadsheet tools can organize information, calculate summaries, sort and filter records, and prepare data for visualization.\nFrom Numbers to Meaning: Students practice moving from raw data to interpretation by asking what patterns appear, what questions remain, and what the data might help explain.", "skills": "Importing or entering data into Google Sheets.\nIdentifying variables, observations, and basic data types.\nSorting and filtering datasets.\nCleaning simple datasets by correcting errors, renaming columns, or removing unnecessary information.\nCalculating basic summaries such as counts, totals, averages, minimums, and maximums.\nCreating simple charts from spreadsheet data.\nWriting short captions that explain what a chart shows and why it matters.", "materials": "Google Sheets.\nTeacher-created introductory datasets.\nCodeHS spreadsheet lessons or selected spreadsheet skill activities.\nShort examples of data visualizations and data stories.\nStudent-facing data reflection prompts.", "assessments": "Spreadsheet Skills Check: Students demonstrate foundational spreadsheet skills, including sorting, filtering, calculating basic summaries, and creating a graph from a dataset."}, {"name": "Unit 2"}, {"name": "Visualizing Patterns and Making Arguments with Data", "timeframe": "4 Weeks", "concepts": "Choosing the Right Visualization: Students learn that different graphs answer different kinds of questions. They compare bar charts, line graphs, histograms, scatterplots, and grouped charts.\nMeasures of Center and Spread: Students use basic statistical summaries, including mean, median, range, and variability, to describe datasets and support claims.\nData Visualization as Argument: Students explore how graphs can clarify a point, reveal a comparison, show change over time, or mislead an audience depending on design choices.\nCaptions and Claims: Students practice writing concise explanations that connect a visualization to a larger question or argument.", "skills": "Creating multiple types of graphs in Google Sheets or CODAP.\nChoosing appropriate graph types for categorical, quantitative, and time-based data.\nUsing pivot tables or grouped summaries to organize data.\nCalculating and interpreting basic measures of center and spread.\nWriting a short evidence-based claim using data.\nRevising graph titles, axis labels, legends, and formatting for clarity.\nRecognizing misleading or confusing visualization choices.", "materials": "Google Sheets.\nCODAP or similar data exploration tools.\nCodeHS spreadsheet and data visualization activities.\nSelected datasets connected to public health, society, environment, or student interest.\nExamples of effective and ineffective data visualizations.", "assessments": "Data Visualization Portfolio: Students create a small set of visualizations from one or more datasets. Each visualization includes a title, labeled axes, appropriate graph choice, and a short caption explaining the pattern shown."}, {"name": "Unit 3"}, {"name": "Mapping Data: Place, Patterns, and The Ghost Map", "timeframe": "4 Weeks", "concepts": "Spatial Thinking: Students learn how maps can show relationships between location, movement, distance, environment, and human behavior.\nThe Ghost Map as a Data Story: Students study John Snow’s investigation of the 1854 London cholera outbreak as an example of how mapping and evidence can transform public understanding.\nGIS and Digital Mapping: Students are introduced to ArcGIS Online as a tool for layering, symbolizing, and interpreting geographic data.\nHistorical and Contemporary Change: Students examine how places change over time and how maps can be used to compare past and present landscapes.", "skills": "Reading and interpreting digital maps.\nUploading or working with mapped datasets in ArcGIS Online.\nSymbolizing points, lines, or areas based on attributes.\nCreating a basic map connected to a question or theme.\nUsing ArcGIS tools such as map layers, pop-ups, labels, and simple analysis features.\nComparing historical and contemporary maps using tools such as Swipe.\nWriting map captions that explain spatial patterns.", "materials": "The Ghost Map by Steven Johnson, selected excerpts or course materials.\nArcGIS Online.\nArcGIS StoryMaps.\nJohn Snow / Broad Street cholera datasets.\nHistorical and contemporary London maps.\nTeacher-created ArcGIS tutorials and planning sheets.", "assessments": "Historical Swipe Map: Students create a map comparison (old map vs. current imagery) that shows how a place connected to the course has changed over time. Students write a short explanation of what changed, what stayed the same, and why the comparison matters."}, {"name": "Unit 4"}, {"name": "Digital Storytelling with ArcGIS StoryMaps", "timeframe": "4-5 Weeks", "concepts": "StoryMaps as Evidence-Based Narratives: Students learn how digital stories combine maps, text, images, videos, charts, and citations to guide an audience through an argument or investigation.\nDesigning a Narrative Path: Students plan the order of scenes or sections so that the audience moves clearly from context to evidence to interpretation.\nMultimedia and Meaning: Students consider how images, maps, audio, video, and embedded visualizations can strengthen a story when used intentionally.\nResponsible Digital Publishing: Students learn to cite sources, credit images and data, protect privacy, and revise work for clarity and audience.", "skills": "Planning a StoryMap using an outline or storyboard.\nCreating sections or scenes with a clear narrative sequence.\nEmbedding or incorporating maps, charts, images, text, and multimedia.\nUsing StoryMap features such as Sidecar, Map Tour, and Swipe.\nWriting concise explanatory text for a digital audience.\nCiting data, images, maps, and outside sources.\nRevising a digital project based on feedback.\nPublishing or sharing a polished digital StoryMap.", "materials": "ArcGIS StoryMaps.\nArcGIS Online maps created earlier in the course.\nStudent-created charts and data visualizations.\nStoryMap planning documents and peer feedback forms.\nCitation guides and model StoryMaps.\nCourse datasets connected to The Ghost Map, public health, urban change, environment, or student-selected themes.", "assessments": "Final Ghost Map StoryMap Project: Students create an ArcGIS StoryMap that brings together the materials they have developed throughout the course related to The Ghost Map and the 1854 London cholera outbreak. Rather than starting from scratch, students curate, revise, and organize their existing maps, data visualizations, written explanations, multimedia, and citations into a clear evidence-based digital story. The StoryMap should explain the outbreak, show how spatial and data evidence helped reveal patterns in cholera deaths, and connect those findings to a broader theme from the course. Students are assessed on the clarity of their narrative, the thoughtful integration of previously created course materials, the strength of their evidence and interpretation, effective use of maps and visualizations, overall design, technical execution, and responsible citation."}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Art of the Short Story", "department": "English", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Bible as Literature", "department": "English", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "creative Writing", "department": "English", "teacher": "Whalen", "grade": "10th-12th grade", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "The Multigenre project", "timeframe": "1 semester", "concepts": "Poetry, Creative Non-fiction, fiction", "skills": "Multi-Genre Craft & Form Manipulation\nGenre Architecture: Write, layout, and structure creative pieces across distinct alternative mediums \nVerse vs. Prose Dynamics: Distinguish prose writing from poetic composition by intentionally manipulating line breaks, enjambment, white space, and structural pauses to create pacing.\nMentor Constraints: Analyze and apply formal constraints or stylistic prompts derived directly from modern mentor authors (e.g., executing structural repetition like Maggie Smith's \"Look\" parameters or Oliver de la Paz's emotional perspective \"flips\").\nSensory Architecture: Utilize dense sensory details and figurative language to anchor abstract feelings into vivid physical descriptions of rooms or familiar places.\nInquiry & Metaphorical Scale\nInquiry Frameworking: Formulate a compelling, multi-layered personal or philosophical query (the \"gnawing\" central question) and use it as a thematic anchor across multiple pieces.\nMetaphorical Scale (Small → Big): Construct extended metaphors by beginning with tiny, mundane concrete objects (e.g., a cup) and systematically scaling them outward to explore sweeping abstract themes (e.g., love, age, or identity).\nAudience Adaptability: Adapt a singular central question to alternative voices or target audiences (e.g., reframing a complex question into prose written from the perspective of a child).\nNarrative Structure & Perspective\nChronological Reversal: Deconstruct traditional chronological plotting by executing backward narrative structures.\nNarrative Condensation: Adhere to tight word or formal limitations to maximize emotional impact within microfiction and flash fiction.\nVocal Multiplicity: Inhabit, experiment with, and maintain alternative, unusual, or radically surreal narrative perspectives (e.g., writing from a non-human perspective like Sylvia Plath's \"Mushrooms\").\nCollaborative Workshop & Revision Loop\nAnalytical Feedback Literacy: Articulate clear, empathetic, and structurally constructive feedback to peers using targeted review criteria.\nEditorial Review Layout: Author explicit marginal reviews and peer critique cards on live creative drafts.\nLong-Form Milestone Management: Track individual developmental revision goals and manage self-guided writing intervals over a multi-week project timeline.\nCopyediting loop: Self-correct pacing flaws, mechanical issues, layout choices, and grammatical transitions prior to final submission.\nCuration & Presentation\nPerformance Delivery: Cultivate public speaking, pacing, and oral performance techniques for reading creative work aloud to a live audience.\nPortfolio Curation: Organize and compile a polished final multi-genre manuscript folder centered on a single core thesis statement.", "materials": "Revising poems \n\nProfessional Mentor Texts & Poems\nUnit 1: Mentorship, Place, and the Central Question\nMaggie Smith – Excerpt from “You Could Make This Place Beautiful” (pp. 3–23)\nFocus: Used for descriptive parameters, sensory details, and utilizing structural anchors (e.g., repeating the line \"I’m your guide here\" and the word \"Look\").\nUnit 2: Forms, Metaphor, and Genre Expansion\nAudre Lorde – “Hanging Fire”\nFocus: Used to analyze structural form vs. prose, and as a writing prompt anchor for age pieces (e.g., breaking down and mimicking the line structure of \"I am fourteen / and my skin has betrayed me\").\nAda Limón – “The Raincoat”\nFocus: Used to study how line breaks function differently than prose, how poems tell stories, and the mechanics of scaling a metaphor from small to big.\nWalt Whitman – “A Noiseless Patient Spider”\nFocus: Used to explore structural line breaks and the transition from a small concrete observation to a massive abstract concept (e.g., moving from a physical spider to the expanse of the human soul: \"and you, O my soul, where you stand\").\nBeth Ann Fennelly – Selected Micro-Prose / Flash Pieces\nFocus: Used to study the architecture of short-form \"question and answer\" narrative structures.\nOliver de la Paz – Selected Poetry / Multi-Genre Excerpts\nFocus: Used to study emotional transition frameworks (e.g., organizing a piece by listing flaws/negative aspects of a place first, and then explicitly shifting perspective using the line anchor: \"But I loved the place once\").\nUnit 3: Microfiction and Multi-Genre Structuring\nSylvia Plath – “Mushrooms”\nFocus: Used to study how titles interact with text, and how to inhabit a surreal, non-human narrative perspective.\nWalt Whitman / Maggie Smith Text Anchors (Revisited)\nFocus: Used as a prompt framework for rewording and mapping a complex central question from the simplified viewpoint of a child.\nSelected Flash Fiction & Microfiction (Backwards Chronology Texts)\nFocus: Short-prose anchor pieces used to demonstrate how to deconstruct chronological timelines.\nVisiting authors (spring 2026) \nMeghan O’Rourke – Poetry, creative non-fiction \nBella DeSandi – Conversational/colloquial poetry \nAdrian Matejka  – Graphic novel, poetry \nMaya Popa – Poetry", "assessments": "Multigenre Writing Project"}]}, {"name": "Class XI English", "department": "English", "teacher": "Vora, Hiland, Menchel", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change", "units": [{"name": "Unit 1"}, {"name": "The Modern Essay", "timeframe": "Approximately 4 weeks", "concepts": "Students are introduced to the modern essay and begin to experiment with the form. \nStudents to hone their interpretive abilities through literary analysis.", "skills": "Identifying literary devices.\nDeconstructing and interpreting literary devices.\nConnecting an author’s stylistic choices to meaning\nUnpacking meaning of quoted language\nSelecting quotations that support an argument. \nIntegrating quotations seamlessly into prose \nOrganizing ideas into paragraphs.\nPeer editing.\nUsing mentor texts for style inspiration.\nConstructing and using literary devices.\nNarrating anecdotes.\nCommentary.\nArtistic statement/self-reflection.", "materials": "Summer reading (assorted essays from The Contemporary American Essay)\n“Why I Write” by Joan Didion\n“Joy” by Zadie Smith\n“Consider The Lobster” by David Foster Wallace\n“Thank You, Esther Forbes” by George Saunders\n“Breaking My Own Silence” by Min Jin Lee\n“The Crane Wife” by CJ Hauser\n“Twelve Minutes and A Life” by Mitchell S. Jackson\n“The I in The Internet” by Jia Tolentino", "assessments": "Summer Reading Recap: Students analyze the ostensible and underlying topics of the essays they chose to read and memorable moments.\nWriting Reflection 1: Students explore their own relationships to writing, drawing on the unit’s reading as mentor texts.\nIn-Class Close Reading 1: Students unpack the meaning of key words and resonant phrases in a passage from an essay. ​They attend to any ambiguities or ironies, and consider more than one way of interpreting meaning. The goal is deep and precise engagement with the language of the text."}, {"name": "Unit 2"}, {"name": "Letters of Recommendation", "timeframe": "Approximately 4 weeks.", "concepts": "Students are introduced to “letters of recommendation,” a New York Times genre devoted to “celebrations of objects and experiences that have been overlooked or underappreciated.” \nStudents learn to blend anecdotes with analysis and develop an “underlying” theme along with an “ostensible” focus.\nStudents learn to build a piece of writing around a tension (that is, a productive complication, or an apparent conflict between ideas that they carefully examine).", "skills": "Selecting quotations that support an argument. \nIntegrating quotations seamlessly into prose \nOrganizing ideas into paragraphs.\nPeer editing.\nUsing mentor texts for style inspiration.\nConstructing and using literary devices.\nNarrating anecdotes.\nCommentary.\nArtistic statement/self-reflection.", "materials": "Selected letters of recommendation from The New York Times.", "assessments": "Students write their own letters of recommendation."}, {"name": "Unit 3"}, {"name": "Personal Essays", "timeframe": "Approximately 5 weeks.", "concepts": "Students explore the personal essay, with a specific focus on essays that model strong storytelling and portraiture.\nStudents continue to hone their interpretive abilities through literary analysis.", "skills": "Identifying literary devices.\nDeconstructing and interpreting literary devices.\nConnecting an author’s stylistic choices to meaning\nUnpacking meaning of quoted language\nSelecting quotations that support an argument. \nIntegrating quotations seamlessly into prose \nOrganizing ideas into paragraphs.\nPeer editing.\nUsing mentor texts for style inspiration.\nConstructing and using literary devices.\nNarrating anecdotes.\nCommentary.\nArtistic statement/self-reflection.", "materials": "“Finding Myself in My Mother’s Calendars” by Carol Adams\n“When Things Go Missing” by Kathryn Schulz\n“The Old Man and The Gun” by David Grann\n“Notes of A Native Son” by James Baldwin\n“Cantilever” by Jordan Kisner\n“The Hard Crowd” by Rachel Kushner\n“Body Language” by Alex Marzano-Lesnevich", "assessments": "Personal essay: Students anchor an essay in a thoughtfully crafted anecdote from their own experiences or offer a portrait of people other than themselves–this might be someone they know, a celebrity/famous figure, or a fictional character (not one they have invented).\n\nIn-Class Close Reading 2: Students unpack the meaning of key words and resonant phrases in a passage from an essay. ​They attend to any ambiguities or ironies, and consider more than one way of interpreting meaning. The goal is deep and precise engagement with the language of the text."}, {"name": "Unit 4"}, {"name": "Poetry", "timeframe": "Approximately seven weeks (we began this unit before and finished it after the winter break).", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "English XII", "department": "English", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Brokeback Mountain", "timeframe": "3 weeks", "concepts": "", "skills": "Reading in an attentive, critical, imaginative, active and thoughtful manner\n\nCommunicating ideas and opinions in a class discussion\nResponding to moral dilemmas with empathy, integrity and respect\nClose reading/textual analysis\nEngaging in discourse with literary criticism\nD king", "department": "English", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "World Literature", "department": "English", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Adolescent Health / 10th/11th Grade Health", "department": "Health", "teacher": "Dean Roth & Robyn Jaffe", "grade": "", "length": "", "description": "", "competencies": "Self-advocacy\nDecision-making\nSelf-management\nValues identification & application\nHelp-seeking\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "10 Dimensions of Health & Social Determinants of Health", "timeframe": "3-4 classes", "concepts": "Holistic Definition of Health: Recognizing that health is a balanced state of complete well-being across multiple spectrums, rather than simply the absence of illness or disease.\nThe 10 Dimensions of Wellness: Defining and identifying traits within all distinct areas of wellness: Physical, Mental/Emotional, Social, Intellectual, Occupational, Spiritual, Environmental, Financial, Multicultural, and Sexual.\nSocial Determinants of Health (SDOH): Understanding the 5 categories of nonmedical and nonpersonal systemic factors (where people are born, grow, live, work, and age) that dictate daily quality of life and clinical outcomes. Recognizing that positive/negative health is not just a matter of personal choice.\nSystemic Barriers and Medical Equity: Examining how institutional/systemic biases, food insecurity, language barriers, and legislative restrictions directly create systemic disparities in patient care.\nRisk Factors and Protective Factors: Differentiating between uncontrollable life circumstances (genetics, background, marginalization, poverty, built environment) and controllable protective actions (coping mechanisms, belonging to a community).", "skills": "Spectrum Analysis & Evaluation: Critiquing life factors to determine if a specific behavior or baseline condition is \"Health-Diminishing\" or \"Health-Enhancing\" as a way to move away from binary health thinking such as good/bad or healthy/unhealthy\nIntersectional Mapping: Cross-referencing real-world scenarios to trace exactly how an external societal determinant modifies internal dimensions of wellness.\nCollaborative Jigsaw Synthesis: Paraphrasing complex medical journalism to a peer working group and extracting overlapping systemic conclusions without copying text verbatim.\nObjective Self-Reflection: Formulating an honest, nonjudgmental personal profile identifying individual protective variables and personal wellness attributes.\nIdentify SDOH: Students use fictional case studies to identify the SDOH that are impacting a student’s health in a variety of dimensions.", "materials": "Unit 1: 10 Dimensions & Social Determinants", "assessments": "Formative Spectrum Placement & Gallery Walk: Group construction of a physical \"Wellness Spectrum\" using a fictional student profile, cross-examined and critiqued by peers during a classroom walk-through.\nScenario Matrix Application Chart: Written analysis mapping specific informational elements from demographic profiles to their corresponding SDOH category and detailing the cascade effect on specific health dimensions.\nPeer Jigsaw Presentation Evaluation: Formative evaluation of student ability to extract key takeaways from medical articles and successfully log secondary connections on shared puzzle worksheets.\nSummative Personal Health Profile: A comprehensive, two-part portfolio assignment collected by the instructor for nonjudgmental feedback.\nPart 1: Log 2–3 authentic personal attributes for each dimension of wellness.\nPart 2: Isolate 5 self-logged traits and draft explicit analytical reflections detailing how an active Social Determinant either enhances or undermines that specific component of their life."}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Health IX: Foundations of Health & Wellness", "department": "Health", "teacher": "Dean Roth & Robyn Jaffe", "grade": "", "length": "", "description": "", "competencies": "intercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future\nSelf-advocacy\nDecision-making\nSelf-management\nValues identification & application\nHelp-seeking", "units": [{"name": "Unit 1"}, {"name": "10 Dimensions of Health", "timeframe": "2 classes", "concepts": "Multi-dimensional Health Analysis: Evaluating how different dimensions of health impact and interact with one another and how they affect your overall day-to-day and long-term health.\nSelf-Reflection & Personalization: Translating abstract health concepts into personalized, real-world attributes and actionable goals.\nResource Literacy: Identifying school, home, and local community resources to support health behavioral improvements.\nDefining Holistic Health: Health is the state of well-being and balance within and among multiple dimensions, not simply the absence of disease.\nThe 10 Dimensions: Deep exploration of the 10 core dimensions: Physical, Mental/Emotional, Intellectual, Social, Environmental, Financial, Occupational, Spiritual, Multicultural, and Sexual Health.\nInterdependence of Health: A single health behavior or attribute in one dimension directly ripples into and impacts other areas of life.\nThe Health Spectrum: Health traits exist on a fluid spectrum ranging from \"Health-Diminishing\" to \"Health-Enhancing,” rather than thinking of a person/behavior as healthy/unhealthy or good/bad.", "skills": "Collaborative communication and peer feedback via interactive learning games and shared evaluations.\nCase-study analysis to critique a fictional student profile, pinpoint areas of strength, and isolate areas needing improvement.\nAction planning to establish definitive changes supported by designated local and institutional resources.", "materials": "Unit 1: 10 Dimensions of Health", "assessments": "Wellness Spectrum Gallery Walk: Students rotate to view classmates' spectrum layouts, offering oral critiques and discussing placements to demonstrate their ability to analyze health outcomes and suggestions for improvement.\nFictional Student Worksheet: Group assignment requiring students to categorize behaviors, trace multidimensional impacts, and draft community-supported improvements.\nMy Dimensions of Health Profile: An individualized profile where students apply their knowledge by identifying 2-3 personal attributes across all 10 dimensions to receive nonjudgmental teacher feedback."}, {"name": "Unit 2"}, {"name": "Stress Management & Mental Health", "timeframe": "4-5 class periods", "concepts": "Defining Stress and Stressors: Understanding stress as the mind and body's biological process of perceiving and responding to any demand or circumstances interpreted by the brain/body as threatening.\nThe Neurobiology of the Alarm System: Tracing the mechanics of the \"Fight, Flight, or Freeze\" response driven by the amygdala. Students learn that when the amygdala senses a potential threat, it activates the sympathetic nervous system and temporarily cuts off communication with the frontal lobe/prefrontal cortex. This makes rational thought, logic, decision-making, and emotional processing difficult because the brain's sole focus shifts to immediate survival.\nSystemic Physiological Responses: Examining how different biological systems react under acute stress, including:\nMuscular: Shifts in blood flow causing tension, clenching, or immobility.\nRespiratory: Rapid, shallow breathing to maximize oxygen intake.\nCirculatory & Heart: Fluctuation in heart rate (pounding/fluttering) and constriction of vessels to divert blood away from digestion toward skeletal muscles.\nVisual: Adrenaline surges causing tunnel vision, blurred vision, or dilated pupils.\nThe Path to Homeostasis: Identifying that the brain and body must safely answer the question of threat elimination in order to shift from high-alert survival back into a state of psychological and physiological calm (homeostasis).\nMaladaptive vs. Adaptive Coping Strategies: Differentiating between temporary or harmful stressors (such as vaping/drug use, staying up all night, skipping meals, avoiding problems, or holding in feelings) and protective, health-enhancing management strategies.\nInterpersonal Advocacy & Help-Seeking: Recognizing mental health warning signs in yourself and others and breaking down structural barriers to communication using national evidence-based resources (such as Seize the Awkward).\nDistress vs. Eustress: understanding that there’s a good kind of stress, and that differentiating between the two can help a person to stay regulated in heightened situations.", "skills": "Experiential Stress Analysis: Using simulated stress environments to track, observe, and document immediate changes in personal physiology, voice tone, and fine motor skills.\nSelf-Care Diagnostic Evaluation: Scoring and spotting patterns within a multi-dimensional inventory to self-assess deficiencies and recognize specific areas of life requiring immediate adjustments.\nPeer Support Dialogue Construction: Scripting a healthy verbal exchange to safely initiate conversations, express concern, and offer resources to a friend showing mental health warning signs.\nApplication of Stress Management Strategies: Identifying which strategies feel best and most realistic for you personally, when you would use them, and how they would help you to get regulated in times of heightened stress, and then creating a personalized stress-management resource plan.\nHelp-Seeking Peer Script Intervention: A practical evaluation requiring students to pair up and compose an actionable support script matching a verified warning sign to specific school, home, or local community professional resources.", "materials": "Unit 2: Mental Health", "assessments": "Come on Six Experiential Reflection: A post-game journal evaluation where students connect the physiological urgency felt during the competitive dice game directly to real-world chronic or acute stress responses.\nStress Management 4 Corners Categorization: A collaborative sorting exercise where students parse and group physical coping actions into designated categories of healthy vs. unhealthy behaviors.\nThe Multi-Dimensional Self-Care Intake & Plan: A deeply reflective inventory where students evaluate their habits across Physical, Social, Mental, and Spiritual practices, isolate distinct real-world obstacles, and establish an actionable maintenance strategy.\nHelp-Seeking Peer Script Intervention: A practical evaluation requiring students to pair up and compose an actionable support script matching a verified warning sign to specific school, home, or local community professional resources."}, {"name": "Unit 3"}, {"name": "Alcohol & Decision-Making", "timeframe": "3-5 classes", "concepts": "The Structural Decision Framework: Utilizing the formalized DECIDE Model to slow down and map out high-stakes personal choices under pressure.\nCentral Nervous System Classification: Confirming that alcohol acts as a Depressant that chemically slows down the central nervous system, heavily altering unconscious life-sustaining processes like heartbeat, respiration, and cognitive filtering.\nThe Path of Alcohol: Chronologically tracing how alcohol travels through and is processed by the body, and what happens in each part of the body.\nUnderstanding BAC: Analyzing the complex biological and situational variables that dictate an individual's Blood Alcohol Concentration (BAC) and impairment severity, as well as the effects and risks of alcohol consumption at the different levels of impairment.\nNational Youth Statistical Realities: Evaluating nationwide context data (via the Monitoring the Future survey from NIH/NIDA) to ground students in factual regional data regarding true peer consumption statistics versus inflated social media perceptions.\nResponding in an Emergency: Recognizing the signs of alcohol overdose, using the recovery position, and understanding the Good Samaritan law as a protective factor in seeking EMS response for an alcohol overdose, even if all parties are underage.", "skills": "Mapping the Path of Alcohol: Accurately ordering the multi-phase physical pathway of alcohol moving through the body.\nDecision-Making: Actively applying the 6-stage DECIDE model to navigate through a fictional party scenario where underage drinking is prevalent.\nResponding in an Emergency: Recognizing the signs of alcohol overdose, using the recovery position, and understanding the Good Samaritan law as a protective factor in seeking EMS response for an alcohol overdose, even if all parties are underage.\nIdentifying an overdose: Recognizing the signs of alcohol overdose.", "materials": "Unit 3: Substance Use", "assessments": "The Party Scenario DECIDE Model for Decision-Making: students unpack a high-risk social situation, explicitly document individual steps of the DECIDE model, isolate corresponding personal core values, and evaluate long-term social, physical, and legal outcomes.\nRecovery Position: Students practice putting each other into the recovery position and calling EMS as a response to alcohol overdose.\nChanging the Outcome: Students use all materials, case studies, and fictional stories throughout the unit to identify where a turning point could be re-imagined for a better and safer outcome based on evidence and scientific understanding - either by writing a detailed narrative account or a dialogue exchange."}, {"name": "Unit 4"}, {"name": "Nutrition & Food Systems", "timeframe": "~5 class periods", "concepts": "The Multidimensional Food Environment: Analyzing how a person’s nutritional choices are heavily dictated by overlapping environmental layers rather than isolated individual choices:\nPhysical Environment: Geographic access to grocery stores vs. \"food deserts\" or \"food swamps\" dominated by corner stores and fast food.\nSocial Environment: Peer groups, family dynamics, time/energy for shopping and cooking, cultural traditions (e.g., immigrant family meals), and household/media focus on appearance and physical fitness that may go against health outcomes.\nPolicy & Economic Environment: Financial access, availability of delivery apps, and municipal food systems.\nMacronutrient Dynamics & Biological Fueling: Identifying and balancing the three core macronutrients (carbohydrates, proteins, and fats) to sustainably fuel brain function, blood sugar stability, and physical activity levels, as well as micronutrients.\nInternal Cues vs. External Messages (Mindful & Neutral Eating, Hunger/Fullness Scale): Learning to dismantle external social pressures and body-shaming media messages. Utilizing the Hunger and Fullness Scale to reconnect with innate biological cues and transition toward intuitive, neutral eating patterns.\nStructural Food Systems Analysis: Tracing the lifecycle of food and examining its hidden global footprints, resource investments (e.g., water, transportation, labor costs), and ethical consequences across health, society, and climate ecosystems.\nNutritional Independence & Financial Literacy: Managing a fiscal and time budget as 9th graders transition into freedom to leave school to buy lunch elsewhere. Understanding the true economic cost of food options relative to high school schedules.", "skills": "Food Environment Case Study Analysis: Deconstructing narrative case studies to isolate specific barriers to health and identify realistic solutions within the fictional student’s parameters.\nFood System Resource Mapping: Filling out multi-variable food system matrices to track how consumer demand, labor regulations, and shipping logistics intersect with environmental impact by following and tracking one school lunch ingredient.\nLogistical Budget Document: Building a comprehensive Monday-Friday meal and snack schedule that concurrently satisfies nutritional needs, time constraints, and a fixed monetary limit.\nAnalyzing Meals: Consider a few recent meals, and identify the macronutrient and micronutrient makeup of each part of the meal, followed by determining how this would impact the brain and body, and concluding what works well and what could use more attention.\nNeutral Eating Analysis: Students respond to reflection questions about the Neutral Eating Guide, and then participate in a gallery walk to compare answers to their classmates, reflect on what they agree and disagree on, and contribute suggestions to make the Guide more comprehensive or personalized to their own needs.", "materials": "Unit 4: Food & Nutrition", "assessments": "The Food Environment Peer Reflection: A paired worksheet check where students outline how a fictional student’s physical environments structurally limit or support their dinner choices.\nMacronutrient & Food System Sorting Challenge: A digital matching game testing students' ability to categorize biological macronutrients and evaluate systemic resource inputs.\nPlanning for Nutritional Independence: Students are assigned a fictional weekly budget tier ($10 to $50) and a set of scheduling complications (e.g., track meets, fatigue, after-school tutoring). They must formulate an actionable, itemized calendar mapping out exactly where they will buy lunch near school, what they will buy, the explicit financial and time costs to meet their budget and not be late to class, and how they will hit their baseline macronutrient targets. Students then cross-evaluate a peer’s portfolio to recommend optimizations.\nNeutral Eating Analysis: Students respond to reflection questions about the Neutral Eating Guide, and then participate in a gallery walk to compare answers to their classmates, reflect on what they agree and disagree on, and contribute suggestions to make the Guide more comprehensive or personalized to their own needs."}, {"name": "Unit 5"}, {"name": "Communication & Conflict Resolution", "timeframe": "3-4 class periods", "concepts": "Healthy & Unhealthy Relationship Traits: Evaluating the 20 core signs that differentiate a healthy relationship from an unhealthy one. Students analyze the progression from a light, easy social dynamic to unhealthy, escalatory patterns \nThe Four Conflict-Communication Styles: Defining, identifying, and contrasting the language and psychological underpinnings of four primary communication styles during conflict: passive, aggressive, passive-aggressive, assertive (assertive is ideal).\nConstructing a Healthy Conflict Conversation: Deconstructing the direct psychological benefits of an Assertive \"I-Statement\" over defensive \"You-Statements\". Mastering the foundational three-part communication formula: \"I feel... [Emotion]\" \"when you... [Objective Fact/Behavior without opinion or assumption]\" \"I need/want... [Direct, respectful boundary or actionable request]\"\nBarriers to Teen Peer Communication: Identifying systemic social obstacles that cause teenagers to avoid direct, honest dialogue\nReal-World Adolescent Conflict Arenas: Unpacking common, high-stakes relationship scenarios that 9th-graders encounter, such as navigating boundaries around physical affection/PDA in front of school peers, address last-minute plan cancellations, managing a failing group project partner, defining casual dating situations, and handling the intentional, respectful drifting apart of a long-term friendship.", "skills": "Behavior Analysis: Skimming and text-annotating relationship case studies to isolate, flag, and classify specific behaviors as either healthy or unhealthy.\nImproving Unhealthy Communication Examples: Actively transforming passive or aggressive responses into assertive, solution-oriented \"I-Statements\".\nHealthy Conflict Dialogue Construction: Designing and executing realistic, peer-reviewed verbal scripts to navigate interpersonal boundary violations under social pressure.", "materials": "Unit 5: Communication & Conflict Resolution", "assessments": "The 3-Part Ava & Jordan Diagnostic Check: An independent writing check where students analyze specific friction points in a story, list the exact unhealthy relationship traits displayed, and outline communication changes to move the relationship to a healthier place.\nThe Anonymous Argument Reflection: A post-it or index card reflective exit ticket where students analyze their own recent peer/family arguments, classify their communication style, and critique the effectiveness of their chosen strategies.\nThe Fishbowl Roleplay Performance Task: A live verbal demonstration where a student enters the \"fishbowl\" to launch a high-stakes dialogue using an original \"I-Statement.\" The student must spontaneously maintain assertive, calm, and boundary-focused communication against a live teacher-simulated counter-response."}, {"name": "Unit 6"}, {"name": "Sexual & Pelvic Health & Readiness", "timeframe": "4-5 classes", "concepts": "Defining \"Sex\" and \"Intercourse\": Expanding the definitions of sexu
