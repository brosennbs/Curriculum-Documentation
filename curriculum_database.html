nTranslating Latin passages and answering comprehension questions.\nUnderstanding the seven kings of Rome and their contributions to the early Roman Empire.", "materials": "Ecce Romani IA Textbook, Ecce Romani Language Activity Book, Quizlet Vocabulary Sets, Kahoot Vocabulary Review Games, Chapter 13 Practice Materials, and Chapter 14 Practice Materials.", "assessments": "Formative: Chapter 13a/13b & 14a/14b Vocab Checks, Imperfect Tense Quiz, Chapters 13–14 Test Review Sheet, Kings of Rome Homework.\nSummative: Chapters 13–14 Test, Kings of Rome Project (Rubric)."}, {"name": "Unit 2"}, {"name": "On Their Journey to Rome, Main Characters Are Stuck on the Via Appia", "timeframe": "5–6 weeks", "concepts": "Neuter nouns, Noun-adjective agreement, Kings of Rome project, Latin numbers, and Roman numerals", "skills": "Understanding the difference between neuter nouns and \"normal nouns\".\nTranslating and constructing Latin sentences using nouns of the first three declensions, along with second and third declension neuter nouns.\nUnderstanding and applying the concept of noun-adjective agreement.\nMastering charts for noun endings and for adjectives.", "materials": "Ecce Romani IA Textbook, Ecce Romani Language Activity Book, English derivative sheets, Quia online vocabulary exercises, Kings of Rome Powerpoint, Kings of Rome information sheet, Song and dance \"The Kings of Rome Macarena\", Creative coloring sheets for noun-adjective agreement, Charts for noun endings/adjectives, Mini cupcakes (representing the distinctive quality of neuter nouns), Chapter 15 Practice Materials, and Chapter 16 Practice Materials.", "assessments": "Formative: Quiz on Chapter 15 Vocabulary and Derivatives, Quiz on Chapter 16 Vocabulary and Derivatives, Quiz on Numbers and Roman numerals, Quiz on the Kings of Rome, and Review sheets for vocabulary quizzes and tests. \nSummative: Test (Chapters 15–16), Presentations on the Kings of Rome."}, {"name": "Unit 3"}, {"name": "To Stay at an Inn or Not? Arrival at the Inn", "timeframe": "3–4 weeks", "concepts": "Review of Regular Verbs and Irregular Verbs II (volō, nōlō, ferō) \nThird Declension Adjectives (Positive forms) \nNoun-Adjective Agreement II \nLegendary Heroes of Early Rome", "skills": "Inflecting and recognizing irregular verbs (volō, nōlō, ferō) in text.\nIdentifying and declining 3rd declension adjectives.\nDeciding which noun an adjective modifies based on case, gender, and number agreement.\nAnalyzing the traits and stories of early Roman mythical/historical heroes.", "materials": "Ecce Romani IA (Chapter 17) and Ecce Romani IB (Chapter 18)\nWord Study V worksheets\nPractice worksheets mapping identical test formatting", "assessments": "Formative: Vocabulary and derivative checks for Chapters 17 & 18 , Review III & Word Study V exercises.\nSummative: Chapters 17–18 Test (preceded by a practice review sheet)."}, {"name": "Unit 4"}, {"name": "Settling In and a Chance Encounter at the Inn", "timeframe": "4–5 weeks", "concepts": "Introduction to the Perfect Tense (System I & II)\nSubordinate clauses using the conjunction dum (while)\nUses of the Infinitive (Consolidation)\nPrincipal Parts of Verbs\nRoman Culture: Travel, Hospitality, and Graffiti from Ancient Inns\nHistory: The Early Roman Republic", "skills": "Recognizing perfect tense verb stems and endings, and translating them accurately as past actions.\nIdentifying and deploying the four principal parts of a verb to build tenses.\nIdentifying subordinate clauses introduced by dum.\nMaking cultural and historical comparisons regarding ancient Roman hospitality, everyday travel conditions, and early republican governance.", "materials": "Ecce Romani IB (Chapters 19–20)\nMaps: Viae Italiae Romanae, Iter Horatii, and Rōmānī Italiam Vincunt", "assessments": "Formative: Perfect Tense verb synopsis drills, Principal Parts quizzes , Early Republic background worksheets.\nSummative: Unit Test on Chapters 19–20 and Principal Parts."}, {"name": "Unit 5"}, {"name": "Plotting a Murder at the Inn", "timeframe": "2–3 weeks", "concepts": "Complex Latin prose translation strategies\nIntroduction to the active verbal system expansion\nRoman Life: Eavesdropping and crime in ancient travel", "skills": "Synthesizing all grammar learned across chapters 18–21 to decode an extended story narrative.\nApplying reading-in-context strategies to infer missing words or historical subtext.", "materials": "Ecce Romani IB (Chapter 21)\nReview IV Framework Materials", "assessments": "Formative: Chapter 21 vocabulary checks and chapter test."}, {"name": "Unit 6"}, {"name": "From the Inn to Rome: Traveling the Via Appia", "timeframe": "3-4 weeks", "concepts": "The Dative Case (Indirect Object, impersonal constructions licet and necesse est, and special verbs)\nDifferentiating Dative vs. Ablative case endings\nThird Declension Adjectives of One Termination\nFrontier Life: Rome and Northern Europe", "skills": "Identifying the dative case by its noun endings across the 1st, 2nd, and 3rd declensions.\nTranslating sentences utilizing licet (\"it is allowed\") and necesse est (\"it is necessary\") paired with a dative reference.\nParsing and distinguishing between dative functions and ablative functions when forms look identical.", "materials": "Ecce Romani IB (Chapter 22)\nWord Study VI derivative tracking charts", "assessments": "Formative: Dative Case sentence construction quizzes , Northern Europe geography check.\nSummative: Chapter 22 Grammatical Mastery Test."}, {"name": "Unit 7"}, {"name": "Arrival at the Porta Capena and Moving into Tomorrow", "timeframe": "5–6 weeks", "concepts": "Adjectives used as Substantives\nFuture Tense (Systems I & II)\nPluperfect Tense and Future Perfect Tense Active Indicative\nDative case with intransitive compound verbs\nAblative of Cause\nRoman Infrastructure: Aqueducts\nHistory: The First and Second Punic Wars\nFrontier Life: North Africa and Cultural Assimilation", "skills": "Determining if an adjective is functioning as a noun (Substantive) based on context.\nGenerating, identifying, and contrasting verb forms across the entire active indicative timeline: Present, Imperfect, Future, Perfect, Pluperfect, and Future Perfect.\nIdentifying and translating the Ablative of Cause.\nMapping the tactical maneuvers of the Punic Wars and understanding how Rome shifted into a dominant Mediterranean superpower.", "materials": "Ecce Romani IB (Chapters 23–24)\nMaps: Septem Montes Romae and Bellum Pūnicum Secundum", "assessments": "Formative: Tense-changing synopsis drills (Future/Pluperfect/Future Perfect) , Aqueduct structural homework , Punic Wars guided reading sheet.\nSummative: Test on Chapters 23–24 , Creative Historical Project or Report on the Punic Wars or Aqueducts."}]}, {"name": "", "department": "Classics", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Class I", "department": "Comput y to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "All About Me Project - Programming (Scratch)", "timeframe": "Fall-Winter", "concepts": "How can we use programming to present information?\nWhat is a variable (in terms of programming)?\nThinking methodically to create functional programs.", "skills": "Implementing foundational coding elements: loops, conditionals, variables, and broadcast statements.\nMethodical planning and logical debugging.", "materials": "Scratch", "assessments": "All About Me\" presentation incorporating loops, conditionals, broadcast statements, and variables."}, {"name": "Unit 2"}, {"name": "Physical Computing & Programming (Scratch & Makey Makey)", "timeframe": "Winter", "concepts": "How does a Makey Makey work? What’s a circuit?\nHow can the physical world interact with the digital world?", "skills": "Circuit building and bridging physical interfaces with software.\nDesigning interactive UI/UX components.", "materials": "Makey Makey\nPizza boxes\nConductive materials\nHote glue", "assessments": "Design,build, and program a digital operation game"}, {"name": "Unit 3"}, {"name": "3D Design & Universal Design", "timeframe": "Spring", "concepts": "How can we design a 3D model?\nWhat is design thinking?\nWhat is universal design, and how can we design spaces that are more inclusive?", "skills": "3D spatial modeling.\nAsset deployment and environment configuration within Virtual Reality (VR).\nApplying empathy and universal design principles to spatial architecture.", "materials": "inkerCAD (3D Modeling)\nCoSpaces (VR Environment Development)", "assessments": "Create a 3D model of an inclusive playspace in TinkerCAD, import the assets, and build an interactive VR environment in CoSpaces."}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Kindergarten Technology", "department": "Computer Science", "teacher": "Alyssa Pyle", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Introduction to Computers and Wixie", "timeframe": "Approximately 3 months", "concepts": "Understanding the physical parts of a computer.\nNavigating the user interface of an internet browser, symbaloo page, and the Wixie platform.\nComprehending digital workspaces (making pages larger, scrolling to see choices).\nCreating artifacts in digital platforms.", "skills": "Identifying and naming parts of a computer.\nOpening an internet browser and closing webpages.\nNavigating and controlling the screen using a mouse (including clicking and dragging).\nAdjusting page views (zooming/making a webpage larger).\nScrolling down a page to view all available options.", "materials": "Computers / Devices\nWixie Platform\niPads", "assessments": "Formative: Observation of mouse skills (click and drag, scrolling) during class activities.\nSummative: Creation of an introductory digital artifact or project within Wixie."}, {"name": "Unit 2"}, {"name": "Introduction to Programming", "timeframe": "Approximately 3.5 months", "concepts": "What is programming? Understanding how to program something to complete an action.\nAlgorithmic Thinking: Concepts of sequencing instructions to achieve a specific goal.\nProblem Solving: Basic debugging techniques and strategies for approaching coding challenges.", "skills": "Sequencing a series of commands or instructions in the correct order.\nDirecting physical and digital objects to complete tasks and challenges.\nIdentifying errors in a sequence and applying basic debugging to fix them.\nNavigating and completing leveled challenges within a coding platform.", "materials": "Bee-Bot programmable floor robots\nKodable platform", "assessments": "Formative: Observation of problem-solving and troubleshooting during hands-on Bee-Bot challenges.\nSummative: Completion milestones reached within the Kodable platform challenges."}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Class V - Creative Computing", "department": "Computer Science", "teacher": "Christina Tobajas", "grade": "", "length": "", "description": "", "competencies": "", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Class VI Creative Machines: Intro to Physical Computing", "department": "Computer Science", "teacher": "Christina Tobajas", "grade": "", "length": "", "description": "", "competencies": "", "units": [{"name": "Unit 0"}, {"name": "Unit 0: Introduction to Physical Computing", "timeframe": "", "concepts": "Defining a Computer: Identifying that a computer is not just a laptop or phone, but any device that processes data.\nHardware vs. Software: Differentiating between the physical components (circuits, buttons, screens) and the digital instructions (code) that tell them what to do.\nThe Information Processing Cycle: The four core functions of all computers: Input, Processing, Storage, and Output.", "skills": "Categorization: Correctly identifying parts of a device as either hardware or software.\nSystem Analysis: Tracing the path of information through a system (e.g., \"When I press this button [Input], the CPU calculates the result [Processing] and shows it on the screen [Output]\").", "materials": "", "assessments": ""}, {"name": "Unit 1"}, {"name": "Unit 1: Exploring Built-in Inputs and Outputs", "timeframe": "", "concepts": "Control Flow: Differentiating between the On Start block (initialization) and the Forever block (looping execution).\nEvents: Understanding how the computer listens for specific triggers, such as button presses (Input), to execute code.\nAdditive Color Mixing (RGB): The science of combining Red, Green, and Blue light at different intensities to create a full spectrum of colors on the LEDs.\nFunctions and Parameters: An introduction to organizing code into reusable blocks and using parameters to send specific data to those blocks.", "skills": "Identifying and using input events to trigger hardware outputs.\nPredicting program behavior based on whether code is placed in a loop or an initialization block.\nProgramming NeoPixel LEDs using specific RGB values to achieve desired colors.", "materials": "", "assessments": "Classwork #1: \"Light it Up\" (designing an interesting light pattern and use RGB)"}, {"name": "Unit 2"}, {"name": "Unit 2: Functions and Decomposition", "timeframe": "3 - 4 classes", "concepts": "Abstraction: Grouping complex code (like musical notes or light patterns) into a single reusable block.\nFunction Definition vs. Calling: Understanding that a function must be defined before it can be used in the main program.\nParameters: Using variables within functions to change specific outputs (like pitch or duration) without duplicating code.", "skills": "Creating custom functions in the MakeCode \"Functions\" category.\nOrganizing code logically to make it readable and efficient.\nUsing parameters to pass values into functions for dynamic responses.", "materials": "", "assessments": "Classwork #2: \"Name That Tune\": Students program a recognizable melody using functions to represent different musical phrases or repeating patterns."}, {"name": "Unit 3"}, {"name": "Unit 3: Variables", "timeframe": "", "concepts": "The Purpose of Variables: Understanding a variable as a \"container\" or \"placeholder\" for information that can change, and why this is more efficient than hard-coding values.\nProgram Tracing: Reading code to track how and why a variable’s value changes as the program executes (e.g., following a counter as a button is pressed).\nInitialization and Modification: Understanding that a variable must be created (initialized) before it can be updated.", "skills": "Conceptual Explanation: Explaining in plain language how a variable functions within a specific program.\nCode Analysis: Predicting the output of a MakeCode program by reading the logic of variable updates.\nImplementation: Creating variables in the MakeCode environment and using the \"set\" and \"change\" blocks to update their values.", "materials": "", "assessments": "Choice-Based Game Design: For their primary assessment, students choose to build and code one of the following physical computing devices:\nRoll the Dice: Using variables to generate and display random numbers.\nHot Potato: Utilizing a variable to track a countdown or \"state\" before an event triggers.\nSpinner Game: Coding a randomized visual output using the NeoPixel ring.\nThe Game of \"War\": Implementing variables to compare two values and determine a winner."}, {"name": "Unit 4"}, {"name": "Final Project - Creative Machines Showcase", "timeframe": "", "concepts": "Digital Pins: Identifying how pads on the CPX send ON/OFF signals to external components.\nCircuits: Understanding a complete path for electricity to power and control components (including Ground/GND and Power/VOUT).\nEngineering: Refining both the physical build (alligator clips, cardboard structures) and the code logic to ensure reliability.", "skills": "Programming Outputs: Coding digital pins to control external LEDs.\nMechanical Control: Connecting and controlling a servo motor using digital pins.\nHardware Debugging: Identifying if an issue is caused by physical wiring, code logic, or pin selection.\nSystem Design: Testing an interactive physical system that produces visible or mechanical output.", "materials": "", "assessments": "Final Invention & Showcase: A functional physical computing device that must include movement and is challenged to include a light-based response.\nPeer Demonstration: Students showcase their machine, explaining their code logic and how they overcame hardware challenges during the build."}]}, {"name": "Class VII - Art of Code: Creative Coding with p5.js", "department": "Computer Science", "teacher": "Christina Tobajas", "grade": "", "length": "", "description": "", "competencies": "", "units": [{"name": "Unit 1"}, {"name": "Unit 1: Draw with Code (Functions + Parameters)", "timeframe": "9 Class Meetings", "concepts": "Programming Foundations: Understanding functions as named sets of tasks and parameters (arguments) as the extra information passed to functions.\nDigital Canvas: Exploring pixels as the smallest unit of a digital image and the Cartesian coordinate system used in p5.js.\nComputational Logic: How inputs to a program directly affect its output.\nProblem Decomposition: Breaking down complex visual ideas into manageable shapes and code segments.\nSyntax: Mastering the rules of the programming language (spacing, capitalization, punctuation).", "skills": "Coding Syntax: Writing correct statements to call 2D primitive shape functions such as rect(), ellipse(), line(), triangle(), and quad().\nVisual Styling: Applying color and outline attributes using stroke(), strokeWeight(), noStroke(), fill(), and noFill().\nResearch & Documentation: Effectively using the p5.js reference to troubleshoot and learn new functions.\nInterpretation: Translating written code into mental or physical visual models and vice versa.\nIterative Development: Practicing a \"Code, Test, & Debug\" workflow by checking programs incrementally", "materials": "CS7 Art of Code", "assessments": "Classwork #1 (Creature Code): A summative project where students design and code a real or imaginary creature on a 400x400 canvas.\nMini Project 1 (Interpret an Image with Code): A multi-day project (approx. 3 days) applying the unit's foundational skills.\nQuiz 1 (Shapes + Color): A live assessment of understanding involving tracing, predicting, and debugging code.\nClass Participation: Ongoing formative assessment of student engagement and collaboration."}, {"name": "Unit 2"}, {"name": "Unit 2: Make it Move (Variables)", "timeframe": "10 Class Meetings", "concepts": "Variables as Containers: Understanding variables as placeholders that store information (data) which can change over time.\nThe Animation Loop: How the draw() function acts as a continuous loop, allowing for the illusion of motion.\nSystem Variables: Leveraging built-in p5.js variables like width, height, mouseX, and mouseY.\nState & Change: Understanding the three-step process of using variables: Declare, Initialize, and Update.\nInteractivity: How user input (mouse movement/clicks) can be mapped to visual changes.", "skills": "Creating Motion: Animating shapes by incrementing or decrementing variable values within the draw() loop (e.g., x = x + 1).\nDynamic Styling: Using variables to change colors, sizes, and positions based on user interaction.\nDebugging Logic: Identifying why a variable might not be updating or why a shape is \"leaving a trail\" (background placement).\nMathematical Application: Applying basic arithmetic to control speed, direction, and scale in a sketch.", "materials": "CS7 Art of Code", "assessments": "Classwork #2: Animate a Scene: A technical challenge focused on animation (clouds, car, sun, balloon).\nClasswork #3: Smart Sizing: A \"reverse engineering\" challenge where students must reproduce a design using width and height for all positions and sizes.\nChallenge: Remixing the Unit 1 \"Creature\" to be fully responsive using system variables."}, {"name": "Unit 3"}, {"name": "Unit 3: Control Flow (Conditionals)", "timeframe": "10 Class Meetings", "concepts": "Conditional Logic: Understanding how to use if, else if, and else statements to allow the program to make decisions.\nBoolean Expressions: Using comparison operators (>, <, ==, !=, >=, <=) to evaluate whether a condition is true or false.\nBoundary Detection: Calculating when a moving object reaches the limits of the canvas (Collision Detection).\nInteractive Zones: Creating \"buttons\" or \"rollover\" areas where code triggers only when the mouse is within a specific coordinate range.\nLogic Gates: Introduction to logical operators like AND (&&) and OR (||) to combine conditions.", "skills": "Syntax Construction: Writing correctly formatted conditional blocks with curly braces and parentheses.\nState Management: Using variables to toggle the \"state\" of a sketch (e.g., clicking to turn a background from black to white).\nPredictive Reading: Tracing code to determine which branch of a conditional will execute under specific circumstances.\nTranslating Requirements: Converting \"If-Then\" English sentences into functional p5.js code (e.g., \"If the ball hits the right wall, make it go left\").", "materials": "p5.js Reference: Relational Operators.\nUnit 3 Lesson Slides (Lessons 5 & 6).", "assessments": "Classwork #4: Code Clash Rollovers: A summative coding assignment where students must design a program that incorporates a rollover."}, {"name": "Unit 4"}, {"name": "Unit 4: Bounce, Click, Reset!", "timeframe": "", "concepts": "Physical World Simulation: Using conditionals and programming logic to simulate physical actions, such as bouncing or resetting motion.\nLogical Operators: Mastering the use of OR (||) and AND (&&) to create more complex conditional expressions.\nBoundary Detection (Advanced): Understanding what it means for a shape to \"reach the edge\" of a canvas (e.g., x > width or x < 0).\nMathematical Interactions: Using the dist() function to calculate the distance between points for circular button detection.\nBoolean System Variables: Utilizing built-in variables like mouseIsPressed and keyIsPressed.", "skills": "Resetting Animations: Programming objects (like clouds or the sun) to reset their position or size once they reach a specific threshold.\nEdge Detection & Bouncing: Using speedX = speedX * -1 logic to reverse direction when a shape hits the canvas boundaries.\nInteractive Button Design: Coding rectangular and circular hitboxes that respond to user clicks.\nLogic Evaluation: Determining the truth values of complex Boolean expressions using truth tables for AND/OR logic.", "materials": "CS7 Art of Code", "assessments": "Edge Detection Practice: Modifying code to make a ball move and bounce vertically (downward) instead of horizontally.\nClasswork #5: Interactive Buttons: A summative project where students fork their Mini Project 1 and add:\nKeyboard interactivity (keyIsPressed).\nOne functioning rectangular button.\nOne functioning circular button."}, {"name": "Unit 5"}, {"name": "Unit 5: Pixels, Beats, and Bytes (Images, Text, and Sound)", "timeframe": "", "concepts": "Data Types & Extensions: Understanding that data comes in many forms (e.g., .jpg, .png, .mp3, .txt) and recognizing how file extensions tell computers how to process them.\nThe preload() Function: Learning how to use the asynchronous preload() function to ensure large media assets (images and sound) are fully loaded before the program starts.\nMedia Objects: Using variables to store and manipulate media files.\nAsset Attribution: Understanding the importance of sourcing and giving credit for copyrighted content.", "skills": "Image Manipulation: Uploading and displaying images using loadImage() and image(), and modifying their attributes (position and size).\nText Styling: Using text(), textSize(), textFont(), and fill() to incorporate and style typography in code.\nAudio Integration: Enabling the p5.sound library, loading sounds with loadSound(), and controlling playback with play().\nObject Methods: Calling specific methods on media objects (e.g., song.play()).", "materials": "CS7 Art of Code", "assessments": "Classwork #6: Collage: Students must create a project (CW6_LastName) containing at least 3 images, all preloaded, resized, and properly cited with URLs.\nClasswork #7: Album Cover: A more complex project (CW7_LastName) requiring the integration of at least one image, one sound file, and styled text."}, {"name": "Unit 6"}, {"name": "Unit 6: Repeat After Me (Loops)", "timeframe": "1 - 2 days", "concepts": "Iteration: Understanding how to use loops to execute a repeated block of code a specific number of times.\nFor Loop Anatomy: Mastering the three parts of a for loop: Initialization (starting point), Condition (how long to run), and Increment (how to count).\nThe Index Variable (i): Using the loop variable to dynamically change positions or sizes of shapes in a sequence.\nModulo Operator (%): Using the remainder operator to create alternating patterns (e.g., alternating colors in a row).", "skills": "Pattern Recognition: Identifying repeating parameters in manual code and refactoring them into a single loop.", "materials": "CS7 Art of Code", "assessments": "Classwork #8: Linear Pattern/Grid:\nStudents must use a for loop to generate a pattern along the x-axis or y-axis.\nRequirements: Must include variation in color or size and proper code indentation.\nNested Loop Challenge: A summative task to create an 8x8 checkerboard or a receding landscape using nested iteration.\nCode Tracing: Predicting the output of loop-based code snippets to understand index variable behavior."}, {"name": "Unit 7"}, {"name": "Final Project", "timeframe": "Approx. 10–12 Class Meetings", "concepts": "Creative Autonomy: Synthesizing all previous technical skills to express a personal interest or solve a specific creative problem.\nProject Management: Moving through the full development lifecycle: Ideation, Planning, Coding, Testing, and Presenting.\nIndependent Research: Identifying and learning new p5.js functions or libraries independently to achieve specific project goals.", "skills": "Synthesis: Integrating variables, conditionals, media assets, and loops into a cohesive, complex program.\nTechnical Documentation: Using extensive comments to explain logic and cite external resources/media.\nPeer Review & Iteration: Engaging in \"Beta Testing\" sessions to give and receive constructive feedback.\nPresentation: Publicly demonstrating the final product and explaining the \"why\" behind the code.", "materials": "", "assessments": "Final Project Sketch: A high-complexity program that meets a custom rubric (Technical Rigor, Creativity, User Interactivity).\nFinal Presentation: A showcase of the working sketch to the class."}]}, {"name": "Class VIII - Python Lab: Foundations in Programming", "department": "Computer Science", "teacher": "Christina Tobajas", "grade": "", "length": "", "description": "", "competencies": "Breaking a complex task into sequential subproblems; identifying required inputs and expected outputs before writing code.\nUtilizing key programming constructs (functions, variables, data types, lists, conditionals, loops).\nDeveloping, tracing, and debugging text-based code logically.", "units": [{"name": "Unit 0"}, {"name": "Introduction to Computational Thinking & Problem Solving", "timeframe": "1 Week", "concepts": "Breaking a complex task into sequential subproblems \nInput-Process-Output (IPO) model identifying required inputs and expected outputs before writing code.", "skills": "", "materials": "Coding Escape Room", "assessments": "Problem Set 0\nQuiz 0"}, {"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "2 weeks", "concepts": "Memory Assignment & Storage: Understanding how variables function as named labels pointing to data values in computer memory.\nBasic Text-Based Data Types: Distinguishing between strings (text data), integers (whole numbers), and floats (decimal numbers), and knowing when to use each.\nExpression Syntax: Building basic mathematical and logical assignments using proper operator hierarchy (PEMDAS).\nEnvironment Execution: Navigating a text-based programming workspace (such as Google Colab or an integrated terminal environment) to write, run, and observe live code outputs.", "skills": "Declaring Variables: Creating clear, meaningful variable names using industry-standard naming conventions (such as snake_case).\nManipulating Basic Strings: Combining separate text variables through concatenation (+) and using basic data conversion functions like str(), int(), and float().\nHandling Keyboard Input: Capturing interactive user input from the terminal using the input() function and dynamically storing it into variables.\nBasic Syntax Debugging: Identifying, reading, and troubleshooting fundamental syntax and type errors flagged by the runtime engine.", "materials": "Unit 1\nUnit 1 CoLab", "assessments": "Unit 1 Problem Set\nCW 1\nFrequent check-ins\nUnit 1 Quiz"}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "2.5 weeks", "concepts": "Object Methods and Modules: Understanding modules as code extensions (turtle) and methods as functions explicitly associated with an object.\nThe Turtle Coordinate Plane: Concept of drawing within an $X/Y$ coordinate system centered at $(0,0)$ where directional turns are relative to the turtle's current heading.\nRepetition Structures (Iteration): Utilizing fixed iterations (for loops) to eliminate redundant code blocks.\nModularity with Nested Loops: Structuring loops within loops to manipulate geometric patterns efficiently.\nLinear Data Collections: Introducing arrays/lists as ordered collections of items managed under a single, pluralized variable label using zero-indexed notation.", "skills": "Environmental Workspace Setup: Importing external modules (import turtle) and initializing drawing objects within Google Colab platforms.\nBasic Vector Control: Navigating drawing paths using spatial commands (forward, backward, right, left, goto, setheading).\nAlgorithmic Polygon Generation: Calculating interior/exterior angles to reverse-engineer regular polygons (triangles, squares, hexagons, octagons) using a for i in range() structure.\nGeometric Pattern Generation: Orchestrating nested loops to create procedural geometric art, such as repeating shapes 36 times across a global canvas.\nData Collection Iteration: Declaring lists, extracting elements via direct index tracking (list[index]), and iterating smoothly through items using for each loop  in list logic.\nVisual Aesthetics Control: Modifying pen sizes, background canvases, shapes, and filling bounds using string color arguments and RGB value parameters.", "materials": "", "assessments": "Unit 2 Problem Set\nClasswork 2: Turtle Art\nFrequent check-ins\nUnit 2 Quiz"}, {"name": "Unit 3"}, {"name": "Choose Your Own Adventure: Conditionals, Logical Operators, and Input Validation", "timeframe": "3 weeks", "concepts": "Control Flow Modification: Understanding how conditional testing interrupts sequential execution to create branching paths based on input variables.\nBoolean Expressions: Evaluating data comparisons using operators (>, <, ==, !=, <=) to resolve strictly to True or False.\nData Type Casting & Integrity: Managing string conversions (int(), str(), float()) to align input data types with required comparison logic formats.\nCompound Logic Processing: Building multi-tiered conditions using logical operators (and, or, not) along with absolute logical standards via Truth Tables.\nInfinite vs. Finite Loops: Using while loop conditions to continuously run code segments until specified state validation flags switch to false.\nPseudocode Mapping: Formulating structural textual logic to break down algorithm requirements prior to code construction.\nPseudo-Random Data Generation: Integrating built-in code libraries (import random) to generate arbitrary integer values within fixed boundaries.", "skills": "Executing Conditional Blocks: Designing working code paths using structural if, elif, and else statements with exact semantic syntax.\nString Validation Testing: Comparing literal string variables case-insensitively and testing character limitations using the len() function.\nValidating Interactive Inputs: Wrapping user inputs within while loop configurations to freeze program progression until data matching standard specifications is supplied.\nIncremental Project Debugging: Tracing conditional execution step-by-step to isolate logic conflicts, type mismatches, and whitespace errors.\nTracking and Modifying Loop Counters: Implementing count variables within repetition structures to log exact loop execution counts and prevent infinite loop errors.\nCharacter String Iteration: Handling strings as iterable data sequences to inspect or rewrite single characters within a loop structure.", "materials": "Unit 3", "assessments": "Problem Set 3\nClasswork 3: Quiz and Tell\nFrequent check-ins\nQuiz 3"}, {"name": "Unit 4"}, {"name": "Building with Functions", "timeframe": "1.5 Weeks", "concepts": "Code Modularity and Abstraction: Breaking complex monolithic tasks into separate, self-contained subprograms (functions) to manage program complexity.\nFunction Definition vs. Execution (Calling): Distinguishing between defining a function (teaching the computer a new routine) and calling a function (running that routine in the main script thread).\nInformation Passing: Passing parameters or inputs (arguments) dynamically into local functional boundaries.\nVoid vs. Fruitful Functions: Differentiating between standard routines that execute actions locally (void functions) and expressions that calculate and return structured data objects back to the main script (fruitful functions using return).\nVariable Scope and Lifespan: Observing how information behaves inside functional walls compared to variables operating in the main body of the application.", "skills": "Declaring Correct Syntactic Blocks: Writing function headers using Python's specific keyword format (def function_name(parameter):) combined with rigorous indentation formatting rules.\nInterpreting Code Tracing Flow: Tracking non-linear script execution as control jumps from main lines directly into functional code blocks and back.\nHandling Variable Data Arguments: Packaging text or integers into function calls to modify final logic computations dynamically.\nAssigning Return Expressions: Mapping outputs from returning functions straight into functional variable buckets or embedding them directly inside print streams.", "materials": "Unit 4", "assessments": "Problem Set 4\nClasswork 4: Cryptography\nFrequent Check-ins\nQuiz 4"}]}, {"name": "Advanced Algorithms and Data Structures", "department": "Computer Science", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials"
