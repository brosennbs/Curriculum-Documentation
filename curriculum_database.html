espués) to describe a logical sequence of events in a day.\nInterpersonal Communication: Asking and answering questions about personal habits and schedules.\nLiteracy: Identifying the difference between reflexive and non-reflexive actions (e.g., lavar vs. lavarse).", "materials": "Textbook: Aventuras (specifically pages 170–190).\nDigital Tools: Quizlet Flashcards. \nPractice Sheets: Paquete de práctica (Unit 7) and digital interactive activities for reflexive verbs.", "assessments": "Oral Presentation: Describing a typical morning routine using reflexive verbs and sequence words.\nUnit 7 Quiz: Focusing on reflexive verb conjugations and the use of negative/affirmative words."}, {"name": "Unit 6"}, {"name": "Unit 8. ¡A comer!", "timeframe": "May - June (Likely VIIIB will finish on this unit)", "concepts": "Vocabulary: Food items, meals (breakfast, lunch, dinner), and restaurant-related terminology.\nGrammar - Preterite Tense (Irregular): Conjugation of high-frequency irregular verbs in the past tense, such as ser, ir, dar, and hacer.\nGrammar - Stem-Changing Verbs: Formation of preterite stem-changing verbs (e.g., servir, dormir).\nGrammar - Comparisons: Using \"more than,\" \"less than,\" and \"as much as\" (e.g., más que, menos que, tan... como).\nGrammar - Superlatives: Expressing the \"most\" or \"best\" of a category.", "skills": "Functional Language: Ordering a meal and interacting with staff in a restaurant setting.\nAnalytical Comparison: Comparing different foods, prices, and cultural dining habits.\nNarrative Writing: Recounting a past dining experience using irregular preterite verbs.", "materials": "Textbook: Aventuras (specifically pages 190–210).\nDigital Tools: Quizlet Flashcards for Food & Restaurant.\nInteractive Practice: Digital activities for comparisons and superlatives.", "assessments": "Restaurant Role-Play: A speaking assessment where students simulate a dining experience.\nUnit 8 Exam: Comprehensive test covering food vocabulary, irregular preterite conjugations, and comparative structures."}, {"name": "Unit 7"}, {"name": "Unit 9. Las fiestas.", "timeframe": "3-4 weeks", "concepts": "Vocabulary: Parties, celebrations, stages of life (birth, adolescence, etc.), and personal relationships.\nGrammar - Irregular Preterites: Mastering verbs with \"u-stem\" (tener/tuv-), \"i-stem\" (venir/vin-), and \"j-stem\" (decir/dij-) changes.\nGrammar - Verbs with Meaning Changes: Understanding how certain verbs change meaning in the preterite (e.g., conocer = to meet; saber = to find out).\nGrammar - Relative Pronouns: Introduction to using que, quien(es), and lo que to combine sentences.\nGrammar - Interrogatives: A review of all question words (e.g., ¿cuál?, ¿cuánto?).", "skills": "Narrative Complexity: Describing past celebrations and life milestones with specific detail and correct irregular verb forms.\nRelational Descriptions: Explaining relationships and defining people or things using relative pronouns.\nInterrogative Precision: Formulating complex questions to interview others about their personal history or family traditions.", "materials": "Textbook: Aventuras (specifically pages 210–235).\nDigital Tools: Quizlet Flashcards for Las Fiestas y Etapas de la Vida.\nInteractive Practice: Digital activities for irregular preterites.", "assessments": "Written Reflection: A short essay describing a memorable celebration (e.g., a birthday or holiday) using the irregular preterite.\nUnit 9 Exam: Focusing on life-stage vocabulary, irregular past tense forms, and relative pronouns."}]}, {"name": "Spanish class VIII", "department": "Modern Languages - Spanish", "teacher": "Hernán J Sánchez  and Amparo Barón", "grade": "VIII", "length": "Full year", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Lección 9: Las celebraciones (Barón)", "timeframe": "3-4 weeks", "concepts": "This unit will focus on personal milestones, social celebrations, and the nuances of narrating and describing past events in Spanish. Students will explore how important moments throughout life shape personal identity, relationships, and cultural traditions. Through readings, discussions, listening activities, and written and oral practice, students will strengthen their ability to communicate about experiences, memories, emotions, and significant events using appropriate vocabulary and past tense structures.\nVocabulary: Thematic vocabulary will include the stages of life (childhood, adolescence, adulthood, and old age), personal relationships and emotional states (friendships, family relationships, marital status, feelings, and states of mind), as well as different types of celebrations and social gatherings such as birthdays, weddings, anniversaries, graduations, and family traditions. Students will also develop greater fluency in describing people, recounting experiences, and discussing cultural customs related to celebrations in the Spanish-speaking world.\nCultural Competence: A cultural focus for this unit will center on how life milestones and celebrations reflect the values, traditions, and social relationships within the Spanish-speaking world. Students will explore how different Hispanic cultures celebrate important events such as quinceañeras and compare these traditions to significant milestones and celebrations within their own cultures. Through these comparisons, students will develop a deeper understanding of cultural identity, family traditions, and the role of community in different societies.", "skills": "Grammar:\n Irregular Preterites: Master verbs with irregular stems such as tener (tuv-), decir (dij-), venir (vin-), and poder (pud-).\nMeaning Changes: Identifying verbs that change meaning in the preterite tense (e.g., saber, conocer, querer, and poder).\nRelative Pronouns: Introduction to que, quien(es), and lo que to create complex sentences.\nReading: Año nuevo: Una sola fiesta con muchas variaciones", "materials": "Textbook: : Aventuras supported by the online platform VHL.\nWorkbook: Aventuras  -  Cuaderno de Práctica. \nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.", "assessments": "Tests, quizzes, oral presentations.readings and discussions. \n\nUnit Project:Students will create a written  essay and oral PowerPoint presentation comparing the tradition of the quinceañera in Mexico with a significant celebration or milestone in their own culture. The project will require students to analyze cultural similarities and differences, including traditions, symbolism, family roles, values, clothing, music, food, and social significance structures studied throughout the unit."}, {"name": "Unit 2"}, {"name": "Lección 10: En el Consultorio (Barón)", "timeframe": "3-4 weeks", "concepts": "This unit will focus on health, wellness, medical situations, and communication in everyday healthcare settings. Students will develop the language skills necessary to describe symptoms, discuss physical and emotional well-being, give recommendations, and interact in situations related to doctors’ visits and healthy living.\nThematic Vocabulary: Parts of the body, illnesses and symptoms, medical treatments, healthy habits, emotional and physical states, injuries, medications, healthcare professionals, and expressions commonly used in medical consultations and emergencies. Students will also learn vocabulary related to nutrition, exercise, and overall wellness in order to discuss healthy lifestyles and preventative care.\nCultural Competence:Students will explore the role of shamans (chamanes) and traditional healing practices in different Hispanic and Indigenous cultures of Latin America. The unit will examine how traditional medicine, herbal remedies, spirituality, and ancestral healing practices continue to influence healthcare and cultural identity in many communities. Students will compare traditional and modern approaches to medicine while reflecting on the cultural beliefs, values, and historical traditions connected to health and wellness in the Spanish-speaking world.", "skills": "Grammar: \nThe Imperfect Tense: Learning the formation and usage of the imperfect tense for ongoing, habitual, or descriptive actions in the past.\nConstruction with se: Using impersonal se for accidental occurrences and general statements (e.g., se prohíbe fumar).\nAdverbs: Formation of adverbs using the -mente suffix.\nKey Skills:\nHealth Literacy: Describing symptoms, illnesses, and physical states to a healthcare professional.\n \nNarrative Distinction: Successfully alternating between preterite and imperfect to tell complex stories in the past.\n\nExpressing Unintentionality: Using se to describe accidents or unplanned events without assigning direct blame. \nReading: Servicios de salud", "assessments": "Tests, quizzes, oral presentations.readings,  and discussions. \nUnit Project: Students will create a written and oral presentation comparing the healthcare system of a Spanish-speaking country in Latin America with the healthcare system of the United States. The project will require students to examine aspects such as access to medical care, public and private healthcare services, cost of treatment, traditional and modern medicine, the role of healthcare professionals, and cultural attitudes toward health and wellness."}, {"name": "Unit 3"}, {"name": "Lección 11: El carro y la tecnología (Barón)", "timeframe": "3-4 weeks", "concepts": "This unit will focus on transportation, automobiles, technology, and the impact of technological advancements on everyday life and society. Students will develop the language skills necessary to discuss cars, driving, travel, modern inventions, digital communication, and the advantages and disadvantages of technology.\nThematic Vocabulary: Parts of a car, driving and transportation terms, traffic and road safety, accidents and repairs, technology and digital devices, social media, communication tools, inventions, and expressions related to problem-solving and daily technological use. Students will also expand their vocabulary related to innovation, artificial intelligence, environmental impact, and responsible use of technology.\nCultural Competence: Students will explore how technology and transportation have transformed life in different Spanish-speaking countries. The unit may include discussions about public transportation systems, environmental initiatives, the role of technology in education and communication, and how access to technology differs across regions and social groups in the Hispanic world.", "skills": "Grammar: \nPreterite vs. Imperfect: Identifying the triggers for each tense to distinguish between completed events and background descriptions.\npor and para to express purpose, destination, duration, deadlines, exchange, opinions, and movement.\nStressed possessive adjectives and pronouns to express ownership and emphasis in both spoken and written communication.\nKey Skills:\nDescribe electronic devices and the use of technology.\nNarrate past events using the distinction between the preterite and imperfect tenses appropriately.\nExpress possession and complex spatial/temporal relationships \nReadings: Las redes sociales and the comic strip “El celular” by Tute.", "materials": "Textbook: Aventuras -  supported by the online platform VHL.\nWorkbook: Aventuras : Cuaderno de Práctica. \nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.", "assessments": "Tests, quizzes, oral presentations.readings,  and discussions. \nAssessments:  Narrative writing task using past tense contrast between preterite and imperfect \nUnit project:Students will create a written and oral multimedia presentation analyzing the impact of technology and electronic devices on modern life and human interaction by comparing a Spanish-speaking country and the United States."}, {"name": "Unit 4"}, {"name": "Lección 12: Hogar, dulce hogar (Barón)", "timeframe": "3-4 weeks", "concepts": "This unit will focus on the home, household responsibilities, living spaces, family interactions,  and the concept of home as a reflection of culture and identity. Students will develop the language skills necessary to describe houses and rooms, discuss household chores and responsibilities, give instructions and recommendations, and express wishes, emotions, and influence in interpersonal situations. \nThematic Vocabulary:Parts of the house, furniture and household items, table settings, household chores and responsibilities, living arrangements, cleanliness and organization, family interactions, and expressions related to maintaining and describing a home environment.\nCultural Competence: Students will explore housing styles, family life, and domestic traditions in Spanish-speaking countries. Special attention will be given to the cultural significance of the home through materials such as La Casa Azul of Frida Kahlo and readings about homes and architecture in Central America and the Hispanic world. Students will examine how homes reflect cultural values, history, geography, and family dynamics.", "skills": "Grammar: \nFormal commands (usted and ustedes commands) for giving instructions, recommendations, and directions.\nThe present subjunctive to express wishes, emotions, doubt, recommendations, and necessity.\nThe subjunctive with verbs of will and influence to express requests, advice, expectations, and interpersonal relationships within the home environment.\nKey Skills:\nDescribe homes, rooms, and household responsibilities using appropriate thematic vocabulary.\nGive instructions and recommendations using formal commands.\nExpress wishes, emotions, influence, and necessity using the present subjunctive.\nCompare cultural perspectives on family life, homes, and domestic responsibilities.\nInterpret authentic cultural texts, videos, and visual materials related to homes and daily life in the Spanish-speaking world.\nReadings: Balcones que enamoran, La casa de Frida y Luis Barragan en Mexico", "materials": "Textbook: : Aventuras supported by the online platform VHL.\nAventuras Workbook and Lab Manual \nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.", "assessments": "Tests, quizzes, oral presentations.readings,  and discussions. \nAssessments: Focusing on formal commands and the present subjunctive.\nWritten compositions describing homes, family traditions, and ideal living environments using thematic vocabulary and the subjunctive mood.\nUnit project:Students will create a written and oral multimedia presentation comparing the concept of “home” in a Spanish-speaking country and in the United States. The project may include comparisons of architecture, family traditions, household responsibilities, daily routines, interior spaces, and cultural values associated with the home."}, {"name": "Unit 5"}, {"name": "Lección 13: La naturaleza", "timeframe": "5  weeks", "concepts": "Vocabulary \nStudents expand vocabulary related to nature, animals, ecosystems, and environmental phenomena. They describe biodiversity, habitats, and environmental changes, including marine ecosystems, forests, weather patterns, and natural events. Students also discuss environmental challenges such as pollution, climate change, and conservation efforts.\nStudents use this language to describe and interpret real-world environmental issues and possible solutions, especially focusing on how human actions impact nature.\nCultural Focus:\nStudents explore marine forests and conservation efforts in Vieques, analyzing environmental protection initiatives in Spanish-speaking regions. They examine the importance of preserving ecosystems and the relationship between communities and natural resources.\nKey Grammar Skills: \n13. 1 The subjunctive with verbs of emotion \nThe subjuntive with doubt, disbilieve, and denial \nLectura: La foto: Enrique Anderson Imbert", "skills": "Intercultural Connection\nStudents explore environmental issues and conservation efforts in Spanish-speaking communities, especially in Vieques, while comparing them to their own communities and cultures.\nSense of Self and Place\nStudents reflect on their relationship with nature and examine how ecosystems influence communities, identity, and daily life.\nCritical Systems Thinking\nStudents analyze the connections between human activity, climate change, pollution, and conservation while interpreting themes from La foto.\nAdaptability to Change\nStudents discuss how communities adapt to environmental challenges and changing ecosystems through sustainable practices and innovation.\nAction Towards a Better Future\nStudents propose solutions to environmental problems and promote conservation using Spanish to express opinions, emotions, and recommendations.", "materials": "Textbook: : Aventuras supported by the online platform VHL.\nAventuras Workbook and Lab Manual \nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.", "assessments": "Tests, quizzes, oral presentations.readings, and discussions. \nStudents will complete a research paper and an oral presentation focused on three natural marvels in the Spanish-speaking world. This task allows students to explore geography, culture, and environmental significance while applying advanced Spanish language skills.\nResearch Paper:\nStudents will research and write about three natural marvels (such as ecosystems, landscapes, waterfalls, forests, mountains, or marine environments) found in Spanish-speaking countries."}, {"name": "Unit 6"}, {"name": "Unidad 14 : En la ciudad", "timeframe": "5  weeks", "concepts": "Vocabulary: City life, giving directions, banking, and postal needs.\n Culture: Common Spanish abbreviations; bike use in Latin American cities (Las bicicletas en la ciudad); Metro del D.F.\nContext: Navigating the city and using technology/workshops (En el taller).\nGrammar 14.1: Using the subjunctive in adjective clauses to express uncertainty or indefinite existence.\nGrammar 14.2 & 14.3: Giving orders, advice, or suggestions using familiar (tú) and nosotros/as commands.\n Literacy: Visualizing stories and reading comprehension (Lectura: Los bomberos).\nTexts: Aventuras Fotonovelas (Por las calles de Madrid), Flash cultura, Panorama.\nDigital: Video Manual/WebSAM, Supersite assignments, and Videoclip (Banco Ficensa).\nPages: pp. 356–382.", "skills": "Intercultural Connection\nStudents explore urban life in Spanish-speaking cities, including transportation, banking, and communication systems, comparing city experiences such as the Metro del D.F. and bike culture in Latin America.\nSense of Self and Place\nStudents reflect on how they navigate urban environments, using language for directions, services, and daily interactions to connect personal experiences with city life.\nCritical Systems Thinking\nStudents analyze how urban systems (transportation, banking, emergency services) function and interconnect, using subjunctive structures to express uncertainty and possibility in city contexts.\nAdaptability to Change\nStudents develop strategies to navigate unfamiliar city environments, use technology, and respond to real-life situations such as workshops and emergencies (Lectura: Los bomberos).\nAction Towards a Better Future\nStudents propose practical solutions for improving urban life, communication, and sustainability, using commands and suggestions in Spanish to encourage positive civic action.", "materials": "Textbook: : Aventuras supported by the online platform VHL.\nAventuras Workbook and Lab Manual \nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.", "assessments": "Tests, quizzes, oral presentations.readings,  and discussions. \nFormative: Workbook and Lab Manual (Gramática 14.1–14.3); WebSAM activities.\nSummative: Lección 14 Supersite Assessment; Aventuras en los países hispanos review."}, {"name": "Unit 7"}, {"name": "Lección 15: El bienestar", "timeframe": "6 weeks", "concepts": "Vocabulary: \nPersonal fitness, well-being, and nutrition.\nGrammar \n Grammar 15.1: Past participles used as adjectives.\nGrammar 15.2 : Present Perfect (pretérito perfecto):\n Students use the present perfect to describe recent scientific discoveries and breakthroughs (e.g., Han descubierto nuevos planetas, Se ha inventado una nueva tecnología).\nGrammar 15.3 :Past Perfect (pluscuamperfecto):\n Students use the past perfect to explain what had already been discovered or invented before a specific point in time (e.g., Ya habían desarrollado la tecnología antes de la misión).\n16.1: Formation and use of the future tense \n16.2: Formation and use of  the conditional tense\nCulture: Healthy public spaces (Espacios públicos saludables); Stress management (¿Estrés? ¿Qué estrés?).\n* Literacy: Reading and interpreting literature (Lectura: El viaje by Cristina Peri Rossi).", "skills": "Intercultural Connection\nStudents explore how Spanish-speaking cultures promote health, wellness, and public well-being, including the use of healthy public spaces and approaches to stress management.\nSense of Self and Place\nStudents reflect on their own habits related to fitness, nutrition, and well-being, connecting personal routines to broader cultural perspectives on health.\nCritical Systems Thinking\nStudents analyze how health, science, and innovation are interconnected, using the present perfect and past perfect to discuss discoveries and prior developments, and interpreting themes in El viaje.\nAdaptability to Change\nStudents examine how individuals and societies adapt to new scientific discoveries, changing health knowledge, and evolving wellness practices.\nAction Towards a Better Future\nStudents propose strategies for improving personal and community health, promoting well-being, and encouraging healthier lifestyles using Spanish to communicate ideas and reflections.", "materials": "Textbook: Descubre 3: Lengua y Cultura del Mundo Hispánico supported by the online platform VHL.\nWorkbook: Descubre 3: Cuaderno de Práctica. \nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.\nHappy Cool\nEse bobo del móvil", "assessments": "Tests, quizzes, oral presentations.readings,  and discussions. \nOral Presentation – Create a Spa to Promote a Healthy Lifestyle\nStudents will work individually or in pairs to design and present an original spa that promotes healthy living and well-being. The presentation should include the spa’s name, location, services offered, healthy activities, nutrition options, and relaxation treatments. Students must describe the atmosphere of the spa, explain how it supports physical and emotional wellness, and persuade classmates to visit.\nStudents are expected to use relevant vocabulary related to health, fitness, wellness, emotions, and daily routines. Presentations should incorporate complete sentences, accurate pronunciation, and appropriate grammar structures, including descriptive language and present tense expressions. Visual aids such as posters, slides, menus, or brochures may be included to enhance communication and creativity."}]}, {"name": "SPANISH 1", "department": "Modern Languages - Spanish", "teacher": "Hernán J Sánchez", "grade": "IX, X", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Preliminar - ¡Hola! (Introduction to Spanish)", "timeframe": "4 weeks (September)", "concepts": "Greetings, introductions, numbers 0-31, alphabet, calendar (days/months), and basic classroom objects.", "skills": "Exchanging basic personal information using simple questions and answers (name, age, origin, and how someone is feeling).\nDeveloping accurate pronunciation of the Spanish alphabet, vowels, greetings, and common classroom expressions through repetition and oral practice.\nRecognizing and reproducing correct stress, intonation, and pronunciation patterns in basic conversations.\nSpelling words aloud in Spanish using the alphabet with improved pronunciation and listening comprehension.\nIdentifying and saying dates, days of the week, months, and basic times correctly and clearly.\nListening to and understanding simple spoken Spanish in classroom interactions and authentic audio/video materials.\nUsing common classroom vocabulary and expressions appropriately during daily routines and partner activities.\nBuilding confidence in speaking through short dialogues, role-plays, and pronunciation drills.", "materials": "Textbook: Descubre 1 : Lengua y Cultura del Mundo Hispánico supported by the online platform VHL.\nWorkbook: Descubre 1: Cuaderno de Práctica. \nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.\nClassroom labels", "assessments": "Oral greeting role-play; Unit 1 Quiz, Unit 1 test"}, {"name": "Unit 2"}, {"name": "En la la clase", "timeframe": "5 weeks", "concepts": "School life: classroom objects, supplies, and campus locations.\nFields of study, school subjects, and schedules.\nDays of the week and numbers 31 and higher.", "skills": "Conjugating regular -AR verbs\n Students learn how to change -ar verbs (hablar, estudiar, bailar) to match subjects in the present tense. Example: yo hablo, tú hablas, él habla.\nForming questions with question words\n Students use words like qué, cómo, dónde, cuándo, and por qué to ask simple questions. Example: ¿Dónde vives?\n Using estar\n Students use estar to talk about locations and feelings. Example: Estoy en clase or Estoy feliz.\n Using gustar + infinitive\n Students express likes and dislikes using me gusta + verb. Example: Me gusta estudiar or No me gusta correr.", "materials": "Textbook: Descubre 1 : Lengua y Cultura del Mundo Hispánico supported by the online platform VHL.\nWorkbook: Descubre 1: Cuaderno de Práctica. \nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.\nClassroom labels", "assessments": "Students will be evaluated through quizzes and unit tests, along with performance-based tasks such as classroom map labeling, schedule creation activities, and oral quizzes. These assessments measure understanding of vocabulary, grammar, reading, writing, speaking, and listening skills in Spanish."}, {"name": "Unit 3"}, {"name": "La Familia", "timeframe": "4 Weeks", "concepts": "Immediate and extended family members and pets.\nIdentifying people, professions, and occupations.\nDescriptive adjectives (appearance and personality)\nPresent tense of -er and - ir verbs \nPresent tense of tener and venir", "skills": "Students in Spanish I develop foundational communication skills in listening, speaking, reading, and writing, with an emphasis on practical, everyday language use.\nListening Skills\n Students learn to understand simple spoken Spanish in familiar contexts. They identify key words, main ideas, and basic instructions from the teacher, classmates, and audio/video resources.\nSpeaking Skills\n Students practice basic conversations using learned vocabulary and structures. They can introduce themselves, answer simple questions, describe people and daily activities, and participate in guided dialogues with correct pronunciation.\nReading Skills\n Students read short passages, dialogues, and descriptions. They focus on understanding main ideas, recognizing familiar vocabulary, and interpreting basic grammar structures in context.\nWriting Skills\n Students write simple sentences and short paragraphs about themselves, family, school, and daily routines. They apply basic grammar rules such as verb conjugation, agreement, and sentence structure.\nCommunication Strategies\n Students use gestures, repetition, context clues, and memorized phrases to support understanding and communication in Spanish.\nCultural Skills\n Students develop awareness of Spanish-speaking cultures through comparisons, multimedia resources, and classroom activities that highlight traditions, daily life, and perspectives.", "materials": "Textbook: Descubre 1 : Lengua y Cultura del Mundo Hispánico supported by the online platform VHL.\nWorkbook: Descubre 1: Cuaderno de Práctica. \nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.\nClassroom labels", "assessments": "Students are evaluated through a combination of written, oral, and performance-based assessments designed to measure progress in vocabulary, grammar, and communication skills.\nPerformance Tasks:\nFamily Tree Project: Students create and present a family tree in Spanish, using vocabulary for family members, descriptions, and possessive adjectives.\n“Who Am I?” Descriptive Essay: Students write a short paragraph describing themselves, including personality traits, physical descriptions, and basic personal information.\nQuizzes & Tests:\nUnit Quizzes: Short assessments given at the end of each unit to check understanding of vocabulary, grammar, and basic sentence structure.\nUnit Tests: More comprehensive evaluations covering listening, speaking, reading, and writing skills from each unit.\nOral Assessments:\nStudents participate in speaking quizzes, dialogues, and short presentations to demonstrate pronunciation, fluency, and comprehension in simple Spanish conversations."}, {"name": "Unit 4"}, {"name": "Los Pasatiempos", "timeframe": "5 weeks", "concepts": "Students learn to talk about everyday activities, hobbies, and free-time pastimes using practical vocabulary and simple sentence structures. They describe what they do regularly and what they enjoy doing in their free time, such as listening to music, watching TV, reading, or spending time with friends.\nIn the context of sports, students learn vocabulary related to common sports and how to talk about participation, teams, places, and equipment. They use the verbs jugar (to play) and hacer deporte in basic present-tense sentences, such as Juego al fútbol or Juego al baloncesto.\nStudents also learn the verb ir (to go) to express movement and destinations, such as Voy al parque or Voy a la escuela, along with basic prepositions to describe where they are going.\nAdditionally, students are introduced to stem-changing verbs in the present tense (such as preferir and poder), helping them express preferences and abilities in simple communication.\nFinally, students describe places in the city, including schools, parks, stores, restaurants, and libraries, and explain where activities take place using basic location vocabulary and sentence patterns.", "skills": "Students develop the ability to communicate about future plans, daily activities, and personal preferences using increasingly accurate present and near-future structures.\nUsing ir and ir a + infinitive\n Students use the verb ir to talk about where they are going and combine it with a + infinitive to express future plans. This allows them to say what they are going to do in simple terms (e.g., Voy a estudiar, Vamos a ir al cine).\nStem-changing verbs (e:ie, o:ue, e:i)\n Students practice common stem-changing verbs in the present tense to express everyday actions and preferences (e.g., preferir, poder, querer, servir). They learn how the verb stem changes in all forms except nosotros and vosotros.\nIrregular “yo” form verbs\n Students use high-frequency verbs with irregular first-person forms such as tener, hacer, salir, venir, poner. This helps them talk about daily routines and personal actions correctly in the present tense.\nExpressing preferences and making plans\n Students use structures like me gusta, me encanta, and prefiero to express likes and dislikes. They combine these with ir + a + infinitive to talk about plans with friends and future activities, helping them communicate intentions in real-life situations (e.g., Voy a salir con mis amigos porque me gusta el cine).", "materials": "Textbook: Descubre 1 : Lengua y Cultura del Mundo Hispánico supported by the online platform VHL.\nWorkbook: Descubre 1: Cuaderno de Práctica. \nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.\nClassroom labels", "assessments": "Vocabulary quiz, 2 grammar quizzes, comprehensive test."}, {"name": "Unit 5"}, {"name": "Las vacaciones", "timeframe": "5 weeks", "concepts": "Travel, vacations, and months of the year.\nSeasons, weather, and ordinal numbers.\nConditions and emotions.\nEstar with conditions and emotions \nSer and estar \nDirect object nouns and pronouns", "skills": "Differentiating between ser and estar\n Students learn when to use ser and estar, both meaning “to be,” but in different contexts. Ser is used for permanent or general characteristics such as identity, origin, time, and descriptions (e.g., Soy estudiante). Estar is used for location and temporary conditions or feelings (e.g., Estoy cansado or La escuela está cerca). Students practice choosing the correct verb in simple sentences.\nUsing the present progressive tense\n Students use the present progressive (estar + gerundio) to describe actions happening right now. They learn the structure estar + present participle (e.g., estoy estudiando, estamos comiendo). This helps them describe ongoing activities in real time, such as what they are doing in class or at home.\nIdentifying and using direct object nouns and pronouns\n Students learn to recognize direct objects in sentences and replace them with pronouns such as lo, la, los, las. This helps avoid repetition and makes sentences more natural. For example, Veo el libro → Lo veo. Students practice both identifying direct objects and using pronouns in simple present-tense sentence", "materials": "Textbook: Descubre 1 : Lengua y Cultura del Mundo Hispánico supported by the online platform VHL.\nWorkbook: Descubre 1: Cuaderno de Práctica. \nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.\nClassroom labels", "assessments": "Students are evaluated through a mix of written, oral, and performance-based assessments that measure communication skills in real-world contexts.\nPerformance-Based Tasks:\nTravel Brochure Project: Students create a simple Spanish travel brochure describing a Spanish-speaking city or country. They include basic descriptions of places, weather, activities, and attractions using present-tense vocabulary and simple descriptive sentences.\nWeather Forecast Video: Students record a short video giving a basic weather forecast in Spanish, using weather vocabulary, expressions of temperature, and simple future or present structures (e.g., Va a llover, Hace sol).\nQuizzes & Tests:\nUnit Quizzes: Short assessments to check understanding of vocabulary, grammar, and sentence formation related to each unit (e.g., weather, travel, daily activities).\nUnit Tests: More comprehensive evaluations covering reading, writing, listening, and grammar skills learned in the unit, including verb usage and sentence construction.\nOral Assessments:\nStudents participate in speaking tasks such as dialogues, interviews, and short presentations. They may describe a travel destination, talk about the weather, or explain daily activities using simple Spanish."}, {"name": "Unit 6"}, {"name": "De Compras", "timeframe": "April - May", "concepts": "Vocabulary: Clothing, colors, shopping, stores, and markets\n Students learn essential vocabulary related to clothing items (e.g., la camisa, los zapatos, la chaqueta), colors, and shopping expressions. They also identify common places such as stores and markets (la tienda, el mercado), and practice describing what people wear and buy using basic sentences.\nStem-changing verbs (e → ie, o → ue, e → i)\n Students continue practicing present-tense stem-changing verbs such as querer, preferir, poder, and servir. These verbs are used to express needs, preferences, and abilities in shopping contexts (e.g., Quiero comprar una camisa).\nDemonstrative adjectives and pronouns (este, ese, aquel)\n Students learn to point out and describe items based on distance using este/esta, ese/esa, and aquel/aquella. They practice saying things like Este suéter es rojo or Aquel es más barato, helping them compare and identify items in stores.\nPreterite of regular verbs (past tense introduction)\n Students are introduced to the basic past tense using regular verbs ending in -ar, -er, and -ir. They learn how to talk about completed shopping experiences or past activities (e.g., Compré ropa en el mercado).\nIndirect object pronouns (le, les)\n Students begin using le and les to indicate to whom something is given or sold. This supports communication in shopping situations (e.g., Le compré un regalo a mi madre).\nCulture: El mercado de Otavalo and shopping in the Hispanic world\n Students explore cultural practices related to shopping in Spanish-speaking countries, focusing on El mercado de Otavalo in Ecuador. They learn about traditional goods, bargaining practices, and the importance of local markets in Hispanic cultures, comparing them with shopping experiences in their own communities.", "skills": "Shopping Literacy: Identify and describe clothing, colors, and prices to navigate retail interactions.\nVerb Mastery: Correctly apply present-tense stem-changing verbs (e:ie, o:ue, e:i) to express needs and preferences.\nSpatial Identification: Use demonstrative adjectives (este, ese, aquel) to distinguish between items based on proximity.\nNarrative Recall: Conjugate regular verbs in the preterite tense to recount past shopping trips and activities.\nSyntactic Precision: Use indirect object pronouns (le, les) to clarify the recipient of an action.", "materials": "Textbook: Descubre 1 : Lengua y Cultura del Mundo Hispánico supported by the online platform VHL.\nWorkbook: Descubre 1: Cuaderno de Práctica. \nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.\nClassroom labels", "assessments": "VHL Central Check-ins (Formative): Completion of online \"Autoevaluación\" activities and \"Práctica\" modules to monitor mastery of stem-changing verbs and the preterite tense.\nThe \"Otavalo Market\" Simulation (Performance-based): A classroom role-play where students use clothing vocabulary, demonstrative adjectives, and bargaining expressions to \"buy\" and \"sell\" items from one another.\nPast Tense Shopping Journal (Writing): A short paragraph where students use regular preterite verbs to describe a recent shopping trip, specifying what they bought, where they went, and for whom (indirect object pronouns).\n\"Fashion Police\" Presentation (Oral): Students use images of celebrities or classmates to describe outfits using specific clothing vocabulary and color agreement in a live or recorded presentation.\nLección 6 Test (Summative): A comprehensive exam via VHL or paper including listening comprehension (identifying clothing), grammar (stem-changers/preterite), and a reading passage about shopping customs in Ecuador.\nIXL Mastery (Diagnostic): Targeted IXL skills to verify individual proficiency in direct and indirect object pronoun placement."}, {"name": "Unit 7"}, {"name": "La rutina diaria", "timeframe": "5 weeks", "concepts": "Vocabulary: Daily Routine, Hygiene, and Grooming\n Students learn vocabulary to describe actions from morning to night, including waking up (despertarse), getting up (levantarse), showering or bathing (ducharse, bañarse), shaving (afeitarse), brushing teeth or hair (cepillarse), getting dressed (vestirse), and going to bed (acostarse, dormirse). They also learn personal hygiene items such as soap, shampoo, toothpaste, towel, and mirror.\nSequencing Language\n Students use time-order words to describe routines in sequence, such as antes de, después de, luego, entonces, and por último, to organize daily activities clearly.\nGrammar Focus: Reflexive Verbs\n Students use reflexive verbs to describe actions done to oneself (e.g., me levanto, se ducha). They also practice common stem-changing reflexive verbs such as despertarse (e:ie), acostarse (o:ue), vestirse (e:i) to describe daily routines accurately.\nIndefinite and Negative Words\n Students learn expressions like algo, nada, alguien, nadie, siempre, nunca, también, and tampoco to add detail and variety to sentences about habits and routines.\nPreterite of ir and ser\n Students review the past tense forms fui, fue, fuimos, etc., to talk about past events such as where they went or what they did during a specific day.\nVerbs like gustar\n Students expand expressions of preference using verbs like encantar, interesar, and importar to describe reactions to daily routines or activities.\nCultural Connection: La rutina de un estudiante hispanohablante\n Students explore a typical daily routine of a Spanish-speaking student, focusing on family life, personal care habits, and cultural expectations around structure and hygiene.", "skills": "Reflexive verbs: Students describe daily routines and self-care activities using reflexive verbs (e.g., me levanto, se ducha, nos vestimos).\nStem-changing reflexive verbs: Students correctly use verbs like despertarse, vestirse, and acostarse in present tense.\nSequencing events: Students organize routines using words like antes de, después de, luego, y por último.\nIndefinite and negative words: Students use algo, nada, alguien, nadie, siempre, and nunca to add detail to descriptions.\nPast tense review: Students use preterite forms of ir and ser (fui, fue, fuimos) to describe past activities.\nExpressing preferences: Students use verbs like gustar, encantar, and interesar to talk about likes and reactions.\nCultural understanding: Students describe and compare daily routines in Spanish-speaking cultures.", "materials": "Textbook: Descubre 1 : Lengua y Cultura del Mundo Hispánico supported by the online platform VHL.\nWorkbook: Descubre 1: Cuaderno de Práctica. \nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.\nClassroom labels", "assessments": "Vocabulary Quizzes: Short quizzes on daily routine actions, hygiene vocabulary, and sequencing words.\nGrammar Quizzes: Assess reflexive verbs, stem-changing verbs, indefinite/negative words, and ir/ser in the past tense.\nUnit Test: Comprehensive assessment covering reading, writing, listening, and grammar from the unit.\nWriting Assessment: Paragraph describing a student’s daily routine using reflexive verbs and sequencing words.\nOral Assessment: Speaking task where students describe their morning/evening routine and answer simple questions.\nPerformance Task: Create and present a “Daily Routine” project using visuals and written Spanish sentences."}]}, {"name": "Spanish 2", "department": "Modern Languages - Spanish", "teacher": "Dr. Arboleda, Mr. Howell.", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Lección Preliminar: ¡Bienvenido a la clase!", "timeframe": "September - October", "concepts": "Foundational Review: Re-establishing core vocabulary including greetings, personal descriptions, and school-related terms.\nGrammar - Present Tense: Review of regular and irregular verbs (e.g., ser, estar, tener, ir) in the present tense.\nGrammar - Noun-Adjective Agreement: Ensuring mastery of gender and number agreement in descriptions.\nGrammar - Question Formation: Practicing the construction of basic interrogative sentences to gather personal information.", "skills": "Interpretive Communication: Understanding classroom instructions and basic biographical information in Spanish.\nInterpersonal Speaking: Introducing oneself and interviewing classmates about their summer and interests.\nSyntactic Accuracy: Correctly applying subject-verb agreement and noun-adjective agreement in foundational sentences.", "materials": "Textbook: Aventuras (Preliminary Chapter).\nDigital Tools: Quizlet Flashcards for Spanish 2 Review.\nPractice Sheets: Paquete de Repaso (review packet) provided in class.", "assessments": "Diagnostic Quiz: A low-stakes assessment to identify areas of strength and those needing further review.\nOral Interview: A brief face-to-face introduction with the teacher or a peer."}, {"name": "Unit 1"}, {"name": "Unit 1: En el consultorio", "timeframe": "Approximately 4-6 weeks", "concepts": "Vocabulary: Medical terminology, parts of the body, and symptoms related to the doctor's office (\"En el consultorio\").\nGrammar - The Imperfect Tense:\nConjugation of regular -ar, -er, and -ir verbs.\nIrregular verbs in the imperfect: ir, ser, and ver.\nUses: Habitual actions, descriptions/background info, and ongoing past actions.\nGrammar - Preterite vs. Imperfect:\nDistinguishing between completed actions (preterite) and continuous/habitual actions (imperfect).\nUsing both tenses in narratives (interrupted actions and storytelling).\nGrammar - Constructions with \"Se\":\nImpersonal \"Se\": Statements where the performer is not defined (e.g., \"Se prohíbe fumar\").\nAccidental \"Se\": Describing unplanned or accidental events (e.g., \"Se me perdió la receta\").\nAdverbs: Formation of adverbs using the -mente suffix and common adverbial expressions (e.g., a menudo, pronto, apenas).", "skills": "Oral Expression: Narrating stories in the past using photographs and recounting childhood television plots.\nReading Comprehension: Analyzing cultural texts, specifically focusing on Costa Rica and the National Museum of Costa Rica.\nListening: Completing audio activities focused on medical vocabulary and past tense distinctions.\nWriting: Correctly forming sentences using impersonal and accidental \"se\" constructions", "materials": "Primary Text: Descubre 2 (Lección 1).\nDigital Resources:\nQuizlet for vocabulary practice.\nProfe de ELE for interactive past tense practice.\nFotonovela video series.\nSupplements: Audio practice workbook and reading documents regarding Costa Rican culture.", "assessments": "Oral Presentation: A 4-minute storytelling task using only photos to demonstrate mastery of the preterite and imperfect.\nFormative Exercises: Textbook activities (pages 32-33), workbook listening exercises, and conjugation drills.\nSummative Reading/Writing: \"Recapitulación\" section (pages 44-45) and the Costa Rica reading assessment."}, {"name": "Unit 2"}, {"name": "La tecnología", "timeframe": "Approximately 4-5 weeks", "concepts": "Vocabulary: Technology and electronics, the use of computers and the internet, and automotive/travel terminology (\"La tecnología y el carro\").\nGrammar - Familiar Commands (Mandatos familiares):\nFormation of affirmative and negative tú commands.\nIrregular affirmative tú commands (e.g., di, haz, ve, pon, sal, sé, ten, ven).\nGrammar - Por vs. Para:\nUnderstanding the distinct uses of both prepositions (e.g., para for goals and destinations; por for duration, exchange, and movement through a place).\nGrammar - Reciprocal Reflexives:\nExpressing actions that two or more people do to each other (e.g., se saludan, nos escribimos).\nGrammar - Stressed Possessive Adjectives and Pronouns:\nUsing emphasized forms like mío/a, tuyo/a, suyo/a to express ownership (e.g., \"la cámara mía\").", "skills": "Giving Instructions: Using familiar commands to explain how to use technology or give directions for driving.\nComparisons and Distinctions: Correctly choosing between por and para in written and spoken contexts.\nCultural Competence: Exploring the history and influence of the Cybercafé culture in Spanish-speaking countries and the development of the Pan-American Highway.\nOral Interaction: Using reciprocal reflexives to describe how friends or family members interact with one another.", "materials": "Fotonovela video episodes focused on technology and travel.\nVHL Central for online practice and activities.\nSupplements: Handouts for irregular command drills and \"Por vs. Para\" flowcharts.", "assessments": "Performance Task: Create an instructional guide (written or video) giving \"tú\" commands on how to perform a technological task (e.g., \"How to upload a photo to social media\").\nQuizzes: Vocabulary quizzes on technology and car parts; grammar quizzes on commands and prepositions.\nUnit Exam: \"Recapitulación\" assessment covering all Lección 2 content including the cultural readings on Argentina."}, {"name": "Unit 3"}, {"name": "La vivienda", "timeframe": "Approximately 4-5 weeks.", "concepts": "Vocabulary: Parts of the house, household rooms, furniture, and appliances (\"La vivienda\").\nVocabulary: Household chores and domestic duties (\"Los quehaceres\").\nGrammar - Relative Pronouns:\nUsing que, quien(es), and lo que to connect ideas and specify people or objects.\nGrammar - Formal Commands (Mandatos formales):\nFormation of affirmative and negative Usted and Ustedes commands.\nIrregular formal commands (e.g., dé, esté, vaya, sepa, sea).\nGrammar - The Present Subjunctive:\nIntroduction to the concept of \"mood\" vs. \"tense\".\nFormation of regular and irregular verbs (including -car, -gar, -zar and stem-changers).\nInitial usage focusing on Will and Influence (e.g., querer que, insistir en que, preferir que).", "skills": "Describing Environments: Identifying and describing rooms and items within a home using specific vocabulary.\nGiving Formal Instructions: Using formal commands to direct others in professional or respectful contexts, such as describing how to clean or organize a space.\nExpressing Desires and Requests: Utilizing the present subjunctive to express what one wants or requires others to do.\nCultural Interpretation: Comparing housing styles and domestic life in Spanish-speaking regions, with a specific focus on Panama and the Panama Canal.", "materials": "Primary Text: Descubre 2 (Lección 3).\nDigital Resources:\nFotonovela video episode: \"¡Qué lío!\".\nVHL Central for interactive grammar and vocabulary drills.\nSupplements: House layout diagrams and \"Quehaceres\" (chores) checklist handouts.", "assessments": "Writing Project: \"La casa de mis sueños\" (Dream House) – Students design a floor plan and write a description using relative pronouns and specific furniture vocabulary.\nOral Assessment: Roleplay giving formal commands (e.g., a real estate agent showing a home or a parent giving chores to a helper).\nUnit Exam: Assessment covering Lección 3 grammar (Subjunctive vs. Indicative intro) and cultural readings on Panama."}, {"name": "Unit 4"}, {"name": "Unit 4: La naturaleza", "timeframe": "Duration: Approximately 4-5 weeks.", "concepts": "Vocabulary: Nature, the environment, and conservation efforts (\"La naturaleza\").\nVocabulary: Animals and geographic features (e.g., el bosque, la cordillera, la selva).\nGrammar - The Subjunctive with Conjunctions:\nUsing conjunctions that always require the subjunctive (e.g., a menos que, antes de que, con tal de que, para que, sin que).\nUsing conjunctions with the subjunctive or indicative depending on time and certainty (e.g., cuando, después de que, en cuanto, hasta que, tan pronto como).\nGrammar - The Present Perfect:\nFormation using the auxiliary verb haber + past participle (e.g., he hablado, has comido).\nIdentification of irregular past participles (e.g., abierto, dicho, escrito, hecho, puesto, visto, vuelto).\nGrammar - The Past Perfect (Pluscuamperfecto):\nExpressing actions that had occurred before another action in the past using había + past participle.", "skills": "Environmental Advocacy: Discussing environmental problems and proposing solutions using conjunctions of purpose and contingency.\nDescribing Past Experiences: Utilizing the present perfect to talk about what has happened recently and the past perfect to sequence past events.\nScientific and Geographical Identification: Categorizing flora and fauna and describing diverse landscapes in the Spanish-speaking world.\nCultural Exploration: Examining the unique biodiversity and conservation policies of Colombia.", "materials": "Primary Text: Descubre 2 (Lección 4).\nDigital Resources:\nFotonovela video episode: \"En el parque nacional\".\nVHL Central for virtual environmental scenarios and grammar practice.\nSupplements: Infographics on climate change and maps of Colombia's national parks.", "assessments": "Creative Project: \"Un Plan de Conservación\" – Students create a pamphlet or presentation for a national park, using the subjunctive to outline rules and goals for visitors.\nOral Interview: Discussing personal experiences with nature and travel using the present perfect tense.\nUnit Exam: Assessment covering Lección 4 vocabulary, compound tenses, and cultural knowledge of Colombia"}, {"name": "Unit 5"}, {"name": "La ciudad", "timeframe": "Around 4 weeks", "concepts": "Vocabulary related to the city, including places like the bakery (panadería), butcher shop (carnicería), shoe store (zapatería), and bank (banco).\nThe Subjunctive mood in adjective clauses (Subjuntivo en cláusulas adjetivas).\n\"Nosotros\" commands.\nPast participles used as adjectives.", "skills": "Describing desired or non-existent people and things using the subjunctive (e.g., \"Yo necesito un novio que sea inteligente\").\nNavigating city services and performing errands (diligencias).\nGiving group commands using the \"Nosotros\" form.\nUsing past participles to describe states or conditions.", "materials": "Descubre 2 textbook (Pages 172-195).\nDescubre 2 Practice Workbook (Cuaderno de práctica/actividades).\nQuizlet Flashcards for Chapter 5 vocabulary.\nVHL Central communicative and listening activities.", "assessments": "Handwritten writing assignment (100 words, no translators)\nListening activities (Workbook pages 117, 128, and 131).\nReading assignment (Pages 194-195).\nCommunicative exercises on VHL Central."}, {"name": "Unit 6"}, {"name": "El bienestar (Well-being)", "timeframe": "4-5 weeks", "concepts": "Vocabulary: Health and well-being, exercise (hacer ejercicio), nutrition, and habits (e.g., fumar, estar a dieta).\nGrammar:\nThe Present Perfect (El pretérito perfecto).\nThe Past Perfect (El pluscuamperfecto).\nThe Present Perfect Subjunctive (El presente perfecto del subjuntivo).", "skills": "Discussing health habits and pressure (e.g., \"estar bajo presión\").\nDescribing recent actions using the Present Perfect (e.g., \"Yo he comido\").\nNarrating past events that happened before other past events using the Past Perfect (e.g., \"Yo había cerrado la puerta\").\nExpressing emotions, doubts, or will regarding completed actions using the Present Perfect Subjunctive (e.g., \"Espero que hayas dormido bien\")", "materials": "Descubre 2 textbook (Pages 208-231).\nDescubre 2 Practice Workbook.\nVHL Central (Supersite) for interactive tutorials and activities.\nTeacher-provided guided notes on \"El Bienestar\"", "assessments": "Formative: Supersite activities (e.g., \"Estructura 6.1\" through \"Estructura 6.3\").\nSummative:\n\"Lección 6 Prueba\" (Lesson 6 Test).\n\"Examen Final\" (Final Exam) preparation including sections on descriptions, present/past/future tenses, and the subjunctive.\nOral/Aural: Listening activities from the workbook (e.g., pages 139 and 150)."}]}, {"name": "Spanish 3", "department": "Modern Languages - Spanish", "teacher": "Hernán J Sánchez", "grade": "IX, X, XI", "length": "Full year", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Las Relaciones Personales", "timeframe": "4 weeks", "concepts": "Vocabulary: \nPersonality traits, emotional states, feelings, and personal relationships.\nCultural Focus: Love and friendship in Hispanic countries; Profile of Isabel Allende and Roger Cukras.\nGrammar: \n Mastery of the present tense.\nDistinguishing between Ser and Estar.\nUsing progressive forms.\nMaterials: * Literature: Poema 20 by Pablo Neruda.\nMedia: Ramona (En pantalla).\nCultura: Sonia Sotomayor: la niña que soñaba.", "skills": "Intercultural Connection: Students compare how relationships and emotions are expressed in Hispanic cultures and their own communities, building empathy and cultural awareness.\nSense of Self and Place: Students use ser, estar, and present progressive forms to describe themselves, emotions, and relationships while reflecting on their identities and roles in their communities.\nCritical Systems Thinking: Students analyze how language choices communicate different meanings and explore cultural perspectives on friendships and relationships.\nAdaptability to Change: Students practice adjusting communication strategies in different social and cultural situations through conversations and collaborative activities.\nAction Towards a Better Future: Students develop empathy, respectful communication, and positive relationship skills that support inclusive multicultural communities.", "materials": "Textbook: Descubre 3: Lengua y Cultura del Mundo Hispánico supported by the online platform VHL.\nWorkbook: Descubre 3: Cuaderno de Práctica. \nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.\nLiterature: Poema 20 by Pablo Neruda.\nMedia: Ramona (En pantalla).\nCultura: Sonia Sotomayor: la niña que soñaba.", "assessments": "Tests, quizzes, oral presentations.readings,  and discussions."}, {"name": "Unit 2"}, {"name": "Las Diversiones", "timeframe": "4 weeks", "concepts": "Vocabulary:\n Students expand thematic vocabulary related to music, theater, recreation areas, sports, and entertainment. They learn to describe cultural activities, express opinions about performances and events, and discuss participation in leisure activities in a variety of settings.\nGrammar \nObject pronouns (direct and indirect):\n Students use pronouns such as lo, la, los, las and le, les to replace nouns and avoid repetition when discussing entertainment, events, and activities (e.g., Vi la película → La vi).\nGustar and similar verbs:\n Students demonstrate mastery of gustar, encantar, interesar, and aburrir to express preferences and reactions to cultural experiences (e.g., Me encanta el teatro, Nos interesan las películas).\nReflexive verbs:\n Students use reflexive verbs to describe routines and personal experiences related to recreation and entertainment (e.g., me divierto, se prepara, nos relajamos).\nCultural Focus:\nStudents explore New Mexican cinema and the career of Gael García Bernal, analyzing how film reflects cultural identity, storytelling, and social themes in the Spanish-speaking world.", "skills": "Intercultural connection: Students analyze and compare entertainment traditions such as cinema, theater, and sports across Spanish-speaking cultures.\nSense of self and place: Students reflect on their own preferences in music, sports, and entertainment while connecting them to cultural identity.\nCritical systems thinking: Students examine how media, cinema, and sports reflect social values and cultural narratives in Latin America.\nAdaptability to change: Students use new grammatical structures (object pronouns, reflexive verbs, and gustar-type verbs) to express more complex ideas in different communicative situations.\nThis unit strengthens students’ ability to discuss cultural experiences, express opinions, and engage in meaningful conversations about entertainment in the Spanish-speaking world.", "materials": "Textbook: Descubre 3: Lengua y Cultura del Mundo Hispánico supported by the online platform VHL.\nWorkbook: Descubre 3: Cuaderno de Práctica. \nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources. * Literature: Idilio by Mario Benedetti.\nMedia: El dorado de Ford.\nCulture: El toreo: ¿Cultura o tortur", "assessments": "Tests, quizzes, oral presentations.readings,  and discussions."}, {"name": "Unit 3"}, {"name": "La vida Diaria", "timeframe": "4 weeks", "concepts": "Vocabulary:\nStudents develop expanded vocabulary related to the home, shopping, daily expressions, and everyday life. They describe household items, rooms in the home, shopping experiences, and common daily interactions. Students also practice functional language for routines, errands, and real-life communication in familiar settings.\nGrammar:\nPreterite tense formation:\n Students use the preterite to describe completed actions in the past, such as shopping trips, specific events, and actions that have clear beginnings and endings (e.g., Compré comida, Fui a la tienda).\nImperfect tense formation:\n Students use the imperfect to describe habitual actions, ongoing past situations, and background information (e.g., Vivía en una casa grande, Comprábamos allí cada semana).\nPreterite vs. Imperfect contrast:\n Students learn to distinguish between completed actions and ongoing or habitual past actions, combining both tenses in meaningful communication (e.g., Cuando era joven, iba al mercado y un día compré un regalo).\nCultural Focus:\nStudents explore The Royal Family and the profile of Letizia Ortiz, analyzing cultural traditions, public life, and the role of modern monarchy in Spanish-speaking societies.", "skills": "Intercultural connection: Students explore cultural perspectives by studying The Royal Family and Letizia Ortiz, comparing traditions, lifestyles, and social roles in Spanish-speaking societies with their own.\nSense of self and place: Students connect language to personal experience by describing their own homes, shopping habits, and daily routines while reflecting on how these compare to others in different cultural contexts.\nCritical systems thinking: Students analyze how past events and routines are structured in Spanish using the preterite and imperfect, recognizing how tense choice changes meaning in storytelling and communication.\nAdaptability to change: Students adjust between preterite and imperfect tenses to accurately express shifting timeframes in past narratives, strengthening flexibility in communication across contexts.\nAction towards a better future: Students use Spanish to communicate real-life experiences and develop awareness of cultural and social differences, encouraging respectful understanding of global communities and perspectives.", "materials": "Textbook: Descubre 3: Lengua y Cultura del Mundo Hispánico supported by the online platform VHL.\nWorkbook: Descubre 3: Cuaderno de Práctica. \nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.\nLiterature: Autorretrato by Rosario Castellanos.\nMedia: Di algo.\nCulture: El arte de la vida diaria.", "assessments": "Tests, quizzes, oral presentations.readings, and discussions. \nAssessments:  Narrative writing task using past tense contrast between preterite and imperfect"}, {"name": "Unit 4"}, {"name": "La salud y el bienestar", "timeframe": "5 weeks", "concepts": "Vocabulary:\n Health symptoms, illnesses, doctors, and treatments.\nCultural Focus: Grandparents and Shamans; Bogotá’s Ciclovía.\nGrammar: \nSubjunctive in noun clauses\nCommands\ndistinguishing Por vs. Para.", "skills": "Intercultural connection: Students understand how health practices and medical advice may vary in Spanish-speaking cultures and communicate respectfully in different cultural contexts.\nSense of self and place: Students describe personal health situations and seek or give basic medical advice in Spanish, connecting language use to real-life health and wellness needs.\nCritical systems thinking: Students explain simple health situations and treatment ideas using logical language structures, including cause and effect (e.g., symptoms and recommendations).\nAdaptability to change: Students respond to different medical scenarios by adjusting language appropriately, including using formal commands and the subjunctive to give advice (e.g., Es importante que tomes… / Le recomiendo que descanse…).\nAction towards a better future: Students give basic formal medical advice using commands and the subjunctive (e.g., Le sugiero que tome medicina) and correctly apply por/para when explaining treatment purposes, duration, or destinations (e.g., para dos semanas, por dolor de cabeza).", "materials": "Textbook: Descubre 3: Lengua y Cultura del Mundo Hispánico supported by the online platform VHL.\nWorkbook: Descubre 3: Cuaderno de Práctica. \nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.\nMaterials: Ayúdame a recordar; Mujeres de ojos grandes.", "assessments": "Tests, quizzes, oral presentations.readings,  and discussions. \nStudents will complete a research-based project exploring traditional medicine practices within an Indigenous community in Latin America. The assignment includes both a written research paper and an oral presentation delivered in Spanish.\nResearch and cultural understanding\nWritten communication in Spanish\nOral fluency and pronunciation\nUse of health-related vocabulary and grammar structures\nAbility to present information clearly in Spanish\nThis task supports intercultural understanding and encourages students to connect language learning with real-world cultural and medical practices."}, {"name": "Unit 5"}, {"name": "Los viajes", "timeframe": "4 weeks", "concepts": "Vocabulary\nStudents develop vocabulary and communicative skills related to lodging, travel safety, accidents, and excursions. They learn to describe different types of accommodations (hotels, hostels, resorts), including services, amenities, and preferences. Students also explore travel-related situations such as booking a hotel, asking for help in emergencies, and describing guided excursions or activities during a trip.\nThey practice language for discussing safety and unexpected situations while traveling, including basic expressions for accidents, asking for assistance, and reporting simple problems in a hotel or during an excursion.\nCultural Focus:\nStudents examine The Coffee Route and The Panama Canal as important cultural and historical landmarks. They learn about tourism, economic impact, and cultural heritage in these regions, and compare how geography and history shape travel experiences in Spanish-speaking countries.\nGrammar:\nComparatives and superlatives:\nStudents compare destinations, hotels, and travel experiences using structures such as más… que, menos… que, and el/la mejor/peor. They evaluate options when planning trips and justify preferences.\nNegative and affirmative expressions:\nStudents use sí, no, tampoco, también, and other expressions to respond clearly in travel situations, confirm information, and describe preferences or restrictions.\nSubjunctive in adjective clauses:\nStudents use the subjunctive to describe uncertain or desired travel experiences, especially when expressing preferences for hypothetical situations (e.g., Busco un hotel que tenga vista al mar).", "skills": "Intercultural connection: Students explore travel and cultural landmarks such as The Coffee Route and The Panama Canal, comparing historical, economic, and cultural significance across Spanish-speaking regions.\nSense of self and place: Students connect language to personal experience by planning trips, describing preferred lodging, and expressing what they look for in travel experiences (e.g., a “dream hotel”), reflecting on their own preferences and identity as travelers.\nCritical systems thinking: Students analyze how tourism, transportation, safety, and lodging systems interact by comparing destinations and evaluating travel options using comparatives and superlatives.\nAdaptability to change: Students use negative/affirmative expressions and the subjunctive in adjective clauses to describe uncertain or ideal travel situations (e.g., busco un hotel que tenga…), adjusting language to express possibility and preference.\nAction towards a better future: Students design and present a trip itinerary that promotes responsible travel choices, cultural appreciation, and thoughtful decision-making when selecting destinations and accommodations.", "materials": "Textbook: Descubre 3: Lengua y Cultura del Mundo Hispánico supported by the online platform VHL.\nWorkbook: Descubre 3: Cuaderno de Práctica. \nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.", "assessments": "Tests, quizzes, oral presentations.readings,  and discussions."}, {"name": "Unit 6"}, {"name": "La Naturaleza", "timeframe": "6 weeks", "concepts": "Vocabulary \nStudents expand vocabulary related to nature, animals, ecosystems, and environmental phenomena. They describe biodiversity, habitats, and environmental changes, including marine ecosystems, forests, weather patterns, and natural events. Students also discuss environmental challenges such as pollution, climate change, and conservation efforts.\nStudents use this language to describe and interpret real-world environmental issues and possible solutions, especially focusing on how human actions impact nature.\nCultural Focus:\nStudents explore marine forests and conservation efforts in Vieques, analyzing environmental protection initiatives in Spanish-speaking regions. They examine the importance of preserving ecosystems and the relationship between communities and natural resources.\nGrammar: \nFuture tense:\n Students use the future tense to make predictions about environmental changes and ecological outcomes (e.g., Habrá más contaminación, Los animales desaparecerán).\nSubjunctive in adverbial clauses:\n Students express conditions and environmental consequences using structures such as cuando, antes de que, a menos que, and para que (e.g., A menos que reciclemos, el medio ambiente empeorará).\nPrepositions (a, hacia, con):\n Students use prepositions to describe movement, direction, and relationships in environmental contexts (e.g., los animales se mueven hacia el bosque, viajamos con expertos en conservación).", "skills": "Intercultural connection: Students explore environmental issues in Spanish-speaking regions such as marine forests and Vieques conservation, comparing ecological priorities and cultural approaches to sustainability across different communities.\nSense of self and place: Students reflect on their own relationship with nature and the environment, connecting personal habits (recycling, energy use, conservation choices) to broader global environmental concerns discussed in Spanish.\nCritical systems thinking: Students analyze how ecosystems, human activity, and environmental policies are interconnected. They use the future tense and subjunctive in adverbial clauses to explain cause-and-effect relationships in environmental change (e.g., consequences if actions are not taken).\nAdaptability to change: Students adjust language to express predictions, possibilities, and conditions using future tense and subjunctive structures, demonstrating flexibility when discussing uncertain environmental outcomes.\nAction towards a better future: Students propose realistic conservation actions and solutions using Spanish, encouraging sustainable behavior (e.g., recycling, protecting wildlife, reducing pollution) and expressing conditions needed to improve environmental outcomes.\nStudents demonstrate understanding by predicting environmental changes using the future tense and explaining conservation conditions using the subjunctive in adverbial clauses. They may also describe environmental scenarios and propose solutions using appropriate grammatical structures.\nThis unit builds students’ ability to discuss environmental issues, make predictions, and communicate solutions while deepening awareness of conservation and sustainability in the Spanish-speaking world", "materials": "Textbook: Descubre 3: Lengua y Cultura del Mundo Hispánico supported by the online platform VHL.\nWorkbook: Descubre 3: Cuaderno de Práctica. \nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.\nTiburón Toro\nEl eclipse", "assessments": "Tests, quizzes, oral presentations.readings,  and discussions. \nStudents will complete a research paper and an oral presentation focused on three natural marvels in the Spanish-speaking world. This task allows students to explore geography, culture, and environmental significance while applying advanced Spanish language skills.\nResearch Paper:\nStudents will research and write about three natural marvels (such as ecosystems, landscapes, waterfalls, forests, mountains, or marine environments) found in Spanish-speaking countries. The paper should include:\nA description of each natural marvel\nIts geographic location and key characteristics\nIts cultural or environmental importance\nConservation issues or efforts related to each site\n Students are expected to use the future tense to make predictions, the subjunctive in adverbial clauses to discuss environmental conditions, and appropriate prepositions to describe location and movement.\nOral Presentation:\nStudents will present their findings in Spanish, summarizing each natural marvel and explaining why it is significant. Presentations should demonstrate clear pronunciation, organized ideas, and accurate use of target grammar structures."}, {"name": "Unit 7"}, {"name": "La tecnología", "timeframe": "5 weeks", "concepts": "Vocabulary:                                                                                                            \nStudents explore vocabulary related to astronomy, the universe, and scientific inventions. They describe planets, space exploration, galaxies, and technological discoveries, as well as key scientific innovations that have shaped modern life. Students also discuss the role of science and technology in society and how inventions impact daily life and future possibilities.\nCultural Focus:\nStudents study Argentine animators and innovation in the Hispanic world, analyzing how creativity, science, and technology intersect in media, animation, and scientific development. They explore contributions from Spanish-speaking scientists, engineers, and creators, highlighting the global impact of Hispanic innovation.\nGrammar Skills:\nPresent Perfect (pretérito perfecto):\n Students use the present perfect to describe recent scientific discoveries and breakthroughs (e.g., Han descubierto nuevos planetas, Se ha inventado una nueva tecnología).\nPast Perfect (pluscuamperfecto):\n Students use the past perfect to explain what had already been discovered or invented before a specific point in time (e.g., Ya habían desarrollado la tecnología antes de la misión).\nDiminutives and augmentatives:\n Students use suffixes such as -ito/-ita and -ón/-ona to modify meaning, express size, emphasis, or tone when describing objects, inventions, or concepts (e.g., librito, planetita, gran invento, problemón).", "skills": "Intercultural connection: Students explore scientific and technological contributions from the Hispanic world, including Argentine animation and innovation in space science, recognizing how Spanish-speaking cultures contribute to global scientific progress.\nSense of self and place: Students connect scientific discoveries and inventions to their own lives by reflecting on how technology, space exploration, and innovation influence their daily experiences and future aspirations.\nCritical systems thinking: Students analyze how scientific breakthroughs build on previous discoveries, using the present perfect and past perfect to show relationships between past innovations and recent developments in science and technology.\nAdaptability to change: Students demonstrate flexibility in language use by shifting between present perfect, past perfect, and descriptive structures to accurately communicate evolving scientific ideas and timelines.\nAction towards a better future: Students discuss how scientific innovation can improve society, using Spanish to describe inventions and breakthroughs that address global challenges and support future advancement in technology and space exploration.", "materials": "Textbook: Descubre 3: Lengua y Cultura del Mundo Hispánico supported by the online platform VHL.\nWorkbook: Descubre 3: Cuaderno de Práctica. \nTeacher-created materials and authentic resources are used to support instruction.\nVarious supplemental online resources.\nHappy Cool\nEse bobo del móvil", "assessments": "Tests, quizzes, oral presentations.readings,  and discussions."}]}, {"name": "Spanish 4", "department": "Modern Languages - Spanish", "teacher": "N. Álvarez and Dr. D. Arboleda", "grade": "10/11", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Unit 1: Reality, Dreams, and Identity – Perspective Shifts in Borges", "timeframe": "4-weeks", "concepts": "Thematic Focus: Exploring how identity, aging, and the fluid boundary between dreams and reality are constructed through an excerpt of Jorge Luis Borges' short story, “El otro.”\nLiterary Understanding: Utilizing the narrative as a central springboard to analyze a dialogue between past and present versions of the self, challenging how objective reality is recorded by human memory.\nStructural Meaning: Harnessing the text to evaluate the precise functional contrast between the present tense (signaling ongoing dialogue, immediate perspectives, and enduring preferences) and the preterite tense (anchoring completed biographical milestones and specific past events).", "skills": "Reading: Navigating complex prose directly in the target language by leveraging Spanish-only vocabulary definitions and contextual footnotes.\nSpeaking: Engaging in spontaneous classroom debates (Expresión personal) regarding personal preferences and whether the text's encounter is a dream or a reality.\nListening: Comprehending recorded biographical data, author background, and native-speaker cadences through the program's audio lectures (conferencias).\nWriting: Synthesizing the themes by drafting a Composición dirigida (guided essay) that requires precise, intentional shifting between past and present timelines.", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit 2: Nature and Death", "timeframe": "4 weeks", "concepts": "Thematic Springboard: Pablo Neruda's poem “Un perro ha muerto” exploring mortality, grief, and human-nature connections.\nLiterary Meaning: Moving beyond surface summaries to analyze how poetic structure processes personal loss without over-sentimentalization.\nGrammar & Syntax Structure:  The functional distinction between Preterite vs. Imperfect for handling timeline actions versus backgrounds. The use of Present Perfect and Pluperfect to link current emotional states with completed historical memories. The semantic differences of Ser vs. Estar when defining the
