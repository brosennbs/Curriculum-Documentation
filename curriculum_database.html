volution of trickster through time and space.", "skills": "Notetaking, IDing common themes across trickster types", "materials": "Monkey\nAnansi and the Moss Covered Rock\nZorro and Quwi\nThe Tale of Tricky Fox\nNo Dinner", "assessments": "Trickster notetaking booklet"}]}, {"name": "Class V Library", "department": "Library", "teacher": "Tina Chesterman", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection ✓\nsense of self and place\ncritical systems thinking ✓\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Library Resources", "timeframe": "4 weeks", "concepts": "Key Questions:\nHow is the library organized?\nHow can I find the resources I need?\nWhat tools help me locate information efficiently?\nLessons:\nLesson 1 - Intro & Reading Survey\nLesson 2 - Call Numbers & Library Catalog\nLesson 3 - Library Catalog (bingo)\nLesson 4 - Sora (scavenger hunt)", "skills": "Understanding call numbers and library organization\nLocating and accessing library materials independently\nUsing the library catalog to search for titles\nUsing Sora to access eBooks & audiobooks", "materials": "See folder", "assessments": "n/a"}, {"name": "Unit 2"}, {"name": "Mock Newbery", "timeframe": "9 weeks", "concepts": "Key Questions:\nWhat are the various children’s book awards and why do they matter?\nHow do I evaluate a book based on its literary qualities rather than my personal preferences?\nWhat are criteria and how can they help us evaluate books?\nLessons:\nLesson 5 - Intro Book Awards\nLessons 6 - 9 -  Book 1 Discussion Groups\nLessons 10 - 13 - Book 2 Discussion Groups", "skills": "Participating in respectful literary discussions\nEvaluating books using criteria\nBuilding reading stamina, commitment, and community by reading a variety of books and participating in several discussions", "materials": "See folder", "assessments": "n/a"}, {"name": "Unit 3"}, {"name": "Media Literacy", "timeframe": "3 weeks", "concepts": "Key Questions:\nHow can I distinguish facts from opinions?\nHow does knowing the purpose of information help me evaluate it?\nex) Is this message trying to inform, persuade, entertain, or sell something?\nWhat are the differences between databases and websites?\nWhat does it mean to vet a resource?\nLessons:\nLesson 14 - Fact vs. Opinion\nLesson 15 - Zones of Information\nLesson 16 - Databases vs. Websites", "skills": "Distinguishing fact vs. opinion\nIdentifying different types of information and their purposes\nUnderstanding the differences between databases and websites", "materials": "See folder", "assessments": "n/a"}, {"name": "Unit 4"}, {"name": "Genres", "timeframe": "3 weeks", "concepts": "Key Questions:\nWhat are the characteristics of different genres?\nHow do genres help readers choose books?\nLessons:\nLesson 17 - Genres\nLesson 18 - Butterfly Book Report\nLesson 19 - Summer Reading", "skills": "Identifying characteristics of different genres", "materials": "See folder", "assessments": "n/a"}]}, {"name": "Class VII Media Literacy", "department": "Library", "teacher": "Tina Chesterman", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking ✓\nadaptability to change ✓\naction towards a better future ✓", "units": [{"name": "Unit 1"}, {"name": "Library Intro", "timeframe": "4 weeks", "concepts": "Key questions:\nHow do we find materials in the library?\nHow is the library organized?\nLessons:\nLesson 1 - Intro, Reading Survey\nLesson 2 - Library Catalog Review\nLesson 3 - Genre Study\nLesson 4 - Dewey", "skills": "Locating and accessing library materials independently\nIdentifying characteristics of different genres\nIntroduction to the Dewey Decimal System", "materials": "See folder", "assessments": "n/a"}, {"name": "Unit 2"}, {"name": "Civic Online Reasoning", "timeframe": "4 weeks", "concepts": "Key questions:\nHow can I evaluate online information thoughtfully and effectively?\nWho is behind the information? (when engaging with online info)\nLessons:\nLesson 5: Intro to Civic Online Reasoning\nLesson 6 - COR Q1: Who’s Behind the Info? - Lateral Reading\nLesson 7 - COR Q2: What’s the Evidence? - Images\nLesson 8 - COR Q3: What Do Other Sources Say? - Click Restraint", "skills": "Students learn to evaluate and verify information by leaving the original source or webpage and consulting other sources\nLateral Reading - open new tabs to investigate a source outside of the sources itself\nClick Restraint - pause before clicking the first search result and evaluate multiple options before choosing a source.", "materials": "See folder", "assessments": "n/a"}, {"name": "Unit 3"}, {"name": "Library Research", "timeframe": "5 weeks", "concepts": "Key questions:\nWhy is it important to cite your sources?\nWhat is the difference between a database and a website?\nHow do I use databases to conduct research effectively?\nHow do I use websites to conduct research effectively?\nLessons:\nLesson 9 - Citations\nLesson 10 - Databases & NoodleTools - Scavenger Hunt Research\nLesson 11 - Research (Lewis & Clark, Westward Expansion)\nLesson 12 - Research (Lewis & Clark, Westward Expansion)\nLesson 13 - Research (Lewis & Clark, Westward Expansion)", "skills": "Citations\nStudents will be able to explain the purpose of citations and why they matter\nNoodleTools\nStudents will be able to create properly formatted citations and build a bibliography using NoodleTools\nVarious library databases\nStudents will be able to navigate several library databases to find relevant information and conduct research.", "materials": "See folder", "assessments": "Students conduct research on the Lewis and Clark Expedition, track their sources on NoodleTools, and write a one page letter or diary entry from the perspective of someone on the trip\nLibGuide\nProject Description"}, {"name": "Unit 4"}, {"name": "News Literacy", "timeframe": "2 weeks", "concepts": "Key questions:\nHow does the news impact our understanding of events?\nHow can we sort fact from fiction?\nWhat is sponsored content and how can it affect a journalist's objectivity?\nLessons:\nLesson 14 - Evaluating Images\nLesson 15 - Sponsored Content", "skills": "Understand the role of news in shaping public understanding\nDistinguish between fact, misinformation, and disinformation\nAnalyze and evaluate the credibility and purpose of images online and in the news\nIdentifying sponsored content", "materials": "See folder", "assessments": "n/a"}, {"name": "Unit 5"}, {"name": "Reading Style & Wrap-Up", "timeframe": "2 weeks", "concepts": "Key questions:\nWhat is your reading style?\nHow can you use appeal terms to articulate what you like about a book and find your next read?\nLessons:\nLesson 17 - Reading Style & Appeal Terms\nLesson 18 - Summer Reading", "skills": "Understand and apply Appeal Terms to articulate what students like about a book\nUse Appeal Terms to Identify and reflect on personal reading preferences", "materials": "See folder", "assessments": "n/a"}]}, {"name": "Math VI", "department": "Math", "teacher": "Massey and Pienciak", "grade": "", "length": "", "description": "", "competencies": "Developing a deep understanding of area and surface area, ratios, unit rates, arithmetic with decimals and fractions, and beginning algebra through expressions and equations.\nOur five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Area and Surface Area", "timeframe": "Approximately 11–13 lessons plus review and testing", "concepts": "Developing an understanding of the concept of area as a two-dimensional space.\nUsing physical representations of multiplication to understand area.\nReasoning about the area of polygons by decomposing, rearranging, and using what is known about rectangles and triangles.\nConnecting the surface area of three-dimensional objects to their nets.", "skills": "Calculate the area of parallelograms, triangles, and polygons.\nDraw and use nets to find the surface area of three-dimensional objects like prisms and pyramids.\nApply area formulas for triangles (A = 1/2 × b × h) and parallelograms (A = b × h).", "materials": "Open-Up Resources", "assessments": "Assessments"}, {"name": "Unit 2"}, {"name": "Introducing Ratios", "timeframe": "Approximately 17 lessons plus a quiz and test.", "concepts": "Understanding that a ratio is a multiplicative comparison between two quantities.\nRecognizing that ratios can be expressed as \"a to b,\" \"a:b,\" or as a fraction.\nUnderstanding equivalent ratios and how they can be scaled using a scale factor.", "skills": "Create and use ratio tables, double number lines, and tape diagrams to solve problems.\nIdentify and generate equivalent ratios.\nCalculate unit rates and apply them to real-world contexts.", "materials": "Open-Up Resources", "assessments": "Assessment"}, {"name": "Unit 3"}, {"name": "Unit Rates and Percentages", "timeframe": "Approximately 10–12 lessons", "concepts": "The concept of a unit rate as a special kind of ratio where one of the quantities is 1.\nConnecting ratios and unit rates to percentages (parts per 100).\nUsing unit rates to compare different rates and solve \"better buy\" problems.", "skills": "Solve problems involving unit pricing and constant speed.\nCalculate percentages of a number and find the whole given a part and a percentage.\nConvert measurements between different systems using unit rates.", "materials": "Open-Up Resources", "assessments": "Assessments"}, {"name": "Unit 4"}, {"name": "Dividing Fractions", "timeframe": "Approximately 11–13 lessons plus review and assessment.", "concepts": "Developing fluency with standard algorithms for addition, subtraction, multiplication, and division of multi-digit decimals.\nUnderstanding the role of place value in decimal operations.\nUsing the Distributive Property as a strategy for mental math and decimal multiplication.\nReasoning about the placement of the decimal point in products and quotients.", "skills": "Add, subtract, multiply, and divide decimals to the hundredths or thousandths place using standard algorithms.\nUse estimation to check the reasonableness of decimal calculations.\nConvert between different representations of decimals (fractions, area models, long division).", "materials": "Open-Up Resources", "assessments": "Assessments"}, {"name": "Unit 5"}, {"name": "Expressions and Equations", "timeframe": "Approximately 10–12 lessons plus review and testing", "concepts": "Understanding that a variable represents a number and can be used to write expressions that describe relationships between quantities.\nRecognizing that an equation is a statement that two expressions are equal.\nUnderstanding that solving an equation is the process of finding the value that makes the equation true.\nApplying the Distributive Property and exponents (a2, a3) to simplify and evaluate algebraic expressions.", "skills": "Write and evaluate numerical and algebraic expressions involving whole-number exponents.\nUse a balance scale model or tape diagrams to represent and solve one-step equations (x + p = q and px = q). * Identify when two expressions are equivalent by using the properties of operations (e.g., 3(2+x) is the same as 6+3x).\nSolve real-world problems by writing and solving equations with variables.", "materials": "Open-Up Resources", "assessments": ""}]}, {"name": "Advanced Calculus A", "department": "Math", "teacher": "Wood", "grade": "", "length": "", "description": "", "competencies": "Reasoning • Creativity • Decision-making • Perseverance • Communication", "units": [{"name": "Unit 1"}, {"name": "Infinite Series", "timeframe": "8 class days", "concepts": "1.1 Sequences and Series\n1.2 Divergence and p-Series Tests\n1.3 Direct and Limit Comparison Tests\n1.4 Alternating Series, Root, and Ratio Tests\n1.5 Absolute and Conditional Convergence\n1.6 Choosing a Convergence Test\n1.7 Alternating Series Remainder", "skills": "Pattern Identification: Recognizing series types and general terms.\nTest Selection: Choosing the most efficient convergence test.\nLogical Proof: Justifying convergence with formal rigor.\nLimit Evaluation: Analyzing end-behavior and growth rates.\nError Bounding: Estimating the accuracy of partial sums.\nCategorization: Distinguishing absolute vs. conditional convergence.", "materials": "Nightingale-created materials\nAnton, H., Bivens, I., & Davis, S. (2012). Calculus: Early Transcendentals (10th ed.). Wiley", "assessments": "https://drive.google.com/drive/folders/1TecNo3Ai5jdlUlBd2Kap4V3wc93KQ9Ln"}, {"name": "Unit 2"}, {"name": "Limits and Continuity", "timeframe": "11 class days", "concepts": "2.1 Limits Intro\n2.2 Algebra Boot Camp\n2.3 Limit Techniques\n2.4 Intermediate Value Theorem\n2.5 Derivative as Rate of Change I\n2.6 Derivative as Rate of Change II\n2.7 Limit Definition of Derivative\n2.8 Continuity & Differentiability I\n2.9 Continuity & Differentiability II", "skills": "Limit Evaluation: Calculating finite and infinite limits using various techniques.\nAlgebraic Manipulation: Simplifying complex expressions to resolve indeterminate forms.\nContinuity Analysis: Applying formal definitions to verify continuity and differentiability.\nExistence Proofs: Using the Intermediate Value Theorem to guarantee values.\nRate of Change Modeling: Interpreting derivatives as instantaneous motion and growth.\nFormal Differentiation: Constructing derivatives using the limit definition.\nGraphical Interpretation: Connecting limits and slopes to visual function behavior.", "materials": "Nightingale-created materials\nAnton, H., Bivens, I., & Davis, S. (2012). Calculus: Early Transcendentals (10th ed.). Wiley", "assessments": "https://drive.google.com/drive/folders/1TecNo3Ai5jdlUlBd2Kap4V3wc93KQ9Ln"}, {"name": "Unit 3"}, {"name": "Differentiation", "timeframe": "7 class days", "concepts": "3.1 Derivative Rules\n3.2 Common Functions I\n3.3 Common Functions II (Inverses)\n3.4 Implicit Differentiation\n3.5 L'Hôpital's Rule (& Approximation)", "skills": "Pattern Recognition: Identifying function structures to select the correct derivative rules.\nProcedural Fluency: Executing multi-step differentiation with speed and accuracy.\nAbstract Manipulation: Differentiating variables implicitly and handling symbolic notation.\nEfficiency: Simplifying algebraic and trigonometric expressions for more usable results.\nEstimation: Using local linearity to approximate values and behavior.\nLogical Consistency: Applying rules systematically to maintain mathematical rigor in complex problems.", "materials": "Nightingale-created materials\nAnton, H., Bivens, I., & Davis, S. (2012). Calculus: Early Transcendentals (10th ed.). Wiley", "assessments": "https://drive.google.com/drive/folders/1TecNo3Ai5jdlUlBd2Kap4V3wc93KQ9Ln"}, {"name": "Unit 4"}, {"name": "Applications of Differentiation I", "timeframe": "5 class days", "concepts": "4.1 Graphing Derivatives\n4.2 Concavity/Points of Inflection\n4.3 Mean Value/Rolle’s/Extreme Value Theorem\n4.4 Graphical Analysis", "skills": "Visual Synthesis: Translating between the derivative graphs.\nBehavior Analysis: Identifying intervals of increase, decrease, and concavity.\nOptimization Reasoning: Locating and justifying relative and absolute extrema.\nTheoretical Proof: Applying existence theorems (MVT, EVT, Rolle's) to guarantee values.\nFeature Identification: Pinpointing critical points and points of inflection from equations or data.\nData Interpretation: Inferring function characteristics from derivative sign charts and tables.", "materials": "Nightingale-created materials\nAnton, H., Bivens, I., & Davis, S. (2012). Calculus: Early Transcendentals (10th ed.). Wiley", "assessments": "https://drive.google.com/drive/folders/1TecNo3Ai5jdlUlBd2Kap4V3wc93KQ9Ln"}, {"name": "Unit 5"}, {"name": "Applications of Differentiation II", "timeframe": "10 class days", "concepts": "5.1 Review of Polar & Parametric Equations\n5.2 Differentiation of Parametric Equations I\n5.3 Differentiation of Parametric Equations II\n5.4 Parametrization of Polar Curves\n5.5 Differentiation of Polar Curves\n5.6 3D Space\n5.7 Vector-Valued Functions\n5.8 Differentiation of Vector-Valued Functions", "skills": "Coordinate Transformation: Converting between rectangular, polar, and parametric forms.\nMotion Modeling: Representing paths and velocity using vector-valued functions and parameters.\nRate Analysis: Calculating instantaneous slopes and rates of change in non-Cartesian systems.\nSpatial Visualization: Mapping and analyzing curves and vectors in 3D space.\nParametric Differentiation: Applying the chain rule to determine derivatives of dependent variables.\nVector Calculus: Executing component-wise differentiation to find velocity and acceleration vectors.", "materials": "Nightingale-created materials\nAnton, H., Bivens, I., & Davis, S. (2012). Calculus: Early Transcendentals (10th ed.). Wiley", "assessments": "https://drive.google.com/drive/folders/1TecNo3Ai5jdlUlBd2Kap4V3wc93KQ9Ln"}, {"name": "Unit 6"}, {"name": "Applications of Differentiation III", "timeframe": "7 class days", "concepts": "6.1 Related rates \n6.2 Graphs of derivatives \n6.3 Optimization", "skills": "Variables Modeling: Relating multiple changing quantities through geometric or physical equations.\nImplicit Differentiation: Differentiating linked variables with respect to time ($t$).\nOptimization Analysis: Finding absolute extrema to solve real-world efficiency problems.\nGraphical Synthesis: Inferring original function behavior from complex derivative graphs.\nConstraint Application: Using domain restrictions and secondary equations to reduce multivariable problems.\nSituational Translation: Converting verbal descriptions into rigorous mathematical models.", "materials": "Nightingale-created materials\nAnton, H., Bivens, I., & Davis, S. (2012). Calculus: Early Transcendentals (10th ed.). Wiley", "assessments": "https://drive.google.com/drive/folders/1TecNo3Ai5jdlUlBd2Kap4V3wc93KQ9Ln"}, {"name": "Unit 7"}, {"name": "Indefinite Integration and Differential Equations", "timeframe": "10 class days", "concepts": "7.1 Slope fields\n7.2 Euler's Method\n7.3 Antiderivatives/indefinite integration\n7.4 u-substitution\n7.5 Separable differential equations\n7.6 Partial fraction decomposition\n7.7 Integration by parts\n7.8 Integrating factor", "skills": "Directional Mapping: Interpreting and sketching slope fields for visual solutions.\nNumerical Estimation: Using iterative steps (Euler’s Method) to approximate values.\nMethod Selection: Identifying the optimal integration rule for various function structures.\nDifferential Solving: Finding particular solutions to separable and first-order linear equations.\nStrategic Decomposition: Reducing complex rational functions via partial fractions.\nIntegration Fluency: Executing advanced techniques with precision.", "materials": "Nightingale-created materials\nAnton, H., Bivens, I., & Davis, S. (2012). Calculus: Early Transcendentals (10th ed.). Wiley", "assessments": "https://drive.google.com/drive/folders/1TecNo3Ai5jdlUlBd2Kap4V3wc93KQ9Ln"}, {"name": "Unit 8"}, {"name": "Definite Integration", "timeframe": "9 class days", "concepts": "8.1 Riemann sums\n8.2 Definite integration (Fundamental Thm of Calc)\n8.3 Trig substitution\n8.4 Acceleration, velocity, position, & distance\n8.5 Proofs & statements\n8.6 Improper integrals\n8.7 Polar integration", "skills": "Area Approximation: Estimating definite integrals using Riemann sums and trapezoidal rules.\nTotal Accumulation: Applying the Fundamental Theorem of Calculus to calculate net change.\nKinematic Modeling: Relating acceleration, velocity, and position through integration.\nTrigonometric Substitution: Simplifying radical integrands using circular identities.\nInfinite Analysis: Evaluating improper integrals over unbounded intervals or at discontinuities.\nPolar Measurement: Calculating area and arc length within polar coordinate systems.\nFormal Proof: Constructing rigorous arguments for integral theorems and properties.", "materials": "Nightingale-created materials\nAnton, H., Bivens, I., & Davis, S. (2012). Calculus: Early Transcendentals (10th ed.). Wiley", "assessments": "https://drive.google.com/drive/folders/1TecNo3Ai5jdlUlBd2Kap4V3wc93KQ9Ln"}, {"name": "Unit 9"}, {"name": "Volumes of Solids", "timeframe": "7 class days", "concepts": "9.1 Disk/Washer method\n9.2 Shell method\n9.3 Solids with other cross-sections\n9.4 Surface area\n9.5 Gabriel's Horn", "skills": "Geometric Visualization: Sketching and rotating 2D regions to visualize 3D solids.\nMethod Selection: Deciding between Disk/Washer or Shell methods for rotational efficiency.\nIntegral Setup: Constructing definite integrals with correct boundaries and radii.\nStructural Modeling: Calculating volumes for solids with known geometric cross-sections.\nSurface Measurement: Applying arc length and rotational formulas to find surface area.\nLimit Investigation: Analyzing infinite paradoxes (e.g., finite volume vs. infinite surface area).\nSpatial Reasoning: Mapping intersections and revolving about non-axis lines.", "materials": "Nightingale-created materials\nAnton, H., Bivens, I., & Davis, S. (2012). Calculus: Early Transcendentals (10th ed.). Wiley", "assessments": "https://drive.google.com/drive/folders/1TecNo3Ai5jdlUlBd2Kap4V3wc93KQ9Ln"}, {"name": "Unit 10"}, {"name": "Taylor Series", "timeframe": "10 class days", "concepts": "10.1 Review of series & local approximation\n10.2 Introduction of Maclaurin polynomials\n10.3 Taylor and Maclaurin polynomials\n10.4 Remainder estimation\n10.5 Taylor series\n10.6 Radius and interval of convergence\n10.7 Functions & power series", "skills": "Function Approximation: Constructing Taylor and Maclaurin polynomials to model transcendental functions.\nConvergence Analysis: Determining the radius and interval of convergence using the Ratio Test.\nError Bounding: Applying the Remainder Estimation Theorem to quantify approximation accuracy.\nSeries Manipulation: Deriving new power series through term-by-term differentiation, integration, and substitution.\nRepresentation: Expressing standard functions as infinite power series.\nLimit Resolution: Using series expansions to evaluate complex limits and indeterminate forms.", "materials": "Nightingale-created materials\nAnton, H., Bivens, I., & Davis, S. (2012). Calculus: Early Transcendentals (10th ed.). Wiley", "assessments": "https://drive.google.com/drive/folders/1TecNo3Ai5jdlUlBd2Kap4V3wc93KQ9Ln"}]}, {"name": "Advanced Calculus B", "department": "Math", "teacher": "John Caputo", "grade": "", "length": "", "description": "", "competencies": "Reasoning • Creativity • Decision-making • Perseverance • Communication", "units": [{"name": "Unit 1"}, {"name": "Limits and Continuity", "timeframe": "", "concepts": "The Existence of Limits: Defining a limit as a value a function approaches from both sides ($x \\to c^-$ and $x \\to c^+$).\nContinuity at a Point: Verifying the three conditions of continuity: $f(c)$ is defined, the limit exists, and the limit equals the function value.\nIntermediate Value Theorem (IVT): Understanding that continuous functions must hit every value between $f(a)$ and $f(b)$.\nInfinite Limits & Asymptotes: Analyzing end behavior to determine horizontal asymptotes and identifying vertical asymptotes through non-removable discontinuities.", "skills": "Evaluating Limits Algebraically: Using factoring, rationalizing (conjugates), and the \"highest power\" rule for limits at infinity.\nTrigonometric Limits: Evaluating special limits involving $\\frac{\\sin x}{x}$ and composite trigonometric functions.\nGraphic Analysis: Determining one-sided and two-sided limits from a visual graph, as well as identifying types of discontinuity (jump, point, infinite).\nDetermining Odd/Even Function Behavior: Using symmetry to predict limits at positive and negative infinity.", "materials": "Nightingale created material", "assessments": "https://drive.google.com/drive/u/0/folders/1jDDRssr4C0oe4Pv7Nb1wT_jawZmyNhND"}, {"name": "Unit 2"}, {"name": "The Derivative (part 1)", "timeframe": "", "concepts": "The Limit Definition of a Derivative: Formulating the derivative as $f'(x) = \\lim_{h \\to 0} \\frac{f(x+h) - f(x)}{h}$.\nDifferentiability: Understanding the criteria for a derivative to exist (the function must be continuous and have a smooth curve without sharp corners or vertical tangents).\nAverage vs. Instantaneous Rate of Change: Differentiating between the slope of a secant line over an interval and the slope of a tangent line at a single point.", "skills": "Deriving from First Principles: Using the formal limit definition to find $f'(x)$ for radical functions (e.g., $\\sqrt{2x-1}$) and rational functions (e.g., $\\frac{2}{5-x}$).\nPower and Quotient Rules: Applying initial differentiation shortcuts to polynomial and rational expressions.\nFunction Table Analysis: Calculating the derivative of a product ($h(x) = f(x)g(x)$) or quotient given a table of values for $f, g, f', \\text{ and } g'$.\nTangent Line Equations: Writing the linear equation $y - y_1 = m(x - x_1)$ for a curve at a specific $x$-coordinate.", "materials": "Nightingale created material", "assessments": "https://drive.google.com/drive/u/0/folders/1jDDRssr4C0oe4Pv7Nb1wT_jawZmyNhND"}, {"name": "Unit 3"}, {"name": "The Derivative (part 2)", "timeframe": "", "concepts": "The Chain Rule: Differentiating composite functions, particularly involving trigonometric bases.\nImplicit Differentiation: Calculating derivatives for equations where $y$ is not isolated (e.g., relations like $x^2y - 3x = y^3 - 3$).\nRelated Rates: Using derivatives to find the rate of change of one quantity (like radius) relative to another (like area) with respect to time.\nSpecial Limits: Recognizing derivatives through the limit definition, such as $\\lim_{h \\to 0} \\frac{\\tan 3(x+h) - \\tan 3x}{h}$.", "skills": "Advanced Implicit Differentiation: Solving for $\\frac{dy}{dx}$ in terms of $y$ and finding the slope at specific coordinate points $(-1, 2)$.\nVertical Tangent Analysis: Identifying points on a curve where the derivative is undefined (the denominator of $\\frac{dy}{dx}$ is zero).\nSolving Related Rates Problems: Calculating how fast a radius is increasing when given the rate of area growth for a circular region.\nTrigonometric Limits with Squeeze Theorem or Identities: Evaluating limits like $\\lim_{x \\to 0} \\frac{1-\\cos^2(2x)}{x^2}$.", "materials": "Nightingale created material", "assessments": "https://drive.google.com/drive/u/0/folders/1jDDRssr4C0oe4Pv7Nb1wT_jawZmyNhND"}, {"name": "Unit 4"}, {"name": "The Derivative (Part 3)", "timeframe": "", "concepts": "Logarithmic and Exponential Differentiation: Mastering the derivatives of $\\ln(u)$ and $e^u$, including cases with complex internal functions.\nInverses and Their Derivatives: Understanding the relationship between the derivative of a function and its inverse, $g'(x) = \\frac{1}{f'(g(x))}$.\nInverse Trigonometric Functions: Differentiating functions like $\\arctan(\\cos x)$.\nMean Value Theorem (MVT) & Rolle’s Theorem: Analyzing existence proofs for specific \"c\" values where the instantaneous rate equals the average rate.", "skills": "Logarithmic Differentiation: Differentiating expressions like $x \\ln(x^2)$ and $e^{3 \\ln(x^2)}$.\nInverse Derivative Calculations: Finding $g'(a)$ given $f(x)$ and $g(x) = f^{-1}(x)$.\nApplying the Mean Value Theorem: Finding the value $c$ on an interval $[1, 3]$ for rational functions like $f(x) = \\frac{x-1}{x}$.\nRolle's Theorem Verification: Confirming the conditions (continuity, differentiability, and $f(a)=f(b)$) are met before calculating critical values.", "materials": "Nightingale created material", "assessments": "https://drive.google.com/drive/u/0/folders/1jDDRssr4C0oe4Pv7Nb1wT_jawZmyNhND"}, {"name": "Unit 5"}, {"name": "The Derivative (Part 4)", "timeframe": "", "concepts": "Curve Sketching & Analysis: Using the First Derivative Test (increasing/decreasing) and the Second Derivative Test (concavity/inflection) to describe function behavior.\nOptimization: Modeling real-world constraints to find the maximum or minimum possible values (e.g., maximizing area with fixed fencing).\nHigher-Order Implicit Derivatives: Finding the second derivative ($y''$) of an implicit relation to determine curvature.", "skills": "Analyzing $f, f',$ and $f'':$ Identifying inflection points from the algebraic expression of a second derivative (e.g., $f''(x) = x^3(x+1)(x-2)^2$).\nSolving Optimization Problems: Setting up and solving \"fence\" problems (maximizing a rectangular enclosure with a shared middle partition).\nGraphic Interpretation: Identifying intervals on a provided graph where $y' > 0$ and $y'' < 0$ (increasing and concave down).\nImplicit Second Derivatives: Calculating $y''$ for equations like $x + \\sin y = y + 3$.", "materials": "Nightingale created material", "assessments": "https://drive.google.com/drive/u/0/folders/1jDDRssr4C0oe4Pv7Nb1wT_jawZmyNhND"}, {"name": "Unit 6"}, {"name": "The Derivative (Part 5)", "timeframe": "", "concepts": "Linearization & Tangent Line Approximation: Using the tangent line at a known point to estimate function values nearby.\nDifferentials: Estimating the change in a variable (like volume or surface area) based on a small change in a measurement (like radius).\nL'Hôpital's Rule: A formal method for evaluating limits that result in indeterminate forms ($\\frac{0}{0}$ or $\\frac{\\infty}{\\infty}$).", "skills": "Performing Linear Approximations: Estimating values like $\\sqrt{4 + \\sin x}$ at $x=0.12$ by using the tangent line at $x=0$.\nEstimating Roots: Calculating how much less than a whole number a cube root is (e.g., $\\sqrt[3]{63}$ compared to 4).\nError Propagation: Estimating the \"metal lost\" in a ball bearing when the radius wears down by a small fraction.\nEvaluating Advanced Limits: Using L'Hôpital’s Rule for complex limits like $\\lim_{x \\to 1} \\frac{\\ln x - x + 1}{x^4 - x}$ or $\\lim_{x \\to 0^+} x^2 \\ln x$.", "materials": "Nightingale created material", "assessments": "https://drive.google.com/drive/u/0/folders/1jDDRssr4C0oe4Pv7Nb1wT_jawZmyNhND"}, {"name": "Unit 7"}, {"name": "Integration (Part 1)", "timeframe": "", "concepts": "The Antiderivative: Reversing the derivative process to find the \"original\" function family (+ C).\nIntegration Rules: Applying the Power Rule, Trigonometric rules, and Exponential rules in reverse.\nIntegration by Substitution (U-Substitution): Dealing with the \"Chain Rule in reverse\" for composite functions.", "skills": "Evaluating Indefinite Integrals: Solving various polynomial, radical, and trigonometric integrals.\nU-Substitution Mastery: Identifying the inner function $u$ and its derivative $du$ to simplify complex integrands.\nSolving for Constants: Utilizing initial conditions to find the specific constant of integration ($C$).", "materials": "Nightingale created material", "assessments": "https://drive.google.com/drive/u/0/folders/1jDDRssr4C0oe4Pv7Nb1wT_jawZmyNhND"}, {"name": "Unit 8"}, {"name": "Integration (Part 2)", "timeframe": "", "concepts": "Advanced U-Substitution: Handling rational functions where the integral results in a natural logarithm ($\\int \\frac{1}{u} du = \\ln|u| + C$).\nIntegration by Parts: Reversing the Product Rule for functions where substitution fails (e.g., $\\int x \\cos x dx$).\nPartial Fraction Decomposition: Breaking down complex rational expressions into simpler, integrable fractions.\nAccumulation Functions: Analyzing functions defined by integrals, $g(x) = \\int_a^x f(t) dt$, and finding their extrema.", "skills": "Evaluating Transcendental Integrals: Integrating trigonometric functions like $\\sec \\theta$ and logarithmic forms like $\\frac{2x}{x^2+5}$.\nApplying Integration by Parts: Using the formula $\\int u dv = uv - \\int v du$ to solve products of algebraic and trigonometric functions.\nAnalyzing Integral Graphs: Identifying where an accumulation function $g(x)$ reaches a maximum by looking at the zeros and signs of the integrand $f(t)$.\nInverse Trig Integrals: Recognizing and solving integrals that result in $\\arctan$ or $\\arcsin$ forms.", "materials": "Nightingale created material", "assessments": "https://drive.google.com/drive/u/0/folders/1jDDRssr4C0oe4Pv7Nb1wT_jawZmyNhND"}, {"name": "Unit 9"}, {"name": "Applications of Integrals", "timeframe": "", "concepts": "Area Between Curves: Extending the concept of the definite integral to find the area bounded by two intersecting functions.\nVolumes of Solids of Revolution: Using the Disk and Washer methods to find the volume of a 3D shape created by rotating a 2D area around an axis.\nVolumes with Known Cross-Sections: Calculating volume based on geometric shapes (like squares or triangles) built on a 2D base.\nArc Length: Using integration to find the exact length of a smooth curve over an interval.\nPhysical Applications: Calculating total distance traveled from a velocity function and finding the average value of a function.", "skills": "Calculating Area: Setting up and evaluating integrals of the form $\\int (f(x) - g(x)) dx$ over specific intervals.\nFinding Volume: Applying the formula $V = \\pi \\int [R(x)]^2 dx$ for rotations or $V = \\int A(x) dx$ for cross-sections (e.g., cross-sections perpendicular to the x-axis that are squares).\nDetermining Arc Length: Evaluating $\\int_a^b \\sqrt{1 + [f'(x)]^2} dx$ for functions like $y = \\ln(\\sec x)$.\nParticle Motion: Finding the net change in position (displacement) and total distance traveled for particles with exponential or polynomial velocity functions.", "materials": "Nightingale created material", "assessments": "https://drive.google.com/drive/u/0/folders/1jDDRssr4C0oe4Pv7Nb1wT_jawZmyNhND"}]}, {"name": "Algebra I", "department": "Math", "teacher": "Enright & Guimaraes", "grade": "", "length": "", "description": "", "competencies": "Reasoning • Creativity • Decision-making • Perseverance • Communication", "units": [{"name": "Unit 1"}, {"name": "Pythagorean Theorem, Right Triangles & Simplifying Radicals", "timeframe": "9 class periods", "concepts": "The Real Number System: Classification of numbers including rational, irrational, integers, and whole numbers. \nProperties of Rational & Irrational Numbers: Understanding decimal expansions (terminating vs. non-terminating) and fraction conversions. \nGeometric Measurement: Relationship between side lengths and area/volume for squares and cubes. \nThe Pythagorean Relationship: Fundamental understanding of the Pythagorean Theorem and its converse. \nSpecial Right Triangles: Properties of 45-45-90 triangles and altitudes of equilateral triangles (30-60-90). \nCoordinate Geometry: Application of the distance formula in a 2D plane.", "skills": "Computation & Simplification: Simplifying all numerical answers completely and applying correct units of measure. \nEstimation: Estimating square roots to the nearest tenth without a calculator. \nSolving for Unknowns: Calculating missing side lengths in right triangles and 3D rectangular prisms. \nMathematical Modeling: Applying geometric theorems to real-world scenarios\nProof & Justification: Showing all work to demonstrate the process of arriving at a solution.", "materials": "OpenUp Curriculum\nPrentice Hall Algebra I textbook\nScientific or Graphing Calculators: (If permitted for specific complex calculations.)\nCoordinate Plane/Graph Paper: For distance formula applications.", "assessments": "https://drive.google.com/file/d/1d3Vij3BU4mZCOypcXhVRlN3hGsOuz5MR/view?usp=drive_link\n\nhttps://drive.google.com/file/d/1elhtvB8y2CX7NljU0C5RVZH_hu4JPVI0/view?usp=drive_link"}, {"name": "Unit 2"}, {"name": "Solving Equations & Inequalities", "timeframe": "13 class periods", "concepts": "Order of Operations: Using the correct sequence (PEMDAS) to simplify complex numerical expressions involving exponents, grouping symbols, and signed numbers.\nLinear Equations: Solving various types of single-variable equations, including those with fractions, decimals, and distributive properties.\nSpecial Solutions: Recognizing and identifying equations that result in an \"identity\" (infinite solutions) or \"no solution\".\nLiteral Equations: Rearranging multi-variable formulas to solve for a specific variable\nAbsolute Value: Understanding the algebraic properties of absolute value in both equations and inequalities.\nLinear Inequalities: Understanding how to solve and graphically represent simple, compound, and absolute value inequalities on a number line.", "skills": "Algebraic Manipulation: Isolating variables by performing inverse operations while maintaining balance on both sides of an equation or inequality.\nModeling Real-World Scenarios: Translating verbal descriptions into mathematical inequalities to solve budget, speed limit, and fundraising problems.\nGraphing: Representing solution sets for inequalities on a number line, including the use of open/closed circles and directional shading.\nSimplification: Consistently reducing all final numerical answers to their simplest form.\nPrecision in answers: Including necessary units in final answers and showing all work to demonstrate the problem-solving process.", "materials": "OpenUp Curriculum\nPrentice Hall Algebra I textbook\nNumber Lines: For graphing the solution sets of various inequalities.\nFormula References: total surface area and volume.", "assessments": "https://drive.google.com/file/d/11qCMRjhGCRRasGcI1LvIULwAtR4ea6qa/view?usp=drive_link\n\nhttps://drive.google.com/file/d/1mhUgQsoCNxZOQWT23uNuLLowGBsz0v4r/view?usp=drive_link"}, {"name": "Unit 3"}, {"name": "Systems of Equations and Inequalities", "timeframe": "11 class periods", "concepts": "Systems of Linear Equations: Solving a set of two or more equations with the same variables using multiple methods.\nClassification of Systems: Identifying systems as consistent/independent, consistent/dependent (infinite solutions), or inconsistent (no solution) based on their algebraic or graphical representation.\nSystems of Linear Inequalities: Determining the overlapping solution region for two or more inequalities on a coordinate plane.\nMatrix Operations: Performing scalar multiplication and addition/subtraction on matrices.\nAugmented Matrices: Using matrices as a tool to solve systems of linear equations (Advanced)\nRate and Mixture Problems: Applying systems of equations to solve complex real-world scenarios involving upstream/downstream speeds and chemical concentrations.", "skills": "Graphical Analysis: Solving systems by graphing lines and identifying the point of intersection.\nAlgebraic Methods: Executing precise steps for solving systems through Substitution and Elimination.\nModeling and Translation: Writing a system of equations from a verbal description, such as business costs versus income or boat speeds in current.\nShading Inequalities: Correctly identifying solution regions through dashed/solid lines and appropriate shading.\nProcedural Accuracy: Simplifying all numerical answers and including specific units of measure (e.g., miles per hour, number of copies) in final results.", "materials": "OpenUp Curriculum\nPrentice Hall Algebra I textbook\nGraph Paper & Coordinate Planes: Specifically 10x10 grids (ranging from -5 to 5 on both axes) for plotting linear equations and inequalities.\nMatrix Notation Tools: Brackets and structured layouts for performing matrix algebra.", "assessments": "https://drive.google.com/file/d/1YoUPqTjpp4Q8xd87v7Ys8_40ulx2jXCt/view?usp=drive_link\n\nhttps://drive.google.com/file/d/1C-57bGout4vDkrLsMIuiKQOQk2Xa4gqp/view?usp=drive_link"}, {"name": "Unit 4"}, {"name": "Associations in Data", "timeframe": "8 class periods", "concepts": "Bivariate Data Analysis: Analyzing the relationship between two different variables to identify patterns and trends.\nScatter Plots: Constructing and interpreting visual representations of data sets to determine associations.\nCorrelation vs. Causation: Distinguishing between variables that move together (correlation) and those where one change directly results in another (causation).\nLinear Modeling: Developing equations for trend lines (lines of best fit) in the form y = mx + b to represent data sets.\nCorrelation Coefficient (r-value): Using numerical values to assess the strength and direction (positive or negative) of a linear relationship.\nPredictive Analysis: Utilizing linear equations and trend lines to estimate or predict future values (interpolation and extrapolation).\nOutliers: Identifying data points that differ significantly from the overall pattern of the rest of the data.", "skills": "Graphical Representation: Manually creating scatter plots from tables of data and drawing appropriate trend lines.\nEquation Derivation: Calculating the slope and y-intercept from a scatter plot or trend line to form an equation.\nContextual Interpretation: Explaining the real-world meaning of slope and y-intercept within a specific scenario.\nRelationship Characterization: Describing associations as positive/negative, linear/non-linear, and strong/weak.\nStatistical Justification: Concluding the usefulness of a linear model for predictions based on r-values and data distribution.", "materials": "OpenUp Curriculum\nPrentice Hall Algebra I textbook\nCoordinate Planes and Graph Paper", "assessments": "https://drive.google.com/file/d/1fGfnNEmRCIJzmqYjcdBOp8PlPR3JWnAE/view?usp=drive_link\n\nhttps://drive.google.com/file/d/16iRTNy-aRYVSOwYVEdXbRhdLo-fZo_NB/view?usp=drive_link"}, {"name": "Unit 5"}, {"name": "Functions & Transformation of Functions", "timeframe": "9 class periods", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Graphing Absolute Value & Quadratic Equations and Polynomial Operations", "timeframe": "10 class periods", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Radicals and Right Triangle Trigonometry", "timeframe": "11 class periods", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 8"}, {"name": "Solving and Graphing Quadratic Equations", "timeframe": "9 class periods", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 9"}, {"name": "Rational Expressions and Equations", "timeframe": "6 class periods", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Calculus 12", "department": "Math", "teacher": "John Caputo", "grade": "", "length": "", "description": "", "competencies": "Reasoning • Creativity • Decision-making • Perseverance • Communication", "units": [{"name": "Unit 1"}, {"name": "Limits and Continuity", "timeframe": "", "concepts": "Understanding the behavior of functions as they approach specific values from the left and right.\nDefining continuity at a point and over an interval.\nExploring limits at infinity and their relationship to horizontal asymptotes.", "skills": "Evaluating limits graphically, including one-sided limits and function values.\nCalculating limits algebraically using factoring, rationalizing, and trigonometric identities.\nIdentifying types of discontinuity (e.g., jump, removable, infinite).\nApplying the properties of limits to solve complex expressions.", "materials": "Nightingale created material", "assessments": "https://drive.google.com/drive/u/0/folders/16nUSaIThodMnfVDLbcUtQZ--9bwkOWwJ"}, {"name": "Unit 2"}, {"name": "The Derivative (part 1)", "timeframe": "", "concepts": "Defining the derivative as the limit of the difference quotient.\nThe relationship between differentiability and continuity.\nInterpreting the derivative as the instantaneous rate of change and the slope of a tangent line.", "skills": "Finding the derivative of a function using the formal limit definition.\nIdentifying points on a graph where a function is continuous but not differentiable (e.g., sharp corners).\nWriting equations for tangent lines to a curve at a specific point.\nDifferentiating between average velocity and instantaneous velocity in kinematic contexts.", "materials": "Nightingale created material", "assessments": "https://drive.google.com/drive/u/0/folders/16nUSaIThodMnfVDLbcUtQZ--9bwkOWwJ"}, {"name": "Unit 3"}, {"name": "The Derivative (part 2)", "timeframe": "", "concepts": "Advanced differentiation rules for complex functions.\nImplicit differentiation for relations that are not explicitly functions.\nRelated rates of change involving geometric shapes and movement.", "skills": "Applying the Power, Product, Quotient, and Chain Rules to algebraic and trigonometric functions.\nFinding the derivatives of all six trigonometric functions (sin, cos, tan, csc, sec, cot).\nPerforming implicit differentiation to find {dy}{dx} for equations like x^2 - 2xy + y^3 = 10.\nSolving related rates problems, such as finding the rate of side length increase for an expanding square given its area growth rate.", "materials": "Nightingale created material", "assessments": "https://drive.google.com/drive/u/0/folders/16nUSaIThodMnfVDLbcUtQZ--9bwkOWwJ"}, {"name": "Unit 4"}, {"name": "Applications of the Derivative", "timeframe": "", "concepts": "Using derivatives to analyze the shape and behavior of graphs.\nConnecting the first and second derivatives to physical and geometric properties (velocity, acceleration, concavity).\nFoundational theorems of calculus, including Rolle’s Theorem and the Mean Value Theorem (MVT).", "skills": "Identifying critical points, local extrema (maxima/minima), and points of inflection.\nDetermining intervals where a function is increasing/decreasing or concave up/down.\nVerifying the hypotheses and applying the conclusions of the Mean Value Theorem.\nFinding the tangent line at a specific point of inflection.", "materials": "Nightingale created material", "assessments": "https://drive.google.com/drive/u/0/folders/16nUSaIThodMnfVDLbcUtQZ--9bwkOWwJ"}, {"name": "Unit 5"}, {"name": "TI-84, Approximations, and the Graph of f'(x)", "timeframe": "", "concepts": "Using technology (graphing calculators) to solve complex calculus problems.\nThe relationship between the graph of a derivative (f') and its parent function (f).\nLinearization and tangent line approximations.", "skills": "Using the TI-84 calculator to find maximum values and sketch complex cubic or trigonometric functions.\nAnalyzing the graph of $f'$ to identify features of f, such as where f has a local minimum or a point of inflection.\nCreating tangent line approximations (linearization) for functions like f(x) = \\sqrt{x^2 + 16} near a specific point to estimate values.\nMatching derivative graphs to their corresponding original function graphs.", "materials": "Nightingale created material", "assessments": "https://drive.google.com/drive/u/0/folders/16nUSaIThodMnfVDLbcUtQZ--9bwkOWwJ"}, {"name": "Unit 6"}, {"name": "Integration and Antiderivatives", "timeframe": "", "concepts": "The Antiderivative: Reversing the process of differentiation to find the original function.\nIndefinite Integrals: Representing a family of functions that differ only by a constant (+ C).\nInitial Value Problems: Using a given point (position or velocity) to find the specific constant of integration.", "skills": "Applying the Power Rule for Integration to polynomial and radical functions.\nIntegrating simple trigonometric functions and rational functions.\nUsing U-Substitution to evaluate integrals of composite functions.\nSolving motion problems: finding the position function (s(t)) given constant acceleration and initial velocity.", "materials": "Nightingale created material", "assessments": "https://drive.google.com/drive/u/0/folders/16nUSaIThodMnfVDLbcUtQZ--9bwkOWwJ"}, {"name": "Unit 7"}, {"name": "Definite Integrals", "timeframe": "", "concepts": "Riemann Sums: Approximating the area under a curve using partitions and limits.\nThe Fundamental Theorem of Calculus (Part 1 & 2): Connecting the derivative to the definite integral.\nArea Under a Curve: Interpreting the definite integral as the accumulated area between a function and the x-axis.", "skills": "Expressing a limit of a Riemann sum as a definite integral.\nEvaluating definite integrals using the Fundamental Theorem of Calculus.\nEvaluating the derivative of an integral function ({d}/{dx} \\int_{a}^{x} f(t)dt).\nIntegrating absolute value functions by splitting the interval at the function's zeros.", "materials": "Nightingale created material", "assessments": "https://drive.google.com/drive/u/0/folders/16nUSaIThodMnfVDLbcUtQZ--9bwkOWwJ"}, {"name": "Unit 8"}, {"name": "Average Value, Logarithms, and Trig Integrals", "timeframe": "", "concepts": "Mean Value Theorem for Integrals: The concept of the \"average height\" of a function over an interval.\nNatural Logarithms in Calculus: The derivative and integral properties of $\\ln(x)$.", "skills": "Calculating the Average Value of a function using the formula {1}/{b-a} \\int_{a}^{b} f(x)dx.\nDifferentiating and integrating functions involving \\ln(x) and \\sqrt{x}.\nApplying the chain rule to logarithmic functions (e.g., finding the derivative of \\ln(\\sec x + \\tan x)).\nSolving for the zeros and domain of functions involving natural logs.", "materials": "Nightingale created material", "assessments": "https://drive.google.com/drive/u/0/folders/16nUSaIThodMnfVDLbcUtQZ--9bwkOWwJ"}, {"name": "Unit 9"}, {"name": "Exponential Functions", "timeframe": "", "concepts": "Natural Exponential Functions: Differentiating and integrating functions with base e.\nGrowth and Decay Models: Using y = Ce^{kt} to model populations or radioactive substances.\nBases other than e: Differentiating functions like a^x", "skills": "Differentiating complex exponential expressions like e^{x^2} or x e^x.\nEvaluating indefinite and definite integrals of exponential functions.\nSolving Related Rates/Growth problems: Determining the time required for a population (like bacteria) to reach a certain size.\nCalculating the remaining mass of a substance based on its half-life.", "materials": "Nightingale created material", "assessments": "https://drive.google.com/drive/u/0/folders/16nUSaIThodMnfVDLbcUtQZ--9bwkOWwJ"}, {"name": "Unit 10"}, {"name": "Total Change, Area, and Volume", "timeframe": "", "concepts": "Net Change Theorem: Interpreting the integral of a rate of change as the total change in the quantity.\nDisplacement vs. Total Distance: Differentiating between the change in position and the total path traveled.\nVolumes of Solids: Using integration to find the volume of a 3D object.", "skills": "Calculating displacement (integral of velocity) and total distance (integral of the absolute value of velocity).\nFinding the area between two curves by integrating the difference between the upper and lower functions.\nFinding the volume of a solid with known cross-sections (e.g., squares perpendicular to the x-axis).\nInterpreting real-world integrals, such as water flow into a reservoir or rainforest acreage consumption.", "materials": "Nightingale created material", "assessments": "https://drive.google.com/drive/u/0/folders/16nUSaIThodMnfVDLbcUtQZ--9bwkOWwJ"}]}, {"name": "Math X Core", "department": "Math", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "Reasoning • Creativity • Decision-making • Perseverance • Communication", "units": [{"name": "Unit 1"}, {"name": "Module A: Functions, Linear Systems & Complex Numbers", "timeframe": "", "concepts": "Function Theory: Defining relations vs. functions, domain and range, and the Vertical Line Test.\nFunction Operations: Performing arithmetic (addition, subtraction, multiplication, division) and composition ($f(g(x))$) on functions.\nSymmetry & Transformations: Algebraic tests for symmetry (x-axis, y-axis, origin) and shifting/stretching parent functions.\nComplex Number System: Introducing $i$ ($\\sqrt{-1}$) and performing operations with imaginary and complex numbers.", "skills": "Determining domain/range from graphs and equations.\nWriting linear equations in slope-intercept and standard form.\nSolving quadratic equations by factoring and completing the square.\nSimplifying complex conjugates and quotients.", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Module B: Geometric Logic, Angle Systems & 3D Space", "timeframe": "", "concepts": "Parallel Line Relationships: Understanding vertically opposite, corresponding, alternate interior, and same-side interior angles.\nTriangle Congruency Postulates: Using SSS, SAS, ASA, and AAS to prove triangles are identical.\n3D Coordinate Geometry: Expanding the Cartesian plane into the $x, y, z$ axes.\nFormal Proofs: Using T-charts (Two-Column Proofs) to build logical mathematical arguments.", "skills": "Solving systems of linear equations to find unknown angles in geometric diagrams.\nProving triangle properties using definitions of bisectors and congruency.\nPlotting points in 3D space and calculating the 3D distance between them.\nApplying the Triangle Inequality Theorem to determine valid side lengths.", "materials": "", "assessments": ""}, {"name": "Unit 3"}, {"name": "Module C: Trigonometry and Periodic Functions", "timeframe": "", "concepts": "The Unit Circle: Mapping central angles to exact $(x, y)$ coordinates where $x = \\cos \\theta$ and $y = \\sin \\theta$.\nAngular Systems: Differentiating between reference angles, coterminal angles, and intercepted arcs.\nRadian Measure: Transitioning from degrees to radians as a standard for circular rotation.\nPeriodic Function Structure: Analyzing sine and cosine waves using the general form $y = a \\cdot \\sin(b(x - h)) + k$.", "skills": "Evaluating trig functions for large or negative angles using reference angles.\nConverting degree measures to fractional radians (e.g., $200^\\circ$ to $\\frac{10\\pi}{9}$).\nCalculating the area of circular sectors and segments.\nGraphing transformed trig functions by identifying amplitude, frequency, and phase shifts.", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Module D: Inverses, Logarithms & Chemical Systems", "timeframe": "", "concepts": "Inverse Functions: Interchanging inputs and outputs; understanding that one-to-one functions pass the Horizontal Line Test.\nLogarithmic/Exponential Duality: Logarithms as the inverse of exponents ($\\log_b(x) = y \\leftrightarrow b^y = x$).\nNatural Logs & $e$: Utilizing base $e$ for continuous growth and decay models.\nChemical Equilibrium (Addendum): The balance between forward and reverse reaction rates and Le Chatelier’s Principle.\npH Scale (Addendum): The logarithmic measurement of $H^+$ concentration in acids and bases.", "skills": "Finding the algebraic equation of an inverse function (e.g., $g^{-1}(x)$).\nGraphing exponential functions and identifying their horizontal asymptotes.\nSolving compound interest problems using $A = P(1 + \\frac{r}{n})^{nt}$.\nPredicting chemical equilibrium shifts and calculating pH, $K_a$, and $K_b$.", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Module E: Year End Review", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Accelerated Math XA", "department": "Math", "teacher": "Nash Sharma, PhD", "grade": "", "length": "", "description": "", "competencies": "Develop deep conceptual understanding of advanced mathematical ideas across algebra, geometry, statistics, and precalculus.\nApply mathematical reasoning and problem-solving strategies to unfamiliar and complex problems.\nCommunicate mathematical thinking clearly through written explanations, discussion, modeling, and formal notation.\nInterpret, analyze, and construct mathematical models connected to real-world and interdisciplinary applications.\nCollaborate effectively through inquiry-based learning, Harkness discussion, and group problem solving.\nUse technology and data analysis tools to investigate patterns, visualize relationships, and test conjectures.\nDemonstrate persistence, intellectual curiosity, and comfort with ambiguity when exploring challenging mathematical ideas.\nBuild readiness for college-level calculus through analytical thinking, abstraction, and mathematical rigor.", "units": [{"name": "Unit 1"}, {"name": "Fundamentals & Foundations", "timeframe": "2.5-3 weeks\n(7 classes in a 2 week cycle; 50 min X 5 and 60 min X 2)", "concepts": "Real number system\nProperties of real numbers\nOperations with algebraic expressions\nFractions, radicals, and rational expressions\nLaws of exponents and radical notation\nScientific notation\nAbsolute value and distance\nSets, intervals, and interval notation\nLinear equations and inequalities\nAbsolute value equations and inequalities\nCoordinate plane and graph interpretation\nDistance and midpoint formulas\nSlope and equations of lines\nParallel and perpendicular lines\nSymmetry\nDirect, inverse, and joint variation\nFactoring techniques\nPolynomial and rational expression simplification\nMathematical notation and symbolic precision", "skills": "Classify and compare types of real numbers\nApply properties of real numbers algebraically\nSimplify algebraic expressions fluently\nPerform operations with radicals and rational exponents\nConvert between radical and exponential notation\nRationalize denominators\nSolve linear equations and inequalities\nSolve absolute value equations and inequalities\nInterpret and graph intervals on the number line\nUse proper interval notation and set notation\nGraph equations in the coordinate plane\nCompute slope, midpoint, and distance\nWrite equations of lines in multiple forms\nFactor polynomial expressions completely\nSimplify rational expressions\nUse scientific notation in applications\nDevelop organized mathematical workflows\nCommunicate mathematical reasoning using proper notation and vocabulary", "materials": "AA Packet 1: Fundamentals & Foundations\nUnit 1 Skills Packet:", "assessments": "Weekly Concept Checks\nSummative Unit Assessment"}, {"name": "Unit 2"}, {"name": "Functions and Their Properties", "timeframe": "2.5-3 weeks\n(2–3 instructional cycles using the NBS 2-week / 7-class rotation)", "concepts": "Definition of a function:\nFunctions represented: algebraically, graphically, numerically, verbally\nFunction notation and evaluation:\nInterpreting functions as mathematical “machines”\nPiecewise-defined functions and applications\nModeling with functions:\nDetermining domains of functions:\nRange of functions\nIncreasing and decreasing intervals\nLocal maximum and minimum values\nEven and odd functions:\nVertical line test\nHorizontal line test\nOne-to-one functions\nInverse functions:\nComposite functions:\nTransformations of functions:\nDifference quotient introduction:", "skills": "Interpret and analyze functions from multiple representations\nEvaluate functions numerically and algebraically\nDetermine domain and range from:\nIdentify whether a relation is a function\nApply vertical and horizontal line tests\nDetermine whether functions are one-to-one\nFind inverse functions algebraically and graphically\nPerform function composition\nInterpret transformations of parent functions\nAnalyze increasing/decreasing behavior\nTranslate verbal descriptions into symbolic function notation\nModel real-world situations using piecewise and algebraic functions\nInterpret function behavior contextually\nDevelop algebraic precision and mathematical communication", "materials": "Unit 2 Packet: Functions and Their Properties\nUnit 2 Problem Set:", "assessments": "Weekly Concept Checks\nSummative Unit Assessment"}, {"name": "Unit 3"}, {"name": "Polynomial and Rational Functions", "timeframe": "3-4 weeks", "concepts": "Polynomial terminology\nOperations with polynomials:\nQuadratic functions:\nCompleting the square\nGraphing parabolas:\nMaximum and minimum values of quadratic functions\nOptimization and modeling applications:\nPolynomial functions:\nFactoring techniques:\nPolynomial division\nRemainder and Factor Theorems\nRational Root Theorem\nGraphing polynomial functions using:\nRational functions:\nVertical, horizontal, and oblique asymptotes\nBehavior near asymptotes\nModeling with rational functions\nIntroduction to local maxima and minima of higher-degree polynomials", "skills": "Simplify and manipulate polynomial expressions\nFactor polynomial expressions efficiently\nConvert quadratic functions into vertex form by completing the square\nGraph quadratic and polynomial functions accurately\nIdentify:\nvertices\nintercepts\nextrema\nasymptotes\nAnalyze end behavior of polynomial functions\nDetermine multiplicity of roots from graphs\nUse synthetic and polynomial long division\nApply the Rational Root Theorem to locate possible zeros\nSolve polynomial and rational equations\nInterpret graphical behavior of rational functions\nDetermine domains of rational expressions\nModel real-world situations using polynomial and rational equations\nUse graphing technology to verify algebraic results\nDevelop mathematical explanations and written justifications\nConnect algebraic structure to graphical behavior", "materials": "Unit 3 Class Packet: Polynomial and Rational Functions\nUnit 3 Skills Packet:", "assessments": "Weekly Concept Checks\nSummative Unit Assessment"}, {"name": "Unit 4"}, {"name": "Exponential and Logarithmic Functions", "timeframe": "2.5-3 weeks", "concepts": "Exponential growth and decay\nGraphs and transformations of exponential functions\nThe natural exponential function and the number eee\nCompound and continuously compounded interest\nLogarithmic functions as inverses of exponential functions\nConverting between logarithmic and exponential form\nGraphs and properties of logarithmic functions\nLaws of logarithms\nSolving exponential and logarithmic equations\nModeling with exponential and logarithmic functions\nReal-world applications involving:\npopulation growth\nradioactive decay\nfinance\nNewton’s Law of Cooling\nlogarithmic scales", "skills": "Graph and interpret exponential and logarithmic functions\nApply transformations to exponential and logarithmic graphs\nEvaluate logarithmic and exponential expressions\nConvert between logarithmic and exponential forms\nApply the Laws of Logarithms\nSolve exponential and logarithmic equations algebraically and graphically\nUse graphing technology to analyze functions and models\nConstruct and interpret exponential growth and decay models\nAnalyze real-world applications involving finance, science, and population growth\nCommunicate mathematical reasoning using proper notation and organized work\nInterpret asymptotic behavior and long-term trends in models", "materials": "Unit 4 Packet: Exponential & Logarithmic Functions", "assessments": "Concept Checks\nSummative Assessments"}, {"name": "Unit 5"}, {"name": "Trigonometric Functions and Graphical Applications", "timeframe": "3-4 weeks", "concepts": "Trigonometric ratios and right-triangle trigonometry\nDegree and radian measure\nAngles in standard position and coterminal angles\nUnit circle and trigonometric functions of angles\nReference angles and exact trig values\nGraphs of sine and cosine functions\nAmplitude, period, phase shift, and transformations\nGraphs of tangent, cotangent, secant, and cosecant functions\nInverse trigonometric functions and restricted domains\nLaw of Sines and solving oblique triangles\nLaw of Cosines and applications to non-right triangles\nPeriodic modeling and real-world trigonometric applications\nTrigonometric applications involving navigation, shadows, circular motion, waves, and geometry", "skills": "Evaluate and interpret trigonometric functions\nUse radians and degrees fluently\nMemorize and apply unit circle values\nDetermine reference angles and exact trig values\nGraph and transform trigonometric functions\nAnalyze amplitude, period, phase shift, and asymptotic behavior\nSolve trigonometric equations and applications\nUse inverse trigonometric functions appropriately\nSolve right and oblique triangles using the Laws of Sines and Cosines\nModel periodic phenomena using trigonometric functions\nInterpret trigonometric behavior graphically, algebraically, and contextually\nCommunicate mathematical reasoning using organized symbolic notation", "materials": "Unit 5 Lesson Packets:\nUnit 5 Problem Sets and Answer Keys \nDesmos graphing investigations", "assessments": "Concept Checks\nSummative Assessments"}, {"name": "Unit 6"}, {"name": "Analytical Trigonometry", "timeframe": "3-4 weeks", "concepts": "Fundamental Trigonometric Identities: Reciprocal, Pythagorean, Even-Odd, and Cofunction identities.\nAddition and Subtraction Formulas: Formulas for sine, cosine, and tangent of sums and differences.\nDouble-Angle, Half-Angle, and Product-Sum Formulas: Derived using addition formulas to rewrite trigonometric functions.\nSums of Sines and Cosines: \nTrigonometric Equations: Solving basic and advanced trigonometric equations.", "skills": "Simplification: Simplifying complex trigonometric expressions by rewriting in terms of sine and cosine or by combining fractions.\nVerification and Proof: Proving trigonometric identities algebraically and confirming them graphically.\nExact Value Evaluation: Using sum and difference formulas to find exact values of expressions like $\\cos 75^{\\circ}$.\nTrigonometric Substitution: Substituting trigonometric functions into algebraic expressions (e.g., substituting $\\sin \\theta$ for $x$ in $\\sqrt{1-x^2}$).\nInverse Function Manipulation: Writing expressions involving inverse trigonometric functions as purely algebraic expressions.", "materials": "AA Unit 6 Packet: \"Analytical Trigonometry\" instructional packet including formulas, guidelines, and exercises.\nProblem Sets: Practice problems covering identities, simplification, and verification", "assessments": "Concept Checks\nSummative assessments - quizzes and tests"}, {"name": "Unit 7"}, {"name": "Polar Coordinates, Complex Numbers, and Parametric Equations", "timeframe": "Mid Feb to mid march", "concepts": "Polar Coordinate System: Understanding the pole, polar axis, and representing points as $(r, \\theta)$.\nCoordinate Conversion: The relationship between polar and rectangular coordinates\nPolar Equations & Graphs: Identifying and sketching circles, spirals, limaçons, and roses.\nComplex Numbers in Polar Form: Modulus, argument, and the trigonometric form \nDe Moivre’s Theorem: Powers and nth roots of complex numbers.\nParametric Equations: Defining curves", "skills": "Plotting & Representation: Plotting points in the polar plane and finding multiple polar representations for a single point.\nEquation Conversion: Converting equations from rectangular to polar form (and vice versa) and eliminating parameters in parametric equations to find rectangular paths.\nSymmetry Testing: Testing polar equations for symmetry about the polar axis, the pole, and the vertical line.\nComplex Operations: Multiplying and dividing complex numbers in polar form; finding roots and powers.\nParametric Modeling: Modeling circular motion and sketching plane curves by tracking the parameter t", "materials": "Lesson Packets, Homework Sets,", "assessments": "Concept Checks\nSummative Assessments: Quizzes and Tests"}, {"name": "Unit 8"}, {"name": "Vectors", "timeframe": "3-4 weeks", "concepts": "Two-Dimensional Vectors: Definition of a vector using component form and unit vector form\nVector Operations: Scalar multiplication, vector addition, and subtraction in both 2D and 3D.\nThe Dot Product: Definition, properties (commutativity, distributive property), and its relationship to the angle between vectors.\nProjections: Calculating the scalar and vector projection of one vector onto another vector\nThree-Dimensional Space: The 3D rectangular coordinate system, plotting points  and identifying coordinate planes (xy, xz, yz)\nSpheres in 3D: Standard equation of a sphere and finding traces of spheres in specific planes.", "skills": "Conversion: Converting vectors between component form and magnitude/direction form \nGeometric Visualization: Plotting 3D vectors using a box/prism to show depth and perspective.\nAnalytical Solving: Using the dot product to determine if vectors are orthogonal (perpendicular) or to find the angle between two vectors.\nApplication: Calculating \"Work\" as a dot product of force and displacement vectors; solving physics-related problems involving inclined planes and velocity.\n3D Geometry: Calculating the distance between two points in space and completing the square to find the center and radius of a sphere from a general equation.", "materials": "Lesson Packets, Homework Sets", "assessments": "Concept Checks\nSummative Assessments: Quizzes and Tests"}, {"name": "Unit 9"}, {"name": "Sequences and Series", "timeframe": "Mid april to mid may", "concepts": "Defining Sequences: Understanding a sequence as a function whose domain is the set of natural numbers; notation for the nth term.\nArithmetic Sequences: Sequences with a common difference \nGeometric Sequences: Sequences with a common ratio; formula for the nth term: \nSummation Notation: Using Sigma ($\\Sigma$) notation to represent the sum of terms in a sequence.\nPartial Sums: Calculating the sum of the first terms for both arithmetic and geometric series.\nInfinite Geometric Series: Conditions for convergence and the formula for the infinite sum", "skills": "Term Calculation: Finding specific terms (e.g., the 100th term) and the first several terms from a given general formula or recursive definition.\nFormula Derivation: Finding the nth term\nEvaluating Sums: Expanding and calculating sums from Sigma notation.\nSeries Analysis: Determining whether an infinite geometric series is convergent or divergent.\nApplications: Converting repeating decimals to fractions using the infinite geometric series formula", "materials": "Lesson Packets, Homework Sets,", "assessments": "Concept Checks\nSummative Assessments: Quizzes and Tests"}, {"name": "Unit 10"}, {"name": "Chemical Equilibrium and pH applications for logarithms", "timeframe": "Mid may to end of may", "concepts": "Quantitative applications in chemistry, including equilibrium concentrations, exponential and logarithmic relationships, pH, acids and bases, and scientific modeling.\nCollaborative inquiry, proof-building, mathematical communication, and open-ended problem solving through Harkness discussion and math labs.\nAlgebraic reasoning, symbolic manipulation, and advanced equation-solving techniques.", "skills": "Calculate and interpret equilibrium constants, including solving for unknown reactant and product concentrations.\nApply the Law of Mass Action to construct and analyze equilibrium expressions from chemical reactions.\nUse polynomial, rational, exponential, and logarithmic functions to model and solve quantitative chemistry problems.\nAnalyze relationships between reactants and products using algebraic and graphical reasoning.\nSolve complex nonlinear equations using algebraic methods, numerical reasoning, and graphing technology such as Desmos.\nInterpret graphs, intersections, asymptotes, and solution behavior within scientific and mathematical contexts.\nBuild and evaluate mathematical models from real experimental or scientific data.\nCommunicate quantitative reasoning clearly through mathematical notation, written explanation, and collaborative problem solving.", "materials": "Lesson Packets, Homework Sets, \n\n\nhttps://drive.google.com/drive/folders/1QU6QRMd7c10JeWrK5ee1n1ip3lVoC5Mn", "assessments": "Graded homework\nLab Notes completion\nGraded problem Set #1\nTitration lab\nGraded problem Set #2"}]}, {"name": "Precalculus", "department": "Math", "teacher": "Enright/Caputo", "grade": "", "length": "", "description": "", "competencies": "Analytical Reasoning: Making informed decisions and using creative thinking to solve multi-step problems.\nCollaboration: Listening deeply to peers and contributing to a collective understanding.\nProductive Struggle: Engaging openly with complex problems and taking risks in seeking solutions.", "units": [{"name": "Unit 1"}, {"name": "Algebra Review", "timeframe": "6 Days", "concepts": "Fundamentals of algebra including exponents, radicals, and rational expressions. Understanding the use of the discriminant in quadratic equations.Simplifying complex rational expressions; factoring polynomials completely (including sum/difference of cubes); solving absolute value inequalities and writing solutions in interval notation.", "skills": "Simplifying complex rational expressions; factoring polynomials completely (including sum/difference of cubes); solving absolute value inequalities and writing solutions in interval notation.", "materials": "Stewart Precalculus Textbook (Ch. 1); Handouts; notability notes", "assessments": "Unit Assessment\nLab stations (Exeter Labs) \nhttps://drive.google.com/drive/folders/1ZqDqlQlrcMpH59tiWEDYm8KcIfs0qAAj?usp=drive_link"}, {"name": "Unit 2"}, {"name": "Functions and Graphs", "timeframe": "8 days", "concepts": "The definition of a function; vertical and horizontal transformations; algebraic and graphical composition; inverse functions.", "skills": "Sketching transformations of a given parent graph; finding domain and range from equations and graphs; identifying intervals of increase/decrease and local extrema.", "materials": "Same as Unit 1", "assessments": "Unit Test \nVolume of a box lab\nhttps://drive.google.com/drive/folders/1zjR-VjpzR7tz_wRUA8Mxv7EueZgGaZDI?usp=drive_link"}, {"name": "Unit 3"}, {"name": "Polynomials and Functions", "timeframe": "9 Days", "concepts": "Quadratic functions in vertex form; polynomial long and synthetic division; complex numbers (a + bi); zeros of polynomial functions.", "skills": "Expressing quadratics in standard form to find vertices/intercepts; using the Factor Theorem to find all zeros; simplifying powers of i.", "materials": "Same as Unit 1", "assessments": "Unit Test\nhttps://drive.google.com/drive/folders/1MVqsaNrOTTzuBNI1cGKGLqyf6Zgofu5P?usp=drive_link"}, {"name": "Unit 4"}, {"name": "Exponential and Logarithmic Functions", "timeframe": "9 days", "concepts": "Laws of Logarithms (expansion and combination); exponential growth and decay; continuous compounding using the natural base e.", "skills": "Solving exponential and logarithmic equations; modeling real-world financial growth; matching logarithmic functions to their graphs based on asymptotes and intercepts.", "materials": "Same as Unit 1", "assessments": "Unit Test\nhttps://drive.google.com/drive/folders/1qqxTVdhbPzYAZst8kU3UUU_f3W7ej_RC?usp=drive_link"}, {"name": "Unit 5"}, {"name": "Trig Part I (Fundamentals)", "timeframe": "11 Days", "concepts": "Radian measure and arc length; the Unit Circle; reference angles; transformations of sine and cosine graphs (amplitude, period, phase shift).", "skills": "Converting between degrees and radians; evaluating trig functions for any angle; writing equations of sinusoidal curves from a graph or word problem.", "materials": "Same as Unit 1", "assessments": "Check-In Quiz\nUnit Test \nhttps://drive.google.com/drive/folders/1eU3NauAKAWd8uaYhypNyjITVVtWalefk?usp=drive_link"}, {"name": "Unit 6"}, {"name": "Trig Part II", "timeframe": "10 Days", "concepts": "Inverse trigonometric functions; the Law of Sines (including the ambiguous case); the Law of Cosines; area formulas for triangles.", "skills": "Solving multi-step triangle word problems; solving trig equations using factoring; rewriting expressions using cofunction and Pythagorean identities.", "materials": "Same as Unit 1", "assessments": "Unit Test\nhttps://drive.google.com/drive/folders/1fJoow3-1M_j0P0NvWP4yMPg3fRczHmYG?usp=drive_link"}, {"name": "Unit 7"}, {"name": "Trig Part III (Analytic Trig)", "timeframe": "9 Days", "concepts": "Addition and Subtraction formulas; double-angle and half-angle identities; methods for proving complex trigonometric identities.", "skills": "Verifying identities by manipulating one side of an equation; using identities to find exact values of trig functions for non-standard angles.", "materials": "Same as Unit 1\nIdentify Reference Sheets", "assessments": "Unit Test\nhttps://drive.google.com/drive/folders/1PgRZ7-hzRJHb6bh5_p6H_2UfrlfrfbIl?usp=drive_link"}, {"name": "Unit 8"}, {"name": "Sequences and Series", "timeframe": "6 days", "concepts": "Arithmetic and Geometric sequences; partial sums; sigma notation; convergence of infinite geometric series.", "skills": "Finding the $n^{th}$ term of a recursive sequence; calculating the sum of a finite or infinite series; expanding sigma notation.", "materials": "Same as Unit 1", "assessments": "Unit Test\nhttps://drive.google.com/drive/folders/1y12I8DAc94YGkQyIzFhHSCMZg2GRjnou?usp=drive_link"}, {"name": "Unit 9"}, {"name": "Regression and Growth", "timeframe": "7 days", "concepts": "Linear, Power, Exponential, and Logarithmic regression models; logistic growth functions; direct and inverse variation.", "skills": "Determining the line of best fit using technology; interpreting the meaning of regression coefficients in a real-world context.", "materials": "Same as Unit 1\nStatistical Software/Graphing Calculators", "assessments": "Unit Test\nFamous Personality Ages Project\nhttps://drive.google.com/drive/folders/1zdSXm2W65a05w50MOxoSTQs9OndOiVGE?usp=drive_link"}, {"name": "Unit 10"}, {"name": "Probability and Binomial Expansion", "timeframe": "10 Days", "concepts": "Counting principles (Permutations vs. Combinations); Binomial Expansion Theorem; binomial probability.", "skills": "Solving complex counting problems using factorials; expanding binomials to the $n^{th}$ power; calculating the probability of specific success rates in multiple trials.", "materials": "Same as Unit 1", "assessments": "Unit test\nBirthday Paradox Problem\nhttps://drive.google.com/drive/folders/1xFmKug7ceoxwOguUnxy77p6xHcbOG4NT?usp=drive_link"}, {"name": "Unit 11"}, {"name": "Trig Review & Statistics", "timeframe": "7 days", "concepts": "Comprehensive review of year-long topics (Factoring and Trig); standard deviation and the Normal Distribution.", "skills": "Reference angles, quadrant signs, Calculating quartiles and constructing box plots; interpreting data using the empirical rule (68-95-99.7).", "materials": "Same as Unit 1", "assessments": "Unit Test\nhttps://drive.google.com/drive/folders/12si0KFgS4FKG2TVrPnMYZI67BZmYcK-H?usp=drive_link"}, {"name": "Unit 12"}, {"name": "Introduction to Limits", "timeframe": "6 days", "concepts": "The concept of a limit; properties of limits; limits at infinity and vertical asymptotes.", "skills": "Evaluating limits algebraically and graphically; understanding continuity.", "materials": "Same as Unit 1", "assessments": "Unit Test\nhttps://drive.google.com/drive/folders/1UWIAuLxeVI7QdTCahFTnGvWuzVUjSlEc?usp=drive_link"}]}, {"name": "Chinese 2 Curriculum", "department": "Modern Languages - Chinese", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": ""
