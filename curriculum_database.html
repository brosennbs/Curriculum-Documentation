nal hurdles of George Washington's presidency starting April 30, 1789. Analyzing how the first Congress split over federal vs. state authority, highlighted by the symbolic debate over presidential titles (resolving on \"Mr. President\" over royal nomenclature) and the formal creation of the first Executive Departments (the Cabinet: State, War, Treasury).\nWashington’s Farewell Address: Deconstructing Washington's crucial non-partisan legacy, specifically his explicit civic warnings to future generations regarding the dangers of deep political party loyalty dividing the nation and the threats of foreign influence.\nThe First Party System (Hamilton vs. Jefferson): Tracking the intense ideological polarization between:\nThe Federalist Party (Alexander Hamilton): Believing humans are naturally self-interested, advocating for a strong central government, loose constitutional construction, and prioritizing manufacturing, global trade, and infrastructure development.\nThe Democratic-Republican Party (Thomas Jefferson): Advocating for an economy centered on agricultural growth, a strict constructionist view of the Constitution, states' rights, and a \"frugal and simple\" federal government.\nThe Election of 1800 & Constitutional Remedy: Reviewing the toxic partisan campaign involving John Adams, Charles Pinckney, Thomas Jefferson, and Aaron Burr. Evaluating how Alexander Hamilton’s behind-the-scenes influence broke the electoral deadlock, why this transition of power mattered, and how it directly led to the ratification of the Twelfth Amendment to separate president/vice-president ballots.\nJeffersonian Presidency & Rhetoric: Analyzing Thomas Jefferson’s Inaugural Address (1801) to evaluate how his leadership message attempted to heal partisan wounds and how his executive actions aligned with or diverged from Washington's precedent.\nGeopolitical Growth & The Louisiana Purchase (1803): Assessing the mechanics of the land deal with Napoleon Bonaparte of France that secured the Mississippi River and the critical port of New Orleans. Evaluating the deep constitutional and political debates surrounding it—specifically analyzing Alexander Hamilton’s New York Evening Post editorial criticizing the purchase as a lucky, wilderness-filled coincidence that risked weakening central authority.\nExploration & Indigenous Impacts: Investigating the logistical goals of the Lewis, Clark, and Sacagawea expedition, alongside the immediate consequences of territorial growth on Indigenous communities.\nManifest Destiny: Deconstructing the concept first coined by New York editor John O'Sullivan in 1845. Evaluating the ideology of \"obvious fate,\" the declaration of divine rights to overspread the continent, and how it was historically weaponized to justify the forcible displacement of sovereign Indigenous nations.", "skills": "Primary Source Rhetoric Analysis: Evaluating political speeches (Washington's Farewell Address, Jefferson's Inaugural Address) and published op-eds (Hamilton's 1803 editorial) to uncover author bias, historical context, and ideological motivations.\nComparative Ideological Frameworks: Distinguishing between strict construction and loose construction of the Constitution, and mapping how these legal philosophies shaped early federal actions.\nHistorical Perspective-Taking / Roleplay Writing: Discerning how distinct socio-economic stakeholders (e.g., frontier farmers vs. coastal merchants) viewed executive actions, and adopting those specific personas to write compelling arguments.\nConceptual Categorization & Matrix Synthesis: Grouping historical actors, events, and policies into logical, thematic clusters to demonstrate an understanding of deeper systemic connections (e.g., the Connections: History Class Edition pattern tracking).\nCritical Deconstruction of Historical Mythologies: Analyzing structural terms like \"Manifest Destiny\" to identify the contradictions between democratic ideals (\"experiments of liberty\") and the realities of institutional expansion at the expense of native populations.", "materials": "Core Curricular Reading Packets: TCI's Political Developments in the Early Republic textbook readings and Manifest Destiny and the Growing Nation unit packets.\nPrimary Sources & Secondary Documentaries: Text of George Washington's Farewell Address; Thomas Jefferson's 1801 Inaugural Address; Alexander Hamilton's editorial \"Purchase of Louisiana\" (July 1803) via the Digital Inquiry Group.\nScaffold Tools & Activities: Unit 6 Political Developments Assignment Sheet; Connections: History Class Edition grouping matrices; Unit 6 Review Sheet.", "assessments": "Formative Assessments & Exercises: Written notebook responses evaluating Washington's cabinet achievements; guided text annotations tracking the Hamilton/Jefferson policy platforms; the Connections vocabulary synthesis challenge (grouping related concepts like Napoleon, Louisiana, and the Mississippi River).\nSummative Persona Writing Assessment (Letter to the Editor): A structured 5–6 sentence analytical paragraph assignment modeled as an historical letter-to-the-editor for the New York Evening Post. Students must adopt a explicit stakeholder persona (e.g., a frontier farmer), state a definitive position for or against the Louisiana Purchase, and deliver at least two historically accurate, text-supported reasons defending their stance.\nSummative Unit Assessment (Political Developments Quest): A comprehensive written assessment combining:\nConceptual multiple-choice items testing knowledge of early executive departments, party platforms, the Twelfth Amendment, and expansion boundaries.\nContextual short-answer analysis requiring students to evaluate whether George Washington would approve of Thomas Jefferson's inaugural messaging based on specific primary source evidence."}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "U.S. History: America’s Founding Ideals, Historical Memory and Human Rights", "department": "History", "teacher": "Hines, Bikk, Hartmann", "grade": "", "length": "", "description": "", "competencies": "", "units": [{"name": "Race and Justice in Contemporary America", "timeframe": "3-4 weeks", "concepts": "The Purpose of History: Examining why we teach U.S. history and what is actually taught in American classrooms\nContested Narratives: Analyzing modern disputes in American history, including the work of Nikole Hannah-Jones and Clint Smith.\nPolitical Activism: Exploring the forgotten history of high school activism.\nCriminal Justice: Understanding mass incarceration and the \"School-to-Prison Pipeline\".\nJustice & Injustice: Exploring systemic injustice and racial discrimination through the lens of Bryan Stevenson’s Just Mercy.", "skills": "Historical Thinking Skills which include the following:\nEvidence & Interpretation: Gathering, sourcing, corroborating, and contextualizing historical evidence.\nReasoning: Applying chronological reasoning and analyzing causation.\nAnalytical Perspectives: Using comparison, geographic reasoning, and understanding economic systems.\nCivic Participation: Developing the skills necessary for active civic engagement.", "materials": "Core Text: Just Mercy by Bryan Stevenson.\nArticles/Essays: \"Actually Slavery Was Very Bad\" (Clint Smith), Nikole Hannah-Jones on history, and \"The Forgotten History of High School Activism\".\nMultimedia: Vox slide deck: \"Mass Incarceration Explained in 22 Charts and Graphs\".", "assessments": "(formative) Vox Slide Presentation: Students present 3 new facts, 2 lingering questions, and 1 main idea from the mass incarceration data.\nCritical Analysis: Specific examples from Just Mercy used to support an analysis of race, poverty, and inequality.\n(summative)“How Do You Define Justice” Summer Reading: An exploration of how Stevenson’s journey sheds light on flaws in the criminal justice system."}, {"name": "The Civil War", "timeframe": "4 weeks (2 cycles)", "concepts": "The persistence of slavery in a nation founded on freedom\nThe role of abolitionists in elevating slavery as a national issue\nDifferential impacts of the war on soldiers, white women, enslaved men and women, Native Americans\nCritical turning points and the political and social changes following the war\nThe contemporary relevance of the American Civil War\nKey Events in the run-up to civil war: \nCompromise of 1850; \nMissouri Compromise\nKansas-Nebraska Act\nDred Scott Supreme Court decision\nJohn Brown’s Raid\nUncle Tom’s Cabin", "skills": "Build vocabulary, including: sectionalism, secession, popular sovereignty, agitator, arsenal, faction, urban, Fort Sumter, etc. (found in TCI text)\nCounterfactual Analysis:  Examine primary documents related to the enslaved community, rebellions (i.e. Vesey and Turner) and influential speeches (i.e. Douglass)\nRhetorical Evaluation: Analyze the lectures of Frederick Douglass and the two versions of Sojourner Truth’s speech “Ain’t I A Woman?” Use the latter to explore reliability, stereotyping, corroboration", "materials": "Curriculum Text: select portions of TCI Lessons 4, 9, 10 (Sectional differences, abolitionists, war effects)\nLiterature excerpts: Uncle Tom’s Cabin Harriet Beecher Stowe\nPrimary Sources: Lincoln’s “House Divided” speech; Gettysburg Address \nProfiles of William Lloyd Garrison and Frederick Douglass", "assessments": "(summative) In-Class Essay: “Was the Civil War Inevitable?”"}, {"name": "Unit 3: Reconstruction"}, {"name": "Reconstruction: The Second Founding", "timeframe": "4 weeks", "concepts": "Definition: The post-Civil War period (1865–1877) focused on reuniting the United States, establishing citizenship and freedom for formerly enslaved, rebuilding the social structure and rebuilding the devastated South\nFounding Ideals: Testing the commitment to liberty, equality, and opportunity for 4 million newly freed African Americans.\nPolitical Factions: Comparisons between Presidential Reconstruction (Lincoln/Johnson) and Congressional Reconstruction (Radical Republicans) .Constitutional Changes: The Reconstruction Amendments (13th: Abolition, 14th: Citizenship, 15th: Voting).\nThe Redemption Governments: The rise of Black Codes, Jim Crow laws, the KKK, and the impact of Plessy v. Ferguson.", "skills": "Primary Source Analysis: Analyzing political cartoons (e.g., Joseph E. Baker and Thomas Nast) and speeches (Lincoln's 2nd Inaugural)\nComparative Analysis: Evaluating the differing priorities of \"Healing vs. Justice\" in Reconstruction plans.\nCritical Inquiry: Investigating the extent of freedom for African Americans and how Black Codes limited that freedom.", "materials": "Text/Curriculum: TCI Unit 1, Lessons 11.1, 11.2, and 11.3.\nPrimary Sources: Lincoln’s 2nd Inaugural Address; \"The Rail Splitter at Work\" cartoon; \"Pardon/Franchise\" cartoon.\nSupplementary: Facing History & Ourselves (Interracial Democracy); Black American History video series; SHEG Documents.", "assessments": "Summative Assessment: Reconstruction DBQ (Document-Based Question) \nFormative Tasks: Primary Source Analysis worksheets and graphic organizers."}, {"name": "Unit 4:  Industrialism and Progressivism in America (Westward Movement, Industrialization, Progressivism, Immigration)"}, {"name": "Industrialism and Progressivism in America", "timeframe": "", "concepts": "Essential Questions\nHow did American society transform during the late nineteenth and early twentieth centuries?\nIn what enduring ways did these transformations shape U.S. politics and Americans' struggles to secure liberty and justice for all?\nHow do people, policies and technological advances shape a nation?\nCore Historical Understandings\nAt the dawn of the twentieth century, a transforming American nation confronted the profound challenges posed by industrialization, urbanization, and immigration.\nProgressives sought to raise awareness of these societal challenges and solve them through targeted reforms at both local and federal levels.\nThe political changes enacted during the Progressive Era structurally paved the way for the New Deal initiatives of the 1930s.\nIndustrialization and immigration directly accelerated the urbanization of America, prompting widespread calls for social reform.\nKey Vocabulary & Thematic Topics\nWestward Movement & Conflict: Chisholm Trail, Dawes Act, Exoduster, Homestead Act, Populist Party, transcontinental railroad, Indian Reorganization Act, and the legacy of Native American boarding schools.\nThe Age of Industry: Bessemer process, horizontal integration, laissez-faire, Sherman Antitrust Act, social Darwinism, and vertical integration.\nLabor's Response: American Federation of Labor (AFL), child labor laws, Haymarket Affair, Homestead Strike, Pullman Strike, and the emerging working class.\nThe Immigrant Experience: Push and pull factors, America letters, Angel Island Immigration Station, Ellis Island Immigration Station, Chinese Exclusion Act, nativism, and Americanization.\nUrbanization & Muckraking: Extractive industries, Pendleton Act, Tammany Hall political machine, temperance movement, and Upton Sinclair's The Jungle.\nProgressive Reform Infrastructure: Hull House, NAACP, National Child Labor Committee, NAWSA, Social Gospel philosophy, and the Tuskegee Institute.\nConstitutional & Federal Policy: Sixteenth, Seventeenth, Eighteenth, and Nineteenth Amendments, Theodore Roosevelt's Square Deal, Woodrow Wilson's New Freedom, and the Pure Food and Drug Act (Note: Federal Reserve System curriculum has been omitted per department planning).", "skills": "Chronological Thinking: Constructing a unit-wide historical timeline to track parallel developments in expansion, industry, and reform.\nContextualization: Referencing timeline events to provide broader structural context during class discussions.\nAnalyzing Multiple Perspectives: Comparing and contrasting conflicting viewpoints in historical conflicts, specifically evaluating Custer’s Last Stand alongside the Lakota perspective of the Battle of Greasy Grass.\nPrimary Source & Textual Analysis: Evaluating historical documents, literary excerpts, and imagery, including J.P. Barrett's lyrics, Charles Dickens's observations, Emma Lazarus's poetry, and Jacob Riis's photojournalism.\nMedia Literacy: Analyzing political cartooning (e.g., \"The Lion Tamer\") to trace shifts in executive power over corporate trusts.\nCollaborative Synthesis: Participating in a jigsaw activity to verbally summarize, synthesize, and teach peers about diverse global immigration waves.\nComparative Rhetorical Analysis: Deconstructing the Seneca Falls Declaration to understand why early feminists mirrored the language of the Declaration of Independence.", "materials": "Core Textbook\nTCI Curriculum: Lesson 12 (Intro, Sections 1–5), Lesson 13 (Intro, Sections 1–4), Lesson 14 (Intro, Sections 1–4), Lesson 15 (Intro, Sections 1–5, and \"Three Waves of Immigration\"), Lesson 16 (Intro, Sections 1, 2, 4, 5), Lesson 17 (Sections 1–4), and Lesson 18 (Intro, Sections 2, 3).\nDigital Inquiry Group (inquirygroup.org) Lessons\nTribal Land Policies\nThe Battle of Little Bighorn\nChinese Immigration and Exclusion\nJacob Riis Analysis\nSettlement House Movement\nBackground on Women's Suffrage\nPrimary Sources & Multimedia\nLyrics: \"I Will Go West\" by J.P. Barrett\nArtwork: \"Custer's War\" (1900) from the Minneapolis Institute of Art\nLiterature: Charles Dickens's American Notes (1842)\nLegal Documents: Text of the Chinese Exclusion Act (National Archives)\nPoetry: \"The New Colossus\" (1883) by Emma Lazarus\nVideo: TED-Ed: \"The dark history of the Chinese Exclusion Act\"\nVideo/Photography: Jacob Riis: How the Other Half Lives (Museum of the City of New York)\nPolitical Cartoons: \"The Lion Tamer\" trust-busting cartoon\nHistorical Curricula: Classroom resources from tolerance.org (Women's Suffrage modules)", "assessments": "Formative Assessments\nTimeline Project: Creation of a collaborative or individual unit timeline.\nDaily Guided Practice: TCI lesson notebook completions and digital \"Checks for Understanding\" (Lessons 14, 17, 18).\nOral Presentations: Verbal delivery of jigsaw summaries regarding specialized immigration sections.\nAnalytical Homework Assignments: Written reflection and modern application questions regarding the Seneca Falls grievances.\nSummative Assessment\nUnit End Exam: A comprehensive assessment consisting of:\n10 multiple-choice questions.\n2 open-response primary source analysis prompts."}, {"name": "Unit 5: Expansionism and Imperialism: WWI and the Interwar Years"}, {"name": "Expansionism and Imperialism; WWI and the Interwar Years", "timeframe": "", "concepts": "Essential Questions\nTo what degree and under what circumstances should a nation involve itself in the affairs of other nations?\nHow does a nation respond to economic, political and social challenges?\nHow did America's role in the world change between the 1870s and the 1910s?\nCore Historical Understandings\nFor much of the 19th century, Americans focused their attention on continental expansion, but later looked beyond their borders to establish a small empire by 1900.\nA mix of diplomatic, economic, and ideological factors drove the United States to send troops to Europe during World War I, prompting post-war debates over global idealism versus neutrality.\nPost-WWI America experienced profound economic prosperity, technological breakthroughs, and workplace innovations during the 1920s.\nDomestic tensions manifested heavily in the interwar years through structural transformations, institutional surveillance, and racial violence.\nThe era concluded with the nation navigating its most severe economic crisis via the expansion of federal intervention through the New Deal.\nKey Vocabulary & Thematic Topics\nForeign Policy & Empire Building: Big Stick Policy, Dollar Diplomacy, Moral Diplomacy, Open Door Policy, Panama Canal, Roosevelt Corollary, and spheres of influence.\nThe WWI Home Front & Civil Liberties: Committee on Public Information (CPI), Espionage Act, Great Migration, Liberty Bonds, Schenck v. United States, Sedition Act, Wobblies, and the Woman's Peace Party.\nPost-War Diplomacy: Big Four, Fourteen Points, internationalist, irreconcilable, League of Nations, reservationist, Treaty of Versailles, and the war-guilt clause.\nPost-War Social Tensions: American Civil Liberties Union (ACLU), Anti-Defamation League (ADL), Back-to-Africa movement, Palmer Raids, quota system, Red Scare, and the Sacco and Vanzetti trial.\nThe Roaring Twenties & Cultural Shifts: Charleston, Equal Rights Amendment (ERA), Harlem Renaissance, Jazz Age, League of Women Voters, and the Lost Generation.\nEconomic Collapse: Black Tuesday, buying on margin, Hawley-Smoot Tariff Act, overproduction, stock market crash, and underconsumption.\nThe Human Impact of the Depression: Black blizzard, breadline, Dust Bowl, Great Flood of 1936, Okies, soup kitchen, and The Grapes of Wrath.\nThe New Deal & Federal Response: Agricultural Adjustment Administration (AAA), Civilian Conservation Corps (CCC), Congress of Industrial Organizations (CIO), National Industrial Recovery Act (NIRA), New Deal Coalition, Social Security Act, Wagner Act, and the Works Progress Administration (WPA).", "skills": "Chronological Strategy Tracking: Building a unit-wide timeline to trace global interventions alongside domestic shifts.\nIdeological Evaluation: Analyzing foreign interventions between 1890 and 1917 to categorize motives as either idealistic or realistic.\nGeographic & Strategic Analysis: Analyzing European battlefront maps to evaluate geographic constraints and opportunities during World War I.\nPrimary Source Interpretation: Critically dissecting foundational texts, such as Woodrow Wilson's Fourteen Points.\nLegal Simulation & Roleplay: Developing arguments and evaluating historical context through a simulated Clemency Hearing exercise.\nAnalyzing Multi-Perspective Systemic Violence: Evaluating conflicting historical viewpoints, media accounts, and modern investigations surrounding the Tulsa Race Massacre.\nVisual & Literary Literacy: Decoding social trends and economic hardships using documentary photography (e.g., \"The Migrant Mother\") and industrial period literature.\nStructured Collaborative Debate: Participating in a Structured Academic Controversy (SAC) to evaluate the long-term domestic efficacy and legacy of the New Deal.", "materials": "Core Textbook\nTCI Curriculum: Lesson 21 (Intro, Sections 1–3) , Lesson 22 (Skimmed) , Lesson 24 , Lesson 25 (Intro, Sections 1–3) , Lesson 26 (Intro, Sections 1–5) , Lesson 28 (Intro through Section 7) , Lesson 30 , Lesson 32 , and Lesson 33.\nDigital Inquiry Group (Formerly SHEG) Packets\nWorld War I Primary Documents\nNew Deal Structured Academic Controversy Packet\nPrimary Sources & Multimedia\nVideo: TED-Ed: \"Building the Panama Canal\"\nCartography: \"40 maps that explain World War I\"\nHistorical Documents: Text of the Espionage Act (1917), Sedition Act (1918), and Schenck v. U.S. (1919) legal records\nTextual Sources: Woodrow Wilson's Fourteen Points\nMultimedia Media Sets: PBS American Experience: \"Tulsa Race Massacre\" , PBS Newshour: \"How a racist white mob ruined 'Black Wall Street'\" , and The New York Times feature: \"What the Tulsa Race Massacre Destroyed\"\nPhotography: Dorothea Lange's \"The Migrant Mother\" photograph", "assessments": "Formative Assessments\nTimeline Challenge: Collaborative or individual timeline mapping of key international and domestic interwar events.\nPaired Analysis Assignments: Joint document evaluation of early 20th-century geopolitical interventions.\nInteractive Legal Simulation: Active performance and written prep for the Lesson 26 Clemency Hearing exercise.\nStructured Academic Controversy (SAC): Group-based evidence matching and consensus building regarding the expansion of federal powers under the New Deal.\nSummative Assessment"}, {"name": "Unit 6: The United States and the World: WWII; The Holocaust; Japanese Internment"}, {"name": "The United States and the World: WWII; The Holocaust; Japanese Internment", "timeframe": "", "concepts": "Essential Questions\nHow can people in a democracy balance the need for liberty with the need for national security?\nHow do competing views of power and morality lead to global conflict?\nCore Historical Understandings\nDuring this era, the United States was structurally transformed from an isolationist nation into a global superpower.\nThe severe geopolitical aggression of the Axis powers (Germany, Italy, and Japan) directly threatened United States security, driving the nation's eventual entry into World War II.\nThe U.S. actively sought to maintain strict neutrality until a devastating surprise attack on Pearl Harbor completely upended that strategy.\nThe modern nature and immense consequences of warfare during WWII fundamentally transformed both the United States and the wider global community, prompting international campaigns to secure human rights following atrocities like the Holocaust and the domestic internment of Japanese Americans.\nAs World War II drew to a close, the United States transitioned into a new type of systemic conflict with the Soviet Union: a \"cold war\" that came to define U.S. foreign policy for decades to come.\nKey Vocabulary & Thematic Topics\nOrigins of World War II: Blitzkrieg, Lend-Lease Act, Munich Pact, Nazism, Neutrality Acts, and the Spanish Civil War.\nThe Domestic Home Front & Identity: Double V campaign, Executive Order 9066, Korematsu v. United States, Tuskegee Airmen, War Production Board (WPB), War Refugee Board, Women's Army Corps (WAC), and the Zoot Suit Riots.\nGlobal Warfare & Atrocities: Allies, Axis power, Battle of Midway, Battle of Okinawa, Battle of Stalingrad, D-Day, the Holocaust, and the Manhattan Project.\nPost-War Rights Infrastructure & Aftermath: Four Freedoms, GI Bill of Rights, Nuremberg War Crimes Trials, United Nations (UN), Universal Declaration of Human Rights, and the World Bank.\nOrigins of the Cold War: Cold War, Iron Curtain, Marshall Plan, Molotov Plan, Potsdam Conference, Truman Doctrine, UN Atomic Energy Commission, and the Yalta Conference.\nGeopolitical Containment Policy: Berlin Blockade, H-bomb, Korean War, Mutual Assured Destruction (MAD), North Atlantic Treaty Organization (NATO), Third World, and the Warsaw Pact.\nDomestic Anxieties & Institutional Red Scares: Alger Hiss case, Atomic Age, communist sympathizer, Federal Civil Defense Administration (FCDA), House Un-American Activities Committee (HUAC), McCarthyism, and the Rosenberg trial.", "skills": "Chronological Mapping: Constructing a unit-wide timeline to trace complex global military interactions alongside escalating domestic changes.\nIdeological & Causal Assessment: Identifying and classifying the systemic roots of global conflict, including the goals of foreign dictators and the combined impacts of fascism, imperialism, militarism, and nationalism.\nPrimary Source Interpretation: Critically analyzing major political rhetoric and policy shifts, specifically through President Franklin D. Roosevelt's \"Day Which Will Live in Infamy\" speech.\nInvestigating Civil Liberties Contradictions: Evaluating how democracies balance national security against constitutional rights by assessing the historical evidence surrounding Japanese Internment.\nCollaborative Jigsaw Synthesis: Analyzing, processing, and verbally teaching peers about the distinct wartime opportunities and challenges experienced by varied demographics, including women, African Americans, Jewish Americans, and Mexican Americans.\nEthical Reflection & Behavior Analysis: Evaluating human behavior during mass historical atrocities to understand systemic discrimination and explore models for holding global leadership accountable.\nData Matrix Matrix/Comparative Analysis: Structuring a data table to contrast the United States and the Soviet Union based on their conflicting post-war visions, wartime realities, and foundational ideologies.\nSpatial & Cartographic Literacy: Evaluating political maps of the Iron Curtain to assess the mechanisms of geopolitical isolation across Eastern Europe.\nEvaluating Strategic Justification: Formulating arguments to assess whether the United States' international methods for the containment of communism were justified.\nAnalyzing Intersectional Anxieties: Examining systemic post-war domestic social scares by analyzing primary perspectives from LGBT communities during the \"Lavender Scare\".", "materials": "TCI Curriculum: Lesson 34 (Intro, Sections 1–5), Lesson 35 (Intro, Sections 1–7), Lesson 37 (Intro, Section 1, and Summary), Lesson 38 (Intro, Sections 1 and 3), Lesson 39 (Intro, Section 4), and Lesson 40 (Intro, Sections 1 and 2).\nDigital Inquiry Group (Formerly SHEG) Packets\nJapanese Internment Inquiry Module.\nSpecialized Curricular Units\nFacing History & Ourselves: Selected lesson sets from the Holocaust and Human Behavior unit.\nPrimary Sources, Data Models & Multimedia\nHistorical Speeches: President Franklin D. Roosevelt's \"Day Which Will Live in Infamy\" speech text (1941).\nComparative Content Tables: TCI Soviet Union vs. United States Geopolitical Ideology Matrix.\nCartography: Map of the European Iron Curtain (TCI Section 38.3).\nSocial History Source Sets: Primary accounts and perspectives detailing post-war domestic LGBT communities and the \"Lavender Scare\".", "assessments": "TCI Timeline Challenge: Chronological tracking and group ordering of major 20th-century geopolitical turning points.\nDaily Guided Practice & CFU Modules: Digital and workbook \"Check for Understanding\" text boxes (e.g., analyzing and identifying dictator objectives in Section 34.1).\nDemographic Jigsaw Presentations: Verbal peer-led synthesis and summary presentations on targeted domestic home-front experiences.\nComparative Data Assignments: Analytical processing of the US/USSR structural ideological differences chart.\nMap Literacy Reflection: Written or verbal analysis assessing containment constraints via the Iron Curtain geographical maps.\nSummative Assessment"}, {"name": "Unit 7: The Search for a Better Life"}, {"name": "Search for a Better Life; Civil Rights in Postwar America", "timeframe": "", "concepts": "Essential Questions\nWhy was there a civil rights movement?\nWhat were the goals and strategies of the civil rights movement?\nDid the civil rights movement succeed?\nWhat does \"equal rights\" mean?\nHow did various movements for equality build upon one another?\nHow was the government connected to the movements for equality?\nHow did the United States' population become more diverse during this time?\nCore Historical Understandings\nPost-World War II America experienced extraordinary economic prosperity and rapid suburbanization, which simultaneously masked deep, hidden pockets of structural poverty.\nLong-standing struggles against systemic racism matured into an unavoidable, mass civil rights movement that forced the nation to address whether its founding ideal of equality was a reality.\nActivists dynamically shifted their goals and strategies from early legal battles and nonviolent direct action to radical political structures and demands for systemic self-determination.\nThe fight for equality expanded significantly during the 1960s and 1970s, as diverse marginalized groups built upon the strategies of the Black civil rights movement to organize for their own liberation.\nKey Vocabulary & Thematic Topics\nLegal De-segregation & Backlash: School Desegregation, Brown v. Board of Education, northern resistance, and the 1974 Boston busing crisis.\nNonviolent Direct Action: The Montgomery Bus Boycott, lunch counter sit-ins, Freedom Rides, and the Birmingham Campaign.\nFederal Policy & Voting Rights: The Civil Rights Act of 1964, the Voting Rights Act of 1965, and localized political organizing.\nRadical Liberation Fronts: Redefining equality, Black Power, and the Black Panther Party's organizational infrastructure.\nThe Intersectional Women's Movement: Second-wave feminism, domesticity critiques, and Black feminist responses to mainstream white exclusion.\nPluralistic Activism Movements: LatinX labor rights, United Farm Workers organizing, Indigenous American civil rights, Asian-American community actions, Japanese American incarceration remembrance, LGBTQ+ liberation, and Disability Rights movements.", "skills": "Textual Legal Analysis: Dissecting judicial prose and analyzing legal arguments using excerpts from the unanimous Brown v. Board of Education opinion.\nEvaluating Contemporary Continuity: Analyzing current sociological studies and data visualizations to assess modern school segregation patterns.\nHistoriographical Interrogation: Evaluating how public memory, historical narratives, and the legacy of civil rights leaders (e.g., Rosa Parks) are framed, preserved, or distorted over time.\nAnalyzing Rhetorical Context: Critically interpreting long-form primary source arguments written under conditions of direct state oppression, specifically Martin Luther King Jr.’s Letter From Birmingham Jail.\nChronological Tracking: Building a structural timeline to map parallel shifts in landmark federal civil rights legislation and local actions.\nDeconstructing Intersectional Viewpoints: Comparing and contrasting differing primary source perspectives within concurrent social movements, such as evaluating bell hooks's critiques of mainstream second-wave feminism.", "materials": "Core Textbook\nTCI Curriculum: Lesson 43 (Section 3), Lesson 44 (Sections 1, 3, 4, 5, 6), Lesson 45 (Intro, Section 2), and Lesson 46 (Intro, Sections 1 through 5).\nDigital Inquiry Group (Formerly SHEG) Packets\nMontgomery Bus Boycott Inquiry Module (Optional)\nJapanese American Incarceration Legacy Unit\nPrimary Sources & Multimedia\nJudicial Records: Unanimous opinion text from Brown v. Board of Education of Topeka (I)\nMedia & Journalism: The New York Times interactive feature on contemporary school choice and desegregation; The New York Times editorial regarding Rosa Parks's legacy; Excerpts from Betty Friedan’s The Feminine Mystique\nArchival Audio & Video: PBS LearningMedia: Boston Desegregation and Busing Crises; PBS documentary film excerpts on the Freedom Rides; Kanopy streaming: Makers: Women Who Make America (Ep. 1)\nPolitical Manifestos & Rhetoric: Martin Luther King Jr.’s Letter From Birmingham Jail; Text of the Civil Rights Act of 1964; Lowndes County Freedom Organization pamphlet: \"Get Out and Vote—leave the Democrats\" (Alabama, 1966); The Black Panther Party Ten Point Program; Stokely Carmichael’s speech text \"Black Power, What We Want\"\nCritical Theory Literature: Excerpts from bell hooks's Feminism is for Everyone (pp. 11–15)\nSocial History Case Files: Biographies and documentation of Dolores Huerta and the United Farm Workers", "assessments": "Formative Assessments\nDigital Check for Understanding Modules: Standardized check-ins across TCI curriculum sections (Lessons 44, 45, and 46).\nNotebook Timeline Mapping: Active graphical execution of a timeline tracking civil rights progress and strategies.\nAnalytical Reading Reflections: Formative written homework questions processing text analysis, legacy framing, and modern grievance parallels.\nSummative Assessment"}, {"name": "Unit Name", "timeframe": "", "concepts": "Essential Questions\nWhose legacy should be commemorated, why should we care about them, and how can we communicate it to future generations?\nHow do specialized units, time periods, or the experiences of marginalized identity groups (racial, ethnic, gender, religious, regional, socio-economic, political) manifest through the lens of a single individual?\nHow can a physical space give tangible form to a historical legacy, and what should visitors think or feel as they experience it?\nHow do location, scale, noise, materials, and light/shadow inject symbolic meaning or evoke emotion without relying heavily on written words?\nHow does an architect or historian justify the funding and public construction of a memorial over other competing proposals?\nCore Project Understandings\nMemorials are explicitly designed to remember and educate, using architectural atmosphere to make visitors think and feel memorable emotions.\nPublic commemoration shapes cultural memory; choosing to memorialize non-mainstream, marginalized, or largely forgotten historical figures fills a societal void and provides well-deserved recognition.\nImpactful memorial design is deeply non-accidental; every structural carving, word, material choice, and layout decision must be fundamentally grounded in rigorous historical research.\nLasting memorial experiences rely primarily on spatial symbolism and evocative environments rather than text-heavy, museum-style layouts.\nKey Content Structures & Thematic Fields\nSubject Criteria: Non-mainstream or marginalized representation , deceased subjects (for settled historical legacy) , historical void filling , and meaningful overlap with American history.\nResearch Paper Framework: Part A: Historical Overview , Part B: Legacy , Part C: Proposed Location and Basic Design , Part D: Mission Statement , and Part E: Bibliography.\nDesign Elements: Spatial scale , materials (stone, marble, concrete, aluminum, brick, water, greenery) , atmosphere (light, shadow, color, sound) , layout keys , and multi-perspective rendering.\nThe Pitch Mechanics: Brief historical framing (<2 minutes) , compelling justification/funding pitch (2 minutes) , structural design process explanation (2 minutes) , and the closing \"sale\" (>1 minute).", "skills": "Sourcing & Critical Inquiry: Identifying, evaluating, and extracting context from a minimum of two primary sources and three secondary sources (including at least one book).\nAcademic Integrity & Citation Ethics: Tracking evidence source paths in real-time and executing proper parenthetical citations using Chicago Style formatting to protect intellectual property.\nHistorical Contextualization & Synthesis: Structuring a 2-3 page historical overview that condenses an individual's lifecycle while intentionally elevating their most critical historical era.\nLegacy Extraction: Formulating and writing a separate, explicit analysis that details exactly why a forgotten figure's accomplishments warrant modern preservation.\nArchitectural & Symbolic Translation: Translating text-based research into physical design plans using location dynamics, structural materials, and emotional metaphors instead of literal signs.\nSpatial Drafting & Perspective Rendering: Generating three distinct technical viewpoints of a physical structure: a front view, a bird's-eye view, and a close-up detail drawing accompanied by a structured key.\nPersuasive Public Speaking (The Pitch): Condensing seven weeks of architectural and historical insights into a rigid, maximum 7-minute oral presentation designed to secure theoretical funding from a panel.", "materials": "Project Guides & Digital Infrastructure\nMemorial Project Lib Guide: The core online hub for academic search queries and tracking.\nInstitutional Policies: Guidelines and policy briefs outlining the Statement of Academic Integrity and AI Policy rules.\nConsultative Resources\nLibrary Faculty Guidance: Research support via Ms. Fernandez (efernandez@nightingale.org) and Ms. Chesterman (tchesterman@nightingale.org).\nFaculty Review: Direct instruction and source approval from class history teachers.\nStudent-Sourced Research Materials\nPrimary Sources (Minimum 2): Speeches, historical newspaper articles, period advertisements, or autobiographies.\nSecondary Sources (Minimum 3): Books (at least one mandatory), e-books, scholarly articles, videos, and academic encyclopedia entries.", "assessments": "Formative Assessments\nTopic Proposal: Brainstorming a shortlist of three potential subjects and narrowing it down to one approved individual or organization.\nProject Outline & Annotated Bibliography: Formatting a structural outline based on project sections and drafting paragraphs that summarize, evaluate reliability, and defend the significance of core sources.\nDrafting Phases (Parts A & B): Submission of the first three pages of the paper focusing strictly on the historical overview and legacy analysis.\nDesign Phase Sketches: Basic design concept ideas followed by an initial draft of spatial sketches.\nFull Paper First Draft: Submission of a complete rough draft containing all five written project components for peer/teacher feedback.\nPresentation Rehearsals & Draft Slides: Slide building containing historical context, designs with keys, three perspectives, and a mission statement, followed by live in-class or free-period trial runs.\nSummative Assessment\nFinal Capstone Research Paper: A polished, double-spaced multi-page research paper complete with parenthetical Chicago Style citations, a separate legacy analysis, design explanations, a mission statement, and a formal bibliography.\nFinal Design Exhibition Renderings: Finalization of the design drawings displayed on a virtual poster board showing three required perspectives (front, bird's-eye, close-up detail), a master key, and the project mission statement.\nFinal Memorial Presentation: A maximum 7-minute competitive oral presentation delivered on May 14 to a panel of judges and classmates to \"make the sale\" and pitch the project's funding worthiness."}]}, {"name": "Global History 2", "department": "History", "teacher": "Bikk Curtis.", "grade": "", "length": "", "description": "", "competencies": "", "units": [{"name": "Unit 1"}, {"name": "Revolutions of Industrialization", "timeframe": "2-3 weeks", "concepts": "Mary Shelly’s Fran  "timeframe": "2 classes", "concepts": "Students will understand library expectations.\nStudents will review how to use shelf markers and understand checkout procedures.\nStudents will understand how to take care of their library books.", "skills": "Using a shelf marker, taking care of their books", "materials": "The Library Dragon\nGoldie Socks and the Three Libearians", "assessments": "Various exit tickets in the form of small projects and crafts"}, {"name": "Unit 2"}, {"name": "Mapping the library", "timeframe": "2-3 classes", "concepts": "Students will know what and where the different library sections are.\nStudents will create a map of the library.", "skills": "Being able to find picture books, early readers, chapter books, graphic novels, nonfiction, biographies, and items in Spanish in the library.", "materials": "Lost in the Library\nLyric McKerrigan Secret Librarian\nCome Home Already!\nButt or Face?", "assessments": "A completed “map”"}, {"name": "Unit 3"}, {"name": "Using the catalog", "timeframe": "5-6 classes", "concepts": "Students will understand how and why we use call numbers.\nStudents will utilize the online catalog to find books.\nStudents will search for books on the shelves.", "skills": "Using the catalog; knowing how to search by keyword, title, and author; know how to filter sublocations (genre/section)\nLooking at spine labels and using alphabetical/numerical order to find books on shelves", "materials": "Mr. S.\nA Perfectly Messed Up Story\nLuigi: The Spider Who Thought He was a Kitten", "assessments": "Catalog/spine label scavenger hunt"}, {"name": "Unit 4"}, {"name": "Reference sources", "timeframe": "3-4 classes", "concepts": "Students will understand what a reference book is and how it is organized and used.\nStudents will navigate dictionaries, encyclopedias, and atlases to find information.", "skills": "Finding entries in alphabetical order\nUsing finger tabs, guide words, and bolded words to find entries", "materials": "A Dictionary
