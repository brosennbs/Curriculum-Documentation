: "https://drive.google.com/drive/folders/1-Pdwrg-TdoDe9-g4cEoG9vFAQOJP3ObK?usp=drive_link", "assessments": "Climate & Seasons Test\nGreenhouse Effect/Global Warming Quiz\nLabs (Greenhouse Effect Lab, Ocean Acidification Lab)"}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Class X Chemistry", "department": "Science", "teacher": "Barros/Ward", "grade": "", "length": "", "description": "", "competencies": "We have STEM learning targets, not competencies. \nData Analysis\nProblem Solving\nSystems Thinking\nCommunication\nQuantitative Reasoning", "units": [{"name": "Unit 1"}, {"name": "The Periodic Table", "timeframe": "5 weeks", "concepts": "The period table shows you how to visualize, understand and predict the physical and chemical properties of elements.  This unit introduces its organizing power and associated foundational information needed for interpretation of real-world quantitative information.", "skills": "Data Analysis\nQuantitative Reasoning", "materials": "All class-related information is located on OnCampus.  We use a vast multitude of resources updated using AI.", "assessments": "AC1: The Four Chemists\nAC2: Density of Liquids\nAC3: Mendeleev’s Garden\nUnit Quiz\nUnit Test"}, {"name": "Unit 2"}, {"name": "Stoichiometry", "timeframe": "6 weeks", "concepts": "The laws of conservation of mass and energy serve as the foundation for the rules used to determine stoichiometric relationships.  You will use the relationships between reactants and/or products in a chemical reaction to determine desired quantitative data.", "skills": "Data Analysis\nQuantitative Reasoning", "materials": "All class-related information is located on OnCampus.  We use a vast multitude of resources updated using AI.", "assessments": "AC4: Applications of the Mole\nWhite Powders Lab Practical\nAC6: Creating Balance\nAC10: Gases\nUnit Quiz\nUnit Test"}, {"name": "Unit 3"}, {"name": "Thermodynamics", "timeframe": "4 weeks", "concepts": "Thermodynamics deals with the transfer of energy from one place to another and from one form to another.  Students apply the laws of thermodynamics to explore energy flows at Nightingale and predict the repercussions of their use.", "skills": "Problem Solving\nSystems Thinking", "materials": "All class-related information is located on OnCampus.  We use a vast multitude of resources updated using AI.", "assessments": "Free Energy of Biofuels Lab Notebook\nBuilding HVAC Modeling Practical"}, {"name": "Unit 4"}, {"name": "Ecology", "timeframe": "4 weeks", "concepts": "You will model the interrelationships between and within the social and ecological systems of NYC, analyze the leverage points within the systems, and use them to make the outputs more sustainable.", "skills": "Communication\nSystems Thinking", "materials": "All class-related information is located on OnCampus.  We use a vast multitude of resources updated using AI.", "assessments": "Double Entry Journal\nEcosystem Modeling Practical"}, {"name": "Unit 5"}, {"name": "Polarity", "timeframe": "4 weeks", "concepts": "Molecular polarity is important for life because it influences the chemical and physical properties of biological processes. You will use geometric representations to learn how the structure of molecules determines their function.", "skills": "Data Analysis\nQuantitative Reasoning", "materials": "All class-related information is located on OnCampus.  We use a vast multitude of resources updated using AI.", "assessments": "AC13: Shapes of Molecules\nUnit Test"}, {"name": "Unit 6"}, {"name": "Aqueous Solutions", "timeframe": "4 weeks", "concepts": "Water is called a “universal solvent” because it is capable of dissolving more substances than any other liquid.  It means wherever water goes, either through the air, the ground, or through the human body, it takes along valuable chemicals.  You will use instrumental chemical analytical techniques to quantify these chemicals.", "skills": "Data Analysis\nQuantitative Reasoning", "materials": "All class-related information is located on OnCampus.  We use a vast multitude of resources updated using AI.", "assessments": "AC14: Liquid Chromatography\nSpectroscopy Lab Practical\nUnit Test"}, {"name": "Unit 7"}, {"name": "Indoor Environmental Quality", "timeframe": "4 weeks", "concepts": "The tragedy of the commons refers to a situation in which individuals with access to public resources act in their own interest and, in doing so, ultimately deplete the resources.  You will explore how Nightingale interacts with the natural world and determine how the school can address environmental issues to preserve our natural resources and ensure a healthy learning environment.", "skills": "Communication\nProblem Solving", "materials": "All class-related information is located on OnCampus.  We use a vast multitude of resources updated using AI.", "assessments": "Interactive Reading Guide\nIEQ Project"}]}, {"name": "Physics", "department": "Science", "teacher": "Flomberg/Kohen/Humphrey", "grade": "A few students take Physics as seniors if they did not take it as juniors.", "length": "", "description": "", "competencies": "We have STEM learning targets, not competencies. \nData Analysis\nProblem Solving\nSystems Thinking\nCommunication\nQuantitative Reasoning", "units": [{"name": "Unit 1"}, {"name": "Measurement and Linear Kinematics", "timeframe": "About 5 weeks (14-16 class meetings)", "concepts": "Students will become adert at reading, interpreting and creating motion graphs. They will also learn the skill of \"building\" motion equations to represent the displacement and velocity of a uniformly accelerating body, like one in free fall for example.  We will extend the concept of vectors and directionality to components and resultants in two-dimensions.  We will review right triangle math and relationships to quantify how much motion in the x-direction, and how much in the y-direction.", "skills": "Data Analysis\nProblem Solving\nQuantitative Reasoning", "materials": "Students use an iBook (Physics: MacGraw Hill), but all course materials beyond the iBook can be in onCampus for Unit 1, and all units.", "assessments": "Spot Check HW assignments\nUnit 1 Problem Set\nElectric Buggy Lab\nGraphing Linear Motion with the LabQuest Stream\nVelocity and Acceleration vector Lab\nMotion Graphing Quiz\nKinematics Equations and Problem Solving Quiz, or\nUnit 1 Test"}, {"name": "Unit 2"}, {"name": "Forces and Newton’s Laws of Motion", "timeframe": "About 5 weeks (16-17 class meetings)", "concepts": "Students apply newly acquired vector addition and arithmetic knowledge (Unit 1) while developing an understanding of force(s) as an agent for changing an object's motion in their first foray into dynamics. They will also learn the rules of the dynamics game through Newton's laws of motion and their applications in everyday scenarios.  Common forces including gravitation, air resistance, normal force, tension, friction and buoyancy are explored.  They will have opportunities to consolidate previously learned skills to generate systems of force equations of motion based on a coordinate system to match the force diagrams you draw.", "skills": "Data Analysis\nSystems Thinking\nProblem Solving\nQuantitative Reasoning", "materials": "Students use an iBook (Physics: MacGraw Hill), but all course materials beyond the iBook can be in onCampus for Unit 2, and all units", "assessments": "Spot Check HW assignments\nUnit 2 Problem Set\nForce Table Lab Activity\nNewton’s 2nd Law Activity\nStatic and Kinetic Friction Activity\nVector Components and Addition Quiz\nUnit 2 Test"}, {"name": "Unit 3"}, {"name": "Two-Dimensional Motion, Projectiles and Relative Velocity", "timeframe": "About 4 weeks (roughly 12-13 class meetings)", "concepts": "Students revisit kinematics concepts (Unit 1), and apply our vector arithmetic skills (Units 1 and 2) in our study of relative velocity, circular motion, and projectiles.  They will apply previously learned skills and content to generate horizontal and vertical equations of motion based on an established coordinate system for projectiles, and investigate the motion of bodies in circular motion, free fall and when air resistance is encountered.", "skills": "Data Analysis\nProblem Solving\nQuantitative Reasoning", "materials": "Students use an iBook (Physics: MacGraw Hill), but all course materials beyond the iBook can be in onCampus for Unit 3, and all units.", "assessments": "Spot Check HW assignments\nUnit 3 Problem Set\nHuman Cannonball Lab Activity\nWhen Pigs Fly Lab Activity\nUnit 3 Test"}, {"name": "Unit 4"}, {"name": "Conservation Laws: Energy and Momentum", "timeframe": "About 4-5 weeks (12 or 13 class meetings)", "concepts": "Students revisit Newton's second and third laws (Unit 3) through a new lens when considering the momentum of a system of objects. Forces between two objects result in changes to the momentum of the objects, and in the absence of outside forces, we can make predictions about the velocities of the objects in the system using the law of conservation of momentum.\n\nStudents will also study work and energy as a new model for understanding how forces acting on a system cause changes in motion for the objects and the amount of energy stored in the system.  They will learn how to predict an object's future speed and position even when the force acting on the body is not constant, using the law of conservation of energy.", "skills": "Data Analysis\nSystems Thinking\nProblem Solving\nQuantitative Reasoning\nCommunication (when we investigate the motion of falling Slinkys)", "materials": "Students use an iBook (Physics: MacGraw Hill), but all course materials beyond the iBook can be in onCampus for Unit 4, and all units.", "assessments": "Spot Check HW assignments\nUnit 4 Problem Set\nConservation of Energy Lab Activity\nHooke’s Law activity\nPivot Interactive Conservation of Momentum (some years)\nImpulse and Momentum Quiz\nUnit 4 TEST"}, {"name": "Unit 5"}, {"name": "Electrostatics and Electric Energy", "timeframe": "About 3-4 weeks (8 or 9 class meetings)", "concepts": "Motion, force and energy pillars (Units 1-4) figure prominently in this unit as we introduce the notion of quantum through electric charge. Properties of conductors and insulators are explored, and electric force between charged particles at a distance is quantified through Coulomb's law...which bears more than a passing resemblance to the Newton's law of gravitation. The concept of the electric field and lines of force are developed in this unit as is the concept of electric potential, or energy per unit charge at a location in an electric field.", "skills": "Data Analysis\nQuantitative Reasoning\nProblem Solving\nSystems Thinking", "materials": "Students use an iBook (Physics: MacGraw Hill), but all course materials beyond the iBook can be in onCampus for Unit 5, and all units.", "assessments": "Spot Check HW assignments\nUnit 5 Problem Set\nCharging by Friction Lab activity\nElectroscopes activity\nPhET Charges and Fields activity\nUnit 5 Test"}, {"name": "Unit 6"}, {"name": "Direct Current and Simple Circuits", "timeframe": "About 5 weeks (13-15 class meetings)", "concepts": "Students investigate the relationship between a steady source of voltage (a.k.a potential difference) and the rate of charge movement (current) through a solid conductor at constant temperature.  The conservation of energy as it pertains to steady state circuits is introduced and expressed through Joule's Law.  They will also discover the properties of simple circuits including series, parallel and combination networks of resistors. Kirchoff's voltage and current rules are used to make predictions about the voltage across, current through, and power dissipated both by individual resistors and the circuit as a whole.", "skills": "Data Analysis\nSystems Thinking\nProblem Solving\nQuantitative Reasoning", "materials": "Students use an iBook (Physics: MacGraw Hill), but all course materials beyond the iBook can be in onCampus for Unit 6, and all units.", "assessments": "Spot Check HW assignments\nUnit 6 Problem Set\nOhm’s Law lab activity\nSimple Circuits lab activity\nPhET DC circuit building activity\nUnit 6 Test"}, {"name": "Unit 7"}, {"name": "Magnetism and Electromagnetic Effects", "timeframe": "About 5-6 weeks (14-16 class meetings)", "concepts": "Students investigate magnetism, magnetic fields, and the source of magnetism in ferromagnetic materials. The parallels between electric charge (Unit 5) and magnetic poles are striking and undeniabe, and they will learn about electromagnetism which links moving charge (Unit 6) and the magnetic fields that form around them.  Lastly, where there are overlapping fields there arises force between the objects producing the fields.  Students learn about magnetic forces and see how the magnetic force on a moving charge due to an external magnetic field is perpendicular to the both vectors.  We will also discover that not only can electricity produce magnetism, but a changing magnetic flux will induce electricity.  We will study Faraday's remarkable law of electromagnetic induction in detail, and Lenz's law too.", "skills": "Data Analysis\nSystems Thinking\nProblem Solving", "materials": "Students use an iBook (Physics: MacGraw Hill), but all course materials beyond the iBook can be in onCampus for Unit 7, and all units.", "assessments": "Spot Check HW assignments\nDiscovering Magnetism activity\nElectromagnetic Lab activity\nFaraday’s Law Lab activity\nLenz’s law activity\nMagnetic Models and Right Hand Rules Quiz"}]}, {"name": "Kindergarten Science", "department": "Science", "teacher": "Amy Helgeson", "grade": "", "length": "", "description": "", "competencies": "Scientific Observation and Documentation - Identifying, describing, and recording physical properties and changes in the natural world through drawings, journals, and basic data collection.\nSystems and Relationships -  Understanding how different parts work together to create a whole, such as the components of a simple machine, the organs of a plant, or the relationship between human activity and the atmosphere.\nCause and Effect Analysis - Predicting and testing how a change in one variable affects an outcome, such as how force affects motion, how heat affects ice, or how light affects plant growth.\nEngineering and Problem Solving -  Applying scientific concepts to design, build, and test physical solutions to challenges, including structural stability, mechanical advantage, and environmental protection.\nTool Proficiency and Safety -  Demonstrating the appropriate and safe use of scientific tools, including thermometers, magnifying glasses, pulleys, and rulers, to gather information.\nEnvironmental and Biological Stewardship - Developing an awareness of the needs of living things and the impact of human choices on the local and global environment.\nScientific Communication -  Using unit-specific vocabulary to explain findings, share predictions, and collaborate with peers during lab investigations.", "units": [{"name": "Unit 1"}, {"name": "Climate Change", "timeframe": "Trimester", "concepts": "Definition of climate change as long-term shifts in weather patterns (temperature, rain, wind).\nThe role of gases and the greenhouse effect in trapping heat.\nImpact of transportation on the atmosphere.\nFossil fuels and the concept of a carbon footprint.", "skills": "Differentiating between weather and climate.\nReading a thermometer.\nIdentifying ways to reduce environmental impact and communicate energy conservation.\nEngineering solutions (building flood-proof or heat-resistant houses).", "materials": "Thermometers\nMagnifying glasses\nCalibrated beakers or clear plastic cups\nTweezers\nPlastic eyedroppers\nRulers\nBalance scales\nSafety goggles\nPulley wheels\nSpring scales\nFlashlights or heat lamps\nTimers or stopwatches\nMicroscopes", "assessments": "Lab Performance (successful construction of a flood-proof house)\nVerbal Participation (oral predictions before an experiment) \nWorksheet \nProject Artifacts"}, {"name": "Unit 2"}, {"name": "Simple Machines", "timeframe": "Trimester", "concepts": "Force and Motion: The definition of \"push\" and \"pull\" and how objects stay at rest unless acted upon.\nMass and Friction: How the weight of an object and the texture of a surface influence speed and ease of movement.\nMechanical Advantage: The function of the six simple machines (lever, inclined plane, wedge, wheel and axle, screw, pulley).\nUnderstanding that simple machines allow us to perform \"work\" (moving an object) with less physical effort by spreading the force over a longer distance or changing the direction of the force.\nCompound Machines: Recognizing how multiple simple machines work together in tools like scissors or bicycles.", "skills": "Technical Identification: Naming and locating simple machines in the classroom and on the playground.\nDescriptive Observation: Using specific vocabulary to describe an object’s position, direction, and speed.\nMeasurement: Using tools like rulers, timers and scales to quantify force and distance.\nProblem Solving: Using simple machines to move objects more efficiently during lab challenges.", "materials": "Pulleys\nRope\nTwine\nRamps\nWooden boards\nBalls of various sizes\nMarbles\nTennis balls\nWheels\nAxles\nWooden spools\nDowels\nScrews\nWedges\nPVC pipes\nCardboard tubes", "assessments": "Lab Performance \nVerbal Participation \nWorksheet \nProject Artifacts"}, {"name": "Unit 3"}, {"name": "Botany", "timeframe": "Trimester", "concepts": "Plant Anatomy: The specific functions of roots, stems, leaves, and flowers.\nPhotosynthesis: The process of using chlorophyll, sunlight, carbon dioxide, and water to produce food and oxygen.\nPlant Reproduction: How plants reproduce to keep the lifecycle going.\nLife Cycles: The stages of growth from germination to a mature flowering plant.\nAdaptation and Dormancy: How plants respond to environmental changes and suspended life processes.", "skills": "Scientific Illustration: Drawing and labeling biological structures with accuracy.\nDissection: Carefully separating plant parts to identify internal functions.\nExperimental Comparison: Observing and sketching differences between taproots and fibrous roots.\nLongitudinal Observation: Monitoring and measuring plant growth over an extended period of time.\nClassification: Categorizing plant parts and identifying if a specimen is a root or a stem.", "materials": "Magnifying glasses\nTweezers\nPlastic eyedroppers\nRulers\nClear plastic cups\nGlass jars\nSafety goggles\nMicroscopes\nSeeds\nSoil\nVegetables", "assessments": "Lab Performance \nVerbal Participation \nWorksheet \nProject Artifacts"}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Psychology", "department": "Science", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\ncritical systems thinking\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 3"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 4"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 5"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 6"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 7"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}];

const DEPT_COLORS = {
  'Math':'#7c3aed','English':'#059669','Science':'#0891b2','History':'#b45309',
  'Computer Science':'#2563eb','Performing Arts':'#db2777',
  'Modern Languages - Spanish':'#65a30d','Modern Languages - French':'#16a34a',
  'Modern Languages - Chinese':'#0d9488','Classics':'#9333ea',
  'Health':'#ea580c','Library':'#0369a1','Beyond Barriers':'#dc2626',
};
function deptColor(d){ return DEPT_COLORS[d]||'#6b7280'; }

let activeDept='All', searchQ='';
const depts=['All',...new Set(COURSES.map(c=>c.department).filter(Boolean).sort())];
const chipsEl=document.getElementById('deptChips');
depts.forEach(d=>{
  const ch=document.createElement('div');
  ch.className='chip'+(d==='All'?' active':'');
  ch.textContent=d; ch.dataset.d=d;
  ch.onclick=()=>{ activeDept=d; document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); ch.classList.add('active'); render(); };
  chipsEl.appendChild(ch);
});

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function matches(c){
  if(activeDept!=='All'&&c.department!==activeDept) return false;
  if(searchQ){
    const h=[c.name,c.teacher,c.description,c.department,...(c.units||[]).map(u=>u.name)].join(' ').toLowerCase();
    if(!h.includes(searchQ)) return false;
  }
  return true;
}

function render(){
  const grid=document.getElementById('grid'),empty=document.getElementById('empty');
  const vis=COURSES.filter(matches);
  document.getElementById('count').textContent=vis.length+' course'+(vis.length!==1?'s':'');
  grid.innerHTML='';
  empty.style.display=vis.length?'none':'block';
  vis.forEach(c=>{
    const el=document.createElement('div'); el.className='card';
    const unitTags=(c.units||[]).slice(0,4).map(u=>'<span class="unit-tag">'+esc(u.name)+'</span>').join('')+
      ((c.units||[]).length>4?'<span class="unit-tag">+'+(c.units.length-4)+' more</span>':'');
    el.innerHTML=
      '<div class="card-dept" style="color:'+deptColor(c.department)+'">'+esc(c.department)+'</div>'+
      '<div class="card-title">'+esc(c.name)+'</div>'+
      '<div class="card-meta">'+
        (c.teacher?'<span>👤 '+esc(c.teacher)+'</span>':'')+
        (c.grade?'<span>📚 '+esc(c.grade)+'</span>':'')+
        (c.length?'<span>⏱ '+esc(c.length)+'</span>':'')+
      '</div>'+
      (c.description?'<div class="card-desc">'+esc(c.description)+'</div>':'')+
      (unitTags?'<div class="card-units">'+unitTags+'</div>':'');
    el.onclick=()=>openModal(c);
    grid.appendChild(el);
  });
}

document.getElementById('search').addEventListener('input',e=>{ searchQ=e.target.value.toLowerCase(); render(); });

function openModal(c){
  document.getElementById('mDept').textContent=c.department||'';
  document.getElementById('mDept').style.color=deptColor(c.department);
  document.getElementById('mTitle').textContent=c.name;
  document.getElementById('mMeta').innerHTML=[
    c.teacher?'👤 '+esc(c.teacher):'',c.grade?'📚 '+esc(c.grade):'',c.length?'⏱ '+esc(c.length):''
  ].filter(Boolean).map(x=>'<span>'+x+'</span>').join('');
  
  const ov=document.getElementById('panelOverview'); ov.innerHTML='';
  if(c.description) ov.innerHTML+='<div class="section"><div class="section-label">Course Description</div><div class="section-content">'+esc(c.description)+'</div></div>';
  if(c.competencies) ov.innerHTML+='<div class="section"><div class="section-label">Key Competencies</div><div class="section-content">'+esc(c.competencies)+'</div></div>';
  if(!c.description&&!c.competencies) ov.innerHTML='<p style="color:var(--text-muted);font-size:.9rem;padding:16px 0">No overview available.</p>';
  
  const un=document.getElementById('panelUnits'); un.innerHTML='';
  if(c.units&&c.units.length){
    c.units.forEach(u=>{
      let h='<div class="unit-name">'+esc(u.name)+'</div>';
      if(u.concepts) h+='<div class="unit-field"><div class="unit-field-label">Key Concepts</div><div class="unit-field-value">'+esc(u.concepts)+'</div></div>';
      if(u.skills)   h+='<div class="unit-field"><div class="unit-field-label">Key Skills</div><div class="unit-field-value">'+esc(u.skills)+'</div></div>';
      if(u.timeframe) h+='<div class="unit-field"><div class="unit-field-label">Timeframe</div><div class="unit-field-value">'+esc(u.timeframe)+'</div></div>';
      if(u.assessments) h+='<div class="unit-field"><div class="unit-field-label">Assessments</div><div class="unit-field-value">'+esc(u.assessments)+'</div></div>';
      if(u.materials) h+='<div class="unit-field"><div class="unit-field-label">Materials</div><div class="unit-field-value">'+esc(u.materials)+'</div></div>';
      const uc=document.createElement('div'); uc.className='unit-card'; uc.innerHTML=h;
      un.appendChild(uc);
    });
  } else { un.innerHTML='<p style="color:var(--text-muted);font-size:.9rem;padding:16px 0">No units documented.</p>'; }
  
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelector('.tab[data-tab="overview"]').classList.add('active');
  document.getElementById('panelOverview').classList.add('active');
  document.getElementById('modalOverlay').classList.add('open');
}

document.getElementById('modalClose').onclick=()=>document.getElementById('modalOverlay').classList.remove('open');
document.getElementById('modalOverlay').onclick=e=>{ if(e.target===e.currentTarget) e.currentTarget.classList.remove('open'); };
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('panel'+t.dataset.tab[0].toUpperCase()+t.dataset.tab.slice(1)).classList.add('active');
});

render();
</script>
</body>
</html>
