l text, poetry, or dramatic narratives\nLearning new, multi-layered score materials independently outside of class using sectional strategies and demo tracks\nCombining instrumental performance with student composition works to build a cohesive production\nCollaborating as a team to organize, promote, and execute a concert connected to a real-world social justice cause", "materials": "Original poetry frameworks and composition software\nInteractive scripts or scores co-created with the composition class\nRepertoire examples: Sing Gently, Bohemian Rhapsody, Girl on Fire, Blowin' in the Wind, or original student works like Join Me", "assessments": "Active, constructive, and highly prepared participation in the 8th-grade musical production rehearsals\nApplication of extended techniques during sectional and full-ensemble checks\nFinal evaluation of the student capstone concert execution and alignment with the chosen social cause\nFinal assessment of overall instrumental growth, rhythmic fluency, and score literacy from semester baselines"}]}, {"name": "", "department": "Performing Arts", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Upper School Ensemble", "department": "Performing Arts", "teacher": "Hannah Hens-Piazza", "grade": "9-12", "length": "", "description": "", "competencies": "Advanced Orchestral Performance: Master complex orchestral and chamber literature across classical, pop, and jazz genres.\nScore Literacy & Rehearsal Technique: Read and analyze full scores for rehearsal purposes while identifying advanced and extended technique markings.\nCritical Cultural Inquiry: Analyze individual and societal assumptions about performance traditions to unpack what classical music is and break cultural stereotypes.\nCommunity Music Advocacy: Actively seek out ways to use performance to connect with others, increase music accessibility, and expand local community horizons.", "units": [{"name": "Unit 1"}, {"name": "Foundations of Ensemble Artistry: Rehearsal Mechanics, Score Literacy, and Collective Voice", "timeframe": "Semester 1", "concepts": "Advanced rehearsal techniques and non-verbal ensemble communication\nReading and analyzing full musical scores for rehearsal preparation and alignment\nAuditory exploration: What do we gain through making music collectively?\nStructural analysis of classical, pop, jazz, and contemporary repertoire\nIdentifying and executing intermediate to advanced extended technique markings within a large ensemble score", "skills": "Navigating initial seating auditions to establish performance benchmarks\nSight-reading complex, unfamiliar orchestral literature fluently in class\nRehearsing assigned musical lines independently at home using provided demo recordings as a baseline\nContributing to deep, text-based class discussions regarding the accessibility of instrumental music", "materials": "Multi-genre orchestral scores spanning classical, pop, and jazz traditions\nDedicated practice platform or OnCampus portal for strategic weekly assignments\nRepertoire examples: Dhyaana (Manjula Ramachandran), Can’t Take My Eyes Off You, Orchid (Yukiko Nishimura), Don’t Know Why, selections from Wicked, etc.", "assessments": "Opening baseline performance audition at the start of the semester\nOngoing, consistent preparedness for full ensemble rehearsals based on targeted music assignments\nDemonstrated skill and growth in score literacy and real-time music reading\nStructured formal and informal teacher feedback paired with recurring student self-assessment entries"}, {"name": "Unit 2"}, {"name": "Cultural Contexts & Public Performance: Breaking Stereotypes and Community Connection", "timeframe": "Semester 2", "concepts": "Cultural forces and biases that historically shape standard understandings of music genres\nDeconstructing traditional performance paradigms to break stereotypes about classical music boundaries\nThe logistical and performance mechanics behind preparing multiple public concert sets across a single academic year\nCommunity music engagement: Using live performance as a bridge to cultivate deep local connections", "skills": "Collaborating smoothly within small, instrument-specific sectional environments to solve technical obstacles\nAdapting playing techniques to match the distinct stylistic demands of global, pop, and traditional repertoire\nAnalyzing live performance dynamics through shared attendance at professional concert events\nDemonstrating individual accountability, collaborative group ethics, and punctuality during final dress rehearsals and staging", "materials": "Advanced repertoire folders and community concert program materials.\nOff-campus professional performance field trip itineraries.\nRepertoire examples: Freedom (Jon Batiste), Adoration (Florence Price), Intermezzo (Samuel Coleridge-Taylor), Scarborough Fair, or music from Black Panther, etc.", "assessments": "Execution and ensemble alignment across a minimum of three distinct public performance showcases throughout the year\nDemonstrated individual technical and artistic progress tracking from the initial semester baseline\nActive, collaborative, and highly focused engagement during instrument-specific sectional blocks\nReflective evaluation of live concert experiences using a customized musical critical lens"}]}, {"name": "", "department": "Performing Arts", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Class V Music Composition", "department": "Performing Arts", "teacher": "Salomon Lerner", "grade": "", "length": "", "description": "", "competencies": "Intercultural Connection: Explored through the historical study of diverse musical genres (Opera, Musical Theater, Modern Pop).\nSense of Self and Place: Developed by students telling their own stories through original musical compositions.\nCritical Systems Thinking: Understanding how music, lyrics, instrumentation, and stage design interact to create a cohesive theatrical production.\nAdaptability to Change: Embracing the collaborative rehearsal process and making live adjustments/revisions based on feedback.\nAction towards a Better Future: Sharing creative works with the broader school community (4th and 5th-grade peers, parents) to foster connection.", "units": [{"name": "Unit 1"}, {"name": "Introduction to Digital Notation & Melodic Baselines", "timeframe": "3–4 Weeks", "concepts": "Students investigate how digital notation software represents fundamental concepts such as pitch, rhythm, and structural architecture. Key focuses include an introduction to the C Major Scale and the exploration of diverse vocal registers.", "skills": "Learning digital music notation using software.", "materials": "Noteflight platform, YouTube instructional/vocal videos, Chromebooks or iPads, and MIDI controllers (keyboards)", "assessments": "Performance/Completion of a fully transcribed \"Mary Had a Little Lamb\" score on Noteflight."}, {"name": "Unit 2"}, {"name": "The Motif & Musical Building Blocks", "timeframe": "4 Weeks", "concepts": "Defining a motif (a short melodic phrase) and a leitmotif (a theme tied to a specific character or idea). Understanding how music helps drive storytelling.", "skills": "Identifying motifs in known melodies; creating a \"sequence\" or modifying a motif to extend a melody; creating an original motif for a specific character.", "materials": "Excerpts from Beethoven’s 5th Symphony, Hamilton, and \"Lean On Me\".", "assessments": "Evaluation of an original, character-specific motif composed on Noteflight."}, {"name": "Unit 3"}, {"name": "Dramatic Structure – Recitative vs. Aria", "timeframe": "4–5 Weeks", "concepts": "Understanding storytelling through Opera. Exploring the functional difference between Recitative (plot-driving, speech-like singing) and Aria (emotional, melodic reflection).", "skills": "Differentiating vocal styles; collaborating in teams to write a short narrative scene using music.", "materials": "Mozart’s The Magic Flute, Humperdinck’s Hansel and Gretel, YouTube performance videos.", "assessments": "Team Project: Composition and in-class presentation of a short, original Aria paired with a short Recitative."}, {"name": "Unit 4"}, {"name": "Harmonics & Structural Accompaniment", "timeframe": "3 Weeks", "concepts": "Accompaniment theory; how chords, baseline harmonies, and secondary tracks support and enrich a primary melody.", "skills": "Adding harmonic accompaniment to a previously created Motif, Aria, or Recitative within notation software.", "materials": "Noteflight, various teacher-provided chord progression templates.", "assessments": "Submission of an upgraded score featuring a clear accompaniment layer."}, {"name": "Unit 5"}, {"name": "Writing and Structuring the Mini-Opera", "timeframe": "4-6 Weeks", "concepts": "Merging all previous skills to tell a complete story through music. Integrating stage directions directly into a musical score.", "skills": "Writing an opera using free source material (individually or in small groups); finalising complex digital notation scores.", "materials": "Chromebooks or iPads, Noteflight, keyboards", "assessments": "Finalised, performance-ready score on Noteflight including all notes, harmonies, lyrics, and stage directions."}, {"name": "Unit 6"}, {"name": "The Rehearsal & Performance Process", "timeframe": "3–4 Weeks", "concepts": "The logistics of live performance; translating digital scores into physical space; managing stage directions and live ensemble work.", "skills": "Classroom rehearsing; receiving constructive critique; executing live adjustments based on rehearsal challenges.", "materials": "Noteflight scores, Classroom and Black Box theater space, basic staging props.", "assessments": "Live production/presentation of the mini-operas in the Black Box theater for 5th-grade peers and parents."}, {"name": "Unit 7"}, {"name": "Critique, Revision, and Peer Mentorship", "timeframe": "2–3 Weeks", "concepts": "The iterative artistic process; understanding what elements of a composition successfully translate to an audience; music's role in dramatic storytelling.", "skills": "Reflective self-assessment (\"What worked?\"); implementing targeted musical revisions; performing within the classroom and giving peer-to-peer feedback.", "materials": "Video recordings of the Black Box performance, updated Noteflight scores.", "assessments": "Peer feedback session and final revised score upload."}, {"name": "Unit 8"}, {"name": "Small Team Minimalist Opera", "timeframe": "3–4 Weeks", "concepts": "Understanding the power of minimalist theater; how to convey tension, setting, and emotion strictly through vocal delivery, lyrics, and musical accompaniment without visual aids; the dynamics of writing and collaborating in independent small ensembles.", "skills": "Co-authoring a narrative score in small teams; composing music that compensates for a lack of visual props or costumes; performing live within a classroom setting; providing peer-to-peer critique.", "materials": "Noteflight platform, classroom instruments/vocal scores, audio recordings of minimalist or radio-drama style musical works.", "assessments": "In-class workshop performance of an original short opera, relying entirely on words and music to communicate the story."}]}, {"name": "Class VI Music Composition", "department": "Performing Arts", "teacher": "Salomon Lerner", "grade": "", "length": "", "description": "", "competencies": "Intercultural Connection: Cultivated through analyzing the global history and structural evolution of popular music, from mid-century classics to contemporary chart-toppers.\nSense of Self and Place: Developed as students collaborate to choose meaningful class themes, write personal lyrics, and compile a shared Class Mixtape.\nCritical Systems Thinking: Practiced by synthesizing audio tracking, video editing, roles in a production crew, and musical arrangement into a unified music video.\nAdaptability to Change: Built through the technical troubleshooting inherent to working with DAWs and video software, alongside collaborative compromises in production teams.\nAction towards a Better Future: Realized by creating and presenting culturally relevant media artifacts that are shared with the wider community at the Spring Concert.", "units": [{"name": "Unit 1"}, {"name": "Introduction to the DAW (Soundtrap) & MIDI Recording", "timeframe": "3 weeks", "concepts": "Introduction to Digital Audio Workstations (DAWs); understanding MIDI data versus audio tracks; translating foundational music skills into a digital recording platform.", "skills": "Navigating a DAW interface; recording and editing MIDI tracks.", "materials": "Soundtrap platform, instructional YouTube videos.", "assessments": "Completion of a \"Mary Had a Little Lamb\" MIDI recording project in Soundtrap."}, {"name": "Unit 2"}, {"name": "The Harmonic Blueprint – Pop Chords & Progressions", "timeframe": "4 weeks", "concepts": "The foundational harmonic framework of modern popular music; exploring the 4 common chords (C, G, F, and A minor); identifying historic chord progressions (such as the 1950s progression).", "skills": "Navigating and testing different chord structures; harmonizing an existing melody; identifying recurring progressions by ear.", "materials": "\"La Bamba,\" \"Deja Vu\" (Olivia Rodrigo), \"Monster Mash,\" and the instructional resource \"I Just Need To Find The Chords.\"", "assessments": "Practical assignment where students successfully add a 4-chord harmonic layer to their previous \"Mary Had a Little Lamb\" project."}, {"name": "Unit 3"}, {"name": "Song Form & Structural Analysis", "timeframe": "4 weeks", "concepts": "The anatomy of a commercial song; identifying and understanding the purpose of standard song sections: Introduction, Verse, Chorus, Bridge, and Outro.", "skills": "Listening to diverse tracks while physically tapping the beat; analyzing and mapping the exact blueprint/sections of standard pop songs.", "materials": "Selected Spotify playlists, varied pop song examples.", "assessments": "Structural analysis quiz/listening map of a selected pop song tracking its specific sections."}, {"name": "Unit 4"}, {"name": "Lyrics, Melodies, and Hooks", "timeframe": "5 weeks", "concepts": "How words and melodies interact; creating a memorable \"hook\"; the art of writing contrasting song sections.", "skills": "Composing a distinct Chorus; writing a structural Verse melody; writing completely new, alternative lyrics over an established verse melody to see how phrasing changes the mood.", "materials": "Soundtrap, digital collaborative lyric sheets.", "assessments": "Submission of a mini-song demo containing at least one verse and one chorus with original lyrics and melodies."}, {"name": "Unit 5"}, {"name": "Whole-Class Songwriting & Pre-Production", "timeframe": "4 weeks", "concepts": "Group creative dynamics; settling on a single, unified artistic vision; establishing a central theme, hook, chorus, verse, and bridge as a collective ensemble.", "skills": "Negotiating artistic choices in a large group; aligning individual tracking contributions to fit a macro class project.", "materials": "Soundtrap, class voting tools, centralized recording sessions.", "assessments": "Final mixdown of the fully composed and arranged Class Mixtape track."}, {"name": "Unit 6"}, {"name": "Video Production & Editing (based on Song structure)", "timeframe": "5 weeks", "concepts": "The history and cultural impact of music videos; translating auditory art into visual narratives; assigning production crew roles (filming, acting, directing, editing); creating credits.", "skills": "Storyboarding/writing a visual storyline tailored to each specific song section; filming footage; video editing using WeVideo software.", "materials": "WeVideo editing software, video cameras/tablets, historical music video examples.", "assessments": "Completion of the official Class Pop Song Music Video."}, {"name": "Unit 7"}, {"name": "Presentation & Community Exhibition", "timeframe": "2 Weeks", "concepts": "Final audio/video edits.\nPreparing art for public distribution; writing a speech to introduce a media presentation; understanding the artist-audience relationship.", "skills": "Public speaking; writing clear video introduction scripts; sharing digital media across platforms outside the classroom.", "materials": "Auditorium projection equipment, written introduction speeches.", "assessments": "Public presentation of the finalized pop music videos at the school's Spring Concert."}, {"name": "Unit 8"}, {"name": "Cover Song Reimagining", "timeframe": "4 weeks", "concepts": "Interpretation vs. imitation; how to take existing source material and modify its instrumentation, tempo, or style to make it unique; small-group ensemble dynamics.", "skills": "Arranging music collaboratively in tiny groups or working independently; choosing a track from a shared playlist; executing a complete recording project from scratch using Soundtrap.", "materials": "Selected Spotify reference playlists, Soundtrap audio software.", "assessments": "Small group or individual submission of a fully completed Cover Song track, shared and reviewed during an in-class listening party."}]}, {"name": "", "department": "Performing Arts", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Class III Music", "department": "Performing Arts", "teacher": "Samantha Spiridellis", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nintercultural connection\nsense of self and place\nadaptability to change\naction towards a better future", "units": [{"name": "Unit 1"}, {"name": "Sixteenth Notes", "timeframe": "12 Weeks", "concepts": "Hearing, reading, identifying, writing, playing sixteenth notes", "skills": "Reading with notation, playing on xylophones, listening in songs to when it arrives.", "materials": "Songs and song-games → Tideo, Diddle Diddle Dumpling, Chimpoy Champoy", "assessments": "Poison-pattern game, four-corners, writing, tracing, composing, singing in two-parts"}, {"name": "Unit 2"}, {"name": "High Do", "timeframe": "8 weeks", "concepts": "Hearing, reading, identifying, writing, playing High Do", "skills": "Reading with notation, playing on xylophones, listening in songs to when it arrives.", "materials": "Songs and song-games → Tideo, G Then Go Down, I Don’t Care if the Rain Comes Down", "assessments": "Poison-pattern game, four-corners, writing, tracing, composing, singing in two-parts"}, {"name": "Low La - Minor modes", "timeframe": "6 weeks", "concepts": "Hearing, reading, identifying, writing, playing low La", "skills": "Reading on notation, playing on xylophones, playing on ringing instruments, playing on metallophones and glockenspiels, listening in songs to when it arrives, movement that companies the rhythms.", "materials": "Songs and song-games → Little Johnny Brown, Draw Me Bucket of Water", "assessments": "Poison-pattern game, four-corners, writing, tracing, composing, playing instruments with different rhythms."}, {"name": "Triple Meter", "timeframe": "4-5 weeks", "concepts": "Hearing, reading, identifying, writing, playing Triple Meter", "skills": "Reading on notation, playing on xylophones, playing on ringing instruments, playing on metallophones and glockenspiels, listening in songs to when it arrives, movement that companies the rhythms.", "materials": "Songs and song-games, reading on slides → Fish & Chips & Vinegar", "assessments": "Poison-pattern game, four-corners, writing, tracing, composing, playing instruments with different rhythms, singing in canon with instruments."}]}, {"name": "Kindergarten Music", "department": "Performing Arts", "teacher": "Samanth Spiridellis, Mary Beth Alexander", "grade": "", "length": "", "description": "", "competencies": "Playing in an ensemble\nMusical opposites\nIncreased sense of self", "units": [{"name": "Unit 1"}, {"name": "Speaking/Singing Voice", "timeframe": "3 weeks", "concepts": "Differentiating between speaking and singing voices", "skills": "Skills of using singing vs. speaking voice will be taught", "materials": "Songs - Yoohoo Munchkin, Tres Pajaritos (singing and echoing)\nChants - Bakery Shop\nGames - Good Queen Ms. Spiridellis", "assessments": "On a scale from 1-4, students sing/speak and we assess their differentiation and pitch matching."}, {"name": "Unit 2"}, {"name": "Fast/Slow", "timeframe": "Four weeks", "concepts": "Musical Opposite of Fast vs. Slow", "skills": "Listening, playing, singing, speaking in a fast vs. slow voice", "materials": "Songs - We’re Floating Down the River, \nChants - Che Che Kule, Humpty Dumpty, A Lion Has a Tail\nTales - Tortoise and Hare,", "assessments": "Leading game activities, individuals coming to the board to “click and drag” the objects into the proper musical opposites area"}, {"name": "Unit 3"}, {"name": "Loud/Quiet", "timeframe": "6 weeks (including Winter Concert Prep)", "concepts": "Differentiating between Loud/Quiet music making while singing, listening, and instrument playing.", "skills": "Skills of differentiating loud/quiet sounds will be taught.", "materials": "Songs - Loud/Quiet - Sesame Street, Loud/Quiet - Bjork, Now It’s Time to Go To Sleep\nClick and Drag Objects into proper musical opposite window", "assessments": "On a scale from 1-4, we assess students accuracy in differentiating loud/quiet, and recognize this while engaging in instrument play."}, {"name": "Unit 4"}, {"name": "High/Low", "timeframe": "4 weeks", "concepts": "Differentiating between high and low sounds", "skills": "Skills singing and hearing high/low music opposites will be taught", "materials": "Songs - My Little Rooster, Sing High/Sing Low, \nChants - Where are You Going Big Pig Big Pig, \nGames -Circle ‘Round the Zero\nInstrument → Learning about the piano", "assessments": "On a scale from 1-4, students are assessed their differentiation of high and low pitch identification. They play high/low sounds and are able to do “click and drag” activities on the board with musical opposites."}, {"name": "Unit 5"}, {"name": "Long/Short", "timeframe": "4 weeks", "concepts": "Differentiating between long and short sounds", "skills": "Skills of playing and identifying long and short sounds will be acquired.", "materials": "Songs - Hush, hush, hush, \nVideo - Long/Short Sounds Video\nChants - \nGames - Be a Little Snowflake and Fall to the Ground\nMusic Ideas - following sound contortions based on shapes\nRecorded Music - Humoresque, Dance of the Sugar Plum Fairy", "assessments": "On a scale from 1-4, students sing/speak and we assess their differentiation and pitch matching."}, {"name": "Unit 6"}, {"name": "Up and Down", "timeframe": "3 weeks", "concepts": "Differentiating between pitches going up and down", "skills": "Skills of identifying and differentiation pitches ascending and descending will be taught", "materials": "Songs - Elevator, Who Fed the Chickens, Bella Bimba\nChants - Hickory, Dickory Dock\nGames - Snake movement game\nInstrument Unit - String Instruments (includes recorded music and videos)", "assessments": "On a scale from 1-4, students sing/speak and we assess their differentiation and pitch matching."}, {"name": "Unit 7"}, {"name": "Two sounds vs One sounds + Call&Response", "timeframe": "6 weeks", "concepts": "Differentiating between two sounds/one sound syllables", "skills": "Skills of pre-literacy of quarter and eighth notes that are experiences and learned in Class 1 will be taught.", "materials": "Songs - Spring is in the air, the Birdie Flies Away and then Comes Back Home, John the Rabbit, Grandparents Day Song\nChants - Here is the Beehive, Where are the Bees? Pease/Carrots, Onion/Squash\nGames - Birthday song, Que Llueva\nRecorded Music - Carnival of the Animals, Moving like water elements", "assessments": "On a scale from 1-4, students sing/speak and we assess their differentiation and pitch matching."}]}, {"name": "", "department": "Performing Arts", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "", "department": "Performing Arts", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Upper School Dance Elective", "department": "Performing Arts", "teacher": "Allison Trotta", "grade": "11, 10, 9", "length": "Students move in and out throughout the year", "description": "", "competencies": "Key Competencies\nThe course assesses four primary areas of growth:\nKinesthetic Proficiency: Understanding anatomical alignment and core stability.\nPhysical Literacy/Technique: Mastering genre-specific movements.\nKinesiological Awareness: Applying body mechanics for safe and efficient movement.\nPhysical Articulation: The ability to execute movement with varying dynamics.", "units": [{"name": "Unit 1"}, {"name": "Momentum and Weightedness", "timeframe": "Two weeks", "concepts": "Exploring gravity as a \"partner\" rather than an opponent.\nUnderstanding how the body moves to prevent injury and build strength", "skills": "Finding the Floor (Release Technique)\nProper turnout vs. parallel, core engagement, and the skeletal system.", "materials": "Students practice floor-to-standing transitions using momentum instead of muscular \"grip\". \nDynamic vs. static stretching, basic kinesiology (joint function), posture, weight distribution, and breath.", "assessments": "Identifying specific muscle groups that must relax to facilitate a smooth floor roll."}, {"name": "Unit 2"}, {"name": "The Architecture of the Core", "timeframe": "Two Weeks", "concepts": "The \"Contract and Release\" principle (Graham-based) and its significance in modern dance. \nBody, Action, Space, Time, and Energy", "skills": "Pliés and tendus synchronized with breath.\nSpace: Levels (high/low), pathways (zigzag/curved), and planes.\nTime: Tempo, rhythm, and syncopation\nEnergy: Bound vs. free flow; sharp vs. fluid movements", "materials": "", "assessments": "Reflection on how focusing on the exhale impacts physical balance."}]}, {"name": "Kindergarten Dance", "department": "Performing Arts", "teacher": "Bria Tyner", "grade": "", "length": "", "description": "", "competencies": "Creating: Explore and create movement through improvisation using music, props, themes, emotions, and other creative stimuli.\nPerforming/Presenting/Producing: Demonstrate dance skills by using body shapes, movement qualities, spatial awareness, locomotor and non-locomotor movements, and performance expectations.\nResponding: Observe, describe, and recall movements using simple dance vocabulary while recognizing patterns and styles from diverse dance genres.\nConnecting: Connect dance to personal experiences, emotions, visual art, and collaboration by expressing ideas and reflecting on movement experiences.\nSense of self and place: Moving safely in general space while maintaining personal space.\nIntercultural connection: Describing and demonstrating movements from diverse dance genres and world cultures.\nCritical systems thinking: Identifying repeating movements and production elements like the roles of dancer versus choreographer.\nAdaptability to change: Applying suggestions for changing movement and \nimprovising in response to different environments or themes.\nAction towards a better future: Working with others in formations and dancing for others with appropriate performance expectations.", "units": [{"name": "Unit 1"}, {"name": "Introduction to Dance & Foundations\n     -Introduction to Dance, Shapes, and Pathways.", "timeframe": "4 weeks", "concepts": "Understanding what dance is and its benefits.\nSafety guidelines and personal vs. general space.\nBody shapes (lines, levels, size) and spatial pathways (zigzag, curved, straight).", "skills": "Moving safely and stopping on cue.\nCreating shapes at high, middle, and low levels.\nWalking, jumping, and twisting within personal space.", "materials": "Drawing materials for depicting movement; music stimuli.", "assessments": "Observations of \"move and freeze\" activities; student drawings of favorite movements."}, {"name": "Unit 2"}, {"name": "Expression and Storytelling\n      -Tempo, Qualities, and Movement Stories.", "timeframe": "4 weeks", "concepts": "Contrast in tempo (fast/slow) and movement qualities (light/heavy, smooth/shaky).  \nExpressing emotions and feelings through movement.  \nThe roles of dancer and choreographer.", "skills": "Improvising a dance with a clear beginning, middle, and end.\nUsing props (scarves, bean bags) to change movement mood.\nIdentifying repeating movements (patterns).", "materials": "Scarves, bean bags, and short video clips for emotional prompts.", "assessments": "Planning and performing a short movement story (e.g., \"A Butterfly's Journey\")."}, {"name": "Unit 3"}, {"name": "Connections and Group Dynamics\n     -Moving Through Art and Group Awareness.", "timeframe": "4 weeks", "concepts": "Connecting dance to visual art (lines, shapes, and colors in paintings).\nSpatial relationships (over, under, around, through).\nGroup formations and ensemble work.", "skills": "Moving like shapes or lines seen in artwork.\nWorking with others to create and change circle formations.\nMastering locomotor skills: skipping, galloping, and sliding.", "materials": "Paintings or sculptures; obstacle courses or partners for spatial practice.", "assessments": "Group formation exercises; teacher/peer questioning regarding movement choices."}, {"name": "Unit 4"}, {"name": "Global Styles and Dance Pioneers\n    - Culture and Pioneers", "timeframe": "4 weeks", "concepts": "Diverse genres (Irish, African, Ballet, Hip Hop).\nIntroduce basic skills surrounding (Ballet, Modern, Hip-Hop)\nModern dance pioneers: Martha Graham (emotion/drama) and Alvin Ailey (joy/culture)", "skills": "Exploring \"contract and release\" and \"strong arm gestures\".\nSelecting and explaining prominent movements from a dance work.", "materials": "Video clips of world dances, Graham’s Lamentation, and Ailey’s Revelations.", "assessments": "Performance of pioneer-inspired short dances; peer observation and constructive feedback."}, {"name": "Unit 5"}, {"name": "Rhythmic Patterns & Math Connections\n  -Math in Motion: Numbers, Shapes, and Beats", "timeframe": "4 weeks", "concepts": "Counting Beats: Understanding 4/4 time and simple rhythmic patterns.\nGeometric Formations: Creating squares, triangles, and lines with the body and the group.\nPatterns (AB, ABA): Connecting dance to mathematical sequencing.", "skills": "Clapping and stepping to a steady beat.\nSymmetrical vs. Asymmetrical shapes.\nMemorizing a 4-part movement pattern.", "materials": "Percussion instruments, floor tape for shapes, and varied rhythmic music.", "assessments": "\"Pattern Challenge\"—students create and perform a repeating 8-count phrase for a peer."}, {"name": "Unit 6"}, {"name": "Character & Community\n     -Characters, Costumes, and Cultural Stories", "timeframe": "4 weeks", "concepts": "Learning a traditional folk dance (e.g., Maypole or Mexican Hat Dance).\nHow a \"costume\" (real or imaginary) changes how we move.\nUnderstanding that every dancer is vital to the \"whole\" (Critical systems thinking).", "skills": "Moving in unison with a large group.\nExpressing a specific character trait (bravery, curiosity) through posture.", "materials": "Basic props (hats, capes), storybooks, and folk music recordings.", "assessments": "Performance of a folk-inspired group dance; verbal reflection on why specific characters move certain ways."}, {"name": "Unit 7"}, {"name": "The Dancing Environment (Spring Kick-off)\n     -Nature in Motion & Environmental Awareness", "timeframe": "4 weeks", "concepts": "How animals, weather, and plants move.\nExploring life cycles (seed to flower) through movement.\nMoving \"with\" the earth (Sense of self and place).", "skills": "Using weight to show \"growth\" (levels) and \"weather\" (movement qualities like heavy rain or light breeze).\nSustained vs. sudden movement (staccato and legato) inspired by nature.", "materials": "Nature sounds, scarves (for wind/water), and botanical images.", "assessments": "Creation of a \"Growth Sequence\" showing a seed becoming a tree; observation of level changes."}, {"name": "Unit 8"}, {"name": "The Choreographer’s Toolbox\n      -Making My Own Dance.", "timeframe": "4 weeks", "concepts": "The Creative Process: Understanding the steps from an initial idea to a finished performance.\nStage Directions: Learning \"Downstage, Upstage, Stage Left, and Stage Right\".\nPerformance Etiquette: Developing focus and discipline while performing for an audience (Action towards a better future).", "skills": "Selecting specific movements to represent a chosen theme or feeling.\nOrganizing movements into a clear \"Beginning, Middle, and End\".\nWorking in small groups to agree on a sequence of shapes and movements.", "materials": "Student-selected music tracks.\nSimple stage props (markers for stage directions, costumes).\nA \"Choreography Journal\" (a place to draw their movement ideas).", "assessments": "Students perform a 30-second original dance in small groups. \nThe \"Star and Wish\" Review: Peers offer one positive observation (\"Star\") and one suggestion for change (\"Wish\") to their fellow choreographers (Adaptability to change)."}, {"name": "Unit 9"}, {"name": "Semester Review and Synthesis\n-K-Dance Review of Semester.", "timeframe": "4 weeks", "concepts": "Synthesizing all learned elements: space, shapes, tempo, emotion, and cultural styles.\nSelf-reflection on growth throughout the semester.", "skills": "Recalling favorite movements and concepts from the entire semester.\nDemonstrating a range of locomotor and non-locomotor skills with confidence.", "materials": "Compilation of materials used throughout the semester.", "assessments": "Completion of \"What I Learned in Dance\" drawing or reflection."}]}, {"name": "Class I-Tap Dance", "department": "Performing Arts", "teacher": "Bria Tyner", "grade": "", "length": "", "description": "", "competencies": "Creating: Exploring movement elements, arranging choreography, improvising phrases, and utilizing revision and documentation.\nPerforming: Developing locomotor and non-locomotor control, building tempo awareness, executing physical formations, and demonstrating safe performance etiquette.\nResponding: Recognizing patterns, analyzing how movements convey ideas/emotions, and interpreting cultural context.\nConnecting: Linking dance to text, personal experiences, and diverse global movement traditions.", "units": [{"name": "Unit 1"}, {"name": "Foundations of Rhythm & Spatial Awareness", "timeframe": "8-9 weeks", "concepts": "Introduction to the Space: Understanding the mechanics of tap shoes, studio safety expectations, and the distinct roles of the dancer, choreographer, and composer.\nThe Steady Beat: Developing an internal metronome by identifying, echoing, and matching movement to an external pulse.\nNavigating Space: Discovering how the body builds shapes, alters levels/facings, moves along specific architectural pathways (straight, curved, zigzag), and shifts across stage directions (stage right/left, upstage/downstage).", "skills": "Basic Tap Mechanics: Finding balance and executing clear toe taps and heel drops.\nTempo Shifting: Recognizing variations in musical speeds and successfully adjusting physical movements between slow, moderate, and quick tempos.\nSpatial Control: Moving safely through general space while strictly maintaining personal space boundaries and cooperating to form collective shapes like circles and straight lines.\nEcho and Response: Listening to acoustic audio cues in the room and accurately replicating rhythm patterns back through the feet.", "materials": "Tap shoes", "assessments": "Formative Milestones: Active participation in safety/sizing circles, \"Echo Tap\" challenges, and the \"Tempo Tap Game\".\nPerformance Task: The \"Pathway Parade\"—a practical navigation check where students maintain personal space while tap-stepping through designated zigzag, curved, and straight courses.\nSummative Evaluation: A small-group floor test demonstrating the correct orientation of stage right, stage left, upstage, and downstage while executing baseline step changes."}, {"name": "Unit 2"}, {"name": "Tap Vocabulary & Choreographic Patterns", "timeframe": "8-9 weeks", "concepts": "Expanded Vocabulary: Moving from isolated steps to connected percussive patterns (e.g., combining steps into shuffles).\nStructural Repetition: Recognizing how repeating movements form patterns in dance, and understanding the basic anatomy of an A-B-A choreographic structure.\nImprovisational Basics: Using personal movement choices to construct a spontaneous dance phrase that contains an explicit beginning, middle, and end.", "skills": "Locomotor & Non-Locomotor Integration: Fluidly blending stationary steps (swings, twists, stretches) with traveling movements (gallops, skips, shuffles).\nPattern Building: Recognizing visual and structural loops in choreography and using them to memorize short sequences.\nStructural Improvisation: Dancing freely inside a structured time limit (e.g., an 8-count circle phrase) while honoring a clear start and finish position.\nMovement Transcription: Documenting a short, self-created movement sequence on paper using simple personalized symbols, drawings, or multimedia logs.", "materials": "Tap shoes\nArt supplies\nClassroom rhythm instruments (e.g., rhythm sticks) to emphasize choreographic beats\nCreative \"Sound Map\" drawing sheets and markers", "assessments": "Choreographic Challenge: \"Tap Pattern Repeat\"—students design and demonstrate a 3-part rhythmic phrase using repeating loops.\nPortfolio Documentation: Completion of a personalized \"Sound Map\" where students accurately draw and verbally describe their own short step sequence.\nMid-Year Practical: The \"Class Pattern Dance\"—a collaborative group benchmark requiring the accurate recall and execution of an A-B-A structured routine"}, {"name": "Unit 3"}, {"name": "Expressive Storytelling & Global Traditions", "timeframe": "8-9 weeks", "concepts": "Dynamic Qualities: Translating descriptive adjectives and adverbs (e.g., light, sharp, heavy, sneaky) directly into physical movement texture.\nLiterary Springboards: Exploring how illustrations and storylines from children's literature can inspire thematic movement phrases and character development.\nCross-Cultural Percussive Dance: Viewing, performing, and respecting percussive step traditions from different global cultures (e.g., African gumboot dance, Irish step dance) and identifying how they contrast with American tap.", "skills": "Emotional Literacy: Identifying specific emotions portrayed in a dance work and analyzing the physical mechanisms used to communicate those feelings.\nNarrative Interpretation: Reading a picture book as a class and physically translating its main plot points into a cohesive narrative dance sequence.\nComparative Movement: Identifying and trying out 1–2 foundational steps from another culture, evaluating what characteristics make those sounds and movements unique.", "materials": "Core Text: Rap A Tap Tap — Here's Bojangles: Think of That by Leo and Diane Dillon (or similar rhythm-focused children's literature).\nMedia Archives: Video recordings showcasing global percussive cultural dance works.\nExpressive Cards: Word-association cards featuring descriptive movement prompts (e.g., \"wavy fall,\" \"narrow spin\").", "assessments": "Improvisation Task: The \"Adjective Freeze Dance\"—students alter their tap style dynamically based on sudden verbalized adjectives and adverbs.\nCross-Cultural Review: A guided group discussion and matching activity where students compare acoustic sounds and physical shapes from different global percussive styles.\nPerformance Task: The \"Storybook Sequence\"—a group ensemble presentation that physically acts out the beginning, middle, and end of the class narrative text."}, {"name": "Unit 4"}, {"name": "Production, Refinement, & Showcase (Spring Concert Prep)", "timeframe": "April-June", "concepts": "The Production Toolkit: Discovering how physical props (scarves, sticks) and musical selections support and elevate a live stage performance.\nThe Revision Cycle: Understanding that choreography is an evolving process that grows through constructive critique, collaborative trial, and editing.\nPerformance Etiquette: Mastering the behavioral expectations of a performer (focus, silence, spatial awareness) and an audience member (attentive listening, supportive applause).", "skills": "Prop Manipulation: Successfully manipulating simple performance props while maintaining consistent footwork, balance, and rhythm.\nConstructive Critique: Participating in peer feedback loops by observing a classmate's phrase and offering precisely \"one positive and one helpful suggestion\".\nChoreographic Editing: Applying feedback from teachers and peers to deliberately revise, clean, and finalize short movement phrases.\nEnsemble Recall: Remembering long-form spatial formations and physical cues for formal and informal group showings.", "materials": "Performance props: Dance scarves and wooden rhythm sticks\nCostume elements or simple uniform pieces to simulate performance readiness\nCompleted student portfolios and materials for final reflection logs", "assessments": "Choreographic Editing Review: Evaluation of a student's ability to adapt a routine following a peer-circle feedback session.\nThe Culminating Showcase: An informal classroom performance shared with peers or parents, graded on focus, spatial awareness, recall, and adherence to performance etiquette.\nFinal Reflection Portfolio: Completion of a comprehensive \"Tap Portfolio\" page consisting of a detailed drawing, a technical vocabulary word, and a written or dictated reflection on their growth across the entire year."}]}, {"name": "Class VI-Intro to Choreography", "department": "Performing Arts", "teacher": "Bria Tyner", "grade": "", "length": "", "description": "", "competencies": "Creating: Selecting diverse stimuli to generate choreography, deploying deliberate structures and devices, integrating feedback to revise phrases, and inventing documentation methods.\nPerforming/Presenting/Producing: Mastering spatial awareness and anatomical alignment, adjusting bodily tensions for dynamic expression, troubleshooting complex ensemble formations, and maintaining performance etiquette.\nResponding: Deconstructing choreography through technical terminology, identifying recurring structural motifs, and critiquing design elements in live or recorded contexts.\nConnecting: Translating personal experiences, literary themes, and social topics into performance while exploring how movement communicates historical or community purpose.", "units": [{"name": "Unit 1"}, {"name": "Foundations of Dance Composition & Spatial Formations", "timeframe": "Weeks 1–7 (approx. 7–8 Sessions)", "concepts": "Defining Choreography: Defining what dance composition is, evaluating what elements constitute dance, and enforcing studio safety parameters.\nThe Choreographic Elements: Exploring Time (slow vs. fast), Space (pathways, directions), and Energy (sharp, smooth, heavy qualities).\nSpatial Design: Manipulating body shapes, level changes (high, mid, low), and facings to communicate clear conceptual intent.\nChoreographic Architecture: Utilizing basic formal structures, such as the A-B-A compositional layout, and experimenting with primary devices like canon, repetition, and retrograde.", "skills": "Dynamic Modulation: Modulating muscular tension and movement speeds fluidly to vary dynamic textures during across-the-floor phrases.\nSpatial Tracking: Estimating interpersonal distance to successfully navigate curved, straight, and zigzag pathways alongside peers without breaking personal boundaries.\nStructural Arrangement: Designing and memorizing short movement motifs that adhere to a specific A-B-A format.\nAcoustic Adaptation: Executing unprompted movement variations in direct response to environmental sounds and ambient room noise.", "materials": "Selected video excerpts showcasing diverse choreographic styles and structures.\nLevel markers or target props to establish height planes and spatial directions.\nSound system", "assessments": "Formative Tracking: Direct participation in \"Sound Walks,\" pathway exercises, and the \"Body Statue Museum\" challenge.\nPerformance Task: The \"Follow the Form\" challenge, requiring partners to cooperatively generate and recall a three-movement A-B-A phrase.\nSummative Benchmark: Practical demonstration of an original 8-count movement sequence featuring distinct changes in height, facial direction, and dynamic energy."}, {"name": "Unit 2"}, {"name": "Expressive Translation, Literacy, & Social Commentary", "timeframe": "Weeks 8–14 (approx. 7–8 Sessions)", "concepts": "Dynamic Expression: Translating abstract inner emotions, moods, and intentions into readable physical movements.\nLiterary Metaphor: Drawing directly upon poetry, vocabulary adjectives, and text illustrations to discover thematic choreographic springboards.\nMovement Journaling: Introducing notation and sketching as tools to track creative growth, preserve personal histories, and transcribe movement.\nSocial Commentary: Using research on a chosen social issue (e.g., climate change, kindness, equality) to choreograph a meaningful, point-of-view-driven piece.\nEnsemble Collaboration: Navigating the creative challenges of shared group decision-making, pattern construction, and structural manipulation (e.g., a duet contrasted against a group).", "skills": "Thematic Improvisation: Executing spontaneous, structurally focused solos based on randomized emotional or narrative prompt cards.\nChoreographic Editing: Applying the 16 Ways to Manipulate a Motif framework to systematically expand and transform a basic movement sequence.\nChoreographic Notation: Transcribing original steps into a personal journal using custom symbols, descriptions, and structural sketches.\nConsensus Problem-Solving: Working collaboratively within small trios or quartets to build a themed dance phrase, resolving spatial conflicts through shared group consensus.", "materials": "Selected short poems, children's literature texts, and conceptual imagery files.\n\"Emotion Cards\" and text prompt sheets.\nDedicated student movement journals and sketching supplies.\nResearch materials or briefs detailing age-appropriate global social issues.", "assessments": "Creative Writing & Notation: Evaluation of the student’s movement journal entries, tracking how accurately their sketches and descriptors capture their physical choreography.\nCollaborative Performance Task: The \"Social Trio/Quartet\" performance challenge, where small groups present a themed study featuring two distinct formations and a shared social message.\nPeer-Review Exchange: Active participation in structured feedback loops using the \"Glow & Grow\" rubric to collaboratively evaluate and adapt their work."}, {"name": "Unit 3"}, {"name": "Production Design, Site Awareness, & Final Performance", "timeframe": "Weeks 15–21 (approx. 6–7 Sessions)", "concepts": "Production Elements: Analyzing how technical choices—such as costuming, variable props, lighting designs, and musical changes—enhance the artistic intent of a piece.\nSite-Specific Architecture: Adapting performance mechanics to unique stage and non-stage venues (such as studios, hallways, and outdoor courtyards).\nPerformance Etiquette: Understanding the traditional responsibilities of a performer (focus, entrance/exit precision, curtain calls) and an audience member.\nThe Archival Process: Gathering personal reflections, performance notes, and technical sketches to compile a comprehensive creative portfolio.", "skills": "Prop Manipulation: Handling and manipulating physical props (e.g., fabric lines, rhythm sticks) without breaking alignment, rhythm, or ensemble timing.\nSpatial Adaptation: Analyzing a non-traditional performance space and proactively adjusting formations to suit its physical limitations.\nProfessional Rehearsal Etiquette: Receiving, recording, and executing live directional notes and performance critiques from the teacher or peer choreographers.\nAnalytical Critique: Comparing recorded video clips of dances performed with and without lighting or costuming to evaluate the artistic impact of production design.", "materials": "Performance production kit: Fabric segments, rhythmic props, and auxiliary lighting tools.\nSelected video recording equipment for self-checks and permanent performance archiving.\n\"My Choreographer Self\" worksheets and portfolio assembly sheets.", "assessments": "Technical Lab Check: A practical evaluation of the student's ability to seamlessly integrate a prop into an 8-count phrase without breaking performance focus.\nThe Culminating Showcase: An informal classroom performance shared with an outside audience group, evaluated on expressive intent, formation memory, tracking accuracy, and entrance/exit etiquette.\nSummative Portfolio & Map: Construction of a final \"Choreography Map\" portfolio page that integrates one detailed drawing, one technical vocabulary descriptor, and one original movement step notation.\nClosing Reflective Circle: A final verbal assessment assessing students' personal discoveries regarding their creative preferences and artistic growth across the semester."}]}, {"name": "Class VII-VIII Dance Styles", "department": "Performing Arts", "teacher": "Bria Tyner", "grade": "", "length": "", "description": "", "competencies": "Creating: Selecting and comparing complex stimuli to broaden choreography, deploying sophisticated devices (counterpoint, accumulation, theme & variation), and articulating the artistic intent behind music, structure, and movement selection.\nPerforming/Presenting/Producing: Mastering technical accuracy, bodily control, and complex rhythm configurations specific to varied genres; adapting performances safely to diverse spatial venues; and applying direct performance critiques to live work.\nResponding: Deconstructing and analyzing peer and professional choreography using precise genre terminology, evaluating how cultural and historical aesthetics shape movement, and designing explicit artistic criteria to assess dance effectiveness.\nConnecting: Investigating how global movement traditions speak to societal values, world news, and personal identity while synthesizing cross-disciplinary research into physical expression.", "units": [{"name": "Unit 1"}, {"name": "Jazz Dance – Syncopation, Line, & Theatre Aesthetics", "timeframe": "11–12 Weeks", "concepts": "The Roots & Evolution of Jazz: Examining the historical lineage of Jazz dance from its African roots to vernacular jazz and standard musical theatre styles.\nRhythmic Isolation & Syncopation: Understanding complex rhythmic meters, syncopation, polyrhythms, and clean bodily isolations (head, shoulders, ribs, hips).\nJazz Compositional Devices: Utilizing choreographic devices like counterpoint (individual groups moving to contrasting rhythms or phrases) and accumulation to structure a jazz routine.\nArtistic Criteria: Formulating collaborative evaluation standards to analyze the impact and execution of jazz dynamics and projection.", "skills": "Genre Execution: Demonstrating classic jazz vocabulary (e.g., sharp lines, jazz walks, pirouettes, isolations) with precise muscle control and energetic focus.\nRhythmic Autonomy: Executing counterpoint movement sequences where a student's rhythm purposely contrasts against a peer group's rhythm.\nAesthetic Analysis: Comparing two different jazz sub-genres (e.g., street jazz vs. theatre jazz) and describing their distinct choreographic differences using accurate terminology.\nCritique Application: Actively applying teacher adjustments regarding performance projection and timing across consecutive run-throughs.", "materials": "Jazz dance playlist spanning early swing, classic Broadway tracks, and contemporary syncopated pop.\nVideo archives highlighting historical jazz choreographers (e.g., Bob Fosse, Katherine Dunham).\nSound system", "assessments": "Formative Tracking: Precision checks during isolation warm-ups and rhythm syncopation drills.\nChoreographic Task: The \"Counterpoint Challenge,\" where duets design an 8-count jazz phrase that juxtaposes two distinct rhythms happening at the exact same time.\nSummative Trimester Performance: Group presentation of a highly stylized Jazz ensemble work, evaluated on rhythmic precision, clean isolations, spatial tracking, and performative projection."}, {"name": "Unit 2"}, {"name": "Modern & Contemporary Dance – Weight, Space, & Abstract Expression", "timeframe": "11–12 Weeks", "concepts": "Modern Foundations: Exploring the relationship with the floor using foundational modern concepts such as weight drop, contract/release, fall/recovery, and fluid momentum.\nAbstract Stimuli: Sourcing non-traditional stimuli—such as abstract art, world news, social justice topics, or emotional poetry—to expand movement vocabulary beyond literal gestures.\nStructural Formations: Utilizing theme and variation as a choreographic structure to manipulate an original phrase without losing its core identity.\nSite-Specific Venue Architecture: Exploring how contemporary dance shifts meaning when set in non-proscenium venues (e.g., hallways, courtyards, or outdoor spaces).", "skills": "Locomotor Fluidity: Effortlessly dropping weight into the floor and recovering balance through multi-level floor sequences and sweeping traveling pathways.\nThematic Abstracting: Translating a complex social theme or text into abstract physical architecture rather than basic pantomime.\nChoreographic Variation: Taking a core 8-count movement theme and altering its speed, level, facing, or emotional energy to fulfill a \"theme and variation\" requirement.\nSpatial Adaptability: Evaluating an alternative, non-stage classroom space and mapping out formations that safely interact with its architectural features.", "materials": "Selected ambient and instrumental tracks with irregular meters or spoken-word poetry overlays.\nVisual art prints and news/literary journal briefs on modern social issues.\nStudent choreographic concept logs.", "assessments": "Mid-Trimester Composition Check: Individual or partner \"Theme & Variation\" exercise where students demonstrate an initial movement theme alongside two distinct structural variations.\nPeer-Critique Loop: Written peer evaluations based on student-designed artistic criteria, examining how well a piece communicates its abstract social intent.\nSummative Site Showcase: A site-specific studio showcase where small ensembles present a contemporary work adapted to an alternative venue, graded on spatial control, emotional depth, and focus."}, {"name": "Unit 3"}, {"name": "Hip-Hop Dance – Foundations, Rhythmic Complexity, & Social Commentary", "timeframe": "11–12 Weeks", "concepts": "The Foundations & Culture of Hip-Hop: Investigating the historical and cultural roots of Hip-Hop dance, centering on the four original elements of the culture, party dances, and street foundations (e.g., locking, popping, breaking, or social dances from distinct eras).\nRhythmic Complexity & Syncopation: Mastering polyrhythms, complex syncopated tracks, and using the body as a percussive instrument by hitting distinct musical accents, downbeats, and counter-rhythms.\nThe Performer-Audience Cypher Exchange: Exploring the concept of the \"Cypher\" or circle exchange, studying how communal spatial formats, call-and-response dynamics, and performer proximity build a shared dialogue with an audience.\nChoreographic Structure & Variations: Deploying choreographic devices such as counterpoint (different groups hitting different layers of a song simultaneously) and theme and variation to flip or manipulate foundational hip-hop grooves.\nArchival Documentation: Compiling personal reflection logs, structural formation diagrams, and custom rhythm maps into a comprehensive year-end dance portfolio.", "skills": "Aesthetic and Groove Execution: Executing genre-specific vocabulary and foundational grooves with authentic posture, weight drop, isolation control, and clear dynamic texture (e.g., contrasting hard hits with fluid transitions).\nRhythmic Autonomy & Accenting: Navigating highly layered musical production, demonstrating the ability to split an ensemble to physically isolate contrasting acoustic loops or vocal patterns.\nContextual Evaluation: Articulating how Hip-Hop serves as a vehicle for community building, historical preservation, or personal and social commentary, using precise, genre-specific terminology.\nSpatial Adaptation & Cypher Navigation: Adapting staging from a traditional front-facing performance into a collaborative circle formation, executing spontaneous or choreographed sequences while maintaining high performance focus and supportive ensemble behavior.", "materials": "A curated audio catalog tracing the evolution of Hip-Hop beats, including funk breaks, classic 90s boom-bap, and highly layered modern polyrhythmic production.\nVideo archives and documentaries profiling pioneers of foundational street styles and social dances.", "assessments": "Formative Groove & Isolation Check: Practical call-and-response drills focusing on rhythmic timing, clarity of execution, and individual variation of foundational social steps.\nChoreographic Task: The \"Music Layering Challenge,\" where small student groups choose an intricate section of music and use a counterpoint structure to assign separate musical stems (e.g., one group dancing to the snare, another to the lyrics) to distinct dancers.\nThe Culminating Showcase: A school-based performance or structured studio Cypher exhibition, evaluated on rhythmic precision, ensemble synchronization, performance energy, and adherence to performance etiquette.\nFinal Reflection Portfolio: Submission of the complete, year-long \"Dance Styles Portfolio\"—requiring a detailed hip-hop movement notation sketch, a terminology guide, and a comprehensive summative essay analyzing their creative and technical growth across all three trimesters."}]}, {"name": "", "department": "Performing Arts", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe":
