nce"}, {"name": "Unit 5"}, {"name": "Meter", "timeframe": "2 months", "concepts": "Music is broken down into meter, which is groups of 2 or 3. Simple meter breaks down by 2s, and compound meter breaks down by 3s", "skills": "Ss will define, explore, and analyze music for METER, beginning with common meters of 2, 3, and 4, then moving to explorations of compound meter (such as 6/8), asymmetrical meter (5/8 and 7/8) and mixed meter", "materials": "Pop songs\nTake Five\nUnsquare Dance\n“Raging Rapids” xylophone piece (Mixed Meter)", "assessments": "FORMATIVE ASSESSMENTS: small group work with rhythm sticks or beanbag-passing - students create repeating patterns to match the meter of indicated repertoire \nSummative assessment: performing pieces in mixed and uncommon meter in the Spring Concert"}, {"name": "Unit 6"}, {"name": "Spring Concert Preparation", "timeframe": "1.5 months", "concepts": "Accompanying classmates on classroom instruments \nPerforming s part of the class iv ensemble\nAdapting known materials to fit a chosen theme", "skills": "Playing and holding a part in 4+ part instrumental ensemble\nSinging and playing at the same time\nChoeographing in elemental form to match elemental forms of chosen musoc", "materials": "Varies from year to year. 2026 repertoire: \nSolar System Song (Tom Chapin)\nRound and Round we Go (John Krumm)\nTsuki / Mochi (Japanese children’s song and hand game)", "assessments": "Final concert is summative assessment"}, {"name": "Unit 7"}, {"name": "Pop Song Form", "timeframe": "2 weeks", "concepts": "Pop songs follow a formula", "skills": "Students will define verse, chorus, bridge, pre-chorus and introduction/coda", "materials": "Many pop songs (Dependent on student interest)", "assessments": "Movement game where students listen to music and move from one part of the room to another depending on which part of the form they are hearing\nClass project writing a pop song on a subject of their choice"}]}, {"name": "", "department": "Performing Arts", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Music Appreciation", "department": "Performing Arts", "teacher": "Lauren Aloia", "grade": "", "length": "", "description": "", "competencies": "Intercultural Connection, Sense of Self and Place, Critical Systems Thinking, Adaptability to Change, Action Toward a Better Future, Active and Critical Listening, Artistic and Cultural Expression, Interdisciplinary Learning, Identifying Elements of Music, Historical and Stylistic Context, Cultural and Contextual Analysis, Aesthetic Articulation and Evaluation", "units": [{"name": "Unit 1"}, {"name": "Introduction to Music Appreciation", "timeframe": "2 Classes", "concepts": "Learning basic musical concepts\nExercise active listening skills\nPreparing how to discuss music and what we hear\nExploring different methods of notation in scores", "skills": "Listening\nAnalyzing\nIntroductory musical vocabulary\nDifferentiating styles", "materials": "", "assessments": "Classroom dialogue and discussion"}, {"name": "Unit 2"}, {"name": "Classical Music", "timeframe": "2 classes", "concepts": "Listening and Identifying Musical Concepts\nIdentifying meter\nLayered voices and counterpoint\nIdentifying differences in classical style\nHistoric Performance Practice\nWestern Music History", "skills": "Identifying melody and harmony, layered voices, timbre, meter, counterpoint, themes and variation\nStrengthening musical vocabulary, and descriptive musical language\nComparing and contrasting styles within classical time periods\nIdentifying and discussing the artistic imperative", "materials": "", "assessments": "Classical Listening and Reflection"}, {"name": "Unit 3"}, {"name": "Latin Music", "timeframe": "3 classes", "concepts": "Learn about the colonization of South America\nDiscuss the Indigenous, West African, and European traditions of music\nDiscuss the marriage of music and dance \nCompare and contrast the way music exists in different cultures around the world \nDifferentiate and Identify Latin music styles", "skills": "Deepen and expand musical vocabulary \nDistinguish and identify Latin styles: Salsa, Merengue, Bachata, Cumbia, Samba, Bossa Nova, Mambo, Tango, Reggaeton/Dembow\nIdentify and clap the clave rhythm\nConnect musical context with historical context, and style with dance", "materials": "", "assessments": "Clave exercise\nLatin Music Listening and Reflection"}, {"name": "Unit 4"}, {"name": "Ragtime and Blues", "timeframe": "1 class", "concepts": "Learn about the colonization of North America\nListen for the influences of African, European, and Indigenous peoples in music\nDiscuss the history and importance of Black Spirituals and how they inform Jazz and Americana\nLearn about the interplay between musicians from a call and response tradition\nIdentify Blues form", "skills": "Learn and embody syncopation\nIdentify a 12-bar Blues progression\nImprovisation", "materials": "", "assessments": "Compose a 12-bar Blues as a class"}, {"name": "Unit 5"}, {"name": "Jazz", "timeframe": "2-3 Classes", "concepts": "Connecting concepts of Ragtime and Blues to Jazz\nListening and identifying jazz form\nExploring improvisation \nExplore the movement of jazz throughout the country\nDiscuss Jazz history and historical events that shape its evolution\nConnect dance tradition and jazz, paralleling lessons from Latin Music\nExplore odd meter\nDiscuss Gospel in Jazz", "skills": "Follow a jazz chart\nIdentify form\nExplore and embody improvisation\nDistinguish Blues, Jazz, and Gospel Language \nIdentify mixed and odd meter", "materials": "", "assessments": "Jazz form performance\nGroup A - Rhythm\nGroup B - Bass\nGroup C - Improvise on xylophone\nJazz Listening and Reflection\nCreate visual representations of sound"}, {"name": "Unit 6"}, {"name": "Rock and Roll", "timeframe": "2 Classes", "concepts": "Developments in mass media, accessibility of music, radio culture\nRacial tensions in America, whitewashing growing musical trends\nMusic industry and business\nMusic as protest\nBeginnings of Disc Jockeys\nAmplified instruments and growing music venues\nRock and Roll and the Civil Rights Movements\nIdentifying Blues and R&B concepts that influence rock\nTimbre of amplified sounds\nComparing pop music culture with previous lessons", "skills": "Connect Rock and Roll with Blues language and concepts\nEvaluate the evolution of the amplified sound\nCompare timbral differences\nMusic as protest and storytelling", "materials": "", "assessments": "Writing a live performance review"}, {"name": "Unit 7"}, {"name": "Hip Hop", "timeframe": "2 Classes", "concepts": "Four Pillars of Hip Hop\nDJ\nMC\nGraffiti\nBreakdance\nCulture of Hip Hop\nInfluences from Disco downtown and a new movement in the Bronx\nDJ Kool Herc\nDiscuss Hip Hop’s evolution over time\nMake connections to Jazz, Rock, Blues and R&B\nPreface sampling and copyright \nDiscuss misogyny in Hip Hop and Rock\nIntroduce Sampling", "skills": "Identify basslines and rhythmic foundation\nConnect improvisation to rap and MC culture\nIdentify the four pillars in our learning and exploration\nIdentify “Merry-go-round” technique in modern day Hip Hop beats", "materials": "", "assessments": "Hip Hop Listening and Reflection"}]}, {"name": "", "department": "Performing Arts", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Class II Dance: Introduction to Classical Ballet", "department": "Performing Arts", "teacher": "Ian Bell", "grade": "Class II", "length": "Full year", "description": "", "competencies": "Our five Global Competencies are met through the following:\n\nIntercultural Connection: Studying the French roots of ballet terminology, exploring diverse global folk dances (Flamenco, Polonaise, Polka), and placing ballet in a global context alongside other world dance traditions.\n\nSense of Self and Place: Developing physical literacy, spatial awareness, and personal artistry through performance practice and live music improvisation; recognizing local artistic institutions by naming NYC-based ballet companies.\n\nCritical Systems Thinking: Identifying elements of classical art across mediums; understanding how music, narrative plot, costuming, and choreography intersect to build a full-scale classical production.\n\nAdaptability to Change: Responding in real-time to live music through improvisation; transitioning smoothly between classical technique, pantomime, and folk styles.\n\nAction towards a Better Future: Cultivating community, mutual respect, and collaborative artistic expression by practicing ensemble dancing, partnering, and traditional classroom courtesies (révérence).", "units": [{"name": "Unit 1"}, {"name": "The Nutcracker (Technique & Fall Repertory)", "timeframe": "Approximately 4 months", "concepts": "The magical and dream plot, characters, and musical themes of The Nutcracker ballet.\n\nIntroduction to classical ballet etiquette and basic French vocabulary.\n\nThe role of storytelling in dance via pantomime gestures.\n\nExploring the specific rhythms of the March and Flamenco.", "skills": "Foundational Technique: Executing walks, plié, tendu, rond de jambe, coupé, passé, relevé, tourné, and port de bras with proper alignment.\n\nLocomotor Movements & Jumps: Mastering prances, gallops, chaîne turns, and basic jumps (sauté, échappé, grand jeté).\n\nArtistry & Articulation: Performing pantomime gestures; embodying March and Flamenco steps; responding creatively to live music during improvisation and révérence; maintaining flexibility via seated and standing stretches.", "materials": "Music from Tchaikovsky’s The Nutcracker score.\n\nVideo clips of The Nutcracker from Marquee TV and YouTube.\n\nPhysical props: Ballet slippers and a pair of pointe shoes for a hands-on lecture/show-and-tell.", "assessments": "Formative tracking of physical alignment, technical execution, and comprehension of French terminology during class exercises.\n\nPeer and teacher evaluation of pantomime readability and storytelling clarity.\n\nIn-Class Performance: An informal presentation of learned Nutcracker repertory and sequences."}, {"name": "Unit 2"}, {"name": "Swan Lake (Technique and Winter Repertory)", "timeframe": "Approximately 3 months", "concepts": "The magical and dream plot, themes, and imagery of Swan Lake.\n\nThe concept of sustaining movement, balance, and lines (extensions).\n\nExploring contrasting social and folk dance rhythms (polka, march, and waltz).\n\nAwareness of major New York City-based ballet companies and institutions.", "skills": "Technical Progression: Building on Unit 1 skills with the addition of leg extensions and increased balance control during plié, tendu, rond de jambe, coupé, passé, relevé, and tourné.\n\nAdvanced Locomotor: Introducing pas de chat and spring points alongside refined gallops, prances, chaîne turns, and grand jetés.\n\nArtistry & Rhythms: Transitioning stylistically between the fluid port de bras of swans and the sharp, rhythmic footwork of the Polka, March, and Waltz. Continuing improvisation with live music and conditioning stretches.", "materials": "Music from Tchaikovsky’s Swan Lake score.\n\nVideo clips from Marquee TV and YouTube focusing on corps de ballet work and character dances.", "assessments": "Group and solo technical observation focusing on leg extensions, balance, and spatial patterns.\n\nVerbal checks on Swan Lake plot points and naming NYC ballet companies.\n\nIn-Class Performance: Presentation of Swan Lake-inspired choreography sequences."}, {"name": "Unit 3"}, {"name": "Sleeping Beauty (Technique and Spring Repertory)", "timeframe": "Approximately 3 months", "concepts": "The fairytale plot and characters of The Sleeping Beauty.\n\nSynthesizing classical ballet technique with historical court dances (Polonaise).\n\nIdentifying overarching elements of classical art (symmetry, balance, grace, storytelling).\n\nPlacing ballet within the global, historical spectrum of world dance.", "skills": "Technique Mastery: Fluently stringing together the complete barre and center sequences: plié, tendu, rond de jambe, coupé, passé, leg extensions, relevé, tourné, port de bras, and deep stretches.\n\nDynamic Allegro & Turns: High-energy execution of sauté, échappé, spring points, prances, gallops, chaîne turns, pas de chat, emboité, and expansive grand jetés.\n\nEnsemble Performance: Dancing in group formations, partnering with classmates, and executing solo performance moments using pantomime. \n\nEmbodying the regal, stately rhythms of the Polonaise alongside the Polka, March, and Waltz.", "materials": "Music from Tchaikovsky’s The Sleeping Beauty score.\n\nSelected video recordings of professional productions showcasing fairy variations and court scenes.", "assessments": "Final evaluation of ballet terminology comprehension and physical execution of the year's cumulative vocabulary.\n\nAssessment of partner and group dancing skills (cooperation, spacing, and synchronicity).\n\nCulminating In-Class Performance: A celebratory showcase of Sleeping Beauty repertory with improvisation."}]}, {"name": "Class III Dance", "department": "Performing Arts", "teacher": "Ian Bell", "grade": "Class III", "length": "Year", "description": "", "competencies": "Intercultural Connection: Placing modern dance within a global context; identifying elements of classical art and jazz; learning and speaking basic French ballet terms, greetings, and courtesies.\n\nSense of Self and Place: Developing deep somatic awareness through contrasting techniques (e.g., Duncan’s nature-inspired waves vs. Ailey’s sharp lines); exploring personal emotional expression through improvisation.\n\nAdaptability to Change: Responding and improvising in real-time to live music; transitioning fluidly between solo, partner, and group formations.\n\nAction Towards a Better Future: Fostering community, mutual respect, and collaborative empathy through ensemble work and sharing choreography.", "units": [{"name": "Unit 1"}, {"name": "Foundations of Modern Technique and Isadora Duncan Repertory", "timeframe": "Approximately six months", "concepts": "Introduction to Duncan dance philosophy: exploring freedom of movement and nature-inspired motifs (waves, ripples); moving from the solar plexus\n\nImprovisation as joyful and choreographic practice and tool\n\nBasic French ballet terminology, greetings, and courtesies", "skills": "Foundational Technique: walks, heroic poses, spine waves, arm ripples, curves, arches, tilts\n\nLocomotor Movement and Jumps: triplets (waltz), turns, prances, small jumps, runs, leaps\n\nArtistry and articulation: creating refined gestural sequences and moving with a variety of qualities\n\nBasic yoga vinyasa\n\nDancing in groups, with partners, and solo\n\nImprovising with live music", "materials": "Brahms, Chopin, and Schubert musical repertory and scores\n\nVideo clips from Marquee TV and YouTube showcasing Duncan repertory", "assessments": "Continuous observation of technique and spatial awareness\n\nPeer feedback on group work\n\nIn-class performance: an informal presentation of Brahms Waltzes repertory (with a focus on Rose Petal Waltz) and other sequences"}, {"name": "Unit 2"}, {"name": "Foundations of Modern Technique and Alvin Ailey Repertory", "timeframe": "Approximately four months", "concepts": "Comparing modern dance to classical ballet and other global dance forms\n\nUnderstanding basic musical meter (march vs. waltz)\n\nIntroduction to American modern dance, jazz, and Black cultural history\n\nExploring the global impact of Alvin Ailey's Revelations\n\nTranslating emotional and narrative themes into precise choreographic phrases\n\nSynthesizing balletic movement with modern energies, floorwork, and stye\n\nStudying essential elements of choreography (space, time, energy)\n\nImprovisation as joyful and choreographic practice and tool\n\nPlacing modern dance within the broader world of dance", "skills": "Foundational technique: seated and reclining floorwork, rolldowns, swings, and fundamental ballet mechanics (plié, tendu, rond de jambe, coupé, passé, relevé, tourné, sauté, échappé)\n\nLocomotor movements and jumps: (prances, skips, triplets, waltzes, chaîne, gallops, sways, leaps)\n\nArtistry and articulation: creating refined gestural sequences and moving with a variety of qualities\n\nBasic yoga vinyasa\n\nDancing in groups, with partners, and solo\n\nImprovising with live music", "materials": "Revelations score, video, and silk fabric props", "assessments": "Continuous observation of technique and spatial awareness\n\nPeer feedback on group work\n\nIn-class performance of select Revelations repertory"}]}, {"name": "Dance IV", "department": "Performing Arts", "teacher": "Ian Bell", "grade": "Class IV", "length": "Semester", "description": "", "competencies": "Intercultural Connection: Students place American modern dance in a world of dance, identifying its roots and comparing it structurally and historically to classical ballet, jazz, folk, and other global dance forms.\n\nSense of Self and Place: Students build physical literacy, spatial awareness, and artistic identity by dancing in groups, with partners, and solo, finding their individual voice through improvisation.\n\nCritical Systems Thinking: Students analyze and identify elements of classical art and jazz, recognizing how socio-political eras influenced choreographic pioneers like Graham and Taylor.\nAdaptability to Change: Students practice radical adaptability by utilizing various choreographic systems and practicing ensemble work.\n\nAction Towards a Better Future: Students learn to use the body as a tool for communication and agency, building a community of mutual trust through collaborative choreography, safe partnering, and constructive peer review.", "units": [{"name": "Unit 1"}, {"name": "Foundations of Modern Dance & The Graham Legacy", "timeframe": "Approximately three months", "concepts": "Introduction/review the language and history of American modern dance\n\nUnderstanding the core principles of Martha Graham’s technique: the physiological and expressive concepts of contraction and release.\n\nComparing modern dance to classical ballet and jazz\n\nIntegrating live music responsiveness into structured movement", "skills": "Technical Execution (Floor & Standing): Contraction, Release, Curve, Arch, Bounce, Tilt, Floor and standing falls, Spirals, Roll down, Seated and standing stretches.\n\nBallet-Infused Foundations: Plié, Lateral, Flat back, Tendu, Jeté, Rond de jambe, Coupé, Passé, Leg extensions, Relevé, Tourné, Sauté, Échappé.\n\nLocomotor & Spatial Patterns: Prances, Triplets, Triplet turns, Chaîne, Gallops, Grand battement, Sauté in arabesque, Leaps.\n\nPerformance & Creative Practice: Embodying the repertory of Martha Graham (Maple Leaf Rag), performing short choreographic sequences, dancing in ensembles and solos, practicing guided improvisation.", "materials": "Live accompaniment of Maple Leaf Rag and other Scott Joplin repertory\n\nVideo clips of Martha Graham’s Maple Leaf Rag via YouTube", "assessments": "Formative assessment of technique\n\nIn-class performance of selected repertory from Maple Leaf Rag\n\nPeer and instructor feedback on improvisational responsiveness to live music"}, {"name": "Unit 2"}, {"name": "Pedestrian Virtuosity & Musicality – The Taylor Tradition", "timeframe": "Approximately two months", "concepts": "Exploring Paul Taylor’s style: blending high-level athleticism with pedestrian actions (running, sliding, jumping) and elements of Graham technique (Contraction, Release, Curve, Arch, Bounce, Tilt, Floor and standing falls, Spirals, Roll down, Seated and standing stretches)\n\nComparing modern dance to jazz, folk, and other vernacular dance forms\n\nSynthesizing the semester’s skills to build trust and collaborative ensemble dynamics.", "skills": "Advanced Athletic Mechanics: Mastery of foundational mechanics with the critical addition of falls and rolls, demanding advanced floor-work safety and momentum control\n\nLocomotor & Spatial Patterns: Prances, Triplets, Triplet turns, Chaîne, Gallops, Grand battement, Sauté in arabesque, Leaps.\n\nDynamic Locomotor Work: High-velocity leaps, gallops, grand battements, and swift direction changes\n\nPerformance & Creative Practice: Embodying the joyous, athletic repertory of Paul Taylor’s Esplanade. Partnering work, dancing in shifting group formations, and executing continuous short choreographic sequences.", "materials": "Bach’s Violin Concertos (the score for Esplanade) and live music for improvisation.\n\nVideo archival clips of Paul Taylor's Esplanade via YouTube.", "assessments": "Final in-class performance of Esplanade repertory sequences, focusing on momentum, weight shifts, and joy.\n\nAssessment of group partnering skills, safety, and spatial awareness during runs and falls.\n\nFormative assessment of technique\n\nPeer and instructor feedback on improvisational responsiveness to live music \n\nCapstone discussion placing modern dance within the wider \"world of dance.\""}]}, {"name": "Class V Dance", "department": "Performing Arts", "teacher": "Ian Bell", "grade": "Class V", "length": "Trimester", "description": "", "competencies": "Sense of Self and Place: Developed through small group and ensemble practice, self-expression in improvisation, and understanding how contemporary dance places them in the wider world of dance.\n\nAdaptability to Change: Cultivated by rapidly shifting between distinct movement qualities (e.g., the rigor of ballet vs. the weight of modern dance) and responding to varied musical styles or silence.\n\nIntercultural & Historical Connection: Built by identifying the core elements of classical art, modern, jazz, and performance, while learning basic French ballet terminology and historical contexts.\n\nCollaborative & Technical Literacy: Demonstrated through the physical embodiment of technique and the ability to dance harmoniously in groups, with partners, and as soloists.", "units": [{"name": "Unit 1"}, {"name": "Essential Contemporary Vocabulary and Practice", "timeframe": "Approximately three months", "concepts": "Introducing parallel vs. turned-out alignment, fundamental dance vocabulary, and basic historical context of ballet, modern, and jazz.\n\nCore integration through spinal rolls, body waves, and isolations; pelvic stability in fundamental extensions and transfers of weight.\n\nExploring gravity, the dynamic opposition of contraction and release, and shifting focus through changing directions.\n\nRelating contemporary dance elements directly to historical modern and jazz forms.\n\nAdvanced gravity exploration (falling, recovering, balancing)\n\nSolo and group artistic identity.\n\nImprovisation as an essential tool for dance making.\n\nPlacing contemporary dance in the broader global landscape of dance and performing arts.", "skills": "Speaking and executing basic French ballet terms (plié, tendu, rond de jambe, coupé, passé, relevé, tourné, port de bras.)\n\nExecuting core jazz foundational steps (jazz walks, grape vine, jazz pirouette, pas de bourrée, gallops) and modern elements (lateral, flat back, tilt, arch, curve).\n\nTraveling sequences (prances, triplets, leaps).\n\nImprovising comfortably during warm-ups and the closing révérence to diverse musical styles.\n\nEmbodying core Graham/modern concepts: contraction, release, and bounce.\n\nMastering complex tracking and weight shifts.\n\nRetaining and executing longer, multi-genre choreographic combinations in groups and with partners.\n\nExpanding improvisational risk-taking by dancing to unfamiliar tempos and unexpected rhythms.\n\nExecuting floor-to-standing transitions safely (seated falls and swings, arm balances).\n\nDisplaying physical control and flexibility during leg extensions, lunges, and swings.\n\nMastering complex allegro and turn sequences.\n\nGenerating original dance studies using learned vocabulary during improvisations. \n\nImprovising intentionally with music of varying styles as well as performing in complete silence.", "materials": "Curated YouTube/Marquee TV clips showing contemporary dance practice.\n\nLive music and eclectic audio playlist (spanning classical, jazz, contemporary, and ambient sounds).", "assessments": "Ongoing formative assessment of physical posture and terminology comprehension.\n\nIn-class sharing of complex locomotor and turning sequences."}]}, {"name": "Class X Dance History", "department": "Performing Arts", "teacher": "Ian Bell", "grade": "Class X", "length": "Semester", "description": "", "competencies": "Sense of Self and Place: Situating personal identity within a rich lineage of dance artists, historical places, and localized New York City history.\n\nIntercultural Connection: Investigating diverse cultural dance forms (Native American, Jazz, Swing, Salsa, Hip Hop, and Ballroom culture, among others) and identifying the communities that birthed them.\n\nCritical Systems Thinking: Analyzing historical structures, policy constraints (such as NYC’s No Dancing Laws), and the methods used to collect, preserve, or disseminate dance histories.\n\nCommunication & Artistry: Developing a robust dance vocabulary to critically write, speak, and present rigorous dance scholarship.", "units": [{"name": "Unit 1"}, {"name": "Moving Bodies in 20th-Century New York City: Lineages, Laws, and Legacies", "timeframe": "Approximately five months", "concepts": "Socio-Political Geography: How New York City served as a unique incubator for social, sacred, and concert dance forms throughout the 20th century.\n\nPolicy & Resistance: The profound impact of NYC’s 1926-2017 No Dancing Laws (Cabaret Laws) and how legal restrictions shaped night life, subcultures, and the birth of American Modern Dance.\n\nLineage & Identity: Situate personal artistic identity within historical lineages of diverse artists, groups, and changing neighborhood spaces.\n\nHistoriography: Understanding the distinct methods used to collect, preserve, and transmit dance history (such as archival research, video documentation, oral history, and body-to-body transmission).\n\nChronological Evolution: Tracing the aesthetic shifts from Native Dance and early modernism (Duncan), through institutional structures (ABT, NYCB, Ailey, etc.), underground vernacular spaces (1920s Jazz, 1930s Swing, 1960s Salsa, 1970s Hip Hop/Disco, 1980s Ballroom/Voguing), and into the 1990s era of nightlife activism and performance art (New York Live Arts).", "skills": "Physical Literacy & Practice: Embodying various foundational dance forms as a practitioner to understand style and weight physically.\n\nCritical Analysis: Developing a sophisticated dance vocabulary to critically write and speak about movement as an engaged viewer.\n\nPrimary & Secondary Research: Utilizing archival materials, video clips, and historical texts to conduct independent historical inquiry.\n\nScholarly Dissemination: Synthesizing findings to write and formally present an original dance history research paper on a chosen subject.", "materials": "Curated video footage and performance archives from Marquee TV and YouTube.\n\nPrimary sources: Rare books, historical documents, and physical artifacts (such as ballet shoes).", "assessments": "Check-ins evaluating physical embodiment of the historical styles, paired with short critical writing reflections on class viewings.\n\nA comprehensive, student-driven dance history research paper on a subject of their choice.\n\nA formal oral/visual showcase presenting their historical research to the class community."}]}, {"name": "Grade 5 Guitar", "department": "Performing Arts", "teacher": "Alejandro Cote, Kathleen Kernell", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\nSense of Self and Place > Artistic Reflection\nWhat it means: Reflecting on personal growth via practice journals and peer feedback circles.\nAdaptability to Change > Performance Agility\nWhat it means: Adjusting on the fly to tempo changes, dynamic shifts, or swapping ensemble parts.\nAction Towards a Better Future > Studio Stewardship\nWhat it means: Peer mentoring, leading student sectionals, and helping peers adjust posture/fingerings.\nCritical Systems Thinking > Ensemble Interlock\nWhat it means: Hearing the \"big picture\"—balancing your volume, blending parts, and integrating with digital tools (Soundtrap/Noteflight).\nIntercultural Connection > Repertoire Context\nWhat it means: Authentically executing and respecting global styles (e.g., Classical Spanish forms, Blues progressions, traditional folk).", "units": [{"name": "Unit 1"}, {"name": "Foundations of Guitar Technique, Literacy, and Ensemble Artistry", "timeframe": "Full Year", "concepts": "• The mechanics of proper physical playing posture and structural hand positioning.\n• Basic music notation: Reading foundational pitch information on the musical staff across the first 3 strings.\n• Basic rhythmic theory: Structural value and performance of half, quarter, eighth, and dotted half notes alongside their coordinating rests.\n• Expressive devices: Interpreting dynamics and timbre modifications (forte, piano, ponticello, tasto).\n• Understanding musical structural form \n• Social-Emotional Learning: Turn-taking, peer cooperation, and empathy during group work.", "skills": "• Establishing optimal, tension-free playing posture and hand architecture.\n• Playing simplified 3/4-string chord shapes (G, Em, C, D, Am, F, Bm).\n• Accurately identifying, and performing rhythmic patterns and written notes on the top 3 strings.\n• Playing accurately in a 3-part ensemble setting while collaborating, leading, and following during group warmups.\n• Engaging in guided creative improvisation prompts, exploratory sound effects.\n\n• Reflecting on personal feelings in response to music and practicing active listening during rehearsals.", "materials": "Guitar Curriculum Levels 1-4\nHal Leonard Book 1\nGuitar Basics\nSelected Pop Song Arrangements", "assessments": "Comprehensive Performance & Competency Evaluation Matrix sheet \nAssessment Ledger link"}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Grade Vi Guitar", "department": "Performing Arts", "teacher": "Alejandro Cote, Kathleen Kernell", "grade": "", "length": "", "description": "", "competencies": "Our five Global competencies are:\n● Sense of Self and Place (Artistic Reflection): Students\nevaluate individual practice goals, participate in group\nfeedback loops, and map visual or poetic responses to\nclassical works.\n● Adaptability to Change (Performance Agility): Students\nalternate roles as instructional section leaders or\nsupportive ensemble players, shifting technical styles to\nnavigate varied pop and classical forms.\n● Action Towards a Better Future (Studio Stewardship):\nStudents organize peer-led teaching projects and runindependent sectional rehearsals to fix group errors.\n● Critical Systems Thinking (Ensemble Interlock):\nStudents analyze multi-part polyphony during our\ncollaborative unit with the strings and composition sections,\nadjusting volume blend.\n● Intercultural Connection (Repertoire Context): Students\nexplore diverse global repertoire textures ranging from\ncontemporary styles to regional method tracks.", "units": [{"name": "Unit 1"}, {"name": "Intermediate Technique, Literacy, and Collaborative Chamber\n\nPerformance", "timeframe": "Full Year", "concepts": "Technique: Developing right-hand string alternation and\narpeggio structures; introducing full chord mechanics.\n● Reading & Theory: Sight-reading infrastructure in first\nposition; scale architecture (C and G major) across the top\n3 strings; half, quarter, eighth, dotted half notes and rests.\n● Musicality & Expression: Full application of standard\ndynamic markings, timbral shades, and structural\nexpression contrast.\n● Ensemble & Repertoire: 3-part score layers, sectional\nrehearsal organization, and peer-to-peer modeling\nstrategies.\n● Improvisation & Creativity: Elementary Orff-based\nimprovisation prompts, abstract cross-medium translation\n(music to art/poetry), and percussive storytelling.\n dynamics and timbre modifications (forte, piano, ponticello, tasto).\n• Understanding musical structural form \n• Social-Emotional Learning: Turn-taking, peer cooperation, and empathy during group work.", "skills": "● Execute clean right-hand alternation and fluid open-string\narpeggios.\n● Transition smoothly into full chord configurations (G, Em,\nC, D, Am, A, E).\n● Sight-read unfamiliar melodic lines on the first 3 strings in\nfirst position.\n● Perform accurate C and G major scales across the topthree strings.\n● Track independent musical lines within a 3-part ensemble\nlandscape.\n● Run small-group sectional rehearsals using targeted\nrepetition and loop isolation.\n● Improvise lines using Orff concepts and construct visual\nresponse projects inspired by active listening.", "materials": "Guitar Curriculum Method Book Selections: Blue\nMagic, The Violet Crown, LoFi, Meditation, Landscape,\nNeptune run, Ode to Joy, Found a Friend, Koi under the\nMoon Bridge\n● Website Repertoire Selections: Kasaya, El Chinati,\nForrest Stream, Hazy Morning, I Remember When..., In the\nCold, Jade Colored Dreaming, Lavender Fields, Lost\nMaples, Night Ride, Oh, How Lovely is the Evening,\nSojourn, Stranger, The, Sun's Crown, Sundance, Synergy,\nTaking Turns, Tango, The Ides of March, Tonight's Dream,\nWaves, Whispers of Winter (Quartet), Winds of Change\n● Alternative Choices: Pieces from 15 Easy Trios\n(Grossman), 12 Guitar Trios (Iceland)\n● Special Units: Unit Collaborating● Guitar Curriculum Method Book Selections: Blue\nMagic, The Violet Crown, LoFi, Meditation, Landscape,\nNeptune run, Ode to Joy, Found a Friend, Koi under the\nMoon Bridge\n● Website Repertoire Selections: Kasaya, El Chinati,\nForrest Stream, Hazy Morning, I Remember When..., In the\nCold, Jade Colored Dreaming, Lavender Fields, Lost\nMaples, Night Ride, Oh, How Lovely is the Evening,\nSojourn, Stranger, The, Sun's Crown, Sundance, Synergy,\nTaking Turns, Tango, The Ides of March, Tonight's Dream,\nWaves, Whispers of Winter (Quartet), Winds of Change\n● Alternative Choices: Pieces from 15 Easy Trios\n(Grossman), 12 Guitar Trios (Iceland)\n● Special Units: Unit Collaborating with Composition/Strings", "assessments": "Comprehensive Performance & Competency Evaluation Matrix sheet \nAssessment Ledger link"}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Class V Drama", "department": "Performing Arts", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "* Creative Expression: Expressing oneself creatively with confidence using voice, body, and imagination .\n\n* Ensemble & Collaboration: Understanding ensemble dynamics, building group trust, and learning to work together effectively as a theatrical team .\n\n* Foundational Literacy in Theatre: Mastering basic theatre vocabulary, stage directions, etiquette, and audition protocols .\n\n* Performance & Reflection: Embodying characters, applying blocking to scenes, performing in front of an audience, and both giving and receiving constructive feedback.", "units": [{"name": "Unit 1"}, {"name": "Foundations of Theatre, Ensemble, and Storytelling", "timeframe": "The whole Trimester", "concepts": "ey Concepts & Content\nTheatre Practices & Etiquette: Understanding basic classroom agreements (Clear/Specific, Positive, Adaptable, and student-driven rules) alongside professional theatre etiquette.\nEnsemble Work & Trust: The concept of the \"ensemble\"—how individual actors build trust, connection, and mutual support to perform together.\nThe Actor's Instrument: Using focus, concentration, memory, vocal techniques (articulation/projection), and physical movement to convey a story.\nThe Performance Process: Understanding basic stage directions, improvisation, the audition protocol, technical theatre elements (costumes, sets, lights), and the structure of a script.", "skills": "Key Skills\nEnsemble & Collaboration: Building focus, listening skills, and establishing deep collaboration with peers through bonding and drama games.\nVocal & Physical Expression: Utilizing physical warm-ups, vocal articulation, and purposeful stage movement to embody characters and express ideas confidently.\nImprovisation & Scene Work: Creating spontaneous narratives to convey a story and exploring short practice scenes.\nAuditioning & Rehearsing: Navigating the audition protocol, memorizing script elements, and properly preparing for performance.\nConstructive Critique: Cultivating the ability to both give and take constructive feedback following a creative performance.", "materials": "Materials\nAnthologies & Plays: Awesome Plays for Teens & Tweens, Multicultural Plays for Children, Short Plays for Young Actors, and Plays (The Drama Magazine for Young People).\nTextual Resources: \"Me Poems\" and various short practice scenes.\nActivity Guides: Improvisation activities, bonding games, and ensemble-building toolkits.", "assessments": "Assessments\nFormative Assessment: Continuous observation of student engagement during weekly activities, including rules/trust exercises, focus development, stage directions practice, vocal/improvisation sessions, and technical theatre introductions.\nSummative Trimester Performance: A final presentation in front of an audience where students are evaluated on their ability to:"}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "INTRO TO THEATRE", "department": "Performing Arts", "teacher": "", "grade": "7, 8", "length": "", "description": "", "competencies": "* Advanced Performance Mechanics: Synthesizing voice, diction, breath work, relaxation techniques, and physical movement into dynamic stage characters .\n\n* Analytical Script Literacy: Investigating dramatic texts using the C.R.O.W. framework and parsing themes to inform staging and character choices .\n\n* Expressive Physicality: Conveying clear, textless narrative arcs through precise movement, spatial choices, and pantomime .\n\n* Ensemble Leadership & Collaboration: Building deep trust, maintaining intense focus, and collaborating symmetrically with scene partners .\n\n* Production & Audition Competency: Navigating the audition pipeline, executing memorized texts, and identifying standard principles of technical theatre design.", "units": [{"name": "Unit 1"}, {"name": "Advanced Fundamentals, Analysis, and Performance\nUnit Name: Advanced Fundamentals, Analysis, and Performance\nTimeframe: 1 Semester\nTimetable: FALL 2025", "timeframe": "", "concepts": "The Performer's Physiology: Deep breath work, targeted relaxation, and physical alignment strategies to prepare for live performance.\nThe C.R.O.W. Structural Metric: Dissecting text through the active lenses of Character, Relationship, Objective, and Where.\nPerformance Styles & Script Variations: Engaging with various acting methodologies, line structures (e.g., Two Lines, Scene Starters), and published dramatic works.\nPantomime: The historical and practical art of telling coherent, detailed narrative sequences solely through physical mechanics.\nTheatre Design Foundations: Understanding the physical environments of performance, including sets, costuming, properties, and lighting.\nThe Professional Pipeline: Navigating standard audition methodologies, text memorization, stage directions, and live ensemble dynamics.", "skills": "Vocal & Diction Control: Mastering articulation, tone modulation, and spatial projection to handle complex theatrical texts safely and clearly.\nPlay & Textual Analysis: Reading, discussing, and actively breaking down scenes to extract character objectives and relationships.\nRisk-Taking & Expression: Pushing past personal comfort zones to embody emotionally diverse characters.\nPhysical Narrative Execution: Eliminating vocal reliance to build clear settings and objectives using body movement alone.\nAudition & Memorization Literacy: Applying strategies to memorize text and successfully navigate live cold readings or prepared auditions.", "materials": "Core Acting Literature Examples: Scenebook for Student Actors, Play The Scene, Sixty Comedy Duet Scenes for Teens, All In The Timing, Great Monologues for Young Actors, and Professional Scenes and Monologues for Student Actors.\nStructural Text Starters: Two Lines exercises, Scene Study packets, Me Poems, and Scene Starters.\nEnsemble Toolkits: Group dynamic challenges and bonding games.", "assessments": "Formative Assessment: Continuous process evaluation during daily physical/vocal warm-ups, improvisational prompts, and partner collaboration checkpoints. Instructor observations track focus development, text analysis discussions, and progress in pantomime exercises.\nSummative Performance Benchmarks: A performance series demonstrating cumulative mastery of semester material:\nMonologue Performance: Execution of an age-appropriate, relevant monologue using established vocal and character techniques.\nEnsemble & Partner Scene Presentation: A live performance of a fully memorized, blocked scene alongside a partner.\nEvaluation Criteria: Grading directly targets the student's ability to demonstrate technical theater knowledge, deep character embodiment, precision in blocking, clean ensemble teamwork, and application of performance techniques under live pressure."}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "", "department": "Performing Arts", "teacher": "", "grade": "", "length": "", "description": "", "competencies": "", "units": [{"name": "Unit 1"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}, {"name": "Unit 2"}, {"name": "Unit Name", "timeframe": "", "concepts": "", "skills": "", "materials": "", "assessments": ""}]}, {"name": "Chamber Chorus", "department": "Performing Arts", "teacher": "Michael Goede", "grade": "", "length": "", "description": "", "competencies": "1. Intercultural Connection: Students decode, contextualize, and authentic-pitch advanced historical polyphony and contemporary global choral literature.\n2. Sense of Self and Place: Students demonstrate absolute vocal autonomy, acoustic self-awareness, and pure-interval intonation within a multi-part unaccompanied ensemble.\n3. Critical Systems Thinking: Students track, analyze, and execute complex score structures, text-painting, and metric shifts on sight without instrumental support.\n4. Adaptability to Change: Students micro-adjust vocal color, dynamic boundaries, and tempo in real time to match changing performance venues and directorial cues.\n5. Action Towards a Better Future: Students synthesize technical mastery and performance psychology to deliver emotionally mature, socially conscious programs before live audiences and NYSSMA adjudication panels.", "units": [{"name": "Unit 1"}, {"name": "Advanced Vocal Artistry and SSA Autonomy", "timeframe": "This is a primary focus for the Fall semester.", "concepts": "SSA Acoustic Tuning: Understanding the physics of sound in treble-dominated frequencies, managing the \"acoustic space\" in upper registers, and navigating vowel modification ($formant$ tuning) to prevent shrillness.\nJust Intonation vs. Equal Temperament: Learning how to tune primary triads, close-interval cluster chords, and suspended harmonies without the aid of a piano.\nVocal Independence: Developing the mental and vocal autonomy required to sing complex, interlocking inner parts with complete confidence.", "skills": "Eliminate sympathetic pitch sag or sharping by making real-time micro-adjustments to breath support and soft-palate height.\nSwitch seamlessly between a clean, vibrant straight-tone (for historical polyphony or close cluster chords) and a warm, spinning vibrato.\nMaintain absolute vocal autonomy and steady intonation when isolated in small-ensemble or quartet configurations.", "materials": "Excerpts from our choral repertoire\nSolfege literacy cards\nMelodic sight reading exercises from Sight Singing Made Accessible Reading Teachable, Volume 1”", "assessments": "Formative Assessments\nDaily Rehearsal Observation: Ongoing evaluation of student posture, breath support, and active engagement during daily vocal warm-ups and technical exercises.\nAcoustic & Vowel Alignment Checks: Informal, spot-checking of specific sections (Soprano 1, Soprano 2, Alto) during rehearsal to evaluate vowel uniformity, soft-palate height, and real-time adjustment to pitch deviations.\nQuartet/Octet Isolation Drills: Periodically breaking the ensemble down into smaller chamber groups during rehearsal to observe individual vocal autonomy and the ability to maintain independent parts without piano support.\nSummative Assessments\nPart-Dominant \"Blind\" Checks: Individual or small-group vocal assessments where singers must perform their specific part against the other two interlocking parts. This measures rhythmic and harmonic independence, memory, and tone production.\nMid-Year Ensemble Technique Review: A performance-based benchmark evaluation at the end of the first semester assessing the student's vocal consistency, register transitions, and application of healthy vocal mechanics under performance conditions."}, {"name": "Unit 2"}, {"name": "Advanced Sight-Reading and Musicality", "timeframe": "Yearlong (September – May)", "concepts": "Advanced Sight-Reading Frameworks: Navigating complex rhythmic syncopations, shifting meters (e.g.,5/8, 7/8), modal melodies, and advanced chromaticism or modulations on sight.\nIntroductory Musicality and Text Painting: Analyzing scores to discover the why behind the music—how dynamics, phrasing, and articulation choices highlight the text and convey deep emotional intent.\nPerformance Psychology Foundations: Introducing stage presence, focus, communicative body language, and strategies for managing physical performance anxiety under pressure.", "skills": "Sight-read intermediate-to-advanced melodies using Solfège, leanly executing skips up to a major/minor 6th and handling sudden accidentals.\nInterpret and execute nuanced, conductor-driven phrasing, dynamic pacing, and clean, unified word endings \nArticulate the emotional trajectory of a piece and translate that understanding into visible, authentic performance energy.\nUtilize concert repertoire to identify where these concepts are applicable", "materials": "Excerpts from repertoire\nUniversity Interscholastic League (Texas) Sight Reading examples\n“Blow, Blow Thou Winter Wind”, Words by William Shakespeare, Music by Jennifer Lucy Cook\n“Sure On This Shining Night, Words by James Agee, Music by Morten Lauridsen\n“Does the World Say?”, Words and Music by Kyle Pedersen", "assessments": "Formative: * Individual sight-reading checkpoint spot-checks during rehearsals.\nPhrase-interpretation exercises where sections explain their text-painting choices.\nMemory benchmark checks on specific sections of the winter literature.\nSummative: * The Winter Choral Concert: Live performance evaluation focusing on precision, musicality, and stage presence.\nPost-Concert Audio Reflection: Students listen to the concert recording and complete a written critique analyzing the ensemble's dynamic pacing and diction."}, {"name": "Unit 3"}, {"name": "Winter Concert Repertoire", "timeframe": "This is our focus for the Fall Semester", "concepts": "Contrasting Textures and Eras: Exploring the intersection of classical lyrical legato (Lauridsen), rhythmic neo-medieval folk pulse (Cook), and contemporary pop-infused acoustic storytelling (Pederson).\nText Painting and Subtext: Analyzing how music brings literary masters to life (William Shakespeare, James Agee, and Kyle Pederson) to convey distinct emotions—ranging from wistful isolation to resilience and natural fury.\nMetrical Flexibility and Agility: Moving between senza misura (unmetered, free time), compound meters with a dance-like feel and elastic tempo rubato.\nExtended Harmonies and Dissolving Clustered Chords: Mastering modern choral structures, including hanging ninths, suspended seconds, and multi-part SSAA splits that require acute inner-ear spatial awareness to lock.", "skills": "Formant Tuning and Register Smoothing (Lauridsen): Execute long, soaring lyrical lines up to a high G5 (Soprano 1) with uniform vowel shapes and an elevated soft palate, avoiding shrillness or vocal strain in the upper register.\nDynamic Rubato Compression & Expansion: Respond with hyper-reactive sensitivity to directorial gestures during rapid ritardando, poco rit., and a tempo transitions in unaccompanied or lightly accompanied sections.\nComplex Interlocking Staccato/Marcato Execution (Cook): Navigate alternating syncopations and crisp consonant emphasis (\"Blow, blow, thou winter wind\") without dragging the underlying rhythmic pulse.\nSustaining Floating A Cappella Clusters (Pederson): Hold 3-part and 4-part close-harmony splits cleanly, maintaining horizontal breath tracking while adjacent voice parts move down or up by a half-step.\nMicro-Phonetic Consistency: Standardize open and closed vowel boundaries within multi-layered acoustic texturing (e.g., controlling the diphthongs in words like \"night,\" \"sky,\" or \"cry\" across the SSAA sections).", "materials": "“Blow, Blow Thou Winter Wind”, Words by William Shakespeare, Music by Jennifer Lucy Cook\n“Sure On This Shining Night, Words by James Agee, Music by Morten Lauridsen\n“Does the World Say?”, Words and Music by Kyle Pedersen", "assessments": "Formative: * Individual sight-reading checkpoint spot-checks during rehearsals.\nPhrase-interpretation exercises where sections explain their text-painting choices.\nMemory benchmark checks on specific sections of the winter literature.\nSummative: * The Winter Choral Concert: Live performance evaluation focusing on precision, musicality, and stage presence.\nPost-Concert Audio Reflection: Students listen to the concert recording and complete a written critique analyzing the ensemble's dynamic pacing and diction."}, {"name": "Unit 4"}, {"name": "NYSSMA Major Organization Festival", "timeframe": "This is our focus for the Spring Semester.", "concepts": "The NYSSMA Adjudication Rubric: Deconstructing the rigorous standards of professional adjudication panel metrics: Tone, Intonation, Technique, Diction, Interpretation, and Performance Quality.\nHigh-Level Stylistic Diction: Mastering advanced linguistic rules (e.g. Latin, French) with exact precision using proper phonetic vowel shapes.\nRepertoire Mastery: Memorizing and polishing a technically challenging program that pushes the limits of the ensemble's range, agility, and expressive capabilities.", "skills": "Deliver a polished, emotionally mature performance under high-stakes evaluation conditions.\nInstantly self-correct ensemble balance, blend, and pitch during a performance based on changing room acoustics.\nSynthesize all 1st-semester sight-reading scaffolds to confidently lead student-run sectionals", "materials": "“Let All the World in Every Corner Sing”, arranged by Andrea Ramsey\n“Petite Voix, Movements I and II”, Francis Poulenc\n“Laudate Dominum”, Z. Randall Stroope", "assessments": "Formative: Individual or sectional \"blind\" part-checks; recording rehearsals and having the singers score themselves using the NYSSMA rubric.\nSummative: The formal NYSSMA evaluation performance and a comprehensive post-festival artistic reflection jury."}]}, {"name": "Class V Chorus", "department": "Performing Arts", "teacher": "Michael Goede, Samantha Spiridellis", "grade": "", "length": "", "description": "", "competencies": "1. Intercultural Connection\nStudents explore diverse global musical traditions and languages, cultivating cultural curiosity and respectful storytelling through folk songs and choral repertoire.\n2. Sense of Self and Place\nStudents discover their unique singing voices, build personal performance confidence, and experience how their individual sound directly supports a shared group identity.\n3. Critical Systems Thinking\nStudents visually map and decode a multi-staff choral score, tracking their individual vocal line from left to right while analyzing how it vertically fits with accompaniments and peer sections.\n4. Adaptability to Change\nStudents practice active ensemble listening, micro-adjusting their individual pitch, vocal volume, and physical register in real time to match changing directorial cues and venue acoustics.\n5. Action towards a Better Future\nStudents collaborate responsively within a diverse team to achieve a unified artistic goal, utilizing communal music-making to actively foster empathy, vulnerability, and positive community dynamics.", "units": [{"name": "Unit 1"}, {"name": "Foundational Vocal Pedagogy, Literacy, & Sight-Reading", "timeframe": "Yearlong Baseline Unit", "concepts": "Vocal Pedagogy & Anatomy: Achieving a basic structural understanding of vocal anatomy and the organic process of vocal production (how breath turns into sound). Learning physical strategies for achieving and maintaining vocal health and longevity.\nRhythmic & Melodic Literacy: Decoding standard time signatures (4/4 and ¾) Understanding the physical and aural layout of the Major, Natural Minor, Harmonic Minor, and Pentatonic scales using hand signs.\nStructural Score Navigation: Understanding standard map markings in a choral octavo, including 1st and 2nd endings, Dal Segno, Codas, and repeat signs.\nMusical Terminology: Internalizing expressive definitions for dynamics (pp through ff), dynamic shifts (crescendo and decrescendo), and textural articulations (legato and staccato).\nSight-Reading Scaffolding Matrix: Following a strict developmental timeline:\nSeptember/October: So-Mi and So-Mi-La flashcard recognition moving onto a floating staff.\nNovember: Introduction of stepwise melodies (Do-Re-Mi-Re-Do).\nDecember/January: Introducing standard notation and reading stepwise melodies directly on a 5-line staff.\nFebruary: Independent sight-reading of two-measure melodies where students actively write in Solfege.\nMarch–May: Comprehensive skill building and advanced literacy retention.", "skills": "Read, clap, and chant rhythms featuring eighth, quarter, half, dotted half, and whole notes/rests on the board.\nSing and physically hand-sign Major, Minor, and Pentatonic scales.\nIdentify musical terms and dynamic markings inside written music.\nPhysically translate aurally perceived or visually noted patterns by writing Solfege syllables directly onto written staff music.\nTransition from reading rhythms and Solfege cards as a full class to reading patterns individually to receive targeted feedback.", "materials": "Vocal Health Slides, pedagogical anatomy resources, and the Operation Ouch: Vocal Folds video.\nSolfege pattern cards and rhythmic flashcards.\nDry-erase board for written notation drills and student staff-writing exercises.\nPrinted musical scores.", "assessments": "Formative: Daily technical spot-checks during warm-ups; board-work observation where students dictate rhythms; individual feedback rounds on Solfege card reading.\nSummative: End-of-term individual sight-reading checks; a short written literacy quiz identifying score symbols and dynamic definitions."}, {"name": "Unit 2"}, {"name": "Rehearsal Artistry and Diverse Repertoire", "timeframe": "Semesters 1 and 2 (Cycle repeats for Winter and Spring Performances)", "concepts": "The Rehearsal Process: Understanding the trajectory of learning music, tracking an octavo from the initial preview phase to detailed rehearsal polishing, and finally to public performance.\nPart Independence & Harmony: Navigating the transition from unison singing to two-part canons, partner songs, and advanced three-part choral textures.\nVocal Placement and Color: Exploring different vocal registers (head voice vs. chest voice, avoiding shouting) and understanding the concepts of resonance, \"space,\" and forward placement in treble singing.\nCultural Context & Global Heritage: Discussing and analyzing how music sounds different based on its cultural origins, historical context, and native language.", "skills": "Apply specific knowledge of vocal registers and vowel shapes to achieve proper placement in specific sections of the performance music.\nMaintain a stable harmonic line independently when singing multi-part music or canons against contrasting vocal sections.\nDisplay a clear physical and aural understanding of dynamics, phrasing, and articulation through deliberate application within the repertoire.\nPrepare, memorize, and accurately sing music in a variety of global languages with respectful diction.", "materials": "General Class Repertoire: \"Fine By Me\", \"Miawoe Zo\".\nConcert Literature: \n\"Aeyaya Balano Sakkad\"\n“Your Holiday Song” \n\"Born to Give”\n\"Sisi Ni Moya\" (Jacob Narverud)", "assessments": "Formative: Sectional \"stand-and-sing\" check-ins during rehearsals to check memory and part-retention; class discussions comparing the stylistic profiles of the global folk selections.\nSummative: Live Public Concert Performance at Winter Concert (evaluating tone production, posture, pitch accuracy, dynamic expression, and ensemble focus); post-concert group reflection evaluation."}, {"name": "Unit 3"}, {"name": "Rhythmic Independence & Global Artistry (Spring Concert Cycle)", "timeframe": "2nd Semester (approx. 14–16 weeks)", "concepts": "Rhythmic Interlocking & Ostinatos: Understanding how repetitive rhythm patterns (ostinatos) layer over one another to create a driving groove. Moving away from rigid classical pulses into syncopated gospel, soul, and roots-music feels.\nTextural Layering & Part-Independence: Shifting from standard unison singing into highly independent multi-part textures (such as the overlapping Part I, II, III, and IV entries in \"An Invitation\"). Learning how to firmly maintain an independent vocal loop while hearing a totally different cross-rhythm from a peer section.\nThe Physics of a Vocal Shout vs. Strain: Exploring healthy vocal placement in gospel and folk traditions. Learning how to cleanly execute high-energy, syncopated vocal \"shouts\" or declarative lines without throat tension or chest-voice forcing.\nSocial and Cultural Themes in Performance: Exploring music as an agent for community building, historical storytelling (the walls of Jericho), and an active \"call to action\" for a better world.", "skills": "Syncopated Rhythmic Execution: Sing and lock off-beat quarter and eighth-note syncopations smoothly, maintaining a rock-solid collective ensemble tempo against a driving piano or hand-clapped accompaniment.\nHorizontal Vocal Tracking across Splits: Confidently navigate a score layout when it fragments into multi-part splits, maintaining individual section tracking through complex repeat loops, 1st/2nd endings, and dynamic builds.\nA Cappella Pitch Retention: Intone and hold close rhythmic folk entries unaccompanied, relying entirely on inner-ear placement and the section's unified vocal vowels to keep from sagging in pitch.\nDynamic Artistry & Physical Phrasing: Apply dramatic dynamic contrasts—such as dropping instantly to a whispered pianissimo before exploding into a full, resonant forte on command.", "materials": "Lisa Clayton (Arr. Cherrelle Crews): \"Walls Come Down\" (Alfred Music) — 2-Part/S.S.A. voices and piano.\nRising Appalachia (Arr. Samantha Spiridellis): \"An Invitation\" (Custom/Choral Manuscript) — Multi-part unaccompanied vocal arrangement.", "assessments": "Formative Assessments\nThe \"Stand and Deliver\" Sectional Loop: Dividing the class into their performance parts (e.g., Leah/Pink vs. Chloe/Yellow parts in \"An Invitation\") and having small groups sing their interlocking entries isolated to check for rhythmic drift or dropped text.\nGospel Stomp-and-Clap Rhythm Isolations: Having the choir chant the lyrics to \"Walls Come Down\" strictly in rhythm while physically stomping the steady downbeats to align their syncopated word placements.\nSummative Assessments\nSpring Concert Public Performance: Evaluation of the live public stage performance, focusing explicitly on the students' ability to maintain part independence, deliver clear vocal registers without shouting, execute score navigation maps perfectly, and convey joyful stage energy.\nThe Collaborative Rehearsal Jury: A final group evaluation assessing how smoothly the choir transitions from independent sectional splits back into a unified ensemble, utilizing mutual feedback to refine their dynamic phrasing."}]}, {"name": "Upper School Chorus", "department": "Performing Arts", "teacher": "Michael Goede", "grade": "", "length": "", "description": "", "competencies": "Musical Literacy\nEnsemble Artistry\nPhysical Awareness\nIntercultural Connection", "units": [{"name": "Unit 1"}, {"name": "Foundational Concepts of Music Literacy", "timeframe": "This is an ongoing skill that we practice every rehearsal throughout the school year.", "concepts": "Understanding and applying different strategies for learning music (solfege, sight reading on neutral syllable, and rote teaching)\nRecognizing how developing music literacy is applicable to all styles of music and empowers singers to be independent musicians", "skills": "Singing a Major and Three Forms of Minor Scale on Solfege\nWriting solfege into a musical score and using solfege to sight read \nIdentify and perform basic rhythmic and melodic patterns", "materials": "Excerpts from our choral repertoire\nSolfege literacy cards\nMelodic sight reading exercises from Sight Singing Made Accessible Reading Teachable, Volume 1”", "assessments": "Students sight read excerpts from their repertoire as well as specific examples in small groups, and students volunteer to sing examples on their own. \nI move through the classroom during these parts of the rehearsal so I can hear individual students and offer private feedback."}, {"name": "Unit 2"}, {"name": "Fundamentals of Vocal Technique", "timeframe": "This is an ongoing skill that we practice every rehearsal throughout the school year.", "concepts": "Respiration: The voice is a wind instrument. Healthy singing starts with the Skill of diaphragmatic breathing and develops into the Competency of breath support.\nThe Concept: Instead of \"taking a big breath,\" students learn to manage the release of air. The goal is to create consistent subglottal pressure (the air pressure beneath the vocal folds).\nPhonation is the actual act of the vocal folds coming together to vibrate.\nThe Concept: To keep the voice healthy, the vocal folds must meet cleanly and gently. This is often taught through \"onsets.\"\nResonance\nOnce the sound is made at the vocal folds, it travels through the throat and mouth (the vocal tract). Healthy technique focuses on \"opening the space.\"\nThe Concept: By lifting the soft palate and relaxing the jaw/tongue, a singer creates a larger \"cathedral\" for the sound to echo in. This amplifies the voice naturally without needing to \"scream\" or strain the vocal folds.", "skills": "Respiration:\nThe Concept: Instead of \"taking a big breath,\" students learn to manage the release of air. The goal is to create consistent subglottal pressure (the air pressure beneath the vocal folds).\nHealthy vs. Unhealthy: Healthy technique uses the abdominal and intercostal muscles to control air. Unhealthy technique \"gasps\" with the chest and shoulders, causing the throat to tighten to hold the air back.\nPhonation:\nThe Skill: Moving from a \"breathy\" sound (folds not touching enough) or a \"glottal\" sound (folds slamming together) to a balanced, clean tone.\nHealthy vs. Unhealthy: Pushing too much air through a tight throat creates vocal fatigue or \"rasping.\" Healthy phonation feels like the sound is \"spinning\" on top of the air rather than being pushed out by it.\nResonance:\nThe Skill: Modifying vowels (e.g., making an \"ee\" sound more oval) to find the \"ring\" in the voice.\nHealthy vs. Unhealthy: A \"swallowed\" or \"nasal\" sound usually means the resonator is constricted, forcing the singer to use more physical effort to be heard.", "materials": "Voice Builders for Better Choirs\nEvoking Sound: The Choral Warm-Up\nThe Complete Choral Warm-Up Book", "assessments": "I move through the classroom during these parts of the rehearsal so I can hear individual students and offer private feedback."}, {"name": "Unit 3"}, {"name": "Winter Concert Choral Repertoire", "timeframe": "The repertoire is selected on a semester basis and culminates in a performance.", "concepts": "Historical & Cultural Context: Analyzing the background, stylistic era, and cultural significance of the selected repertoire.\nDiction & Language: Mastering the pronunciation rules of various performance languages (e.g., Latin, Hindi, English, and Swahili.\nPerformance Psychology: Developing stage presence, managing performance anxiety, and understanding the singer-audience connection.", "skills": "Memorize and accurately perform four diverse choral pieces in a public setting.\nApply correct linguistic diction and stylistic nuances native to each piece of literature.\nMaintain rhythmic and harmonic independence while singing in a multi-part texture.", "materials": "Semester 1:\nAeyaya Balano Sakkad\nSisi Ni Moya\nWinter Song\nVeni, Veni Emmanuel", "assessments": "Formative: \"Mock adjudication\" sessions where the choir records a run-through and critiques themselves using a rubric.\nSummative: Winter and Spring Concert Performance"}, {"name": "Unit 4"}, {"name": "Spring Concert Repertoire", "timeframe": "This is the focus of our Spring semester.", "concepts": "Advanced Expressive Phrasing: Understanding text painting, rubato, dynamic pacing, and standard structural forms in large-scale choral works.\nCritical Evaluation: Learning how to critique choral performances objectively using standard festival adjudication rubrics (Tone, Intonation, Technique, Diction, Interpretation).\nCommunity & Collaboration: Exploring the role of choral music in community building and shared artistic experiences.", "skills": "Execute highly nuanced dynamics and expressive phrasing based on directorial cues and text analysis.\nEvaluate peer performances and professional recordings using formal musical terminology.\nAdapt vocal production to varying acoustic environments", "materials": "Semester 2:\nBohemian Rhapsody\nHere Comes the Sun\nLovely Day", "assessments": "Formative: \"Mock adjudication\" sessions where the choir records a run-through and critiques themselves using a rubric.\nSummative: Winter and Spring Concert Performance"}]}, {"name": "Class V Strings", "department": "Performing Arts", "teacher": "Hannah Hens-Piazza & Suzanne Saba-Hughes", "grade": "", "length": "", "description": "", "competencies": "Instrumental Mastery: Find and maintain solid playing/bow positions and produce clear tone.\n\nMusic literacy: Read and write music notation, including rhythmic dictation. \n\nCritical Listening: Discuss musical works using thoughtful observations and vocabulary. \n\nCreative Expression: Create original music through improvisation.", "units": [{"name": "Unit 1"}, {"name": "Instrumental Foundations and The Major Scale", "timeframe": "Semester 1", "concepts": "Proper instrument and bow hold mastery\nThe structure of a Major Scale (starting with D Major)\nFundamentals of tone production and accurate intonation\nMeter vs. Rhythm (4/4 and 3/4 time)\nIntroduction to folk music and diverse global melodies", "skills": "Moving smoothly from rest to playing position\nRecognizing and translating basic rhythmic patterns into written notation\nIdentifying meter through movement or conducting\nPlaying/reading music in the key of D Major", "materials": "Essential Elements Book 1 (first half, through approximately #76)\nCustom arrangements in D Major\nPractice log and staff paper", "assessments": "Practice log consistency (aiming for 4 times/week)\nRhythmic dictations (once per cycle)\nNote recognition \"pop quizzes”\nClass participation and preparedness"}, {"name": "Unit 2"}, {"name": "Expanding Technique & Repertoire", "timeframe": "Semester 2", "concepts": "Introduction to G Major scales and melodies\nArticulation styles: Staccato vs. Legato\nDynamic contrasts: Forte vs. Piano\nMelody vs. Harmony in two- and three-part arrangements", "skills": "Mastering 2-note slurs (bowing technique)\nSelf-correcting tone and finger placement\nPerforming rhythmic figures including eighth notes and basic ties\nImprovising original music using the instrument or voice", "materials": "Repertoire such as \"Ode to Joy,\" \"Shake It Off,\" and \"Lakota Courting Song\"\nCustom arrangements in D and G Major\nEssential Elements Book 1 (second half, through approximately #115)", "assessments": "Short in-class individual playing assessments (mini-assessments)\nPreparedness for ensemble performances\nDemonstrated progress on rhythmic and melodic dictations\n“Pop quizzes” on note recognition and staff proficiency"}]}, {"name": "Class VI Strings", "department": "Performing Arts", "teacher": "Hannah Hens-Piazza and Suzanne Saba-Hughes", "grade": "", "length": "", "description": "", "competencies": "Intermediate Technical Mastery: Execute advanced bowing techniques (hooked bows, multi-note slurs) and implement low-finger placements ($C\\natural$ and $F\\natural$).\n\nRhythmic & Meter Fluidity: Perform compound subdivisions (6/8) and asymmetric timing structures.\n\nEar-Training & Auditory Literacy: Transcribe rhythms accurately and figure out familiar pop and folk melodies completely by ear.\n\nCreative Improvisation: Explore spontaneous musical composition within contemporary styles and collaborative circles.", "units": [{"name": "Unit 1"}, {"name": "Expanding Horizons & Low Finger Patterns", "timeframe": "Semester 1", "concepts": "Introduction to C-natural and F-natural (low 2 finger placement)\nMechanics of the C Major scale and related finger patterns\nHooked bows and multi-note slurs\nIntroduction to compound meters (6/8 and 2/4) and their respective subdivisions\nNavigating intermediate notation markers (first/second endings, DC al fine)", "skills": "Playing and reading music fluently in the key of C Major\nExecuting hooked bowing patterns cleanly across string crossings\nMaintaining rhythm while playing whole notes, 6/8 subdivisions, and dotted quarter notes\nLearning new ensemble music line-by-line via phrase-based classroom modeling", "materials": "Essential Elements Book 1 (second half)\n4-part orchestra arrangements\nSelection from performance repertoire: Bubble Gum Blues, A Vivaldi School Year, Beyond the Thunder, etc.", "assessments": "Demonstrated preparedness for class based on assigned music\nOnce-per-cycle individual playing \"mini-assessments\" (performing a teacher-selected excerpt while peers practice)\nOnce-per-cycle rhythmic dictations\nSmall-group \"pop quizzes\" on intermediate note and clef recognition"}, {"name": "Unit 2"}, {"name": "Creative Expression & Contemporary Stylings", "timeframe": "Semester 2", "concepts": "Frameworks for contemporary string improvisation\nIntroduction to jazz strings and global folk traditions (e.g., Chinese folk song structures)\nThe mechanics of learning music by ear without a printed score\nAdvanced rhythmic ties (half-to-quarter and quarter-to-eighth notes)", "skills": "Participating confidently in an collaborative improv circle\nDecoding and figuring out a familiar pop melody entirely by ear given only the starting note\nPracticing assigned sections independently as homework using a provided framework\nIntegrating individual parts seamlessly into multi-part ensemble arrangements", "materials": "Custom arrangements and contemporary charts\nSpecial collaboration unit materials featuring a guest artist\nPerformance repertoire: Jasmine Flower, Blue Room, Power Rock, and student-created original improvised works such as Nature’s Rhythm, etc.", "assessments": "Demonstrated progress over the course of the semester from individual baselines\nPerformance execution in the \"Pop Melody Challenge\"\nFinal performance preparation and ensemble contribution\nProficiency tracking on melodic/rhythmic staff identification"}]}, {"name": "Class VII Strings", "department": "Performing Arts", "teacher": "Hannah Hens-Piazza and Suzanne Saba-Hughes", "grade": "", "length": "", "description": "", "competencies": "Advanced Instrumental Technique: Establish consistency in playing position, bow hold, and master initial shifting positions (3rd position for violin/viola; 4th position for cello).\n\nComplex Score Literacy: Navigate intricate scores (e.g., $DS\\ al\\ fine$, verse/chorus layout) and decode varied scales across multiple major and minor keys.\n\nCritical Inquiry & Dialogue: Use musical and non-musical vocabulary to articulate structural elements of a piece and analyze the role music plays in our world.\n\nCollaborative Composition: Harness creative negotiation, empathy, and musical skills to write and perform original works with peers.", "units": [{"name": "Unit 1"}, {"name": "Technical Expansion & Musical Identity", "timeframe": "Semester 1", "concepts": "Introduction to new finger alterations: B-flat and E-flat (low 1 and low 4 finger placements)\nScale and melodic structures in F Major, D Minor, and A Minor\nExecuting a two-octave G Major scale\nShifting mechanics: Third position for violin and viola; fourth position for cello\nRhythmic figures: Basic syncopations (such as eighth-quarter-eighth notes), ties, and sixteenth notes\nConcept of musical ancestry and personal connection to sound", "skills": "Navigating shifts safely while maintaining accurate intonation and a clear, resonant tone\nTracking independent parts when new ensemble music is distributed in class\nSelf-correcting shifting inaccuracies by ear\nResearching, organizing, and delivering a personal presentation on individual musical identity", "materials": "Specialized intermediate orchestral arrangements (pop, classical, and global)\nStudent Chromebooks for identity project research\nRepertoire examples: Canon / See You Again arrangement, The Mandalorian, Pirates of the Caribbean, Night Changes, etc.", "assessments": "Timely and thoughtful completion of written homework assignments and listening reflections\nAssessment of thoughtfulness, clarity, and artistry during the Musical Identity presentations\nOnce-per-cycle mini-assessments on teacher-selected measures from the ensemble score\nIndividual tracking of music reading progress and targeted technical improvement"}, {"name": "Unit 2"}, {"name": "The Chamber Ensemble & Global Perspectives", "timeframe": "Semester 2", "concepts": "The historical development, structure, and significance of the string quartet genre\nDeep-dive regional studies broadening the musical lens (e.g., traditional Mariachi music and traditional Chinese music structures)\nScore navigation for small ensembles (DS al fine, verse/chorus structural shifts)\nNon-musical group mechanics: Collaboration, creative negotiation, and group resilience", "skills": "Analyzing live string quartet recordings using advanced musical and descriptive vocabulary\nRehearsing music independently within student sections using teacher-provided demo recordings as reference\nNegotiating creative control to collaboratively write an original string quartet\nPerforming a custom role within an unconducted chamber setting", "materials": "Historical scores and listening guides for string quartets\nComposition software or manuscript materials for original quartets\nCollaborative unit charts featuring regional experts (e.g., Mario Trujillo for Mariachi or Vivi Hu for Chinese folk music)\nRepertoire examples: Los Machetes, Picking Tea Leaves and Catching Butterflies, Furusato, Bésame Mucho, etc.", "assessments": "Productive and proactive participation in class activities, sectional work, and ensemble playing\nPerformance execution and score submission of the final original string quartet project\nClassroom preparedness with assigned musical parts or homework benchmarks\nScore and performance alignment during sight-reading checkpoints"}]}, {"name": "Class VIII Strings", "department": "Performing Arts", "teacher": "Hannah Hens-Piazza and Suzanne Saba-Hughes", "grade": "", "length": "", "description": "", "competencies": "Advanced Instrumental Technique: Execute multi-octave scales, implement vibrato, and apply extended techniques such as harmonics, tremolo, and glissando.\n\nEnsemble Leadership & Arranging: Lead sections of rehearsal, sight-read diverse chamber literature, and grasp basic string arranging mechanics.\n\nSocial Advocacy & Inquiry: Connect musical performance to historical, political, and social movements; plan an advocacy-driven community concert.\n\nInterdisciplinary Collaboration: Harness creative negotiation, problem-solving, and empathy to co-create an original musical with peers.", "units": [{"name": "Unit 1"}, {"name": "Advanced Artistry & Social Impact", "timeframe": "Semester 1", "concepts": "Two-octave scales in C major, A minor, and D major/minor.\nScales and melodies in A major and E-flat major.\nUnderstanding structural intervals to figure out new scales using whole- and half-step patterns.\nShifting refinement and the introduction to vibrato mechanics.\nRhythms involving complex syncopations and ties.\nAnalysis of community music and songs that have historical, political, or social impact.", "skills": "Navigating intricate key signatures and rhythm markers independently\nInitiating a consistent vibrato motion to enhance tone quality\nResearching, organizing, and delivering a presentation analyzing a song's political or social influence\nPeer leadership through conducting or guiding designated segments of an ensemble rehearsal", "materials": "Complex pop and chamber music arrangements\nAdvanced technical method exercises\nStudent Chromebooks for independent media research\nRepertoire examples: Uptown Funk, Scherzo Pastiche, Viva la Vida, The Journey Forward, Koythu Pattu, etc.", "assessments": "Individual tracking of music reading progress and technique mastery\nMini-assessments conducted once per cycle on teacher-selected excerpts\nAssessment of thoughtfulness, clarity, and historical accuracy in the Song of Impact presentations\nCompletion of written listening reflections and homework benchmarks"}, {"name": "Unit 2"}, {"name": "Collaborative Creation & The Capstone", "timeframe": "Semester 2", "concepts": "Introduction to extended techniques: harmonics, tremolo, glissando, col legno, sul ponticello, and sul tasto\nStrategic planning, coordination, and organization required for public concert production\nThe mechanics of interdisciplinary collaboration within musical theater\nNon-musical competencies: advocacy, creative problem-solving, group negotiation, and community empathy", "skills": "Adapting individual performance style to support theatrica
